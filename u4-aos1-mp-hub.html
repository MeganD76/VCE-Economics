<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCE Economics — Unit 4 AOS1 Monetary Policy Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2e1a47;--primary-mid:#43286b;--primary-light:#7c5cad;
  --accent:#d4a017;--accent-pale:#faf3df;
  --green:#15803d;--green-pale:#f0fdf4;
  --red:#b91c1c;--red-pale:#fef2f2;
  --amber:#d97706;--amber-pale:#fffbeb;
  --text:#241a33;--text-sec:#6b6477;
  --border:#e5e0ec;--bg:#f8f6fb;--white:#ffffff;
  --shadow:0 4px 20px rgba(46,26,71,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;}
.wrap{max-width:840px;margin:0 auto;padding:0 28px 60px;}
h1,h2,h3{font-family:'Playfair Display',serif;}
.hero{background:var(--primary);color:#fff;padding:46px 28px 40px;margin-bottom:28px;}
.hero-inner{max-width:840px;margin:0 auto;}
.hero .badge{display:inline-block;background:rgba(212,160,23,0.18);border:1px solid var(--accent);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:.5px;margin-bottom:14px;}
.hero h1{font-size:34px;margin-bottom:8px;}
.hero p{color:#cfc4e2;max-width:560px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px;}
.btn{font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--primary-mid);color:#fff;}
.btn:hover{background:var(--primary);}
.btn.gold{background:var(--accent);color:var(--primary);}
.btn.ghost{background:transparent;color:var(--primary-mid);border:1.5px solid var(--primary-light);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:7px 14px;font-size:13.5px;}
input[type=text],input[type=password]{font-family:'Source Sans 3',sans-serif;font-size:16px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;width:100%;max-width:340px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.tile{background:var(--white);border:1px solid var(--border);border-radius:15px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;}
.tile:hover{transform:translateY(-2px);}
.tile.locked{opacity:.55;cursor:default;}
.tile.locked:hover{transform:none;}
.tile h3{font-size:19px;margin:6px 0 4px;color:var(--primary);}
.tile .num{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
.tile .meta{font-size:13.5px;color:var(--text-sec);}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin-top:10px;}
.pill.done{background:var(--green-pale);color:var(--green);}
.pill.prog{background:var(--accent-pale);color:#9a7410;}
.pill.new{background:#eee9f6;color:var(--primary-mid);}
.pill.soon{background:#f1eff5;color:var(--text-sec);}
.nav{background:var(--primary-mid);color:#fff;border-radius:12px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
.nav .score{font-weight:700;color:var(--accent);}
.nav .sname{font-size:14px;color:#d9cfeb;}
.dots{display:flex;gap:5px;flex-wrap:wrap;}
.dot{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);}
.dot.on{background:var(--accent);}
.acard{background:var(--white);border:1px solid var(--border);border-radius:15px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);}
.acard:hover{border-color:var(--primary-light);}
.acard h3{font-size:17px;color:var(--primary);}
.acard .tdesc{font-size:13.5px;color:var(--text-sec);}
.opt{display:block;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px;font-family:'Source Sans 3',sans-serif;cursor:pointer;transition:border-color .15s;}
.opt:hover:not(:disabled){border-color:var(--primary-light);}
.opt.sel{border-color:var(--primary-mid);background:#f3eefb;}
.opt.ok{border-color:var(--green);background:var(--green-pale);}
.opt.bad{border-color:var(--red);background:var(--red-pale);}
.opt:disabled{cursor:default;color:var(--text);opacity:1;}
.fb{border-left:4px solid var(--primary-light);background:#f6f2fc;border-radius:0 10px 10px 0;padding:12px 14px;font-size:14.5px;margin:10px 0;}
.tip{border-left:4px solid var(--amber);background:var(--amber-pale);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;margin:10px 0;}
.rule{border:1.5px solid var(--amber);background:var(--amber-pale);border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0;}
.qhead{font-weight:700;font-size:16px;margin:18px 0 4px;}
.qhead:first-child{margin-top:0;}
.chip{display:inline-block;border:1.5px solid var(--border);background:var(--white);border-radius:18px;padding:7px 14px;margin:5px 6px 0 0;font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;}
.chainstep{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px;}
.resp{font-style:italic;background:#f6f2fc;border-radius:10px;padding:14px 16px;margin:10px 0;font-size:15px;}
.snap{background:var(--accent-pale);border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:14.5px;}
.snap b{color:var(--primary);}
.blank{display:inline-block;min-width:90px;border-bottom:2px dashed var(--primary-light);text-align:center;font-weight:700;color:var(--primary-mid);padding:0 6px;}
.blank.ok{color:var(--green);border-color:var(--green);}
.blank.bad{color:var(--red);border-color:var(--red);}
.save-toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;display:none;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:50;}
.save-toast.show{display:flex;}
.tl-wrap{overflow-x:auto;}
.backlink{display:inline-block;margin-bottom:14px;color:var(--primary-mid);font-weight:600;cursor:pointer;font-size:14.5px;}
table.tch{width:100%;border-collapse:collapse;font-size:13.5px;}
table.tch th,table.tch td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top;}
table.tch th{background:#f3eefb;color:var(--primary);}
.kdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;}
.selfcheck li{margin:7px 0 7px 18px;font-size:15px;}
.footer-link{text-align:center;margin-top:34px;font-size:13px;color:var(--text-sec);}
.footer-link span{cursor:pointer;text-decoration:underline;}
.obj-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.obj-col{border:2px dashed var(--border);border-radius:12px;padding:12px;min-height:80px;}
.obj-col h4{font-size:13px;font-weight:700;color:var(--primary-mid);margin-bottom:6px;text-align:center;}
.obj-chip{display:block;border:1.5px solid var(--border);background:var(--white);border-radius:10px;padding:8px 10px;margin:5px 0;font-size:13.5px;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-align:left;width:100%;}
.obj-chip.ok{border-color:var(--green);background:var(--green-pale);}
.obj-chip.bad{border-color:var(--red);background:var(--red-pale);}
.obj-bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.obj-bank-chip{border:1.5px solid var(--primary-light);background:#f3eefb;border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;}
.obj-exp{font-size:13.5px;padding:7px 10px;border-radius:8px;margin:4px 0;}
.obj-exp.ok{background:var(--green-pale);}
.obj-exp.bad{background:var(--red-pale);}
@media(max-width:600px){.obj-cols{grid-template-columns:1fr;}}
@media(max-width:560px){.hero h1{font-size:26px;}.wrap{padding:0 16px 50px;}}
</style>
</head>
<body>
<div id="app"></div>

<script>

var S={screen:'home',name:'',act:0,ans:{},obj:{placed:{},checked:false},tl:{},dual:{},chain:{},spot:{marks:{},gap1:{},gap2:{}},cond:{},synced:{}};

    if(sv){var p=JSON.parse(sv);for(var k in p){S[k]=p[k];}if(S.screen==='act'){S.screen='chooser';}if(S.screen==='teacher'){S.screen='home';}}

loadState();

var KK_MAP={adpol:'AD policies & business cycle',mpdef:'Nature & objectives of monetary policy',infl:'Inflation target & measurement',stance:'Stance of monetary policy'};

/* ===== MCQ DATA — options balanced in length, correct answers rotated ===== */
var MCQ=[
  {q:"Which of the following best defines aggregate demand policies?",
   opts:["Policies that permanently expand the economy's productive capacity by improving technology",
         "Policies used to stabilise economic activity by influencing the level of aggregate demand",
         "Policies that directly regulate the prices businesses can charge consumers",
         "Policies focused on growing government revenue through new taxes"],
   a:1,kk:'adpol',
   fb:"AD policies work by altering the level of AD to counter the business cycle — stimulating AD in downturns and restraining it in booms. Expanding productive capacity is the role of aggregate supply (AS) policies, which operate over the longer run.",
   tip:"Exam tip: always link AD policies to their purpose — stabilising the business cycle. Simply saying 'helps the economy' won't earn marks."},
  {q:"Which of the following is NOT one of the RBA's three statutory objectives under the Reserve Bank Act 1959?",
   opts:["The stability of the Australian dollar exchange rate",
         "The stability of the currency of Australia",
         "The maintenance of full employment in Australia",
         "The economic prosperity and welfare of the people of Australia"],
   a:0,kk:'mpdef',
   fb:"'Stability of the currency' means price stability — preserving the purchasing power of money — not fixing the exchange rate. The AUD has floated freely since 1983 and the RBA does not target its value. This is one of the most common errors flagged in VCAA examiner reports.",
   tip:"Exam tip: never write 'stability of the exchange rate' as an RBA objective — it costs marks every time."},
  {q:"The RBA's inflation target is best described as:",
   opts:["Keeping the cash rate between 2% and 3% at all times",
         "Holding CPI at exactly 2.5% every quarter regardless of conditions",
         "Keeping consumer price inflation at 2–3% on average over time",
         "Reducing inflation to zero over a five-year planning horizon"],
   a:2,kk:'infl',
   fb:"The target is a flexible band — 2–3% on average over time — not a fixed point. The 'on average over time' wording matters: inflation can sit outside the band temporarily without the target being abandoned.",
   tip:"Exam tip: quote the full target — '2–3% on average over time' — on first mention in any exam answer. Dropping 'on average over time' loses marks."},
  {q:"Which statement about headline and underlying inflation is correct?",
   opts:["The RBA targets underlying inflation; headline is used only for international comparisons",
         "Underlying inflation strips out volatile price changes so the RBA can better forecast where headline CPI is heading",
         "Headline and underlying measures always move in the same direction by the same amount",
         "Underlying inflation includes commodity prices, while headline excludes them"],
   a:1,kk:'infl',
   fb:"The 2–3% target is quoted in headline CPI terms, but headline is distorted by temporary, one-off price moves. Underlying measures strip out the most extreme price changes, giving the RBA a cleaner signal of where inflation is genuinely heading.",
   tip:"Exam tip: underlying excludes volatile items — students frequently reverse this and say it includes them."},
  {q:"Which statement best describes monetary policy in Australia?",
   opts:["The government's use of spending and taxation decisions to influence the level of aggregate demand",
         "The RBA's direct control over the interest rates charged on all bank loans",
         "The RBA's manipulation of the cash rate target to influence aggregate demand and stabilise economic activity",
         "The government's program of buying and selling foreign currency to manage the exchange rate"],
   a:2,kk:'mpdef',
   fb:"Monetary policy is operated by the RBA and works through the cash rate target. Changing the cash rate flows through to borrowing costs across the economy, influencing spending and the level of AD. Government spending and tax decisions are budgetary policy.",
   tip:"Exam tip: name the specific instrument — 'the cash rate target' — rather than just saying 'interest rates'."},
  {q:"The RBA's financial stability role is best described as:",
   opts:["Guaranteeing that Australian banks cannot lose money on their lending portfolios",
         "Setting the maximum interest rates banks can charge on home loans and credit cards",
         "Insuring all Australian share-market investments against capital losses",
         "Promoting the stability of the financial system, including acting as lender of last resort to solvent banks"],
   a:3,kk:'mpdef',
   fb:"The RBA promotes financial system stability and can lend to solvent banks in exchange for assets during a crisis — the 'lender of last resort' role. It does not guarantee bank profits, cap lending rates, or insure share investments.",
   tip:"Exam tip: financial stability sits alongside the three statutory objectives — the RBA makes monetary policy decisions 'with the stability of the financial system in mind'."}
];

/* ===== OBJECTIVE MATCHER ===== */
var OBJ={
  cats:["Stability of the currency","Maintenance of full employment","Economic prosperity and welfare"],
  items:[
    {t:"The RBA raises the cash rate to bring CPI back within the 2–3% band",c:0,why:"Keeping CPI within 2–3% on average over time is the operational definition of 'stability of the currency' — preserving the purchasing power of money."},
    {t:"The RBA cuts the cash rate to stimulate AD and support job creation as unemployment rises",c:1,why:"Cutting the cash rate to boost economic activity and reduce unemployment directly pursues the 'maintenance of full employment' objective."},
    {t:"Monetary policy is set to support rising material living standards and higher household incomes across the economy",c:2,why:"Improving the prosperity and welfare of Australians — including living standards — is the third statutory objective, broader than just prices or jobs."},
    {t:"The RBA holds the cash rate steady to avoid stoking further inflationary pressure while wages growth accelerates",c:0,why:"Holding the cash rate to prevent CPI from rising further is motivated by the price stability (stability of the currency) objective."},
    {t:"The RBA acts to keep the unemployment rate near NAIRU so that labour markets are neither too tight nor too slack",c:1,why:"Keeping unemployment around NAIRU — the non-accelerating inflation rate — is the practical meaning of 'maintenance of full employment'."},
    {t:"The RBA considers how interest rate decisions might affect consumer confidence, business investment and long-run living standards",c:2,why:"These broader considerations — confidence, investment and living standards — fall under economic prosperity and welfare of the people of Australia."}
  ]
};

/* ===== TIMELINE ===== */
var TL={
  opts:['Expansionary','Highly expansionary','Contractionary','Neutral'],
  periods:[
    {label:'A · 2002–2004',desc:"Cash rate around 4.75–5.25%. Growth tracking close to trend, inflation near the middle of the 2–3% band.",a:3,
     why:"With growth near trend and inflation mid-band, the cash rate sat around the neutral rate of the time — neither stimulating nor restraining AD. Note: the neutral rate was higher in the early 2000s than the ~3% used today; it has shifted over time."},
    {label:'B · 2007–2008',desc:"Cash rate lifted to 6.75–7.25% as strong demand and a commodity boom pushed inflation above 3%.",a:2,

    {label:'C · 2009–2010',desc:"Cash rate cut rapidly to 3.0% at the height of the Global Financial Crisis as growth fell sharply.",a:0,
     why:"Emergency cuts pushed the rate toward and below the neutral level of the time — an expansionary stance to stimulate AD and support employment, though not at an extreme low."},
    {label:'D · 2020–2021',desc:"Cash rate reduced to a record low of 0.10% during the COVID-19 recession, accompanied by unconventional policy measures.",a:1,
     why:"At 0.10% — the lowest rate in Australian history, far below any estimate of neutral — the stance was not just expansionary but highly expansionary (highly accommodative). The COVID setting was an emergency measure of exceptional scale."},
    {label:'E · 2022–2023',desc:"Cash rate raised from 0.10% to 4.35% across 13 consecutive increases as inflation surged above 7%.",a:2,
     why:"The fastest tightening cycle in decades took the cash rate well above the ~3% neutral level — a clearly contractionary stance designed to restrain AD and bring inflation back toward the 2–3% band."}
  ]
};

/* ===== DUAL STANCE ===== */
var DUAL={
  stanceOpts:['Expansionary','Contractionary','Neutral'],
  moveOpts:['Becoming more expansionary','Becoming less expansionary','Becoming more contractionary','Becoming less contractionary','Unchanged'],
  sc:[
    {desc:"The RBA raises the cash rate from 3.85% to 4.35%.",stance:1,move:2,
     why:"At 4.35% the cash rate is above the ~3% neutral rate — the stance is contractionary. The rise has pushed it further from neutral, making policy MORE contractionary."},
    {desc:"The RBA cuts the cash rate from 4.35% to 3.85%.",stance:1,move:3,
     why:"The classic trap: a cut does not automatically produce an expansionary stance. At 3.85%, the rate is still above neutral — the stance remains contractionary. The cut has simply made it LESS contractionary (less restrictive)."},
    {desc:"The RBA cuts the cash rate from 2.50% to 2.00%.",stance:0,move:0,
     why:"Both 2.50% and 2.00% sit below the ~3% neutral rate — the stance was already expansionary. The cut makes it MORE expansionary (more accommodative)."},
    {desc:"The RBA raises the cash rate from 1.50% to 2.25%.",stance:0,move:1,
     why:"The mirror trap: a rise does not automatically mean contractionary. At 2.25%, the rate is still below neutral — the stance remains expansionary. The rise makes it LESS expansionary."},
    {desc:"The RBA holds the cash rate at 3.00% with inflation tracking at 2.5%.",stance:2,move:4,
     why:"At roughly the neutral rate with inflation mid-band, policy is neither stimulating nor restraining AD — a neutral stance, unchanged by the hold decision."}
  ]
};

/* ===== CHAIN ===== */
var CHAIN=[
  {pre:"Real GDP growth falls below the government's goal of around ",post:" per year and spare productive capacity begins to emerge.",opts:['3–3.5%','2–3%','4–4.25%'],a:0,kk:'adpol'},
  {pre:"With demand-side pressure easing, inflation falls below the lower bound of the RBA's target of ",post:" on average over time.",opts:['3–3.5%','2–3%','0–1%'],a:1,kk:'infl'},
  {pre:"The RBA Board is likely to respond by ",post:" the cash rate target at its next meeting.",opts:['raising','holding at the same level','cutting'],a:2,kk:'stance'},
  {pre:"This shifts the stance of monetary policy in a more ",post:" direction, reducing the cost of borrowing.",opts:['expansionary','contractionary','neutral'],a:0,kk:'stance'},
  {pre:"Cheaper credit should encourage households and firms to increase spending and investment, lifting the ",post:" components of AD and supporting a return toward trend growth.",opts:['G and (X−M)','C and I','X−M only'],a:1,kk:'adpol'}
];

/* ===== SPOT THE ERROR — 0/2 question now has two separate error steps ===== */
var SPOT=[
  {q:"Define the stance of monetary policy and classify the stance after the RBA cuts the cash rate from 4.35% to 3.85%. Assume the neutral rate is around 3%. <strong>(2 marks)</strong>",
   resp:"\u201CThe stance of monetary policy refers to whether the RBA is raising or lowering the cash rate at its board meetings. Because the RBA has just cut the cash rate, the stance of monetary policy is now expansionary.\u201D",
   marks:2,correctMark:0,kk:'stance',
   twoErrors:true,
   err1Opts:["The definition describes the direction of the most recent move, not the intended impact on AD","The definition should have included the exchange rate channel","The definition is missing a reference to fiscal policy","The definition should mention NAIRU"],
   err1A:0,err1fb:"The stance is defined by the intended IMPACT of the cash rate setting on AD — whether policy is set to stimulate, restrain or neither. The direction of the latest move is irrelevant to the definition.",
   err2Opts:["The classification ignores that 3.85% is still above the ~3% neutral rate, so the stance remains contractionary","The classification should be neutral, not expansionary","The student should have said the stance is highly expansionary","The classification is actually correct — any cut produces an expansionary stance"],
   err2A:0,err2fb:"At 3.85%, the cash rate still sits above neutral — so the stance is still contractionary, just less so. A cut only changes the stance from contractionary to neutral (or expansionary) once the rate actually falls to or below the neutral level.",
   fixed:"The stance of monetary policy refers to the intended impact of the cash rate setting on the level of AD. At 3.85%, the cash rate remains above the neutral rate of ~3%, so the stance is still contractionary — the cut has simply made policy less contractionary.",
   rule:"VCAA principle: BOTH marks are lost here. The definition is wrong (describes direction, not impact on AD) and the classification follows from that wrong definition. Stance = level relative to neutral, not the direction of the last move."},
  {q:"Outline one reason why changes in monetary policy can influence the level of aggregate demand. <strong>(2 marks)</strong>",
   resp:"\u201CMonetary policy influences aggregate demand because the RBA directly controls every interest rate in the economy. When the RBA cuts the cash rate, all home loan and business lending rates immediately fall by exactly the same amount, which will increase consumption and investment spending.\u201D",
   marks:2,correctMark:1,kk:'mpdef',
   twoErrors:false,
   errOpts:["The RBA sets only the cash rate target — other rates are influenced through it, and the pass-through is neither immediate nor uniform",
            "The response should have discussed the exchange rate rather than interest rates",
            "Consumption and investment are not components of aggregate demand",
            "The response is correct — the RBA does set all interest rates directly"],
   errA:0,
   fixed:"Changes in the cash rate target flow through to the interest rates banks charge on loans. A cut in the cash rate should lead to lower lending rates, reducing borrowing costs. This is likely to encourage households and firms to increase consumption (C) and investment (I), raising the level of AD.",
   rule:"VCAA principle: the RBA sets only the cash rate target. Commercial lending rates are influenced by it, but banks set their own rates — the pass-through is neither automatic nor uniform. Also use 'likely/should' not 'will'. One mark is retained for correctly linking lower rates to higher C and I."}
];

/* ===== CONDITIONS ===== */
var COND={
  sc:[
    {name:"Economy A",data:"CPI: <b>4.6%</b> (underlying 4.1%) &nbsp;·&nbsp; Cash rate: <b>4.25%</b> &nbsp;·&nbsp; Real GDP growth: <b>1.2% p.a.</b> &nbsp;·&nbsp; Unemployment: <b>3.9%</b>",
     qs:[
      {q:"Is inflation currently inside or outside the RBA's target band?",
       opts:["Inside — inflation is within the 2–3% target range","Outside — inflation is below the 2–3% target band","Outside — inflation is above the 2–3% target band","The data is insufficient to determine this"],a:2,
       fb:"At 4.6% headline CPI (and 4.1% underlying), inflation is clearly above the upper bound of the 2–3% target — the price stability goal is not being met."},
      {q:"Classify the current stance of monetary policy.",
       opts:["Expansionary","Neutral","Cannot be determined from this data","Contractionary"],a:3,
       fb:"At 4.25% — well above the ~3% neutral rate — the cash rate is set to restrain AD and reduce inflationary pressure. This is a contractionary (restrictive) stance."},
      {q:"Given these conditions, the most appropriate decision at the next board meeting is most likely to be:",
       opts:["Cut the cash rate sharply to prevent a recession","Raise the cash rate further or hold at a restrictive level until inflation moves back toward the band","Cut the cash rate to zero and adopt unconventional measures","Switch focus to the exchange rate instead of the cash rate"],a:1,
       fb:"With inflation well above the band, keeping policy restrictive is appropriate. A cut would re-stimulate AD and risk embedding inflation further above target — even with soft growth, price stability is the priority when inflation is this high."}
     ]},
    {name:"Economy B",data:"CPI: <b>1.4%</b> &nbsp;·&nbsp; Cash rate: <b>1.00%</b> &nbsp;·&nbsp; Real GDP growth: <b>0.8% p.a.</b> &nbsp;·&nbsp; Unemployment: <b>5.6% and rising</b>",
     qs:[
      {q:"Classify the current stance of monetary policy.",

/* ===== SCORING ===== */
function computeScores(){
  var per={},kk={adpol:{c:0,t:0},mpdef:{c:0,t:0},infl:{c:0,t:0},stance:{c:0,t:0}};
  var i,j,s;
  s=0;for(i=0;i<MCQ.length;i++){kk[MCQ[i].kk].t++;var sel=S.ans['a1-'+i];if(sel!==undefined&&sel===MCQ[i].a){s++;kk[MCQ[i].kk].c++;}}per.a1=s;
  s=0;for(i=0;i<OBJ.items.length;i++){kk.mpdef.t++;if(S.obj.checked&&S.obj.placed[i]===OBJ.items[i].c){s++;kk.mpdef.c++;}}per.a2=s;
  s=0;for(i=0;i<TL.periods.length;i++){kk.stance.t++;if(S.tl[i]!==undefined&&S.tl[i]===TL.periods[i].a){s++;kk.stance.c++;}}per.a3=s;
  s=0;for(i=0;i<DUAL.sc.length;i++){kk.stance.t+=2;if(S.dual['s'+i]!==undefined&&S.dual['s'+i]===DUAL.sc[i].stance){s++;kk.stance.c++;}if(S.dual['m'+i]!==undefined&&S.dual['m'+i]===DUAL.sc[i].move){s++;kk.stance.c++;}}per.a4=s;
  s=0;for(i=0;i<CHAIN.length;i++){kk[CHAIN[i].kk].t++;if(S.chain[i]!==undefined&&S.chain[i]===CHAIN[i].a){s++;kk[CHAIN[i].kk].c++;}}per.a5=s;
  s=0;
  for(i=0;i<SPOT.length;i++){
    kk[SPOT[i].kk].t+=2;
    if(S.spot.marks[i]!==undefined&&S.spot.marks[i]===SPOT[i].correctMark){s++;kk[SPOT[i].kk].c++;}
    if(SPOT[i].twoErrors){
      if(S.spot.gap1[i]!==undefined&&S.spot.gap1[i]===SPOT[i].err1A){s++;kk[SPOT[i].kk].c++;}
    }else{
      if(S.spot.gap1[i]!==undefined&&S.spot.gap1[i]===SPOT[i].errA){s++;kk[SPOT[i].kk].c++;}
    }
  }per.a6=s;
  s=0;var qn=0;
  for(i=0;i<COND.sc.length;i++){for(j=0;j<COND.sc[i].qs.length;j++){kk.stance.t++;if(S.cond[qn]!==undefined&&S.cond[qn]===COND.sc[i].qs[j].a){s++;kk.stance.c++;}qn++;}}per.a7=s;
  var total=0;for(var k in per){total+=per[k];}
  return{per:per,kk:kk,total:total,max:39};
}

function actProgress(id){
  var done=0,tot=0,i,j;
  if(id==='a1'){tot=MCQ.length;for(i=0;i<tot;i++){if(S.ans['a1-'+i]!==undefined)done++;}}
  if(id==='a2'){tot=1;done=S.obj.checked?1:0;}
  if(id==='a3'){tot=TL.periods.length;for(i=0;i<tot;i++){if(S.tl[i]!==undefined)done++;}}
  if(id==='a4'){tot=DUAL.sc.length*2;for(i=0;i<DUAL.sc.length;i++){if(S.dual['s'+i]!==undefined)done++;if(S.dual['m'+i]!==undefined)done++;}}
  if(id==='a5'){tot=CHAIN.length;for(i=0;i<tot;i++){if(S.chain[i]!==undefined)done++;}}
  if(id==='a6'){tot=SPOT.length*2;for(i=0;i<SPOT.length;i++){if(S.spot.marks[i]!==undefined)done++;if(SPOT[i].twoErrors){if(S.spot.gap2[i]!==undefined)done++;}else{if(S.spot.gap1[i]!==undefined)done++;}}}
  if(id==='a7'){tot=0;var qn=0;for(i=0;i<COND.sc.length;i++){tot+=COND.sc[i].qs.length;}for(i=0;i<tot;i++){if(S.cond[i]!==undefined)done++;}}
  return{done:done,tot:tot,complete:done>=tot&&tot>0};
}

function dualInner(i){
  var sc=DUAL.sc[i],ss=S.dual['s'+i],ms=S.dual['m'+i],h='';
  h+="<div class='qhead'>Scenario "+(i+1)+"</div><p style='font-size:15px'>"+sc.desc+"</p>";
  h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid);margin-top:12px'>Part 1 — The stance is now:</p><div style='display:flex;flex-wrap:wrap;gap:8px'>";
  for(var o=0;o<3;o++){var c1='opt';if(ss!==undefined){if(o===sc.stance)c1+=' ok';else if(o===ss)c1+=' bad';}h+="<button class='"+c1+"' style='width:auto' "+(ss!==undefined?'disabled':'')+" onclick='ansDualS("+i+","+o+")'>"+DUAL.stanceOpts[o]+"</button>";}
  h+="</div>";
  h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid);margin-top:12px'>Part 2 — This move is best described as:</p>";
  for(var m=0;m<DUAL.moveOpts.length;m++){var c2='opt';if(ms!==undefined){if(m===sc.move)c2+=' ok';else if(m===ms)c2+=' bad';}h+="<button class='"+c2+"' "+(ms!==undefined?'disabled':'')+" onclick='ansDualM("+i+","+m+")'>"+DUAL.moveOpts[m]+"</button>";}
  if(ss!==undefined&&ms!==undefined)h+="<div class='fb'>"+sc.why+"</div>";
  return h;
}
function ansDualS(i,o){if(S.dual['s'+i]!==undefined)return;S.dual['s'+i]=o;saveState();var el=document.getElementById('dual'+i);if(el)el.innerHTML=dualInner(i);updateNav();maybeSync('a4');}
function ansDualM(i,o){if(S.dual['m'+i]!==undefined)return;S.dual['m'+i]=o;saveState();var el=document.getElementById('dual'+i);if(el)el.innerHTML=dualInner(i);updateNav();maybeSync('a4');}

/* ===== A5 CHAIN ===== */
function vChain(){
  var h="<div class='card' id='chainCard'>"+chainInner()+"</div>";
  return h;
}
function chainInner(){
  var h="<p style='font-size:14.5px;margin-bottom:12px'>Complete the chain below. Choose carefully — once placed, an answer is locked in.</p>";
  for(var i=0;i<CHAIN.length;i++){
    var c=CHAIN[i],sel=S.chain[i],blank;
    if(sel===undefined)blank="<span class='blank'>?</span>";
    else blank="<span class='blank "+(sel===c.a?'ok':'bad')+"'>"+c.opts[sel]+"</span>"+(sel!==c.a?" <span style='color:var(--green);font-weight:700'>("+c.opts[c.a]+")</span>":"");
    h+="<div class='chainstep'><strong>Step "+(i+1)+".</strong> "+c.pre+blank+c.post;
    if(sel===undefined){h+="<div style='margin-top:8px'>";for(var o=0;o<c.opts.length;o++){h+="<button class='chip' onclick='ansChain("+i+","+o+")'>"+c.opts[o]+"</button>";}h+="</div>";}
    h+="</div>";
  }
  var done=true;for(var j=0;j<CHAIN.length;j++){if(S.chain[j]===undefined)done=false;}
  if(done){var right=0;for(var k=0;k<CHAIN.length;k++){if(S.chain[k]===CHAIN[k].a)right++;}h+="<div class='fb'><strong>Chain complete — "+right+"/5.</strong> The key terms: growth below 3–3.5% → spare capacity → inflation below 2–3% band → RBA cuts cash rate → more expansionary stance → cheaper borrowing lifts C and I → AD returns toward trend. Always name the AD components and the specific targets.</div>";}
  return h;
}
function ansChain(i,o){
  if(S.chain[i]!==undefined)return;
  S.chain[i]=o;saveState();
  var el=document.getElementById('chainCard');if(el)el.innerHTML=chainInner();
  updateNav();maybeSync('a5');
}

/* ===== A6 SPOT ===== */
function vSpot(){
  var h='';
  for(var i=0;i<SPOT.length;i++){h+="<div class='card' id='spot"+i+"'>"+spotInner(i)+"</div>";}
  return h;
}
function spotInner(i){
  var q=SPOT[i],mk=S.spot.marks[i],g1=S.spot.gap1[i],g2=S.spot.gap2[i],h='';
  h+="<div class='qhead'>Question "+(i+1)+"</div><p style='font-size:15px'>"+q.q+"</p>";
  h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid);margin-top:10px'>A student wrote:</p><div class='resp'>"+q.resp+"</div>";
  h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid)'>Step 1 — What mark would this earn?</p><div style='display:flex;gap:8px;flex-wrap:wrap'>";
  for(var m=0;m<=q.marks;m++){var c1='opt';if(mk!==undefined){if(m===q.correctMark)c1+=' ok';else if(m===mk)c1+=' bad';}h+="<button class='"+c1+"' style='width:auto' "+(mk!==undefined?'disabled':'')+" onclick='ansMark("+i+","+m+")'>"+m+" / "+q.marks+"</button>";}
  h+="</div>";
  if(mk!==undefined){
    if(q.twoErrors){
      h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid);margin-top:14px'>Step 2 — Identify Error 1 (the definition):</p>";
      for(var e1=0;e1<q.err1Opts.length;e1++){var c2='opt';if(g1!==undefined){if(e1===q.err1A)c2+=' ok';else if(e1===g1)c2+=' bad';}h+="<button class='"+c2+"' "+(g1!==undefined?'disabled':'')+" onclick='ansGap1("+i+","+e1+")'>"+q.err1Opts[e1]+"</button>";}
      if(g1!==undefined){h+="<div class='fb'>"+q.err1fb+"</div>";}
      h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid);margin-top:10px'>Step 3 — Identify Error 2 (the classification):</p>";
      for(var e2=0;e2<q.err2Opts.length;e2++){var c3='opt';if(g2!==undefined){if(e2===q.err2A)c3+=' ok';else if(e2===g2)c3+=' bad';}h+="<button class='"+c3+"' "+(g2!==undefined?'disabled':'')+" onclick='ansGap2("+i+","+e2+")'>"+q.err2Opts[e2]+"</button>";}
      if(g2!==undefined){
        h+="<div class='fb'>"+q.err2fb+"</div>";
        h+="<p style='font-size:13.5px;font-weight:700;color:var(--green);margin-top:12px'>An improved response:</p><div class='resp' style='background:var(--green-pale)'>"+q.fixed+"</div>";
        h+="<div class='rule'>"+q.rule+"</div>";
      }
    }else{
      h+="<p style='font-size:13.5px;font-weight:700;color:var(--primary-mid);margin-top:14px'>Step 2 — What is the key error?</p>";
      for(var e=0;e<q.errOpts.length;e++){var c4='opt';if(g1!==undefined){if(e===q.errA)c4+=' ok';else if(e===g1)c4+=' bad';}h+="<button class='"+c4+"' "+(g1!==undefined?'disabled':'')+" onclick='ansGap1("+i+","+e+")'>"+q.errOpts[e]+"</button>";}
      if(g1!==undefined){
        h+="<p style='font-size:13.5px;font-weight:700;color:var(--green);margin-top:12px'>An improved response:</p><div class='resp' style='background:var(--green-pale)'>"+q.fixed+"</div>";
        h+="<div class='rule'>"+q.rule+"</div>";
      }
    }
  }
  return h;
}
function ansMark(i,m){if(S.spot.marks[i]!==undefined)return;S.spot.marks[i]=m;saveState();var el=document.getElementById('spot'+i);if(el)el.innerHTML=spotInner(i);updateNav();maybeSync('a6');}
function ansGap1(i,e){if(S.spot.gap1[i]!==undefined)return;S.spot.gap1[i]=e;saveState();var el=document.getElementById('spot'+i);if(el)el.innerHTML=spotInner(i);updateNav();maybeSync('a6');}
function ansGap2(i,e){if(S.spot.gap2[i]!==undefined)return;S.spot.gap2[i]=e;saveState();var el=document.getElementById('spot'+i);if(el)el.innerHTML=spotInner(i);updateNav();maybeSync('a6');}

/* ===== A7 CONDITIONS ===== */
function vCond(){
  var h="<div class='card'><p style='font-size:14.5px'>Three fictional economies. Apply what you know about the RBA's target and the neutral rate to diagnose each one — exactly the kind of thinking the Board does before every meeting.</p></div>";
  var qn=0;
  for(var i=0;i<COND.sc.length;i++){
    var sc=COND.sc[i];
    h+="<div class='card'><h3 style='color:var(--primary)'>"+sc.name+"</h3><div class='snap'>"+sc.data+"</div>";
    for(var j=0;j<sc.qs.length;j++){
      h+="<div id='cond"+qn+"'>"+condInner(i,j,qn)+"</div>";
      qn++;
    }
    h+="</div>";
  }
  return h;
}
function condInner(si,qi,qn){
  var q=COND.sc[si].qs[qi],sel=S.cond[qn],h='';
  h+="<div class='qhead'>"+q.q+"</div>";
  for(var o=0;o<q.opts.length;o++){var cls='opt';if(sel!==undefined){if(o===q.a)cls+=' ok';else if(o===sel)cls+=' bad';}h+="<button class='"+cls+"' "+(sel!==undefined?'disabled':'')+" onclick='ansCond("+si+","+qi+","+qn+","+o+")'>"+q.opts[o]+"</button>";}
  if(sel!==undefined)h+="<div class='fb'>"+(sel===q.a?'<strong>Correct.</strong> ':'<strong>Not quite.</strong> ')+q.fb+"</div>";
  return h;
}
function ansCond(si,qi,qn,o){
  if(S.cond[qn]!==undefined)return;
  S.cond[qn]=o;saveState();
  var el=document.getElementById('cond'+qn);if(el)el.innerHTML=condInner(si,qi,qn);
  updateNav();maybeSync('a7');
}

/* ===== NAV UPDATE without full re-render ===== */
function updateNav(){
  var sc=computeScores();
  var navEl=document.querySelector('.nav .score');
  if(navEl)navEl.textContent='Score: '+sc.total+' / '+sc.max;
}

/* ===== TEACHER ===== */
function vTeacherPin(){
  return "<div class='hero' style='padding:34px 28px 30px'><div class='hero-inner'><span class='badge'>STAFF</span><h1 style='font-size:26px'>Teacher view</h1></div></div><div class='wrap'><div class='card'><p style='font-size:14.5px;margin-bottom:10px'>Enter your teacher PIN to load class results.</p><input type='password' id='pinIn' placeholder='PIN'><button class='btn gold' style='margin-top:10px;display:block' onclick='loadTeacher()'>View results →</button><div id='tchOut' style='margin-top:18px'></div></div><span class='backlink' onclick='go(\"home\")'>&larr; Back</span></div>";
}
function loadTeacher(){
  var pin=document.getElementById('pinIn').value.trim();
  var out=document.getElementById('tchOut');
  out.innerHTML="<em>Loading…</em>";
  fetch(RES_URL+'/?pin='+encodeURIComponent(pin)).then(function(r){return r.json();}).then(function(d){
    if(d.error){out.innerHTML="<span style='color:var(--red)'>"+esc(d.error)+"</span>";return;}
    out.innerHTML=teacherTable(d.results||[]);
  }).catch(function(e){out.innerHTML="<span style='color:var(--red)'>Error: "+esc(e.message)+"</span>";});
}
function kdot(c,t){if(t===0)return"<span class='kdot' style='background:#d6d2de'></span>";var pct=c/t;var col=pct>=0.8?'#15803d':(pct>=0.5?'#d97706':'#b91c1c');return"<span class='kdot' style='background:"+col+"'></span>";}
function teacherTable(rows){
  if(!rows.length)return"<p>No results yet.</p>";
  rows.sort(function(a,b){return(a.name||'').localeCompare(b.name||'');});
  var h="<p style='font-size:13.5px;color:var(--text-sec);margin-bottom:8px'>"+rows.length+" submission(s) · green ≥80% · amber 50–79% · red &lt;50%</p><div style='overflow-x:auto'><table class='tch'><tr><th>Student</th><th>Score</th><th>Acts done</th>";
  for(var k in KK_MAP){h+="<th>"+KK_MAP[k]+"</th>";}
  h+="<th>Updated</th></tr>";
  for(var i=0;i<rows.length;i++){
    var r=rows[i],dc=0,ac=0;
    if(r.acts){for(var a in r.acts){ac++;if(r.acts[a].done)dc++;}}
    h+="<tr><td><strong>"+esc(r.name||'?')+"</strong></td><td><strong>"+(r.score||0)+" / "+(r.max||'?')+"</strong></td><td>"+dc+" / "+ac+"</td>";
    for(var k2 in KK_MAP){var kk=(r.kk&&r.kk[k2])?r.kk[k2]:{c:0,t:0};h+="<td>"+kdot(kk.c,kk.t)+kk.c+"/"+kk.t+"</td>";}
    var dt=r.updated?new Date(r.updated):null;
    h+="<td>"+(dt?dt.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—')+"</td></tr>";
  }
  return h+"</table></div>";
}

render();
</script>
