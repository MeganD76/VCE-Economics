<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCE Economics — Unit 4 AOS1 Monetary Policy Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2e1a47;--primary-mid:#43286b;--primary-light:#7c5cad;
  --accent:#d4a017;--accent-pale:#faf3df;
  --green:#15803d;--green-pale:#f0fdf4;
  --red:#b91c1c;--red-pale:#fef2f2;
  --amber:#d97706;--amber-pale:#fffbeb;
  --text:#241a33;--text-sec:#6b6477;
  --border:#e5e0ec;--bg:#f8f6fb;--white:#ffffff;
  --shadow:0 4px 20px rgba(46,26,71,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;}
.wrap{max-width:840px;margin:0 auto;padding:0 28px 60px;}
h1,h2,h3{font-family:'Playfair Display',serif;}
.hero{background:var(--primary);color:#fff;padding:46px 28px 40px;margin-bottom:28px;}
.hero-inner{max-width:840px;margin:0 auto;}
.hero .badge{display:inline-block;background:rgba(212,160,23,0.18);border:1px solid var(--accent);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:.5px;margin-bottom:14px;}
.hero h1{font-size:34px;margin-bottom:8px;}
.hero p{color:#cfc4e2;max-width:560px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px;}
.btn{font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--primary-mid);color:#fff;}
.btn:hover{background:var(--primary);}
.btn.gold{background:var(--accent);color:var(--primary);}
.btn.ghost{background:transparent;color:var(--primary-mid);border:1.5px solid var(--primary-light);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:7px 14px;font-size:13.5px;}
input[type=text],input[type=password],input[type=number]{font-family:'Source Sans 3',sans-serif;font-size:16px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;width:100%;max-width:340px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.tile{background:var(--white);border:1px solid var(--border);border-radius:15px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s;}
.tile:hover{transform:translateY(-2px);}
.tile.locked{opacity:.55;cursor:default;}
.tile.locked:hover{transform:none;}
.tile h3{font-size:19px;margin:6px 0 4px;color:var(--primary);}
.tile .num{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
.tile .meta{font-size:13.5px;color:var(--text-sec);}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;margin-top:10px;}
.pill.done{background:var(--green-pale);color:var(--green);}
.pill.prog{background:var(--accent-pale);color:#9a7410;}
.pill.new{background:#eee9f6;color:var(--primary-mid);}
.pill.soon{background:#f1eff5;color:var(--text-sec);}
.nav{background:var(--primary-mid);color:#fff;border-radius:12px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
.nav .score{font-weight:700;color:var(--accent);}
.nav .sname{font-size:14px;color:#d9cfeb;}
.acard{background:var(--white);border:1px solid var(--border);border-radius:15px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);}
.acard:hover{border-color:var(--primary-light);}
.acard h3{font-size:17px;color:var(--primary);}
.acard .tdesc{font-size:13.5px;color:var(--text-sec);}
.opt{display:block;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px;font-family:'Source Sans 3',sans-serif;cursor:pointer;transition:border-color .15s;}
.opt:hover:not(:disabled){border-color:var(--primary-light);}
.opt.ok{border-color:var(--green);background:var(--green-pale);}
.opt.bad{border-color:var(--red);background:var(--red-pale);}
.opt:disabled{cursor:default;color:var(--text);opacity:1;}
.fb{border-left:4px solid var(--primary-light);background:#f6f2fc;border-radius:0 10px 10px 0;padding:12px 14px;font-size:14.5px;margin:10px 0;}
.tip{border-left:4px solid var(--amber);background:var(--amber-pale);border-radius:0 8px 8px 0;padding:12px 14px;font-size:14px;margin:10px 0;}
.rule{border:1.5px solid var(--amber);background:var(--amber-pale);border-radius:10px;padding:12px 14px;font-size:14px;margin:12px 0;}
.qhead{font-weight:700;font-size:16px;margin:18px 0 4px;}
.qhead:first-child{margin-top:0;}
.chip{display:inline-block;border:1.5px solid var(--border);background:var(--white);border-radius:18px;padding:7px 14px;margin:5px 6px 0 0;font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;}
.chainstep{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px;}
.resp{font-style:italic;background:#f6f2fc;border-radius:10px;padding:14px 16px;margin:10px 0;font-size:15px;}
.snap{background:var(--accent-pale);border:1.5px solid var(--accent);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:14.5px;}
.blank{display:inline-block;min-width:90px;border-bottom:2px dashed var(--primary-light);text-align:center;font-weight:700;color:var(--primary-mid);padding:0 6px;}
.blank.ok{color:var(--green);border-color:var(--green);}
.blank.bad{color:var(--red);border-color:var(--red);}
.save-toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px;display:none;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:50;}
.save-toast.show{display:flex;}
.tl-wrap{overflow-x:auto;}
.backlink{display:inline-block;margin-bottom:14px;color:var(--primary-mid);font-weight:600;cursor:pointer;font-size:14.5px;}
table.tch{width:100%;border-collapse:collapse;font-size:13px;}
table.tch th,table.tch td{border:1px solid var(--border);padding:6px 7px;text-align:left;vertical-align:top;}
table.tch th{background:#f3eefb;color:var(--primary);}
.kdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;}
.selfcheck li{margin:7px 0 7px 18px;font-size:15px;}
.footer-link{text-align:center;margin-top:34px;font-size:13px;color:var(--text-sec);}
.footer-link span{cursor:pointer;text-decoration:underline;}
.obj-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.obj-col{border:2px dashed var(--border);border-radius:12px;padding:12px;min-height:80px;}
.obj-col h4{font-size:13px;font-weight:700;color:var(--primary-mid);margin-bottom:6px;text-align:center;}
.obj-chip{display:block;border:1.5px solid var(--border);background:var(--white);border-radius:10px;padding:8px 10px;margin:5px 0;font-size:13.5px;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-align:left;width:100%;}
.obj-chip.ok{border-color:var(--green);background:var(--green-pale);}
.obj-chip.bad{border-color:var(--red);background:var(--red-pale);}
.obj-bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.obj-bank-chip{border:1.5px solid var(--primary-light);background:#f3eefb;border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer;font-family:'Source Sans 3',sans-serif;}
.obj-exp{font-size:13.5px;padding:7px 10px;border-radius:8px;margin:4px 0;}
.obj-exp.ok{background:var(--green-pale);}
.obj-exp.bad{background:var(--red-pale);}
@media(max-width:600px){.obj-cols{grid-template-columns:1fr;}}
/* corridor visual */
.corridor{position:relative;height:54px;background:linear-gradient(to right,var(--green-pale),var(--accent-pale),var(--red-pale));border-radius:10px;border:1px solid var(--border);margin:30px 0 28px;}
.cmark{position:absolute;top:-22px;font-size:11px;font-weight:700;transform:translateX(-50%);white-space:nowrap;color:var(--text-sec);}
.cmark.t{color:var(--primary);}
.cline{position:absolute;top:0;bottom:0;width:2px;background:var(--text-sec);}
.cline.t{background:var(--primary);}
/* calc table */
table.calc{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0;}
table.calc th,table.calc td{border:1px solid var(--border);padding:8px;text-align:center;}
table.calc th{background:#f3eefb;color:var(--primary);font-size:13px;}
.calc-in{width:80px;padding:7px;border:1.5px solid var(--border);border-radius:8px;font-size:14.5px;text-align:center;}
.calc-in.ok{border-color:var(--green);background:var(--green-pale);}
.calc-in.bad{border-color:var(--red);background:var(--red-pale);}
/* comparison table */
table.comp{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;}
table.comp th,table.comp td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
table.comp th{background:#f3eefb;color:var(--primary);font-size:13px;}
/* drift bar */
.driftbar{display:flex;gap:10px;margin:14px 0;}
.driftseg{flex:1;padding:16px 10px;border-radius:12px;border:2px solid var(--border);text-align:center;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;font-size:14px;}
.driftseg.floor{background:var(--green-pale);}
.driftseg.target{background:var(--accent-pale);}
.driftseg.ceiling{background:var(--red-pale);}
.driftseg.ok{border-color:var(--green);box-shadow:0 0 0 2px var(--green);}
.driftseg.bad{border-color:var(--red);box-shadow:0 0 0 2px var(--red);}
.driftseg:disabled{cursor:default;}
.driftseg small{display:block;font-weight:400;font-size:12px;margin-top:4px;}
@media(max-width:560px){.hero h1{font-size:26px;}.wrap{padding:0 16px 50px;}.driftbar{flex-direction:column;}}
</style>
</head>

<script>

var KK_MAP={
  adpol:'AD policies & business cycle',
  mpdef:'Nature & objectives of MP',
  infl:'Inflation target & measurement',
  stance:'Stance of monetary policy',
  cashrate:'Cash rate & ES balances',
  corridor:'The corridor (ES rate & lending rate)',

  liquidity:'System liquidity & rate drift',

};

/* ============================================================
   LESSON 1 DATA
   ============================================================ */
var MCQ=[
 {q:"Which of the following best defines aggregate demand policies?",
  opts:["Policies that permanently expand the economy's productive capacity by improving technology",
        "Policies used to stabilise economic activity by influencing the level of aggregate demand",
        "Policies that directly regulate the prices businesses can charge consumers",
        "Policies focused on growing government revenue through new taxes"],
  a:1,kk:'adpol',
  fb:"AD policies work by altering the level of AD to counter the business cycle. Expanding productive capacity is the role of aggregate supply (AS) policies, which operate over the longer run.",
  tip:"Exam tip: always link AD policies to their purpose - stabilising the business cycle."},
 {q:"Which of the following is NOT one of the RBA's three statutory objectives under the Reserve Bank Act 1959?",
  opts:["The stability of the Australian dollar exchange rate",

  a:0,kk:'mpdef',

        "Reducing inflation to zero over a five-year planning horizon"],
  a:2,kk:'infl',
  fb:"The target is a flexible band - 2-3% on average over time - not a fixed point. Inflation can sit outside the band temporarily without the target being abandoned.",
  tip:"Exam tip: quote the full target - '2-3% on average over time' - on first mention."},
 {q:"Which statement about headline and underlying inflation is correct?",
  opts:["The RBA targets underlying inflation; headline is used only for international comparisons",
        "Underlying inflation strips out volatile price changes so the RBA can better forecast where headline CPI is heading",
        "Headline and underlying measures always move in the same direction by the same amount",
        "Underlying inflation includes commodity prices, while headline excludes them"],
  a:1,kk:'infl',
  fb:"The 2-3% target is quoted in headline CPI terms, but underlying measures strip out the most extreme price changes, giving a cleaner signal of where inflation is heading.",
  tip:"Exam tip: underlying excludes volatile items - students frequently reverse this."},
 {q:"Which statement best describes monetary policy in Australia?",
  opts:["The government's use of spending and taxation decisions to influence the level of aggregate demand",
        "The RBA's direct control over the interest rates charged on all bank loans",
        "The RBA's manipulation of the cash rate target to influence aggregate demand and stabilise economic activity",
        "The government's program of buying and selling foreign currency to manage the exchange rate"],
  a:2,kk:'mpdef',
  fb:"Monetary policy is operated by the RBA and works through the cash rate target, which flows through to borrowing costs and AD. Government spending and tax decisions are budgetary policy.",
  tip:"Exam tip: name the specific instrument - 'the cash rate target' - rather than just 'interest rates'."},
 {q:"The RBA's financial stability role is best described as:",
  opts:["Guaranteeing that Australian banks cannot lose money on their lending portfolios",
        "Setting the maximum interest rates banks can charge on home loans and credit cards",
        "Insuring all Australian share-market investments against capital losses",
        "Promoting the stability of the financial system, including acting as lender of last resort to solvent banks"],
  a:3,kk:'mpdef',
  fb:"The RBA promotes financial system stability and can lend to solvent banks in a crisis - the lender of last resort role. It does not guarantee profits, cap rates, or insure investments.",
  tip:"Exam tip: financial stability sits alongside the three statutory objectives."}
];

var OBJ={
  cats:["Stability of the currency","Maintenance of full employment","Economic prosperity and welfare"],
  items:[
    {t:"The RBA raises the cash rate to bring CPI back within the 2-3% band",c:0,why:"Keeping CPI within 2-3% on average over time is the operational definition of stability of the currency."},
    {t:"The RBA cuts the cash rate to stimulate AD and support job creation as unemployment rises",c:1,why:"Cutting the cash rate to boost activity and reduce unemployment directly pursues the maintenance of full employment objective."},
    {t:"Monetary policy is set to support rising material living standards and higher household incomes across the economy",c:2,why:"Improving prosperity and welfare - including living standards - is the third statutory objective, broader than just prices or jobs."},
    {t:"The RBA holds the cash rate steady to avoid stoking further inflationary pressure while wages growth accelerates",c:0,why:"Holding the cash rate to prevent CPI rising further is motivated by price stability."},
    {t:"The RBA acts to keep the unemployment rate near NAIRU so labour markets are neither too tight nor too slack",c:1,why:"Keeping unemployment around NAIRU is the practical meaning of maintenance of full employment."},
    {t:"The RBA considers how rate decisions might affect consumer confidence, business investment and long-run living standards",c:2,why:"These broader considerations fall under economic prosperity and welfare of the people of Australia."}
  ]
};

var TL={
  opts:['Expansionary','Highly expansionary','Contractionary','Neutral'],
  periods:[
    {label:'A - 2002-2004',desc:"Cash rate around 4.75-5.25%. Growth tracking close to trend, inflation near the middle of the 2-3% band.",a:3,
     why:"With growth near trend and inflation mid-band, the cash rate sat around the neutral rate of the time - neither stimulating nor restraining AD. The neutral rate was higher in the early 2000s than the ~3% used today."},
    {label:'B - 2007-2008',desc:"Cash rate lifted to 6.75-7.25% as strong demand and a commodity boom pushed inflation above 3%.",a:2,
     why:"Well above the neutral rate, the cash rate was set to restrain AD and reduce inflationary pressure - a contractionary stance."},
    {label:'C - 2009-2010',desc:"Cash rate cut rapidly to 3.0% at the height of the Global Financial Crisis as growth fell sharply.",a:0,
     why:"Emergency cuts pushed the rate toward and below the neutral level of the time - expansionary to stimulate AD and support employment, though not at an extreme low."},
    {label:'D - 2020-2021',desc:"Cash rate reduced to a record low of 0.10% during the COVID-19 recession, accompanied by unconventional policy measures.",a:1,
     why:"At 0.10% - the lowest rate in Australian history, far below any estimate of neutral - the stance was highly expansionary, an emergency measure of exceptional scale."},
    {label:'E - 2022-2023',desc:"Cash rate raised from 0.10% to 4.35% across 13 consecutive increases as inflation surged above 7%.",a:2,
     why:"The fastest tightening cycle in decades took the cash rate well above the ~3% neutral level - contractionary, to restrain AD and bring inflation back toward the 2-3% band."}
  ]
};

var DUAL={
  stanceOpts:['Expansionary','Contractionary','Neutral'],
  moveOpts:['Becoming more expansionary','Becoming less expansionary','Becoming more contractionary','Becoming less contractionary','Unchanged'],
  sc:[
    {desc:"The RBA raises the cash rate from 3.85% to 4.35%.",stance:1,move:2,
     why:"At 4.35% the cash rate is above the ~3% neutral rate - the stance is contractionary. The rise has pushed it further from neutral, making policy MORE contractionary."},
    {desc:"The RBA cuts the cash rate from 4.35% to 3.85%.",stance:1,move:3,
     why:"The classic trap: a cut does not automatically produce an expansionary stance. At 3.85%, the rate is still above neutral - the stance remains contractionary. The cut has simply made it LESS contractionary."},
    {desc:"The RBA cuts the cash rate from 2.50% to 2.00%.",stance:0,move:0,
     why:"Both 2.50% and 2.00% sit below the ~3% neutral rate - the stance was already expansionary. The cut makes it MORE expansionary."},
    {desc:"The RBA raises the cash rate from 1.50% to 2.25%.",stance:0,move:1,
     why:"The mirror trap: a rise does not automatically mean contractionary. At 2.25%, the rate is still below neutral - the stance remains expansionary. The rise makes it LESS expansionary."},
    {desc:"The RBA holds the cash rate at 3.00% with inflation tracking at 2.5%.",stance:2,move:4,
     why:"At roughly the neutral rate with inflation mid-band, policy is neither stimulating nor restraining AD - a neutral stance, unchanged by the hold decision."}
  ]
};

var CHAIN=[
  {pre:"Real GDP growth falls below the government's goal of around ",post:" per year and spare productive capacity begins to emerge.",opts:['3-3.5%','2-3%','4-4.25%'],a:0,kk:'adpol'},
  {pre:"With demand-side pressure easing, inflation falls below the lower bound of the RBA's target of ",post:" on average over time.",opts:['3-3.5%','2-3%','0-1%'],a:1,kk:'infl'},
  {pre:"The RBA Board is likely to respond by ",post:" the cash rate target at its next meeting.",opts:['raising','holding at the same level','cutting'],a:2,kk:'stance'},
  {pre:"This shifts the stance of monetary policy in a more ",post:" direction, reducing the cost of borrowing.",opts:['expansionary','contractionary','neutral'],a:0,kk:'stance'},
  {pre:"Cheaper credit should encourage households and firms to increase spending and investment, lifting the ",post:" components of AD and supporting a return toward trend growth.",opts:['G and (X-M)','C and I','X-M only'],a:1,kk:'adpol'}
];

var SPOT=[
  {q:"Define the stance of monetary policy and classify the stance after the RBA cuts the cash rate from 4.35% to 3.85%. Assume the neutral rate is around 3%. <strong>(2 marks)</strong>",
   resp:"The stance of monetary policy refers to whether the RBA is raising or lowering the cash rate at its board meetings. Because the RBA has just cut the cash rate, the stance of monetary policy is now expansionary.",
   marks:2,correctMark:0,kk:'stance',
   twoErrors:true,
   err1Opts:["The definition describes the direction of the most recent move, not the intended impact on AD","The definition should have included the exchange rate channel","The definition is missing a reference to fiscal policy","The definition should mention NAIRU"],
   err1A:0,err1fb:"The stance is defined by the intended IMPACT of the cash rate setting on AD - whether policy is set to stimulate, restrain or neither. The direction of the latest move is irrelevant to the definition.",
   err2Opts:["The classification ignores that 3.85% is still above the ~3% neutral rate, so the stance remains contractionary","The classification should be neutral, not expansionary","The student should have said the stance is highly expansionary","The classification is actually correct - any cut produces an expansionary stance"],
   err2A:0,err2fb:"At 3.85%, the cash rate still sits above neutral - so the stance is still contractionary, just less so. A cut only changes the stance once the rate actually falls to or below the neutral level.",
   fixed:"The stance of monetary policy refers to the intended impact of the cash rate setting on the level of AD. At 3.85%, the cash rate remains above the neutral rate of ~3%, so the stance is still contractionary - the cut has simply made policy less contractionary.",
   rule:"VCAA principle: BOTH marks are lost here. The definition is wrong and the classification follows from that wrong definition. Stance = level relative to neutral, not the direction of the last move."},
  {q:"Outline one reason why changes in monetary policy can influence the level of aggregate demand. <strong>(2 marks)</strong>",
   resp:"Monetary policy influences aggregate demand because the RBA directly controls every interest rate in the economy. When the RBA cuts the cash rate, all home loan and business lending rates immediately fall by exactly the same amount, which will increase consumption and investment spending.",
   marks:2,correctMark:1,kk:'mpdef',
   twoErrors:false,
   errOpts:["The RBA sets only the cash rate target - other rates are influenced through it, and the pass-through is neither immediate nor uniform",

   errA:0,

   rule:"VCAA principle: the RBA sets only the cash rate target. Also use 'likely/should' not 'will'. One mark is retained for correctly linking lower rates to higher C and I."}
];

var COND={
  sc:[
    {name:"Economy A",data:"CPI: <b>4.6%</b> (underlying 4.1%) &nbsp;&middot;&nbsp; Cash rate: <b>4.25%</b> &nbsp;&middot;&nbsp; Real GDP growth: <b>1.2% p.a.</b> &nbsp;&middot;&nbsp; Unemployment: <b>3.9%</b>",
     qs:[

  var total=0;for(var k in per){total+=per[k];}
  return{per:per,kk:kk,total:total,max:45};
}
function computeScores(){
  return S.lesson===2 ? computeL2Scores() : computeL1Scores();
}

function actProgress(id){
  var done=0,tot=0,i,j;
  if(id==='a1'){tot=MCQ.length;for(i=0;i<tot;i++){if(S.ans['a1-'+i]!==undefined)done++;}}
  if(id==='a2'){tot=1;done=S.obj.checked?1:0;}
  if(id==='a3'){tot=TL.periods.length;for(i=0;i<tot;i++){if(S.tl[i]!==undefined)done++;}}
  if(id==='a4'){tot=DUAL.sc.length*2;for(i=0;i<DUAL.sc.length;i++){if(S.dual['s'+i]!==undefined)done++;if(S.dual['m'+i]!==undefined)done++;}}
  if(id==='a5'){tot=CHAIN.length;for(i=0;i<tot;i++){if(S.chain[i]!==undefined)done++;}}
  if(id==='a6'){tot=SPOT.length*2;for(i=0;i<SPOT.length;i++){if(S.spot.marks[i]!==undefined)done++;if(SPOT[i].twoErrors){if(S.spot.gap2[i]!==undefined)done++;}else{if(S.spot.gap1[i]!==undefined)done++;}}}
  if(id==='a7'){tot=0;for(i=0;i<COND.sc.length;i++){tot+=COND.sc[i].qs.length;}for(i=0;i<tot;i++){if(S.cond[i]!==undefined)done++;}}

  if(id==='b1'){tot=MCQ2.length;for(i=0;i<tot;i++){if(S.l2ans['b1-'+i]!==undefined)done++;}}
  if(id==='b2'){
    tot=CALC2.rows.length+1+CALC2.tf.length;
    for(i=0;i<CALC2.rows.length;i++){if(S.l2calc[i]&&S.l2calc[i].checked)done++;}
    if(S.l2calc.shift&&S.l2calc.shift.checked)done++;
    for(i=0;i<CALC2.tf.length;i++){if(S.l2calctf[i]!==undefined)done++;}
  }
  if(id==='b3'){tot=CHAIN2.length;for(i=0;i<tot;i++){if(S.l2chain[i]!==undefined)done++;}}
  if(id==='b4'){tot=COMP2.length*2;for(i=0;i<COMP2.length;i++){if(S.l2comp[i+'_a']!==undefined)done++;if(S.l2comp[i+'_b']!==undefined)done++;}}
  if(id==='b5'){tot=DRIFT2.length;for(i=0;i<tot;i++){if(S.l2drift[i]!==undefined)done++;}}
  if(id==='b6'){tot=SPOT2.length*2;for(i=0;i<SPOT2.length;i++){if(S.l2spot.marks[i]!==undefined)done++;if(S.l2spot.gap[i]!==undefined)done++;}}
  if(id==='b7'){tot=1;done=S.l2sort.checked?1:0;}

  return{done:done,tot:tot,complete:done>=tot&&tot>0};
}
function lessonComplete(lessonId){
  var acts = LESSONS[lessonId-1].acts;
  var allDone=true,any=false;
  for(var i=0;i<acts.length;i++){var p=actProgress(acts[i].id);if(p.complete)any=true;else allDone=false;if(p.done>0)any=true;}
  if(allDone)return{cls:'done',txt:'Complete'};
  if(any)return{cls:'prog',txt:'In progress'};
  return{cls:'new',txt:'Not started'};
}

function syncResults(){

  var payload={name:S.name,lesson:'L'+S.lesson,score:sc.total,max:sc.max,acts:actData,kk:sc.kk};

}

function tlSVG(){
  var pts=[[1996,7.5],[1997,5.5],[1998,5.0],[1999,4.75],[2000,6.25],[2001,4.25],[2002,4.75],[2003,4.75],[2004,5.25],[2005,5.5],[2006,6.0],[2007,6.75],[2008,7.25],[2009,3.0],[2010,4.5],[2011,4.75],[2012,3.0],[2013,2.5],[2014,2.5],[2015,2.0],[2016,1.5],[2019,0.75],[2020,0.1],[2021,0.1],[2022,3.1],[2023,4.35],[2024,4.35],[2025,3.85]];
  function X(y){return 60+(y-1996)*(700/30);}
  function Y(r){return 250-r*(220/8);}
  var per=[[2002,2004],[2007,2008],[2009,2010],[2020,2021],[2022,2023]];
  var lbl=['A','B','C','D','E'];
  var s="<svg viewBox='0 0 800 290' xmlns='http://www.w3.org/2000/svg' style='width:100%;min-width:560px;background:#fff;border:1px solid var(--border);border-radius:12px'>";
  for(var g=0;g<=8;g+=2){s+="<line x1='60' y1='"+Y(g)+"' x2='760' y2='"+Y(g)+"' stroke='#eee9f6' stroke-width='1'/><text x='50' y='"+(Y(g)+4)+"' font-size='11' fill='#6b6477' text-anchor='end'>"+g+"%</text>";}
  for(var p=0;p<per.length;p++){s+="<rect x='"+X(per[p][0])+"' y='30' width='"+(X(per[p][1]+1)-X(per[p][0]))+"' height='220' fill='#d4a017' opacity='0.16'/><text x='"+((X(per[p][0])+X(per[p][1]+1))/2)+"' y='24' font-size='13' font-weight='700' fill='#9a7410' text-anchor='middle'>"+lbl[p]+"</text>";}
  var d='';for(var i=0;i<pts.length;i++){d+=(i===0?'M':'L')+X(pts[i][0])+' '+Y(pts[i][1])+' ';}
  s+="<path d='"+d+"' fill='none' stroke='#43286b' stroke-width='2.5'/>";
  s+="<line x1='60' y1='"+Y(3)+"' x2='760' y2='"+Y(3)+"' stroke='#b91c1c' stroke-width='1.5' stroke-dasharray='5,4'/><text x='755' y='"+(Y(3)-6)+"' font-size='11' fill='#b91c1c' text-anchor='end'>~3% neutral (today)</text>";

  return s;
}

  var h="<div class='card'><p style='font-size:14.5px;margin-bottom:10px'>For each cash rate target, calculate the ES rate (floor, target minus 0.10) and the lending rate (ceiling, target plus 0.25). Enter values to 2 decimal places, then check.</p>";

    h+="<tr><td><strong>"+r.target.toFixed(2)+"%</strong></td>";
    h+="<td><input type='number' step='0.01' class='calc-in"+(row.checked?(Math.abs((row.floorVal||0)-r.floor)<=CALC2.tol?' ok':' bad'):'')+"' id='cf"+i+"' "+(row.checked?'disabled':'')+" value='"+(row.floorVal!==undefined?row.floorVal:'')+"' placeholder='%'></td>";

  }
  h+="</table>";
  var allDone=true;for(var j=0;j<CALC2.rows.length;j++){if(!S.l2calc[j]||!S.l2calc[j].checked)allDone=false;}
  if(allDone){h+="<div class='fb'><strong>Pattern check:</strong> notice the floor always sits 0.10 percentage points BELOW the target, while the ceiling always sits 0.25 percentage points ABOVE it - the corridor is not symmetric. Its width (0.35pp) never changes - only its position shifts when the target changes.</div>";}
  h+="</div>";

  // Corridor shift scenario
  var sh=CALC2.shift, srow=S.l2calc.shift||{};
  h+="<div class='card'><p style='font-size:14.5px;margin-bottom:10px'><strong>Corridor shift:</strong> the cash rate target moves from "+sh.from.target.toFixed(2)+"% (floor "+sh.from.floor.toFixed(2)+"%, ceiling "+sh.from.ceiling.toFixed(2)+"%) to a new target of "+sh.to.target.toFixed(2)+"%. Calculate the NEW floor and ceiling.</p>";

  h+="<tr><td><strong>"+sh.to.target.toFixed(2)+"%</strong></td>";
  h+="<td><input type='number' step='0.01' class='calc-in"+(srow.checked?(Math.abs((srow.floorVal||0)-sh.to.floor)<=CALC2.tol?' ok':' bad'):'')+"' id='shf' "+(srow.checked?'disabled':'')+" value='"+(srow.floorVal!==undefined?srow.floorVal:'')+"' placeholder='%'></td>";
  h+="<td><input type='number' step='0.01' class='calc-in"+(srow.checked?(Math.abs((srow.ceilVal||0)-sh.to.ceiling)<=CALC2.tol?' ok':' bad'):'')+"' id='shc' "+(srow.checked?'disabled':'')+" value='"+(srow.ceilVal!==undefined?srow.ceilVal:'')+"' placeholder='%'></td>";
  h+="<td>"+(srow.checked?"<span style='font-size:13px;color:var(--text-sec)'>Correct: "+sh.to.floor.toFixed(2)+"% / "+sh.to.ceiling.toFixed(2)+"%</span>":"<button class='btn btn-sm gold' onclick='checkCalcShift()'>Check</button>")+"</td></tr>";
  h+="</table>";
  if(srow.checked){h+="<div class='fb'>The whole corridor shifts together with the target - the floor and ceiling each move by the same amount as the target ("+(sh.to.target-sh.from.target>=0?'+':'')+(sh.to.target-sh.from.target).toFixed(2)+"pp).</div>";}
  h+="</div>";

  // True/False set
  h+="<div class='card'><p style='font-size:14.5px;margin-bottom:10px'><strong>True or False:</strong> for each statement about the corridor, decide whether it is true or false.</p>";
  for(var t=0;t<CALC2.tf.length;t++){h+="<div id='calctf-"+t+"'>"+calcTfInner(t)+"</div>";}
  h+="</div>";

  return h;

function ansMark2(i,m){if(S.l2spot.marks[i]!==undefined)return;S.l2spot.marks[i]=m;saveState();var el=document.getElementById('spot2-'+i);if(el)el.innerHTML=spot2Inner(i);updateNav();maybeSync('b6');}
function ansGap2L2(i,e){if(S.l2spot.gap[i]!==undefined)return;S.l2spot.gap[i]=e;saveState();var el=document.getElementById('spot2-'+i);if(el)el.innerHTML=spot2Inner(i);updateNav();maybeSync('b6');}

/* ---- B7 RBA TOOL OR NOT (2-column sorter) ---- */
function vSort2(){
  var h="<div class='card'><p style='font-size:14.5px'>Click each statement to assign it: things the RBA actually does, or things it does not do. Click a placed item to remove it.</p>";
  var placed={};for(var k in S.l2sort.placed){placed[k]=S.l2sort.placed[k];}
  h+="<div class='obj-cols' style='grid-template-columns:repeat(2,1fr)'>";
  for(var c=0;c<2;c++){
    h+="<div class='obj-col'><h4>"+SORT2.cats[c]+"</h4>";
    for(var j=0;j<SORT2.items.length;j++){
      if(placed[j]===c){
        var cls2='obj-chip';
        if(S.l2sort.checked)cls2+=placed[j]===SORT2.items[j].c?' ok':' bad';
        h+="<button class='"+cls2+"' onclick='removeSort2("+j+")'>"+SORT2.items[j].t+"</button>";
      }
    }
    h+="</div>";
  }
  h+="</div>";
  var unplaced=[];for(var m=0;m<SORT2.items.length;m++){if(placed[m]===undefined)unplaced.push(m);}
  if(unplaced.length>0){
    h+="<p style='font-size:13.5px;color:var(--text-sec);margin:8px 0 4px'>Items to place - click one, then click a column:</p><div class='obj-bank' id='sortBank2'>";
    for(var n=0;n<unplaced.length;n++){h+="<button class='obj-bank-chip' onclick='selectSort2("+unplaced[n]+")' id='sb2-"+unplaced[n]+"'>"+SORT2.items[unplaced[n]].t+"</button>";}
    h+="</div>";
  }
  var allPlaced=(unplaced.length===0);
  if(allPlaced&&!S.l2sort.checked)h+="<button class='btn gold' style='margin-top:10px' onclick='checkSort2()'>Check my answers</button>";
  if(S.l2sort.checked){
    h+="<div style='margin-top:14px'>";
    for(var p=0;p<SORT2.items.length;p++){
      var ok=S.l2sort.placed[p]===SORT2.items[p].c;
      h+="<div class='obj-exp "+(ok?'ok':'bad')+"'><strong>"+(ok?'Correct - ':'Not quite - ')+SORT2.items[p].t+"</strong> - "+SORT2.cats[SORT2.items[p].c]+". "+SORT2.items[p].why+"</div>";
    }
    h+="</div>";
  }
  h+="</div>";
  return h;
}
var _sort2Sel=null;
function selectSort2(idx){
  _sort2Sel=idx;
  var els=document.querySelectorAll('#sortBank2 .obj-bank-chip');
  for(var i=0;i<els.length;i++){els[i].style.borderColor='';}
  var el=document.getElementById('sb2-'+idx);
  if(el)el.style.borderColor='var(--accent)';
  var cols=document.querySelectorAll('.obj-col');
  for(var c=0;c<cols.length;c++){(function(ci){cols[ci].style.cursor='pointer';cols[ci].onclick=function(){placeSort2(ci);};})(c);}
}
function placeSort2(col){
  if(_sort2Sel===null)return;
  if(S.l2sort.checked)return;
  S.l2sort.placed[_sort2Sel]=col;_sort2Sel=null;saveState();
  document.getElementById('app').innerHTML=vAct();window.scrollTo(0,0);
}
function removeSort2(idx){if(S.l2sort.checked)return;delete S.l2sort.placed[idx];saveState();document.getElementById('app').innerHTML=vAct();window.scrollTo(0,0);}
function checkSort2(){S.l2sort.checked=true;maybeSync('b7');document.getElementById('app').innerHTML=vAct();window.scrollTo(0,0);}

/* ================= TEACHER ================= */
function vTeacherPin(){
  return "<div class='hero' style='padding:34px 28px 30px'><div class='hero-inner'><span class='badge'>STAFF</span><h1 style='font-size:26px'>Teacher view</h1></div></div><div class='wrap'><div class='card'><p style='font-size:14.5px;margin-bottom:10px'>Enter your teacher PIN to load class results.</p><input type='password' id='pinIn' placeholder='PIN'><button class='btn gold' style='margin-top:10px;display:block' onclick='loadTeacher()'>View results</button><div id='tchOut' style='margin-top:18px'></div></div><span class='backlink' onclick='go(\"home\")'>Back</span></div>";
}
function loadTeacher(){
  var pin=document.getElementById('pinIn').value.trim();
  var out=document.getElementById('tchOut');
  out.innerHTML="<em>Loading...</em>";
  fetch(RES_URL+'/?pin='+encodeURIComponent(pin)).then(function(r){return r.json();}).then(function(d){
    if(d.error){out.innerHTML="<span style='color:var(--red)'>"+esc(d.error)+"</span>";return;}
    out.innerHTML=teacherTable(d.results||[]);
  }).catch(function(e){out.innerHTML="<span style='color:var(--red)'>Error: "+esc(e.message)+"</span>";});
}
function kdot(c,t){if(t===0)return"<span class='kdot' style='background:#d6d2de'></span>";var pct=c/t;var col=pct>=0.8?'#15803d':(pct>=0.5?'#d97706':'#b91c1c');return"<span class='kdot' style='background:"+col+"'></span>";}
function teacherTable(rows){
  if(!rows.length)return"<p>No results yet.</p>";
  rows.sort(function(a,b){var n=(a.name||'').localeCompare(b.name||'');if(n!==0)return n;return (a.lesson||'').localeCompare(b.lesson||'');});
  var h="<p style='font-size:13.5px;color:var(--text-sec);margin-bottom:8px'>"+rows.length+" submission(s) - green at least 80%, amber 50-79%, red below 50%, grey not assessed this lesson</p><div style='overflow-x:auto'><table class='tch'><tr><th>Student</th><th>Lesson</th><th>Score</th><th>Acts done</th>";
  for(var k in KK_MAP){h+="<th>"+KK_MAP[k]+"</th>";}
  h+="<th>Updated</th></tr>";
  for(var i=0;i<rows.length;i++){
    var r=rows[i], dc=0, ac=0;
    if(r.acts){for(var a in r.acts){ac++;if(r.acts[a].done)dc++;}}
    h+="<tr><td><strong>"+esc(r.name||'?')+"</strong></td><td>"+esc(r.lesson||'')+"</td><td><strong>"+(r.score||0)+" / "+(r.max||'?')+"</strong></td><td>"+dc+" / "+ac+"</td>";
    for(var k2 in KK_MAP){var kk=(r.kk&&r.kk[k2])?r.kk[k2]:{c:0,t:0};h+="<td>"+kdot(kk.c,kk.t)+kk.c+"/"+kk.t+"</td>";}
    var dt=r.updated?new Date(r.updated):null;
    h+="<td>"+(dt?dt.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-')+"</td></tr>";
  }
  return h+"</table></div>";
}

render();
