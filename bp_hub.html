<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCE Economics — Budgetary Policy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2e1a47; --primary-mid:#46306b; --primary-light:#8a6fc0;
  --accent:#c9a227; --accent-pale:#faf5e4;
  --green:#15803d; --green-pale:#f0fdf4;
  --red:#b91c1c; --red-pale:#fef2f2;
  --amber:#d97706; --amber-pale:#fffbeb;
  --text:#251b33; --text-sec:#6b6478;
  --border:#e5e0ee; --bg:#f7f5fa; --white:#ffffff;
  --shadow:0 4px 20px rgba(46,26,71,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
h1,h2,h3{font-family:'Playfair Display',serif}
.wrap{max-width:840px;margin:0 auto;padding:0 28px 60px}
.hero{background:var(--primary);color:#fff;padding:44px 0 36px;margin-bottom:26px}
.hero .wrap{padding-bottom:0}
.hero .kicker{color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;margin-bottom:10px}
.hero h1{font-size:2.1rem;line-height:1.15;margin-bottom:8px}
.hero p{color:#d9d2e8;max-width:560px}
.nav{background:var(--primary-mid);color:#fff;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.nav .inner{max-width:840px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.nav .score{font-weight:700;color:var(--accent)}
.nav .who{font-size:.9rem;color:#d9d2e8}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:16px;height:4px;border-radius:3px;background:rgba(255,255,255,.28)}
.dot.on{background:var(--accent)}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
button{font-family:'Source Sans 3',sans-serif;font-weight:600;border:none;border-radius:10px;cursor:pointer;font-size:.95rem}
.btn{background:var(--primary);color:#fff;padding:11px 20px}
.btn:hover{background:var(--primary-mid)}
.btn.gold{background:var(--accent);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tile{display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile.locked{opacity:.55;cursor:default}
.tile.locked:hover{transform:none}
.tile h3{font-size:1.15rem;margin-bottom:3px}
.tile .sub{color:var(--text-sec);font-size:.9rem}
.pill{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--accent-pale);color:#8a6d12;border:1px solid var(--accent)}
.pill.soon{background:#eee;color:#888}
.pill.done{background:var(--green-pale);color:var(--green);border:1px solid var(--green)}
.opt{display:block;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;font-weight:400;font-size:.95rem}
.opt:hover{border-color:var(--primary-light)}
.opt.sel{border-color:var(--primary);background:#f3eefc}
.opt.correct{border-color:var(--green);background:var(--green-pale)}
.opt.wrong{border-color:var(--red);background:var(--red-pale)}
.opt:disabled{cursor:default;opacity:1}
.fb{border-radius:10px;padding:12px 14px;margin-top:10px;font-size:.92rem}
.fb.good{background:var(--green-pale);border:1px solid var(--green)}
.fb.bad{background:var(--red-pale);border:1px solid var(--red)}
.tip{background:var(--amber-pale);border:1px solid var(--amber);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:.9rem}
.chip{display:inline-block;background:var(--white);border:1.5px solid var(--border);border-radius:999px;padding:8px 14px;margin:5px;cursor:pointer;font-size:.9rem;font-weight:600}
.chip.sel{border-color:var(--accent);background:var(--accent-pale)}
.chip.ok{border-color:var(--green);background:var(--green-pale)}
.chip.bad{border-color:var(--red);background:var(--red-pale)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cols.c2{grid-template-columns:repeat(2,1fr)}
.cols.c4{grid-template-columns:repeat(2,1fr)}
.col{background:var(--bg);border:1.5px dashed var(--border);border-radius:12px;min-height:120px;padding:10px}
.col h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);margin-bottom:8px;text-align:center}
.col .chip{display:block;margin:5px 0;text-align:center}
.calcrow{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.calcrow input{width:110px;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem}
.calcrow input.ok{border-color:var(--green);background:var(--green-pale)}
.calcrow input.bad{border-color:var(--red);background:var(--red-pale)}
table.data{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92rem}
table.data th,table.data td{border:1px solid var(--border);padding:8px 10px;text-align:left}
table.data th{background:var(--accent-pale)}
.stu{font-style:italic;background:var(--bg);border-left:4px solid var(--primary-light);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.markbtns{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.markbtns button{min-width:44px;height:44px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);font-size:1rem;padding:0 6px}
.markbtns button.sel{border-color:var(--primary);background:#f3eefc}
.markbtns button.ok{border-color:var(--green);background:var(--green-pale)}
.markbtns button.bad{border-color:var(--red);background:var(--red-pale)}
.rule{background:var(--amber-pale);border:1px solid var(--amber);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.9rem}
.toast{position:fixed;bottom:18px;right:18px;background:var(--green);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .3s;z-index:99}
.toast.show{opacity:1}
.progressline{font-size:.85rem;color:var(--text-sec);margin-bottom:10px}
.selfcheck{background:var(--accent-pale);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:18px}
.selfcheck h3{margin-bottom:6px;font-size:1rem}
.selfcheck li{margin-left:20px;font-size:.92rem}
input.name{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;margin:12px 0}
.acttile{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kktag{font-size:.72rem;background:#f3eefc;color:var(--primary-mid);border-radius:6px;padding:2px 7px;font-weight:700;margin-left:6px}
.tgrid{width:100%;border-collapse:collapse;font-size:.8rem}
.tgrid th,.tgrid td{border:1px solid var(--border);padding:5px 7px;text-align:center}
.tgrid th{background:var(--primary);color:#fff;font-weight:600}
.tgrid td.name{text-align:left;font-weight:700}
.tscroll{overflow-x:auto}
@media(max-width:640px){.cols{grid-template-columns:1fr}.hero h1{font-size:1.6rem}}
@media print{.nav,.btn,.toast{display:none!important}}
</style>
</head>

var LESSON_DATA = {};

/* ---------------- LESSON 1 : Revenue & Expenses ---------------- */
LESSON_DATA[1] = {
 mcq:[
 {kk:"kk1",q:"Budgetary policy is best defined as:",o:[
  "the Reserve Bank's manipulation of the cash rate to influence the cost of borrowing and the level of aggregate demand in the economy",
  "the manipulation of the level and composition of federal government revenue and expenditure to help achieve government goals",
  "the federal government setting the interest rates that apply to its outstanding public debt when the budget is released each May",
  "state government decisions about payroll tax and stamp duty"],a:1,

  tip:"Always include both 'level' AND 'composition' in the definition — VCAA rewards precision here."},
 {kk:"kk1",q:"In the 2026-27 Budget, the government expects to collect approximately how much in total receipts?",o:[
  "$616.6 billion","$829.6 billion","$139.6 billion","$798.1 billion"],a:3,
  fb:"The 2026-27 Budget forecasts total receipts of $798.1 billion, against expected payments of $829.6 billion. $616.6B is expected net debt, and $139.6B is the health spending allocation.",
  tip:"Learn the headline receipts, payments and outcome figures for the current budget — examiners reward current data."},
 {kk:"kk1",q:"The single largest source of Australian Government revenue in the 2026-27 Budget is:",o:[
  "personal income tax, at around 48% of revenue",
  "GST collections received and then transferred to the states",
  "company tax and resource rent taxes combined",
  "excises levied on fuel, alcohol and tobacco products"],a:0,
  fb:"Personal income tax is forecast to make up around 48% of all government revenue in 2026-27 — by far the largest single source. Company and resource rent taxes are large but smaller, and GST flows TO the states, not from them.",
  tip:"'Individuals income tax' and 'personal income tax' mean the same thing in budget papers."},
 {kk:"kk2",q:"The largest single category of Australian Government expenditure is:",o:[
  "defence and national security","health, including Medicare","social security and welfare","education and training"],a:2,
  fb:"Social security and welfare — including all pensions and unemployment benefits — is the largest outlay category. Health ($139.6B in 2026-27) is also very large but second.",
  tip:"This has been directly tested in multiple-choice on past SACs — memorise the order: welfare, then health."},
 {kk:"kk1",q:"Which of the following is an INDIRECT tax?",o:[
  "fringe benefits tax","excise on fuel","superannuation tax","company tax on profits"],a:1,
  fb:"Indirect taxes are levied on SPENDING on goods and services — excises and the GST. Fringe benefits tax, superannuation tax and company tax are all levied on income earned, making them direct taxes.",
  tip:"Test yourself: is the tax triggered when income is EARNED (direct) or when money is SPENT (indirect)?"},
 {kk:"kk2",q:"Paying the salaries of public servants is classified as:",o:[
  "G1 — government current (consumption) expenditure",
  "a transfer payment made without goods or services in return",
  "G2 — government capital (investment) expenditure",
  "a source of non-tax revenue for the government"],a:0,
  fb:"Salaries and day-to-day running costs are G1, government current/consumption expenditure. G2 covers spending on assets that provide future benefits (infrastructure, submarines). Transfers are payments made without goods or services received in return.",
  tip:"G1 = day-to-day; G2 = assets with future benefits. Both are in the G of AD; transfers are NOT."},
 {kk:"kk2",q:"Transfer payments such as JobSeeker are NOT counted in the G component of aggregate demand because:",o:[
  "they are too small a share of total government outlays to have any measurable influence on aggregate demand",
  "they are financed through government borrowing rather than through taxation revenue collected each year",
  "no good or service is received in return; they affect AD indirectly through C when spent",
  "the government receives no good or service in return; they affect AD indirectly through consumption when recipients spend them"],a:2,
  fb:"Transfers redistribute income — the government gets no good or service in exchange, so they are not government spending on output. They influence AD indirectly: recipients spend the money, lifting C.",
  tip:"A classic trap. If asked how welfare affects AD, trace it through C, never through G."},
 {kk:"kk1",q:"Which of the following is an example of NON-TAX revenue?",o:[
  "the Medicare levy collected from Australian taxpayers each year",
  "the Petroleum Resource Rent Tax on LPG profits",
  "dividends earned from Australia Post, a GBE",
  "GST collected on retail sales"],a:2,
  fb:"Non-tax revenue includes dividends and interest earned by the government, income from Government Business Enterprises like Australia Post, and proceeds from asset sales (e.g. Medibank Private in the past). The Medicare levy, PRRT and GST are all taxes.",
  tip:"A GBE is a government-owned business run like a private firm to generate profit — the government is the majority shareholder."}
],
 sorts:{
  sortRev:{cats:["Direct tax","Indirect tax","Non-tax revenue"],items:[
   {t:"Personal income tax",c:0,why:"Levied directly on income earned by individuals — the largest direct tax."},

   {t:"Company tax on profits",c:0,why:"Levied on income (profit) earned by companies — direct."},
   {t:"GST",c:1,why:"A broad-based tax on spending on goods and services — indirect."},

  sortExp:{cats:["G1 — current expenditure","G2 — capital expenditure","Transfer payment"],items:[
   {t:"Paying GPs for Medicare-funded consultations",c:0,why:"Payment for a service delivered now — day-to-day (current) spending, G1."},
   {t:"Building a new public hospital",c:1,why:"Creates an asset providing benefits for years — capital spending, G2."},
   {t:"Age Pension payments",c:2,why:"Income support with no good or service received in return — a transfer."},
   {t:"Office supplies for a government department",c:0,why:"Day-to-day running cost — G1."},
   {t:"Purchasing new submarines",c:1,why:"Military hardware is a long-lived asset — capital spending, G2."},
   {t:"JobSeeker payments",c:2,why:"Income support to the unemployed — a transfer payment."},
   {t:"Wages of defence personnel",c:0,why:"Salaries are current spending — G1 (contrast with buying the hardware they use)."},
   {t:"Constructing energy transmission infrastructure",c:1,why:"Long-lived infrastructure asset — G2."},
   {t:"Disability Support Pension",c:2,why:"Income support — a transfer payment, affecting AD via C when spent."}
  ]}
 },
 calcs:{
  calc1:{
   intro:"The fictional economy of Tarland has the following income tax system: the first $20,000 of income is tax-free; income from $20,001 to $80,000 is taxed at 20%; income above $80,000 is taxed at 40%. Separately, Tarland levies a 10% consumption tax on all goods.",
   rows:[
    {label:"Average tax rate for a worker earning $40,000 (income tax only)", unit:"%", ans:10.0, tol:0.2,
     why:"Tax = 20% × $20,000 = $4,000. Average rate = 4,000 ÷ 40,000 = 10.0%."},
    {label:"Average tax rate for a worker earning $80,000 (income tax only)", unit:"%", ans:15.0, tol:0.2,
     why:"Tax = 20% × $60,000 = $12,000. Average rate = 12,000 ÷ 80,000 = 15.0%."},
    {label:"Average tax rate for a worker earning $160,000 (income tax only)", unit:"%", ans:27.5, tol:0.2,
     why:"Tax = $12,000 + 40% × $80,000 = $44,000. Average rate = 44,000 ÷ 160,000 = 27.5%."},
    {label:"Two shoppers each spend $10,000 on taxed goods, paying $1,000 consumption tax. Average tax rate for the shopper earning $50,000", unit:"%", ans:2.0, tol:0.2,
     why:"1,000 ÷ 50,000 = 2.0% of income."},
    {label:"Average tax rate of that same $1,000 consumption tax for the shopper earning $200,000", unit:"%", ans:0.5, tol:0.2,
     why:"1,000 ÷ 200,000 = 0.5% of income."}
   ],
   trend:"Trend analysis: Tarland's income tax is PROGRESSIVE — the average tax rate rises (10% → 15% → 27.5%) as income rises, narrowing the gap between high and low income earners. The consumption tax is REGRESSIVE — the same dollar amount of tax is a falling percentage of income (2.0% → 0.5%) as income rises, so it falls more heavily on lower income earners. This is why Australia exempts basic goods like bread, milk, health and education from the GST."
  }
 },
 marks:{
  mark1:[
  {kk:"kk1",q:"Distinguish between direct and indirect taxes, providing an example of each. (2 marks)",
   stu:"Direct taxes are taxes paid directly to the government by the consumer, such as the GST, while indirect taxes are collected indirectly through a third party, such as personal income tax.",
   marks:[0,1,2], correct:0, bait:1,
   gaps:["The examples are reversed AND the distinction is based on the wrong criterion — it should be income vs spending, not how the tax is collected",

         "The response should have used company tax instead of income tax as its indirect example"],
   g:0,
   fix:"Direct taxes are levied on income as it is earned, such as personal income tax. Indirect taxes are levied on spending on goods and services, such as the GST.",

  {kk:"kk2",q:"Explain one way transfer payments differ from government current expenditure (G1). (2 marks)",
   stu:"Transfer payments like the Age Pension are government spending on goods and services, so they are included in G1 and directly add to aggregate demand when they are paid out.",
   marks:[0,1,2], correct:0, bait:1,
   gaps:["Age Pension is a state government payment, not federal",
         "Transfer payments are part of G2, not G1",
         "Transfers are NOT spending on goods and services and are excluded from G — they affect AD indirectly through C when recipients spend them",
         "The response needed a dollar figure from the current budget"],
   g:2,
   fix:"Transfer payments differ from G1 because the government receives no good or service in return — they redistribute income to recipients such as Age Pensioners. Unlike G1, transfers are not counted in the G component of AD; they influence AD indirectly by boosting consumption (C) when recipients spend the income.",
   rule:"VCAA principle: an answer built on a false premise (transfers being part of G) cannot earn marks for a correct-sounding conclusion. Naming a real payment (Age Pension) does not rescue a response whose core mechanism is wrong."}
  ]

  scen:"It is Budget night, 12 May 2026. The Treasurer announces total expected receipts of $798.1 billion against expected payments of $829.6 billion. Measures include a new $250 Working Australians Tax Offset, a cut to the fuel excise, $139.6 billion for health (including funds to build new hospitals), an increase in pension indexation, and $163.6 billion in 'other purposes' including GST transfers to the states.",
  qs:[
 {kk:"kk1",q:"The $250 Working Australians Tax Offset affects which part of the budget?",o:[

    "revenue — it reduces direct (income) tax collected",
    "revenue — it reduces indirect tax collections"],a:2,
    fb:"A tax offset reduces the income tax individuals pay, so it reduces revenue from direct taxation. It is not a payment out — no money is spent; less is collected."},
 {kk:"kk1",q:"The cut to the fuel excise will:",o:[
  "reduce indirect tax revenue",
  "reduce direct tax revenue",
  "increase non-tax revenue based on figures released this year",
  "increase transfer payments"
 ],a:0,
    fb:"Fuel excise is a tax on spending on petrol/diesel — an indirect tax. Cutting it reduces indirect tax revenue."},
 {kk:"kk2",q:"Within the $139.6 billion health allocation, the money used to build new hospitals is best classified as:",o:[
    "a transfer payment","G1 — current expenditure","non-tax expenditure","G2 — capital expenditure"],a:3,

 {kk:"kk2",q:"The increase in pension indexation raises spending on:",o:[
    "G2 capital expenditure","transfer payments","G1 current expenditure","non-tax outlays"],a:1,

 {kk:"kk2",q:"Comparing the headline figures, in 2026-27 the government expects:",o:[

    "receipts to equal payments",

    "payments to exceed receipts by $163.6 billion"],a:2,
    fb:"Payments of $829.6B exceed receipts of $798.1B by $31.5 billion. What this gap is called, and what it means for government debt, is exactly where next lesson picks up."}
]

/* ---------------- LESSON 2 : Outcome & Public Debt ---------------- */
LESSON_DATA[2] = {
 mcq:[
 {kk:"kk3",q:"The budget outcome refers to:",o:[
  "the total stock of money the government owes at a single point in time",
  "the difference between total government receipts and total outlays over a financial year",
  "the level of GST revenue transferred to the states each year as outlined in the 2026-27 Budget",
  "the interest rate the RBA charges the government on its overdraft"
 ],a:1,
  fb:"The budget outcome is the difference between receipts and outlays over a financial year — a deficit (outlays exceed receipts), surplus (receipts exceed outlays), or balance.",

 {kk:"kk3",q:"Which figure is most commonly used when reporting 'the budget outcome' in the media?",o:[
  "the headline cash balance",
  "gross debt relative to the previous financial year",

   rows:[
    {label:"Net debt at the end of Year 1", unit:"$B", ans:220, tol:1, why:"200 + 20 = $220 billion (the deficit is financed by new borrowing)."},
    {label:"Net debt at the end of Year 2", unit:"$B", ans:235, tol:1, why:"220 + 15 = $235 billion."},
    {label:"Net debt at the end of Year 3", unit:"$B", ans:225, tol:1, why:"235 − 10 = $225 billion (the surplus is used to buy back bonds)."},
    {label:"Net debt at the end of Year 4", unit:"$B", ans:250, tol:1, why:"225 + 25 = $250 billion."},
    {label:"Net debt at the end of Year 5", unit:"$B", ans:255, tol:1, why:"250 + 5 = $255 billion."}
   ],

  }

/* ================= SCORING (generic) ================= */
function computeLessonScores(n){
 var LD=LESSON_DATA[n], per={}, kk={};
 for(var k in KK_MAP) kk[k]={c:0,t:0};
 LD.acts.forEach(function(a){
  var st=S.st[n][a.id], s=0;
  if(a.type==="mcq"){
   LD.mcq.forEach(function(m,i){kk[m.kk].t++; if(st[i]===m.a){s++;kk[m.kk].c++;}});
  } else if(a.type==="exit"){
   LD.exit.qs.forEach(function(m,i){kk[m.kk].t++; if(st[i]===m.a){s++;kk[m.kk].c++;}});
  } else if(a.type==="sort"||a.type==="seq"){
   var D=LD.sorts[a.key];
   D.items.forEach(function(it,i){
    var kkey=a.kk.split(" ")[0];
    kk[kkey].t++;
    if(st.checked && st.placed[i]===it.c){s++;kk[kkey].c++;}
   });
  } else if(a.type==="calc"){
   var D=LD.calcs[a.key];
   D.rows.forEach(function(r,i){
    var kkey=a.kk.split(" ")[0]; kk[kkey].t++;
    var c=st[i];
    if(c&&c.checked&&Math.abs(parseFloat(c.val)-r.ans)<=(r.tol||0.2)){s++;kk[kkey].c++;}
   });
  } else if(a.type==="mark"){
   var D=LD.marks[a.key];
   D.forEach(function(m,i){
    var kkey=m.kk||a.kk.split(" ")[0]; kk[kkey].t+=2;
    if(st.marks[i]!==undefined&&st.marks[i]===m.correct){s++;kk[kkey].c++;}
    if(st.gap[i]!==undefined&&st.gap[i]===m.g){s++;kk[kkey].c++;}
   });
  }
  per[a.id]=s;
 });
 var total=0; for(var p in per) total+=per[p];
 return {per:per, kk:kk, total:total, max:LD.max};
}
function computeScores(){ if(!S.lesson) return {per:{},kk:{},total:0,max:0}; return computeLessonScores(S.lesson); }

function actProgress(n, actId){
 var LD=LESSON_DATA[n], a=LD.acts.find(function(x){return x.id===actId;}), st=S.st[n][actId];
 if(a.type==="mcq"){var tot=LD.mcq.length,done=0; for(var i=0;i<tot;i++) if(st[i]!==undefined) done++; return {done:done,tot:tot,complete:done===tot};}
 if(a.type==="exit"){var tot=LD.exit.qs.length,done=0; for(var i=0;i<tot;i++) if(st[i]!==undefined) done++; return {done:done,tot:tot,complete:done===tot};}
 if(a.type==="sort"||a.type==="seq"){return {done:st.checked?1:0, tot:1, complete:!!st.checked};}
 if(a.type==="calc"){var D=LD.calcs[a.key]; var tot=D.rows.length,done=0; D.rows.forEach(function(r,i){if(st[i]&&st[i].checked)done++;}); return {done:done,tot:tot,complete:done===tot};}
 if(a.type==="mark"){var D=LD.marks[a.key]; var tot=D.length*2,done=0; D.forEach(function(m,i){if(st.marks[i]!==undefined)done++; if(st.gap[i]!==undefined)done++;}); return {done:done,tot:tot,complete:done===tot};}
 return {done:0,tot:1,complete:false};
}

   LD.exit.qs.forEach(function(m,i){var s=st[i]; if(s!==undefined&&s!==m.a) wrong.push({act:a.title,item:m.q,your:m.o[s],correct:m.o[m.a],why:m.fb});});
  } else if(a.type==="sort"||a.type==="seq"){
   if(st.checked){ var D=LD.sorts[a.key]; D.items.forEach(function(it,i){var p=st.placed[i]; if(p!==undefined&&p!==it.c) wrong.push({act:a.title,item:it.t,your:D.cats[p],correct:D.cats[it.c],why:it.why});}); }
  } else if(a.type==="calc"){
   var D=LD.calcs[a.key];
   D.rows.forEach(function(r,i){var c=st[i]; if(c&&c.checked&&Math.abs(parseFloat(c.val)-r.ans)>(r.tol||0.2)) wrong.push({act:a.title,item:r.label,your:c.val+(r.unit||""),correct:r.ans+(r.unit||""),why:r.why});});
  } else if(a.type==="mark"){
   var D=LD.marks[a.key];
   D.forEach(function(m,i){
    if(st.marks[i]!==undefined&&st.marks[i]!==m.correct) wrong.push({act:a.title,item:"Mark awarded — "+m.q,your:st.marks[i]+" marks",correct:m.correct+" marks",why:m.rule});
    if(st.gap[i]!==undefined&&st.gap[i]!==m.g) wrong.push({act:a.title,item:"Error identified — "+m.q,your:m.gaps[st.gap[i]],correct:m.gaps[m.g],why:m.rule});
   });
  }
 });
 return {wrong:wrong, notDone:notDone};
}
function buildReportData(){ if(!S.lesson) return {wrong:[],notDone:[]}; return wrongItemsLesson(S.lesson); }
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function downloadResults(){
 var sc=computeScores(), L=LESSONS[S.lesson-1], LD=LESSON_DATA[S.lesson], rd=buildReportData();
 var h="<html><head><title>Report</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:24px auto;color:#222;line-height:1.5}h1{font-size:1.4rem}h2{font-size:1.05rem;margin-top:22px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:6px 0}.w{border-left:4px solid #b91c1c;background:#fef2f2;padding:10px 12px;margin:10px 0;border-radius:0 8px 8px 0}.small{color:#666;font-size:.85rem}</style></head><body>";
 h+="<h1>Budgetary Policy Hub — Lesson "+S.lesson+": "+esc(L.title)+"</h1>";
 h+="<p><strong>"+esc(S.name)+"</strong> — "+new Date().toLocaleDateString("en-AU")+"</p>";
 h+="<div class='row'><span><strong>Total</strong></span><span><strong>"+sc.total+" / "+sc.max+"</strong></span></div>";
 LD.acts.forEach(function(a){h+="<div class='row'><span>"+esc(a.title)+" <span class='small'>("+a.kk.toUpperCase()+")</span></span><span>"+(sc.per[a.id]||0)+" / "+a.max+"</span></div>";});
 if(rd.notDone.length) h+="<h2>Not yet completed</h2><p>"+rd.notDone.map(esc).join(", ")+"</p>";
 h+="<h2>Focus areas — items to review</h2>";
 if(!rd.wrong.length) h+="<p>No errors recorded — excellent retrieval. Before your SAC, practise writing full-sentence definitions of every key term in this lesson.</p>";
 rd.wrong.forEach(function(w){h+="<div class='w'><strong>"+esc(w.act)+":</strong> "+esc(w.item)+"<br><span class='small'>Your answer: "+esc(w.your)+" — Correct: "+esc(w.correct)+"</span><br>"+esc(w.why)+"</div>";});
 h+="<p class='small'>Print this page to PDF and submit via Compass.</p><script>window.print()<\/script></body></html>";
 var w=window.open("","_blank"); w.document.write(h); w.document.close();
}

/* ================= NAV / ROUTING ================= */
function go(screen,l,a){S.screen=screen; if(l!==undefined)S.lesson=l; if(a!==undefined)S.act=a; saveState(); render(); window.scrollTo(0,0);}
function render(){
 var app=document.getElementById("app");
 var sc=(S.lesson)?computeScores():{total:0,max:0};
 document.getElementById("navScore").textContent=sc.total+" pts";
 document.getElementById("navWho").textContent=S.name||"";
 var dots="";
 if(S.screen==="act"&&S.act){var p=actProgress(S.lesson,S.act); var t=p.tot; if(t>1){for(var i=0;i<t;i++) dots+="<div class='dot"+(i<p.done?" on":"")+"'></div>";}}
 document.getElementById("navDots").innerHTML=dots;
 if(S.screen==="home") app.innerHTML=vHome();
 else if(S.screen==="name") app.innerHTML=vName();
 else if(S.screen==="chooser") app.innerHTML=vChooser();
 else if(S.screen==="act") app.innerHTML=vAct();
 else if(S.screen==="teacher") app.innerHTML=vTeacher();
}

/* ================= VIEWS ================= */
function vHome(){
 var h="<div class='hero'><div class='wrap'><div class='kicker'>VCE Economics · Unit 4 AOS 1</div><h1>Budgetary Policy Hub</h1><p>Retrieval practice after each lesson. Pick your lesson, complete the activities in any order, then download your report and submit it via Compass.</p></div></div><div class='wrap'>";
 if(S.name) h+="<div class='card'><strong>Welcome back, "+esc(S.name)+"</strong> — your progress is saved on this device. <button class='btn ghost' style='margin-left:8px' onclick='resetAll()'>Start over</button></div>";
 LESSONS.forEach(function(L){
  var locked=COMING.indexOf(L.id)>-1;
  var status;
  if(locked) status="<span class='pill soon'>Coming soon</span>";
  else{ var done=LESSON_DATA[L.id].acts.every(function(a){return actProgress(L.id,a.id).complete;});
   status=done?"<span class='pill done'>Complete</span>":"<span class='pill open'>Open</span>"; }
  h+="<div class='card tile"+(locked?" locked":"")+"' "+(locked?"":"onclick='enterLesson("+L.id+")'")+"><div><h3>Lesson "+L.id+" — "+L.title+"</h3><div class='sub'>"+L.subtitle+"</div></div>"+status+"</div>";
 });
 h+="<p style='margin-top:22px;font-size:.85rem;color:var(--text-sec)'><a href='#' onclick='teacherLogin();return false' style='color:var(--text-sec)'>Teacher view</a></p></div>";
 return h;
}
function enterLesson(id){ if(!S.name){ S.lesson=id; go("name"); } else go("chooser",id); }
function vName(){
 return "<div class='wrap' style='padding-top:40px'><div class='card'><h2>Before you start</h2><p>Enter your full name — it appears on your report and your teacher's dashboard.</p><input class='name' id='nameIn' placeholder='Your full name' onkeydown='if(event.key===\"Enter\")setName()'><button class='btn gold' onclick='setName()'>Let's go →</button></div></div>";
}
function setName(){ var v=document.getElementById("nameIn").value.trim(); if(!v) return; S.name=v; go("chooser",S.lesson); }
function vChooser(){
 var L=LESSONS[S.lesson-1], LD=LESSON_DATA[S.lesson];
 var h="<div class='hero'><div class='wrap'><div class='kicker'>Lesson "+L.id+"</div><h1>"+L.title+"</h1><p>"+L.subtitle+"</p></div></div><div class='wrap'>";
 h+="<div class='selfcheck'><h3>Can you answer these? (in your head, before you start)</h3><ul>";
 L.selfCheck.forEach(function(q){h+="<li>"+q+"</li>";});
 h+="</ul></div>";
 var sc=computeScores();
 LD.acts.forEach(function(a){
  var p=actProgress(S.lesson,a.id);
  h+="<div class='card tile' onclick='openAct(\""+a.id+"\")'><div><h3>"+a.title+"<span class='kktag'>"+a.kk.toUpperCase()+"</span></h3><div class='sub'>"+a.desc+"</div></div><div style='text-align:right'>"+(p.complete?"<span class='pill done'>"+sc.per[a.id]+" / "+a.max+"</span>":"<span class='pill open'>"+p.done+" / "+p.tot+"</span>")+"</div></div>";
 });
 var allDone=LD.acts.every(function(a){return actProgress(S.lesson,a.id).complete;});
 h+="<div style='display:flex;gap:10px;margin-top:18px;flex-wrap:wrap'><button class='btn ghost' onclick='go(\"home\")'>← All lessons</button><button class='btn gold' "+(allDone?"":"disabled")+" onclick='downloadResults()'>Download my report"+(allDone?"":" (finish all activities first)")+"</button></div></div>";
 return h;
}
function openAct(id){ S.q=0; go("act",S.lesson,id); }
function actShell(a,inner){
 return "<div class='wrap' style='padding-top:26px'><div class='progressline'><a href='#' onclick='go(\"chooser\");return false' style='color:var(--primary)'>← Back to Lesson "+S.lesson+"</a></div><div class='card'><h2>"+a.title+"</h2><p style='color:var(--text-sec);margin-bottom:14px'>"+a.desc+"</p>"+inner+"</div></div>";
}
function vAct(){
 var LD=LESSON_DATA[S.lesson], a=LD.acts.find(function(x){return x.id===S.act;});
 if(a.type==="mcq") return actShell(a, vMcqGeneric(LD.mcq, a.id));
 if(a.type==="sort"||a.type==="seq") return actShell(a, vSortGeneric(LD.sorts[a.key], a.id, a.type));
 if(a.type==="calc") return actShell(a, vCalcGeneric(LD.calcs[a.key], a.id));
 if(a.type==="mark") return actShell(a, vMarkGeneric(LD.marks[a.key], a.id));
 if(a.type==="exit") return actShell(a, vExitGeneric(LD.exit, a.id));
 return "";
}

/* --- MCQ (generic) --- */
function vMcqGeneric(DATA, actId){
 var st=S.st[S.lesson][actId];
 var i=S.q; if(i>=DATA.length) i=DATA.length-1;
 var m=DATA[i], sel=st[i], h="";
 h+="<div class='progressline'>Question "+(i+1)+" of "+DATA.length+"</div><p style='font-weight:600'>"+m.q+"</p>";
 m.o.forEach(function(o,j){
  var cls="opt";
  if(sel!==undefined){ if(j===m.a) cls+=" correct"; else if(j===sel) cls+=" wrong"; }
  h+="<button class='"+cls+"' "+(sel!==undefined?"disabled":"")+" onclick='selMcq("+i+","+j+")'>"+o+"</button>";
 });
 if(sel!==undefined){
  h+="<div class='fb "+(sel===m.a?"good":"bad")+"'>"+m.fb+"</div>";
  if(m.tip) h+="<div class='tip'><strong>Exam tip:</strong> "+m.tip+"</div>";
  h+="<div style='margin-top:14px;display:flex;gap:8px'>";
  if(i<DATA.length-1) h+="<button class='btn' onclick='nextQ()'>Next question →</button>";
  else h+="<button class='btn gold' onclick='go(\"chooser\")'>Finish activity ✓</button>";
  h+="</div>";
 }
 return h;
}
function selMcq(i,j){ var st=S.st[S.lesson][S.act]; if(st[i]!==undefined) return; st[i]=j; saveState(); maybeSync(S.act); render(); }
function nextQ(){ S.q++; saveState(); render(); window.scrollTo(0,0); }

/* --- EXIT (generic) --- */
function vExitGeneric(EX, actId){
 var st=S.st[S.lesson][actId];
 var h="<div class='stu' style='font-style:normal'><strong>Scenario:</strong> "+EX.scen+"</div>";
 var i=S.q; if(i>=EX.qs.length) i=EX.qs.length-1;
 var m=EX.qs[i], sel=st[i];
 h+="<div class='progressline'>Question "+(i+1)+" of "+EX.qs.length+"</div><p style='font-weight:600'>"+m.q+"</p>";
 m.o.forEach(function(o,j){
  var cls="opt"; if(sel!==undefined){ if(j===m.a) cls+=" correct"; else if(j===sel) cls+=" wrong"; }
  h+="<button class='"+cls+"' "+(sel!==undefined?"disabled":"")+" onclick='selExit("+i+","+j+")'>"+o+"</button>";
 });
 if(sel!==undefined){
  h+="<div class='fb "+(sel===m.a?"good":"bad")+"'>"+m.fb+"</div><div style='margin-top:14px'>";
  if(i<EX.qs.length-1) h+="<button class='btn' onclick='nextQ()'>Next question →</button>";
  else h+="<button class='btn gold' onclick='go(\"chooser\")'>Finish activity ✓</button>";
  h+="</div>";
 }
 return h;
}
function selExit(i,j){ var st=S.st[S.lesson][S.act]; if(st[i]!==undefined) return; st[i]=j; saveState(); maybeSync(S.act); render(); }

/* --- SORT / SEQ (generic) --- */
var sortSel=null;
function vSortGeneric(DATA, actId, type){
 var st=S.st[S.lesson][actId];
 var instr = (type==="seq") ? "Click a step, then click the slot where it belongs. Click a placed step to return it to the bank." : "Click an item, then click a column to place it. Click a placed item to return it to the bank.";
 var h="<p>"+instr+"</p><div style='margin:12px 0' id='bank'>";
 DATA.items.forEach(function(it,i){
  if(st.placed[i]===undefined && !st.checked) h+="<span class='chip"+(sortSel===i?" sel":"")+"' onclick='pickSort("+i+")'>"+it.t+"</span>";
 });
 h+="</div><div class='cols"+(DATA.cats.length===2?" c2":(DATA.cats.length>=4?" c4":""))+"'>";
 DATA.cats.forEach(function(c,ci){
  h+="<div class='col' onclick='placeSort("+ci+")'><h4>"+c+"</h4>";
  DATA.items.forEach(function(it,i){
   if(st.placed[i]===ci){
    var cls="chip"; if(st.checked) cls+=(it.c===ci?" ok":" bad");
    h+="<span class='"+cls+"' onclick='event.stopPropagation();removeSort("+i+")'>"+it.t+(st.checked&&it.c!==ci?" → "+DATA.cats[it.c]:"")+"</span>";
    if(st.checked) h+="<div style='font-size:.78rem;color:var(--text-sec);margin:2px 4px 8px'>"+it.why+"</div>";
   }
  });
  h+="</div>";
 });
 h+="</div>";
 var all=DATA.items.every(function(it,i){return st.placed[i]!==undefined;});
 if(all && !st.checked) h+="<div style='margin-top:14px'><button class='btn gold' onclick='checkSort()'>Check my answers</button></div>";
 if(st.checked) h+="<div style='margin-top:14px'><button class='btn' onclick='go(\"chooser\")'>Finish activity ✓</button></div>";
 return h;
}
function pickSort(i){ var st=S.st[S.lesson][S.act]; if(st.checked) return; sortSel=(sortSel===i?null:i); render(); }
function placeSort(ci){ var st=S.st[S.lesson][S.act]; if(st.checked||sortSel===null) return; st.placed[sortSel]=ci; sortSel=null; saveState(); render(); }
function removeSort(i){ var st=S.st[S.lesson][S.act]; if(st.checked) return; delete st.placed[i]; saveState(); render(); }
function checkSort(){ var st=S.st[S.lesson][S.act]; st.checked=true; saveState(); maybeSync(S.act); render(); }

/* --- CALC (generic) --- */
function vCalcGeneric(CD, actId){
 var st=S.st[S.lesson][actId];
 var h="<div class='stu' style='font-style:normal'>"+CD.intro+"</div>";
 CD.rows.forEach(function(r,i){
  var c=st[i]||{};
  var cls=""; if(c.checked) cls=(Math.abs(parseFloat(c.val)-r.ans)<=(r.tol||0.2))?"ok":"bad";
  h+="<div class='calcrow'><span style='flex:1;min-width:240px'>"+r.label+"</span><input id='calcin"+i+"' class='"+cls+"' "+(c.checked?"disabled value='"+esc(c.val)+"'":"value='"+esc(c.val||"")+"'")+" onkeydown='if(event.key===\"Enter\")chkCalc("+i+")' placeholder='"+(r.unit||"")+"'> ";
  if(!c.checked) h+="<button class='btn' onclick='chkCalc("+i+")'>✓</button>";
  else if(cls==="bad") h+="<span style='color:var(--red);font-weight:700'>"+r.ans+(r.unit||"")+"</span>";
  h+="</div>";
  if(c.checked) h+="<div style='font-size:.85rem;color:var(--text-sec);margin:-4px 0 8px'>"+r.why+"</div>";
 });
 var all=CD.rows.every(function(r,i){return st[i]&&st[i].checked;});
 if(all) h+="<div class='fb good'><strong>Trend analysis:</strong> "+CD.trend+"</div><div style='margin-top:14px'><button class='btn' onclick='go(\"chooser\")'>Finish activity ✓</button></div>";
 return h;
}
function chkCalc(i){ var v=document.getElementById("calcin"+i).value.trim(); if(v==="") return; var st=S.st[S.lesson][S.act]; st[i]={val:v,checked:true}; saveState(); maybeSync(S.act); render(); }

/* --- MARK (generic) --- */
function vMarkGeneric(MD, actId){
 var st=S.st[S.lesson][actId];
 var i=S.q; if(i>=MD.length) i=MD.length-1;
 var m=MD[i], mk=st.marks[i], gp=st.gap[i];
 var h="<div class='progressline'>Response "+(i+1)+" of "+MD.length+"</div>";
 h+="<p style='font-weight:600'>"+m.q+"</p><div class='stu'>"+m.stu+"</div>";
 h+="<p style='font-weight:600'>Step 1 — What mark would you award?</p><div class='markbtns'>";
 m.marks.forEach(function(v){
  var cls=""; if(mk!==undefined){ if(v===m.correct) cls="ok"; else if(v===mk) cls="bad"; }
  h+="<button class='"+cls+"' "+(mk!==undefined?"disabled":"")+" onclick='markSel("+i+","+v+")'>"+v+"</button>";
 });
 h+="</div>";
 if(mk!==undefined){
  h+="<div class='fb "+(mk===m.correct?"good":"bad")+"'>"+(mk===m.correct?"Correct — this response earns "+m.correct+" marks.":"An examiner would award "+m.correct+" marks. Many first instincts land on "+m.bait+" — work out why it can't earn that.")+"</div>";
  h+="<p style='font-weight:600;margin-top:14px'>Step 2 — Why? Identify the key problem:</p>";
  m.gaps.forEach(function(g,j){
   var cls="opt"; if(gp!==undefined){ if(j===m.g) cls+=" correct"; else if(j===gp) cls+=" wrong"; }
   h+="<button class='"+cls+"' "+(gp!==undefined?"disabled":"")+" onclick='gapSel("+i+","+j+")'>"+g+"</button>";
  });
  if(gp!==undefined){
   h+="<div class='fb good'><strong>Improved response:</strong> "+m.fix+"</div><div class='rule'><strong>VCAA rule:</strong> "+m.rule+"</div>";
   h+="<div style='margin-top:14px'>";
   if(i<MD.length-1) h+="<button class='btn' onclick='nextQ()'>Next response →</button>";
   else h+="<button class='btn gold' onclick='go(\"chooser\")'>Finish activity ✓</button>";
   h+="</div>";
  }
 }
 return h;
}
function markSel(i,v){ var st=S.st[S.lesson][S.act]; if(st.marks[i]!==undefined) return; st.marks[i]=v; saveState(); maybeSync(S.act); render(); }
function gapSel(i,j){ var st=S.st[S.lesson][S.act]; if(st.gap[i]!==undefined) return; st.gap[i]=j; saveState(); maybeSync(S.act); render(); }

/* ================= TEACHER ================= */
function teacherLogin(){ var p=prompt("Teacher PIN:"); if(p===TEACHER_PIN) go("teacher"); else if(p!==null) alert("Incorrect PIN."); }
function vTeacher(){
 var h="<div class='hero'><div class='wrap'><div class='kicker'>Teacher dashboard</div><h1>Class results</h1><p>Synced results by student, activity and key knowledge, across all six lessons.</p></div></div><div class='wrap'>";
 if(!syncEnabled()){
  h+="<div class='card'><strong>Sync not configured.</strong> Set RESULTS_WORKER_URL at the top of this file to your vce-results Worker's deployed URL. Until then, only this device's local results are shown below.</div>";
  h+=localTeacherTable();
 } else {
  h+="<div class='card' id='tload'>Loading synced results…</div>";
  fetchTeacher();
 }
 h+="<div style='margin-top:16px'><button class='btn ghost' onclick='go(\"home\")'>← Back</button></div></div>";
 return h;
}
function localTeacherTable(){
 if(!S.name) return "<div class='card'>No local student data yet.</div>";
 var h="<div class='card tscroll'><h3 style='margin-bottom:10px'>Local device — "+esc(S.name)+"</h3><table class='tgrid'><tr><th>Lesson</th>";
 for(var li=1;li<=6;li++) h+=""; // placeholder to keep header simple
 h+="<th>Total</th></tr>";
 var totalKK={}; for(var k in KK_MAP) totalKK[k]={c:0,t:0};
 LESSONS.forEach(function(L){
  var sc=computeLessonScores(L.id);
  h+="<tr><td class='name'>L"+L.id+"</td><td colspan='1'>"+sc.total+" / "+sc.max+"</td></tr>";
  for(var k in KK_MAP){ totalKK[k].c+=sc.kk[k].c; totalKK[k].t+=sc.kk[k].t; }
 });
 h+="</table><h3 style='margin:16px 0 8px'>Key knowledge coverage (all lessons)</h3><table class='tgrid'><tr>";
 for(var k in KK_MAP) h+="<th>"+KK_MAP[k].split(" ")[0]+"</th>";
 h+="</tr><tr>";
 for(var k in KK_MAP){ var v=totalKK[k]; h+="<td>"+(v.t?v.c+"/"+v.t:"—")+"</td>"; }
 h+="</tr></table></div>";
 return h;
}
function fetchTeacher(){
 fetch(RESULTS_WORKER_URL + "?pin=" + encodeURIComponent(TEACHER_PIN) + "&hub=" + encodeURIComponent(HUB_ID))
  .then(function(r){ return r.json(); })
  .then(function(d){
   // The Worker itself scopes this list to HUB_ID's records (via ?hub=),
   // so nothing further needs filtering out here.
   var mine = (d && d.results) || [];
   var byStu = {};
   mine.forEach(function(r){
    if(typeof r.lesson !== "string") return;
    var li = parseInt(r.lesson.replace(/^L/i, ""), 10);
    if(!li || li<1 || li>6) return;
    if(!byStu[r.name]) byStu[r.name]={};
    byStu[r.name][li] = r; // {per, kk, total, max}
   });
   var h="<div class='tscroll'><table class='tgrid'><tr><th>Student</th>";
   for(var li=1; li<=6; li++) h+="<th>L"+li+"</th>";
   for(var k in KK_MAP) h+="<th>"+KK_MAP[k].split(" ")[0]+"</th>";
   h+="</tr>";
   Object.keys(byStu).sort().forEach(function(n){
    h+="<tr><td class='name'>"+esc(n)+"</td>";
    var totalKK={}; for(var k in KK_MAP) totalKK[k]={c:0,t:0};
    for(var li=1; li<=6; li++){
     var rec = byStu[n][li];
     h+="<td>"+(rec?rec.total+"/"+rec.max:"—")+"</td>";
     if(rec && rec.kk) for(var k in KK_MAP){ if(rec.kk[k]){ totalKK[k].c+=rec.kk[k].c; totalKK[k].t+=rec.kk[k].t; } }
    }
    for(var k in KK_MAP){ var v=totalKK[k]; h+="<td>"+(v.t?v.c+"/"+v.t:"—")+"</td>"; }
    h+="</tr>";
   });
   h+="</table></div>";
   document.getElementById("tload").innerHTML=(Object.keys(byStu).length?h:"No synced results yet.");
  }).catch(function(){document.getElementById("tload").innerHTML="Could not reach the worker. Check RESULTS_WORKER_URL, and that the PIN in this file matches the one set in the Worker.";});
}

/* ================= INIT ================= */
loadState();
S.screen="home"; S.act=null; S.q=0;
render();
</script>
