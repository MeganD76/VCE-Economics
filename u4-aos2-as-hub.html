<body>
<div id="app"></div>
<script>
/* ============================================================
   VCE ECONOMICS — UNIT 4 AOS 2 — AGGREGATE SUPPLY POLICIES HUB
   Config + content data
   ============================================================ */

const HUB_ID = "as";
const HUB_TITLE = "Unit 4 AOS 2 — Aggregate Supply Policies";
const TEACHER_PIN = "0904";
const RESULTS_WORKER_URL = "https://vce-results.megan-dyring.workers.dev";

/* The class roll. Students pick from this list — they never type a name,
   which is what stops one student generating several dashboard rows. */
const ROLL = ["Arman", "Diana", "Hamish", "Hugh", "Isaac", "Jayleen", "Joseph", "Kyan", "Nils"];

const KK_MAP = {
  kk1: "Complementing AD policies",
  kk2: "Supply-side conditions and the four levers",
  kk3: "Tax reform",
  kk4: "Skilled migration",
  kk5: "Trade liberalisation",
  kk6: "Market-based environmental policy",
  kk7: "International competitiveness",
  kk8: "Goals and living standards",
  kk9: "Exam technique"
};

const LESSON_DATA = {};

/* ============================================================
   LESSON 1 — THE NATURE AND OPERATION OF AS POLICIES
   ============================================================ */

LESSON_DATA[1] = {
  mcq: [
    { kk: "kk2", q: "Only one of these is a correct definition of aggregate supply policies. Which one?",
      o: ["Government policies designed to improve supply-side conditions by increasing the productive capacity of the economy.",
          "Government policies designed to improve supply-side conditions by increasing the level of spending in the economy.",
          "Government policies designed to improve supply-side conditions by increasing the quantity of money in the economy.",
          "Government policies designed to improve supply-side conditions by increasing the willingness of consumers to purchase output."],
      a: 0,
      fb: "Aggregate supply policies work on productive capacity — the willingness and/or ability of PRODUCERS to expand output. Spending, money and consumer willingness all belong to the aggregate demand side.",
      tip: "If your definition contains the word 'spending', you have defined an aggregate demand policy." },

    { kk: "kk2", q: "Which statement gets the direction right?",
      o: ["Higher productivity raises per-unit costs of production.",
          "Lower per-unit costs of production raise productivity.",
          "Higher productivity lowers per-unit costs of production.",
          "Higher costs of production raise productivity."],
      a: 2,
      fb: "Productivity is output per unit of input. If each input produces more output, the cost attached to each unit of output falls. The causation runs productivity to costs, not costs to productivity.",
      tip: "The 2024 examiner report flagged students reversing this exact relationship." },

    { kk: "kk2", q: "Which version of the hinge sentence is correct?",
      o: ["...making firms more profitable, increasing productive capacity and aggregate demand.",
          "...making consumers more willing and/or able to spend, increasing productive capacity and aggregate supply.",
          "...making firms more willing and/or able to supply, increasing aggregate demand and aggregate supply.",
          "...making firms more willing and/or able to supply, increasing productive capacity and aggregate supply."],
      a: 3,
      fb: "Firms, not consumers. Willing and/or able to SUPPLY, not to spend. And the thing that rises is productive capacity, which is what then raises aggregate supply.",
      tip: "This is the sentence students skip. Write it out in full every time — it is worth a mark on its own." },

    { kk: "kk2", q: "Which is the correct meaning of productive capacity?",
      o: ["The actual level of output the economy produces in a given year.",
          "The maximum level of output the economy is able to produce using its existing resources.",
          "The total level of spending the economy can sustain in a given year.",
          "The maximum level of output the economy can produce with no unemployment of any kind."],
      a: 1,
      fb: "Capacity is what the economy is ABLE to produce, not what it actually produces and not what it spends. Full capacity is still consistent with frictional and structural unemployment.",
      tip: "" },

    { kk: "kk7", q: "Which statement describes international competitiveness correctly?",
      o: ["It compares the price and quality of Australian output relative to that of overseas producers.",

/* ============================================================
   GENERIC ENGINE — works for any lesson in LESSON_DATA
   ============================================================ */

const slugify = s => String(s || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "");

function emptyActState(type) {
  if (type === "mcq" || type === "exit") return {};
  if (type === "sort" || type === "seq") return { placed: {}, checked: false };
  if (type === "conn") return { solved: [], mistakes: 0, sel: [], done: false };
  if (type === "calc") return {};
  if (type === "mark") return { marks: {}, gap: {} };
  if (type === "trim") return { cut: {}, checked: false };
  if (type === "write") return { text: "", check: {}, submitted: false, at: "" };
  return {};
}

let S = { name: "", slug: "", st: {} };

function blankState() {
  const st = {};
  Object.keys(LESSON_DATA).forEach(n => {
    st[n] = {};
    LESSON_DATA[n].acts.forEach(a => { st[n][a.id] = emptyActState(a.type); });
  });
  return { name: "", slug: "", st };
}

function saveState() {
  try { localStorage.setItem("vce_" + HUB_ID + "_state", JSON.stringify(S)); } catch (e) {}
}

function loadState() {
  let loaded = null;
  try { loaded = JSON.parse(localStorage.getItem("vce_" + HUB_ID + "_state")); } catch (e) {}
  S = blankState();
  if (loaded && loaded.st) {
    S.name = loaded.name || "";
    S.slug = loaded.slug || slugify(loaded.name);
    Object.keys(LESSON_DATA).forEach(n => {
      LESSON_DATA[n].acts.forEach(a => {
        if (loaded.st[n] && loaded.st[n][a.id]) S.st[n][a.id] = loaded.st[n][a.id];
      });
    });
  }
}

/* ---------- data accessors ---------- */

function actData(n, act) {
  const LD = LESSON_DATA[n];
  switch (act.type) {
    case "mcq":  return act.key ? LD.mcqs[act.key] : LD.mcq;
    case "exit": return LD.exit;
    case "sort":
    case "seq":  return LD.sorts[act.key];
    case "conn": return LD.conns[act.key];
    case "calc": return LD.calcs[act.key];
    case "mark": return LD.marks[act.key];
    case "trim": return LD.trims[act.key];
    case "write": return LD.writes[act.key];
  }
  return null;
}

function actKk(n, act) {
  const d = actData(n, act);
  if (act.type === "mcq") return d.map(q => q.kk);
  if (act.type === "exit") return d.qs.map(q => q.kk);
  if (act.type === "mark") return d.map(m => m.kk);
  return null;
}

/* ---------- scoring ---------- */

function computeLessonScores(n) {
  const LD = LESSON_DATA[n], per = {}, kk = {};
  const bump = (key, c, t) => {
    if (!key) return;
    if (!kk[key]) kk[key] = { c: 0, t: 0 };
    kk[key].c += c; kk[key].t += t;
  };
  let total = 0;

  LD.acts.forEach(act => {
    const st = (S.st[n] && S.st[n][act.id]) || emptyActState(act.type);
    const d = actData(n, act);
    let sc = 0;

    if (act.type === "mcq") {
      d.forEach((q, i) => { const ok = st[i] === q.a ? 1 : 0; sc += ok; bump(q.kk, ok, 1); });
    } else if (act.type === "exit") {
      d.qs.forEach((q, i) => { const ok = st[i] === q.a ? 1 : 0; sc += ok; bump(q.kk, ok, 1); });
    } else if (act.type === "sort" || act.type === "seq") {
      d.items.forEach((it, i) => { if (st.checked && st.placed[i] === it.c) sc++; });
      bump(act.kk, sc, d.items.length);
    } else if (act.type === "conn") {
      sc = (st.solved || []).length * 2;
      bump(act.kk, sc, act.max);
    } else if (act.type === "calc") {
      d.rows.forEach((r, i) => {
        const cell = st[i];
        if (cell && cell.checked && Math.abs(parseFloat(cell.val) - r.ans) <= r.tol) sc++;
      });
      bump(act.kk, sc, d.rows.length);
    } else if (act.type === "mark") {
      d.forEach((m, i) => {
        let s = 0;
        if (st.marks[i] === m.correct) s++;
        if (st.gap[i] === m.g) s++;
        sc += s; bump(m.kk, s, 2);
      });
    } else if (act.type === "trim") {
      if (st.checked) d.sentences.forEach((s, i) => { if (!!st.cut[i] === !!s.cut) sc++; });
      bump(act.kk, sc, d.sentences.length);
    } else if (act.type === "write") {
      sc = 0;   // teacher-marked; deliberately excluded from the automatic total
    }

    per[act.id] = sc; total += sc;
  });

  return { per, kk, total, max: LD.max };
}

function actProgress(n, actId) {
  const LD = LESSON_DATA[n];
  const act = LD.acts.find(a => a.id === actId);
  if (!act) return { done: 0, tot: 0, complete: false };
  const st = (S.st[n] && S.st[n][actId]) || emptyActState(act.type);
  const d = actData(n, act);
  let done = 0, tot = 0;

  if (act.type === "mcq")       { tot = d.length;          done = d.filter((q, i) => st[i] !== undefined).length; }
  else if (act.type === "exit") { tot = d.qs.length;        done = d.qs.filter((q, i) => st[i] !== undefined).length; }
  else if (act.type === "sort" || act.type === "seq") { tot = d.items.length; done = st.checked ? tot : Object.keys(st.placed || {}).length; }
  else if (act.type === "conn") { tot = d.groups.length;    done = st.done ? tot : (st.solved || []).length; }
  else if (act.type === "calc") { tot = d.rows.length;      done = d.rows.filter((r, i) => st[i] && st[i].checked).length; }
  else if (act.type === "mark") { tot = d.length * 2;       done = Object.keys(st.marks || {}).length + Object.keys(st.gap || {}).length; }
  else if (act.type === "trim") { tot = d.sentences.length; done = st.checked ? tot : 0; }
  else if (act.type === "write") { tot = 1; done = st.submitted ? 1 : 0; }

  return { done, tot, complete: tot > 0 && done >= tot };
}

function lessonComplete(n) { return LESSON_DATA[n].acts.every(a => actProgress(n, a.id).complete); }

/* ---------- wrong items, for the printable report ---------- */

function wrongItemsLesson(n) {
  const LD = LESSON_DATA[n], wrong = [], notDone = [];
  LD.acts.forEach(act => {
    const p = actProgress(n, act.id);
    if (!p.complete) { notDone.push(act.title); return; }
    const st = S.st[n][act.id], d = actData(n, act);

    if (act.type === "mcq" || act.type === "exit") {
      const qs = act.type === "exit" ? d.qs : d;
      qs.forEach((q, i) => {
        if (st[i] !== q.a) wrong.push({ act: act.title, item: q.q, your: q.o[st[i]], correct: q.o[q.a], why: q.fb });
      });
    } else if (act.type === "sort" || act.type === "seq") {
      d.items.forEach((it, i) => {
        if (st.placed[i] !== it.c) wrong.push({ act: act.title, item: it.t, your: d.cats[st.placed[i]], correct: d.cats[it.c], why: it.why });
      });
    } else if (act.type === "conn") {
      d.groups.forEach((g, i) => {
        if (!(st.solved || []).includes(i)) wrong.push({ act: act.title, item: g.label, your: "Not solved", correct: g.items.join(" / "), why: g.why });
      });
    } else if (act.type === "calc") {
      d.rows.forEach((r, i) => {
        const cell = st[i];
        if (!(cell && Math.abs(parseFloat(cell.val) - r.ans) <= r.tol))
          wrong.push({ act: act.title, item: r.label, your: cell ? cell.val : "—", correct: r.ans, why: r.why });
      });
    } else if (act.type === "mark") {
      d.forEach((m, i) => {
        if (st.marks[i] !== m.correct) wrong.push({ act: act.title, item: "Mark awarded — " + m.q, your: st.marks[i], correct: m.correct, why: m.rule });
        if (st.gap[i] !== m.g) wrong.push({ act: act.title, item: "Diagnosis — " + m.q, your: m.gaps[st.gap[i]], correct: m.gaps[m.g], why: m.rule });
      });
    } else if (act.type === "trim") {
      d.sentences.forEach((s, i) => {
        if (!!st.cut[i] !== !!s.cut)
          wrong.push({ act: act.title, item: s.t, your: st.cut[i] ? "Cut" : "Kept", correct: s.cut ? "Cut" : "Kept", why: s.why });
      });
    }
  });
  return { wrong, notDone };
}

/* ---------- sync ---------- */

function writtenPayload(n) {
  const out = {};
  (LESSON_DATA[n].acts || []).forEach(act => {
    if (act.type !== "write") return;
    const st = (S.st[n] && S.st[n][act.id]) || emptyActState("write");
    if (!st.submitted || !st.text) return;
    out[act.id] = { title: act.title, marks: act.marks || 0, text: st.text, words: wordCount(st.text), check: st.check || {}, at: st.at || "" };
  });
  return out;
}

function syncPayload(n) {
  const r = computeLessonScores(n);
  return { name: S.name, slug: S.slug, lesson: "L" + n, hub: HUB_ID, per: r.per, kk: r.kk, total: r.total, max: r.max, written: writtenPayload(n) };
}

function maybeSync(n, actId) {
  if (!RESULTS_WORKER_URL) return;
  if (!actProgress(n, actId).complete) return;
  try {
    fetch(RESULTS_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(syncPayload(n))
    }).catch(() => {});
  } catch (e) {}
}

/* ---------- tiny DOM helpers ---------- */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let VIEW = { screen: "home", lesson: null, act: null, idx: 0 };

function go(screen, lesson, act) {
  VIEW = { screen, lesson: lesson ?? VIEW.lesson, act: act ?? null, idx: 0 };
  render(); window.scrollTo(0, 0);
}

/* ============================================================
   RENDERERS
   ============================================================ */

function vMcqGeneric(n, act, items, introHtml) {
  const st = S.st[n][act.id];
  const allDone = items.every((q, i) => st[i] !== undefined);
  let cur = st.cur === undefined ? 0 : st.cur;
  if (cur > items.length - 1) cur = items.length - 1;
  if (cur < 0) cur = 0;
  const reviewing = allDone;
  const q = items[cur];
  const answered = st[cur] !== undefined;

  let h = introHtml ? `<div class="intro">${introHtml}</div>` : "";
  h += `<div class="qcount">Question ${cur + 1} of ${items.length}</div>`;
  h += `<div class="qtext">${q.q}</div><div class="opts">`;
  q.o.forEach((o, oi) => {
    let cls = "opt";
    if (answered) {
      if (oi === q.a) cls += " right";
      else if (oi === st[cur]) cls += " wrong";
      else cls += " dim";
    }
    h += `<button class="${cls}" ${answered ? "disabled" : ""} onclick="answerMcq('${act.id}',${cur},${oi})">${o}</button>`;
  });
  h += `</div>`;
  if (answered) {
    h += `<div class="fb ${st[cur] === q.a ? "ok" : "no"}"><strong>${st[cur] === q.a ? "Correct." : "Not quite."}</strong> ${q.fb}</div>`;
    if (q.tip) h += `<div class="tip"><strong>Exam tip.</strong> ${q.tip}</div>`;
    if (cur < items.length - 1) h += `<button class="next" onclick="mcqNext('${act.id}')">Next question</button>`;
    else if (reviewing) h += `<div class="doneNote">All ${items.length} answered. Tap a number below to look back at any question.</div>`;
  }
  if (reviewing) {
    h += `<div class="revnav">`;
    items.forEach((it, k) => {
      h += `<button class="rev ${st[k] === it.a ? "rok" : "rno"} ${k === cur ? "rnow" : ""}" onclick="mcqJump('${act.id}',${k})">${k + 1}</button>`;
    });
    h += `</div>`;
  }
  return h;
}

function mcqNext(actId) { const st = S.st[VIEW.lesson][actId]; st.cur = (st.cur === undefined ? 0 : st.cur) + 1; saveState(); render(); }
function mcqJump(actId, k) { S.st[VIEW.lesson][actId].cur = k; saveState(); render(); }

function answerMcq(actId, idx, opt) {
  const n = VIEW.lesson;
  S.st[n][actId][idx] = opt;
  saveState(); maybeSync(n, actId); render();
}

function vSortGeneric(n, act, d) {
  const st = S.st[n][act.id];
  const placedIdx = Object.keys(st.placed).map(Number);
  const bank = d.items.map((it, i) => i).filter(i => !placedIdx.includes(i));
  const allPlaced = bank.length === 0;

  let h = `<div class="bank"><div class="banklabel">Items</div>`;
  if (bank.length === 0) h += `<div class="bankempty">All placed.</div>`;
  bank.forEach(i => {
    h += `<button class="tile ${st.sel === i ? "sel" : ""}" onclick="sortPick('${act.id}',${i})">${d.items[i].t}</button>`;
  });
  h += `</div><div class="cats cats${d.cats.length}">`;
  d.cats.forEach((c, ci) => {
    h += `<div class="cat"><div class="catlabel">${c}</div><div class="catdrop" onclick="sortDrop('${act.id}',${ci})">`;
    placedIdx.filter(i => st.placed[i] === ci).forEach(i => {
      const it = d.items[i];
      let cls = "tile placed";
      if (st.checked) cls += it.c === ci ? " right" : " wrong";
      h += `<div class="${cls}" onclick="event.stopPropagation();sortTileTap('${act.id}',${i},${ci})">${it.t}${st.checked ? `<div class="why">${it.why}</div>` : ""}</div>`;
    });
    h += `</div></div>`;
  });
  h += `</div>`;
  if (allPlaced && !st.checked) h += `<button class="next" onclick="sortCheck('${act.id}')">Check my answers</button>`;
  if (!allPlaced) h += `<div class="hintline">Tap an item, then tap a column. More than one item belongs in most columns. Tap a placed item to send it back to the list.</div>`;
  return h;
}

function sortPick(actId, i) { const st = S.st[VIEW.lesson][actId]; if (st.checked) return; st.sel = st.sel === i ? null : i; saveState(); render(); }
function sortDrop(actId, ci) {
  const st = S.st[VIEW.lesson][actId];
  if (st.checked || st.sel === null || st.sel === undefined) return;
  placeInto(actId, st.sel, ci); saveState(); render();
}
function sortReturn(actId, i) { const st = S.st[VIEW.lesson][actId]; if (st.checked) return; delete st.placed[i]; saveState(); render(); }

/* A tap on an already-placed tile is ambiguous, so resolve it by intent:
   if the student has an item selected they are aiming at the column and the
   tile is simply in the way, so place the selection here. Only when nothing
   is selected does the tap mean "send this one back". Without this, a column
   holding one tile is almost impossible to add a second item to, because the
   tile covers the drop zone. */
function sortTileTap(actId, i, ci) {
  const st = S.st[VIEW.lesson][actId];
  if (st.checked) return;
  if (st.sel !== null && st.sel !== undefined) { placeInto(actId, st.sel, ci); }
  else { delete st.placed[i]; }
  saveState(); render();
}

/* A sequence step holds exactly one item, so dropping onto an occupied step
   bumps the incumbent back to the list rather than stacking two in one slot.
   Sort columns are unrestricted: most of them are meant to hold several. */
function placeInto(actId, itemIdx, ci) {
  const n = VIEW.lesson;
  const st = S.st[n][actId];
  const act = LESSON_DATA[n].acts.find(a => a.id === actId);
  if (act && act.type === "seq") {
    Object.keys(st.placed).forEach(k => { if (st.placed[k] === ci && Number(k) !== itemIdx) delete st.placed[k]; });
  }
  st.placed[itemIdx] = ci;
  st.sel = null;
}
function sortCheck(actId) { const n = VIEW.lesson; S.st[n][actId].checked = true; saveState(); maybeSync(n, actId); render(); }

function vConnGeneric(n, act, d) {
  const st = S.st[n][act.id];
  const solved = st.solved || [];
  const tiles = [];
  d.groups.forEach((g, gi) => g.items.forEach(t => tiles.push({ t, g: gi })));
  // stable shuffle keyed to the activity so it does not reshuffle on every render
  const order = tiles.map((_, i) => i).sort((a, b) => {
    const h = s => { let x = 0; for (let k = 0; k < String(s).length; k++) x = (x * 31 + String(s).charCodeAt(k)) % 99991; return x; };
    return h(tiles[a].t + act.id) - h(tiles[b].t + act.id);
  });

  let h = `<div class="connsolved">`;
  solved.forEach(gi => {
    const g = d.groups[gi];
    h += `<div class="solvedrow"><div class="solvedlabel">${g.label}</div><div class="solveditems">${g.items.join(" &nbsp;·&nbsp; ")}</div><div class="why">${g.why}</div></div>`;
  });
  h += `</div>`;

  if (!st.done) {
    h += `<div class="grid">`;
    order.forEach(i => {
      const t = tiles[i];
      if (solved.includes(t.g)) return;
      const sel = (st.sel || []).includes(i);
      h += `<button class="gtile ${sel ? "gsel" : ""}" onclick="connPick('${act.id}',${i})">${t.t}</button>`;
    });
    h += `</div>`;
    h += `<div class="connbar"><span class="mistakes">Mistakes: ${st.mistakes || 0}</span>`;
    h += `<button class="next small" ${(st.sel || []).length === 4 ? "" : "disabled"} onclick="connSubmit('${act.id}')">Submit four</button></div>`;
    h += `<div class="hintline">Select four tiles that belong together. Two marks per group. Some tiles sit deliberately close to a boundary.</div>`;
  } else {
    h += `<div class="doneNote">Finished with ${st.mistakes || 0} mistakes. Score: ${solved.length * 2} of ${act.max}.</div>`;
  }
  return h;
}

function connPick(actId, i) {
  const st = S.st[VIEW.lesson][actId];
  if (st.done) return;
  st.sel = st.sel || [];
  if (st.sel.includes(i)) st.sel = st.sel.filter(x => x !== i);
  else if (st.sel.length < 4) st.sel.push(i);
  saveState(); render();
}

function connSubmit(actId) {
  const n = VIEW.lesson, act = LESSON_DATA[n].acts.find(a => a.id === actId), d = actData(n, act);
  const st = S.st[n][actId];
  const tiles = [];
  d.groups.forEach((g, gi) => g.items.forEach(t => tiles.push({ t, g: gi })));
  const groups = st.sel.map(i => tiles[i].g);
  const same = groups.every(g => g === groups[0]);
  if (same) {
    st.solved = (st.solved || []).concat([groups[0]]);
    st.sel = [];
    if (st.solved.length === d.groups.length - 1) {
      const left = d.groups.map((_, i) => i).filter(i => !st.solved.includes(i));
      st.solved = st.solved.concat(left);
    }
    if (st.solved.length === d.groups.length) st.done = true;
  } else {
    st.mistakes = (st.mistakes || 0) + 1;
    st.sel = [];
    if (st.mistakes >= 5) st.done = true;
  }
  saveState(); maybeSync(n, actId); render();
}

function vTrimGeneric(n, act, d) {
  const st = S.st[n][act.id];
  const kept = d.sentences.filter((s, i) => !st.cut[i]).length;
  let h = `<div class="intro"><strong>The question.</strong> ${d.q}</div>`;
  h += `<div class="intro">${d.intro}</div>`;
  h += `<div class="trimbar">Sentences kept: <strong>${kept}</strong> &nbsp;·&nbsp; target: <strong>${d.target}</strong></div>`;
  h += `<div class="trimbody">`;
  d.sentences.forEach((s, i) => {
    let cls = "sent";
    if (st.cut[i]) cls += " struck";
    if (st.checked) cls += (!!st.cut[i] === !!s.cut) ? " right" : " wrong";
    h += `<div class="${cls}" onclick="trimToggle('${act.id}',${i})"><span class="sn">${i + 1}</span>${s.t}`;
    if (st.checked) h += `<div class="why">${s.why}</div>`;
    h += `</div>`;
  });
  h += `</div>`;
  if (!st.checked) {
    h += `<button class="next" ${kept === d.target ? "" : "disabled"} onclick="trimCheck('${act.id}')">Check my cuts</button>`;
    if (kept !== d.target) h += `<div class="hintline">Tap a sentence to cut it. The button unlocks when exactly ${d.target} sentences remain.</div>`;
  }
  return h;
}

function trimToggle(actId, i) {
  const st = S.st[VIEW.lesson][actId];
  if (st.checked) return;
  if (st.cut[i]) delete st.cut[i]; else st.cut[i] = true;
  saveState(); render();
}
function trimCheck(actId) { const n = VIEW.lesson; S.st[n][actId].checked = true; saveState(); maybeSync(n, actId); render(); }

function vCalcGeneric(n, act, d) {
  const st = S.st[n][act.id];
  let h = `<div class="intro">${d.intro}</div><table class="calctab">`;
  d.rows.forEach((r, i) => {
    const cell = st[i] || {};
    const ok = cell.checked && Math.abs(parseFloat(cell.val) - r.ans) <= r.tol;
    h += `<tr class="${cell.checked ? (ok ? "crow right" : "crow wrong") : "crow"}">`;
    h += `<td class="clabel">${r.label}</td><td class="cinput"><span class="unit">${r.unit === "$" ? "$" : ""}</span>`;
    h += `<input type="text" inputmode="decimal" value="${cell.val !== undefined ? cell.val : ""}" ${cell.checked ? "disabled" : ""} onchange="calcSet('${act.id}',${i},this.value)">`;
    h += `<span class="unit">${r.unit !== "$" ? r.unit : ""}</span>`;
    if (!cell.checked) h += `<button class="mini" onclick="calcCheck('${act.id}',${i})">Check</button>`;
    h += `</td></tr>`;
    if (cell.checked) h += `<tr class="wrow"><td colspan="2"><div class="why">${ok ? "" : "Answer: " + r.ans + ". "}${r.why}</div></td></tr>`;
  });
  h += `</table>`;
  if (d.rows.every((r, i) => st[i] && st[i].checked)) h += `<div class="fb ok">${d.trend}</div>`;
  return h;
}

function calcSet(actId, i, v) { const st = S.st[VIEW.lesson][actId]; st[i] = Object.assign({}, st[i], { val: v }); saveState(); }
function calcCheck(actId, i) {
  const n = VIEW.lesson, st = S.st[n][actId];
  st[i] = Object.assign({ val: "" }, st[i], { checked: true });
  saveState(); maybeSync(n, actId); render();
}

function vMarkGeneric(n, act, d) {
  const st = S.st[n][act.id];
  let cur = st.cur === undefined ? 0 : st.cur;
  if (cur > d.length - 1) cur = d.length - 1;
  if (cur < 0) cur = 0;
  const m = d[cur];
  const hasMark = st.marks[cur] !== undefined;
  const hasGap = st.gap[cur] !== undefined;

  let h = `<div class="qcount">Response ${cur + 1} of ${d.length}</div>`;
  h += `<div class="intro"><strong>The question.</strong> ${m.q}</div>`;
  h += `<div class="student">${m.stu}</div>`;

  h += `<div class="steplabel">Step 1 — what mark would you award?</div><div class="markrow">`;
  m.marks.forEach(v => {
    let cls = "markbtn";
    if (hasMark) {
      if (v === m.correct) cls += " right";
      else if (v === st.marks[cur]) cls += " wrong";
      else cls += " dim";
    }
    h += `<button class="${cls}" ${hasMark ? "disabled" : ""} onclick="markSet('${act.id}',${cur},${v})">${v}</button>`;
  });
  h += `</div>`;

  if (hasMark) {
    h += `<div class="fb ${st.marks[cur] === m.correct ? "ok" : "no"}"><strong>${m.correct} out of ${m.marks[m.marks.length - 1]}.</strong> `;
    h += `Many markers are tempted by ${m.bait} &mdash; the response reads fluently and uses the right vocabulary. It does not survive the criteria.</div>`;
    h += `<div class="steplabel">Step 2 — what explains the gap?</div><div class="opts">`;
    m.gaps.forEach((g, gi) => {
      let cls = "opt";
      if (hasGap) {
        if (gi === m.g) cls += " right";
        else if (gi === st.gap[cur]) cls += " wrong";
        else cls += " dim";
      }
      h += `<button class="${cls}" ${hasGap ? "disabled" : ""} onclick="gapSet('${act.id}',${cur},${gi})">${g}</button>`;
    });
    h += `</div>`;
  }

  if (hasGap) {
    h += `<div class="fb ok"><strong>The fix.</strong> ${m.fix}</div>`;
    h += `<div class="tip"><strong>The principle.</strong> ${m.rule}</div>`;
    if (cur < d.length - 1) h += `<button class="next" onclick="markNext('${act.id}')">Next response</button>`;
    else h += `<div class="doneNote">Both responses marked.</div>`;
  }
  return h;
}

function markNext(actId) { const st = S.st[VIEW.lesson][actId]; st.cur = (st.cur === undefined ? 0 : st.cur) + 1; saveState(); render(); }
function markSet(actId, i, v) { const n = VIEW.lesson; S.st[n][actId].marks[i] = v; saveState(); maybeSync(n, actId); render(); }
function gapSet(actId, i, v)  { const n = VIEW.lesson; S.st[n][actId].gap[i] = v;  saveState(); maybeSync(n, actId); render(); }

function vExitGeneric(n, act, d) {
  return `<div class="scen">${d.scen}</div>` + vMcqGeneric(n, act, d.qs, null);
}


/* ---------- written response ----------
   Students type an answer, self-check it against the criteria, then submit.
   Nothing is auto-scored: the text goes to the teacher to mark. */

function wordCount(t) { return String(t || "").trim().split(/\s+/).filter(Boolean).length; }

function vWriteGeneric(n, act, d) {
  const st = S.st[n][act.id];
  let h = `<div class="card">`;
  h += `<div class="qmeta">${act.marks} marks</div>`;
  if (d.intro) h += `<div class="stim">${d.intro}</div>`;
  h += `<p class="wprompt">${d.prompt}</p>`;

  if (!st.submitted) {
    if (d.hint) h += `<p class="whint">${d.hint}</p>`;
    h += `<textarea id="wbox" class="wbox" rows="12" placeholder="Write your response here."
            oninput="writeInput('${act.id}')">${esc(st.text || "")}</textarea>`;
    h += `<div class="wcount"><span id="wc">${wordCount(st.text)}</span> words${d.guideWords ? ` &middot; aim for about ${d.guideWords}` : ""}</div>`;

    h += `<div class="checkbox-block"><p class="checkhead">Before you submit, check your own answer.</p>`;
    d.checklist.forEach((c, i) => {
      h += `<label class="checkrow ${st.check[i] ? "on" : ""}">
              <input type="checkbox" ${st.check[i] ? "checked" : ""} onchange="writeCheck('${act.id}',${i})">
              <span>${c}</span></label>`;
    });
    h += `</div>`;

    const words = wordCount(st.text);
    const ready = words >= (d.minWords || 30);
    h += `<button class="primary" ${ready ? "" : "disabled"} onclick="writeSubmit(${n},'${act.id}')">
            ${ready ? "Submit to my teacher" : `Write at least ${d.minWords || 30} words`}</button>`;
    h += `<p class="fineprint">Once you submit, your answer is sent to your teacher and locked. You can still reopen it to make changes and submit again.</p>`;
  } else {
    h += `<div class="submitted"><strong>Submitted.</strong> Your teacher can now see this answer.</div>`;
    h += `<div class="wshow">${esc(st.text).replace(/\n/g, "<br>")}</div>`;
    h += `<div class="wcount">${wordCount(st.text)} words</div>`;
    if (d.guide && d.guide.length) {
      h += `<div class="guidebox"><p class="checkhead">What a full-mark answer needs</p><ul>`;
      d.guide.forEach(g => { h += `<li>${g}</li>`; });
      h += `</ul><p class="fineprint">Compare this against what you wrote. Your teacher marks the response itself.</p></div>`;
    }
    h += `<button class="ghost" onclick="writeReopen(${n},'${act.id}')">Reopen and edit</button>`;
  }
  h += `</div>`;
  return h;
}

function writeInput(actId) {
  const n = VIEW.lesson;
  S.st[n][actId].text = $("wbox").value;
  const c = $("wc"); if (c) c.textContent = wordCount(S.st[n][actId].text);
  saveState();
  const d = actData(n, LESSON_DATA[n].acts.find(a => a.id === actId));
  const btn = document.querySelector(".card .primary");
  if (btn) {
    const ready = wordCount(S.st[n][actId].text) >= (d.minWords || 30);
    btn.disabled = !ready;
    btn.textContent = ready ? "Submit to my teacher" : `Write at least ${d.minWords || 30} words`;
  }
}

function writeCheck(actId, i) {
  const n = VIEW.lesson;
  const st = S.st[n][actId];
  st.check[i] = !st.check[i];
  saveState(); render();
}

function writeSubmit(n, actId) {
  const st = S.st[n][actId];
  if (!st.text || !st.text.trim()) return;
  st.submitted = true;
  st.at = new Date().toISOString().slice(0, 16).replace("T", " ");
  saveState(); maybeSync(n, actId); render();
}

function writeReopen(n, actId) {
  S.st[n][actId].submitted = false;
  saveState(); render();
}

function vAct(n, act) {
  const d = actData(n, act);
  switch (act.type) {
    case "mcq":  return vMcqGeneric(n, act, d, (LESSON_DATA[n].mcqIntro || {})[act.key]);
    case "exit": return vExitGeneric(n, act, d);
    case "sort":
    case "seq":  return vSortGeneric(n, act, d);
    case "conn": return vConnGeneric(n, act, d);
    case "calc": return vCalcGeneric(n, act, d);
    case "mark": return vMarkGeneric(n, act, d);
    case "trim": return vTrimGeneric(n, act, d);
    case "write": return vWriteGeneric(n, act, d);
  }
  return "<p>Unknown activity type.</p>";
}

let TEACHER = { rows: null, error: null, expand: null, loading: false };

function teacherPrompt() {

function loadTeacher() {
  TEACHER.loading = true; TEACHER.error = null; render();
  if (!RESULTS_WORKER_URL) { TEACHER.loading = false; TEACHER.rows = localOnlyRows(); render(); return; }
  fetch(RESULTS_WORKER_URL + "?hub=" + encodeURIComponent(HUB_ID) + "&pin=" + encodeURIComponent(TEACHER_PIN))
    .then(r => r.json())
    .then(data => {
      if (data && data.error) {
        TEACHER.error = "The results server rejected the PIN. Check that TEACHER_PIN here matches the PIN in the Worker.";
        TEACHER.rows = localOnlyRows(); TEACHER.loading = false; render(); return;
      }
      TEACHER.rows = normaliseRows(Array.isArray(data) ? data : (data.results || data.records || []));
      TEACHER.loading = false; render();
    })
    .catch(e => {
      TEACHER.error = "Could not reach the results server. Showing this device only.";
      TEACHER.rows = localOnlyRows(); TEACHER.loading = false; render();
    });
}

/* Remove one student's stored results for this hub only.
   Always scoped with hub=as, so records belonging to any other hub
   on the same Worker are never touched. */
function teacherDelete(name, lesson) {
  if (!RESULTS_WORKER_URL) { alert("No results server configured."); return; }
  const what = lesson ? (name + " — Lesson " + lesson) : (name + " — every lesson");
  if (!confirm("Delete stored results for " + what + "?\n\nThis removes them from the server for this hub. It cannot be undone.")) return;
  let u = RESULTS_WORKER_URL + "?pin=" + encodeURIComponent(TEACHER_PIN)
        + "&hub=" + encodeURIComponent(HUB_ID)
        + "&name=" + encodeURIComponent(name);
  if (lesson) u += "&lesson=L" + lesson;
  fetch(u, { method: "DELETE" })
    .then(r => r.json())
    .then(d => {
      if (d && d.error) { alert("The server refused: " + d.error); return; }
      TEACHER.expand = null; loadTeacher();
    })
    .catch(() => alert("Could not reach the results server."));
}

function localOnlyRows() {
  if (!S.name) return [];
  return normaliseRows(Object.keys(LESSON_DATA)
    .filter(n => LESSON_DATA[n].acts.some(a => actProgress(n, a.id).complete))
    .map(n => syncPayload(n)));
}

/* Collapse many raw records into ONE ROW PER STUDENT with a column per lesson.
   Records are grouped on a normalised key, so "Hugh", "hugh " and "HUGH"
   are the same student rather than three dashboard rows. */
function normaliseRows(raw) {
  const byStudent = {};
  raw.forEach(rec => {
    if (!rec) return;
    const display = rec.name || rec.student || "(unnamed)";
    const key = rec.slug ? slugify(rec.slug) : slugify(display);
    if (!key) return;
    const lesson = String(rec.lesson || "").replace(/[^0-9]/g, "");
    if (!lesson) return;
    if (!byStudent[key]) byStudent[key] = { key, name: display, lessons: {} };
    if (display.length > byStudent[key].name.length) byStudent[key].name = display;
    const prev = byStudent[key].lessons[lesson];
    const cand = { total: rec.total || 0, max: rec.max || (LESSON_DATA[lesson] ? LESSON_DATA[lesson].max : 0), per: rec.per || {}, kk: rec.kk || {}, written: rec.written || {}, updated: rec.updated || "" };
    // upsert: keep the fuller record if the same student+lesson arrives twice,
    // but never let a later score-only record wipe written work already stored
    if (!prev) { byStudent[key].lessons[lesson] = cand; }
    else {
      const keep = cand.total >= prev.total ? cand : prev;
      const other = keep === cand ? prev : cand;
      if (!Object.keys(keep.written).length && Object.keys(other.written).length) keep.written = other.written;
      byStudent[key].lessons[lesson] = keep;
    }
  });
  const rows = Object.values(byStudent);
  rows.sort((a, b) => a.name.localeCompare(b.name));
  return rows;
}

function teacherExpand(k, n) {

function exportCsv() {
  const lessonIds = LESSONS.map(l => l.id), rows = TEACHER.rows || [];
  const present = {}; rows.forEach(r => { present[slugify(r.name)] = r; });
  let csv = "Student," + lessonIds.map(i => "L" + i).join(",") + ",Total,Max\n";
  ROLL.forEach(nm => {
    const r = present[slugify(nm)];
    let st = 0, sm = 0;
    const cells = lessonIds.map(i => {
      const c = r && r.lessons[i];
      if (!c) return "";
      st += c.total; sm += c.max; return c.total;
    });
    csv += [nm].concat(cells).concat([st, sm]).join(",") + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "u4aos2-results-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
}

/* ============================================================
   ROUTER
   ============================================================ */

function render() {
  const root = $("app");
  if (!S.name && VIEW.screen !== "identity") VIEW.screen = "identity";
  let h = "";
  if (VIEW.screen === "identity") h = vIdentity();
  else if (VIEW.screen === "home") h = vHome();
  else if (VIEW.screen === "lesson") h = vLesson(VIEW.lesson);
  else if (VIEW.screen === "act") h = vActScreen(VIEW.lesson, VIEW.act);
  else if (VIEW.screen === "teacher") h = vTeacher();
  else if (VIEW.screen === "written") h = vWritten();
  root.innerHTML = h;
}

loadState();
render();

</script>
