<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blank page definitions · Year 11 Economics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="wrap">
<header id="hdr"></header>
<main id="app"></main>
</div>
<script src="portal-data.js"></script>
<script src="defs-data.js"></script>
<script>
const app = $('#app');
let cw = null, hist = {};

(async function () {
  cw = await mountHeader('Blank page definitions');
  if (!cw) { app.innerHTML = `<div class="card"><p>Set your code word on the <a href="index.html">portal home page</a> first.</p></div>`; return; }
  await refresh();
  const s = new URLSearchParams(location.search).get('set');
  if (s === 'due') return runDefs(dueDefs(), 'Due again');
  menu();
})();
async function refresh() { hist = historyBy(await Record.rows(cw, 'def')); }
const dueDefs = () => DEFS.filter(d => hist[d.id] && isDue(hist[d.id], Date.now(), dueInDef));
const status = id => { const h = hist[id]; if (!h) return 'new'; const last = h[h.length - 1]; const n = nextDue(h, dueInDef); return n === null ? (last.ok ? 'done' : 'due') : (Date.now() >= n ? 'due' : 'later'); };

function menu() {
  const due = dueDefs();
  const groups = { aos1: [], trade: [], labour: [] };
  DEFS.forEach(d => groups[kkArea(d.kk)].push(d));
  const mastered = DEFS.filter(d => status(d.id) === 'done').length;
  app.innerHTML = `
    <p class="lead">Write the definition from memory, with nothing in front of you. Then check it and tick what you actually wrote. Anything you drop comes back in 2 days, then 5.</p>
    ${due.length ? `<a class="tool" href="#" data-g="due"><h3>Due again <span class="tag due">${due.length}</span></h3><p>${esc(due.map(d => d.term).join(', '))}</p></a>` : ''}
    ${Object.entries(groups).map(([g, list]) => `<a class="tool" href="#" data-g="${g}"><h3>${esc(AREAS[g])} <span class="tag">${list.filter(d => status(d.id) === 'done').length}/${list.length} secure</span></h3><p>${esc(list.map(d => d.term).join(', '))}</p></a>`).join('')}
    <a class="tool" href="#" data-g="pairs"><h3>Confusion pairs</h3><p>Terms people mix up: write one sentence that separates them, then check.</p></a>
    <p class="note">${mastered} of ${DEFS.length} definitions secure.</p>`;
  $$('a.tool').forEach(a => a.onclick = e => { e.preventDefault(); const g = a.dataset.g;
    if (g === 'pairs') return runPairs();
    runDefs(g === 'due' ? dueDefs() : shuffle(groups[g]), g === 'due' ? 'Due again' : AREAS[g]); });
  window.scrollTo(0, 0);
}

function runDefs(list, title) {
  if (!list.length) { app.innerHTML = `<div class="card"><p>Nothing due right now.</p><button class="ghost" id="m">Back</button></div>`; $('#m').onclick = menu; return; }
  let i = 0, full = 0;
  const show = () => {
    const d = list[i];
    app.innerHTML = `<p class="prog"><a href="#" id="m">← Definitions</a> · ${esc(title)} · ${i + 1} of ${list.length}</p>
      <div class="card"><p class="stem">Define: <b>${esc(d.term)}</b></p>
      <textarea id="ans" placeholder="Write it from memory" style="min-height:110px"></textarea>
      <button class="go wide" id="ck">Check</button></div><div id="res"></div>`;
    $('#m').onclick = e => { e.preventDefault(); menu(); };
    $('#ck').onclick = () => {
      $('#ck').classList.add('hide'); $('#ans').readOnly = true;
      $('#res').innerHTML = `<div class="card"><h3 style="margin-top:0">A full definition</h3><p class="sample">${esc(d.model)}</p>
        <p style="margin:12px 0 4px"><b>Tick each part you actually wrote:</b></p>
        <div class="crit">${d.els.map((e, k) => `<label><input type="checkbox" data-k="${k}"><span>${esc(e)}</span></label>`).join('')}</div>
        <button class="go wide" id="sv">Save</button></div>`;
      $('#sv').onclick = async () => {
        const got = $$('.crit input:checked').length, ok = got === d.els.length;
        if (ok) full++;
        const missing = d.els.filter((e, k) => !$$('.crit input')[k].checked);
        await Record.push(cw, [{ t: 'def', q: d.id, kk: d.kk, ok, got, max: d.els.length, ts: Date.now() }]);
        await refresh();
        const n = nextDue(hist[d.id], dueInDef);
        $('#sv').outerHTML = `<div class="box ${ok ? 'good' : 'warn'}" style="margin-top:12px">${ok ? 'All there.' : `Missing: <b>${esc(missing.join('; '))}</b>. Learn just that part.`}
          ${n ? ` This one comes back ${whenText(n)}.` : ''}</div><button class="go wide" id="nx">${i + 1 < list.length ? 'Next' : 'Finish'}</button>`;
        $('#nx').onclick = () => { i++; if (i < list.length) show(); else done(); };
      };
      $('#res').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    $('#ans').focus();
  };
  const done = () => {
    app.innerHTML = `<div class="card"><p class="stem">${full} / ${list.length} complete</p>
      <p>Don’t redo the missed ones now. Coming back to them in 2 days is what makes them stick.</p>
      <button class="go" id="m">Back to definitions</button></div>`;
    $('#m').onclick = menu;
  };
  show();
}

function runPairs() {
  const list = shuffle(PAIRS); let i = 0;
  const show = () => {
    const p = list[i];
    app.innerHTML = `<p class="prog"><a href="#" id="m">← Definitions</a> · Confusion pairs · ${i + 1} of ${list.length}</p>
      <div class="card"><p class="stem"><b>${esc(p.a)}</b> or <b>${esc(p.b)}</b>?</p>
      <p class="note">Write one sentence that separates them. Use “whereas”.</p>
      <textarea id="ans" style="min-height:90px"></textarea>
      <button class="go wide" id="ck">Check</button></div><div id="res"></div>`;
    $('#m').onclick = e => { e.preventDefault(); menu(); };
    $('#ck').onclick = () => {
      $('#ck').classList.add('hide');
      $('#res').innerHTML = `<div class="card"><p class="sample">${esc(p.sep)}</p>
        <p class="note">Did yours make the same distinction? If not, write this one out once by hand.</p>
        <button class="go wide" id="nx">${i + 1 < list.length ? 'Next pair' : 'Finish'}</button></div>`;
      $('#nx').onclick = () => { i++; if (i < list.length) show(); else menu(); };
    };
  };
  show();
}
</script>
</body>
</html>
