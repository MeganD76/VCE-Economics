<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher view · Year 11 Unit 2 exam portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<style>
  .wrap.wide{max-width:1300px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:0 0 16px}
  .tile{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
  .tile .v{font:600 26px/1.1 'IBM Plex Sans',sans-serif}
  .tile .l{font-size:13px;color:var(--soft);margin-top:2px}
  .controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px;font-size:14px}
  .controls select{padding:6px 8px;font-size:14px}
  .scroll{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:3px}
  table.cls{border-collapse:collapse;width:100%;font-size:14px;min-width:1040px}
  table.cls th,table.cls td{padding:9px 8px;border-bottom:1px solid #EEF1F5;text-align:left;vertical-align:middle;white-space:nowrap}
  table.cls th{font-size:12px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;background:#F7F8FA}
  table.cls td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.cls tr.stu{cursor:pointer}
  table.cls tr.stu:hover td{background:#FAFBFC}
  table.cls tr.stu.open td{background:#F4F6F9}
  .done{display:flex;align-items:center;gap:8px}
  .bar{width:110px;height:8px;background:#E3E7ED;border-radius:2px;overflow:hidden;flex:none}
  .bar span{display:block;height:100%;background:#12447E;border-radius:2px}
  .sub{color:var(--soft);font-size:12.5px}
  .res{font-size:12.5px;color:var(--soft);display:block}
  .chev{color:var(--soft);font-size:12px}
  tr.det td{background:#F4F6F9;white-space:normal;padding:4px 16px 18px}
  .detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px}
  .detgrid h4{margin:12px 0 6px;font:600 13px 'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  .detgrid table{border-collapse:collapse;width:100%;font-size:13.5px}
  .detgrid td{padding:4px 0;border-bottom:1px solid #E6EAF0;white-space:normal}
  .detgrid td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
  .err{color:var(--trap);margin:10px 0 0}
  textarea.copy{min-height:170px;font:400 14px/1.5 'IBM Plex Sans',sans-serif}
</style>
</head>
<body>
<div class="wrap wide">
<header id="hdr"><a class="back" href="index.html">← Exam portal</a><h1>Teacher view · what each student has completed</h1><div class="who" id="when"></div></header>
<main id="app"></main>
</div>
<script src="portal-data.js"></script>
<script src="tracker-data.js"></script>
<script src="practice-data.js"></script>
<script src="mc-data.js"></script>
<script src="defs-data.js"></script>
<script src="rtq-data.js"></script>
<script>
/* Reads the "u2ex26" records from the vce-results Worker (same PIN as the
   Trade and Labour Market hubs). Shows completion and results; students'
   written answers never leave their device. */
const app = $('#app');
let pin = null, data = null, fetchedAt = null, sortBy = 'least', open = null;
try { pin = sessionStorage.getItem('econ11u2-teacher-pin'); sortBy = localStorage.getItem('econ11u2-teacher-sort') || 'least'; } catch (e) {}

const TOTAL = { marks: ASSESS.length, pt: PQ.length, mc: MCQ.length, def: DEFS.length, rtq: RQ.length, as: ASSESS_ITEMS.length };
const ALL_TASKS = Object.values(TOTAL).reduce((a, b) => a + b, 0);
const DAYMS = 86400000;
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

if (pin) load(); else askPin();

function askPin(msg) {
  app.innerHTML = `<div class="card" style="max-width:460px">
    <p class="stem">Teacher PIN</p>
    <p class="note">The same PIN as the Trade and Labour Market hubs.</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" style="width:100%">
    <button class="go wide" id="go">Show the class</button>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
  $('#pin').focus();
  $('#pin').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
  $('#go').onclick = () => { pin = $('#pin').value.trim(); if (pin) load(); };
}

async function load() {
  app.innerHTML = `<p class="note">Loading the class…</p>`;
  let j;
  try {
    const r = await fetch(`${RESULTS_URL}?hub=${encodeURIComponent(HUB_ID)}&pin=${encodeURIComponent(pin)}`);
    j = await r.json();
  } catch (e) { return askPin('Couldn’t reach the results Worker. Check your connection and try again.'); }
  if (!j || j.error) { try { sessionStorage.removeItem('econ11u2-teacher-pin'); } catch (e) {} return askPin(j && j.error ? 'The Worker said: ' + j.error : 'That PIN didn’t work.'); }
  try { sessionStorage.setItem('econ11u2-teacher-pin', pin); } catch (e) {}
  data = j.results || []; fetchedAt = Date.now();
  render();
}

/* Latest record per student, merged with the roll. */
function students() {
  const by = {};
  data.forEach(r => {
    const slug = r.slug || slugify(r.name || ''); if (!slug || !r.progress) return;
    const prev = by[slug];
    if (!prev || String(r.progress.updated || '') > String(prev.progress.updated || '')) by[slug] = r;
  });
  const rollSlugs = new Set(ROLL.map(slugify));
  return ROLL.map(n => ({ name: n, rec: by[slugify(n)] || null, onRoll: true }))
    .concat(Object.values(by).filter(r => !rollSlugs.has(r.slug || slugify(r.name))).map(r => ({ name: r.name, rec: r, onRoll: false })))
    .map(s => Object.assign(s, measure(s.rec)));
}

function measure(rec) {
  const p = rec && rec.progress;
  if (!p || !p.last) return { p: null, done: 0, share: 0, since: null };
  const entered = Object.keys(p.marks || {}).length;
  const done = entered + p.pt.n + p.mc.n + p.def.n + p.rtq.n + p.as.n;
  const since = Math.round((startOfDay(Date.now()) - startOfDay(p.last)) / DAYMS);
  return { p, entered, done, share: pct(done, ALL_TASKS), since };
}

const ago = d => d === null ? '—' : d === 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`;

function render() {
  const all = students();
  const roll = all.filter(s => s.onRoll);
  const started = roll.filter(s => s.p);
  if (sortBy === 'name') all.sort((a, b) => (b.onRoll - a.onRoll) || a.name.localeCompare(b.name));
  else all.sort((a, b) => a.share - b.share || a.name.localeCompare(b.name));
  $('#when').textContent = 'Updated ' + new Date(fetchedAt).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });

  const avg = started.length ? Math.round(started.reduce((a, s) => a + s.share, 0) / started.length) : 0;
  const withMarks = roll.filter(s => s.entered).length;

  const cell = (v, t, res) => `<td class="num">${v}<span class="sub"> / ${t}</span>${res ? `<span class="res">${res}</span>` : ''}</td>`;
  const blank = `<td class="num"><span class="sub">—</span></td>`;
  const row = (s, i) => {
    const p = s.p;
    const head = `<td><span class="chev">${p ? (open === s.name ? '▾' : '▸') : ''}</span> <b>${esc(s.name)}</b>${s.onRoll ? '' : ` <span class="sub">(not on roll)</span> <a href="#" class="rm sub" data-name="${esc(s.rec.name)}">remove</a>`}</td>`;
    if (!p) return `<tr>${head}<td><span class="sub">Not started</span></td><td></td>${blank.repeat(6)}</tr>`;
    const mk = Object.values(p.marks || {}); const mg = mk.reduce((a, m) => a + m.got, 0), mm = mk.reduce((a, m) => a + m.max, 0);
    return `<tr class="stu${open === s.name ? ' open' : ''}" data-i="${i}">${head}
      <td><div class="done"><div class="bar"><span style="width:${s.share}%"></span></div><b>${s.share}%</b></div></td>
      <td>${ago(s.since)}</td>
      ${cell(s.entered, TOTAL.marks, mm ? `${pct(mg, mm)}% across them` : '')}
      ${cell(p.pt.n, TOTAL.pt, p.pt.max ? `scored ${pct(p.pt.got, p.pt.max)}%` : '')}
      ${cell(p.mc.n, TOTAL.mc, p.mc.n ? `${pct(p.mc.first, p.mc.n)}% right first try` : '')}
      ${cell(p.def.n, TOTAL.def, p.def.n ? `${p.def.full} complete` : '')}
      ${cell(p.rtq.n, TOTAL.rtq, p.rtq.n ? `${p.rtq.ok} read perfectly` : '')}
      ${cell(p.as.n, TOTAL.as, p.as.n ? `${p.as.agreed} marked accurately` : '')}
    </tr>${open === s.name ? `<tr class="det"><td colspan="9">${details(s)}</td></tr>` : ''}`;
  };

  app.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="v">${started.length}<span class="sub"> / ${roll.length}</span></div><div class="l">Started</div></div>
      <div class="tile"><div class="v">${avg}%</div><div class="l">Average completed (of those started)</div></div>
      <div class="tile"><div class="v">${withMarks}<span class="sub"> / ${roll.length}</span></div><div class="l">Have entered SAC marks</div></div>
    </div>
    <div class="controls">
      <label>Sort <select id="sort"><option value="least" ${sortBy === 'least' ? 'selected' : ''}>Least completed first</option><option value="name" ${sortBy === 'name' ? 'selected' : ''}>By name</option></select></label>
      <button class="ghost" id="rf">Refresh</button>
      <button class="go" id="cp">Copy a progress list</button>
      <span class="sub">Click a student to see their results in detail.</span>
    </div>
    <div class="scroll"><table class="cls">
      <thead><tr><th>Student</th><th>Completed</th><th>Last active</th><th>Marks entered</th><th>Practice Qs</th><th>Multiple choice</th><th>Definitions</th><th>Read the Q</th><th>Marked others</th></tr></thead>
      <tbody>${all.map(row).join('')}</tbody></table></div>
    <div id="cpout" class="hide" style="margin-top:16px"></div>
    <div class="foot">
      <p><b>Completed</b> is the share of all ${ALL_TASKS} portal tasks the student has done at least once: the ${TOTAL.marks} SACs and practice exams in Where your marks went, ${TOTAL.pt} practice questions, ${TOTAL.mc} multiple choice, ${TOTAL.def} definitions, ${TOTAL.rtq} Read the Question drills and ${TOTAL.as} Mark someone else’s answers.</p>
      <p><b>Results</b> are what students recorded: SAC and practice exam marks they entered, their self-marked practice scores (latest attempt), multiple choice right on the first try, and definitions written in full. Students’ written answers stay on their own device.</p>
      <p>Students appear once they pick their name on the portal home page. Names not on the roll (a test or a typo) can be removed with the link beside them; edit the roll in <code>portal-data.js</code>. If a student works on two devices, the one used most recently is shown.</p>
    </div>`;

  $('#sort').onchange = e => { sortBy = e.target.value; try { localStorage.setItem('econ11u2-teacher-sort', sortBy); } catch (err) {} render(); };
  $('#rf').onclick = load;
  $('#cp').onclick = () => copyList(all.filter(s => s.onRoll || s.p));
  $$('tr.stu').forEach(tr => tr.onclick = e => {
    if (e.target.closest('a')) return;
    const s = all[+tr.dataset.i]; open = open === s.name ? null : s.name; render();
  });
  $$('a.rm').forEach(a => a.onclick = async e => {
    e.preventDefault(); e.stopPropagation();
    if (a.dataset.sure !== '1') { a.dataset.sure = '1'; a.textContent = 'click again to remove'; return; }
    try { await fetch(`${RESULTS_URL}?pin=${encodeURIComponent(pin)}&hub=${encodeURIComponent(HUB_ID)}&name=${encodeURIComponent(a.dataset.name)}`, { method: 'DELETE' }); } catch (err) {}
    load();
  });
}

/* One student’s results in full. */
function details(s) {
  const p = s.p;
  const trs = rows => rows.length ? `<table>${rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>` : '<p class="sub">Nothing yet.</p>';
  const marks = ASSESS.filter(a => p.marks && p.marks[a.id]).map(a => { const m = p.marks[a.id]; return [esc(a.n) + (m.n < a.q.length ? ` <span class="sub">(${m.n} of ${a.q.length} questions entered)</span>` : ''), `${m.got} / ${m.max} · ${pct(m.got, m.max)}%`]; });
  const famTot = p.fam.A + p.fam.B + p.fam.C;
  const fam = famTot ? Object.keys(FAMILY).map(f => [esc(FAMILY[f].n), `${p.fam[f]} marks · ${pct(p.fam[f], famTot)}%`]) : [];
  const plan = (p.plan || []).filter(c => TASKS[c]).map(c => [esc(TASKS[c].n), `<span class="sub">${esc(CODES[c].n)}</span>`]);
  const types = Object.keys(QTYPES).filter(t => p.pt.byType[t]).map(t => { const b = p.pt.byType[t]; return [`${esc(QTYPES[t])} <span class="sub">(${b.n} done)</span>`, `${b.got} / ${b.max} · ${pct(b.got, b.max)}%`]; });
  const other = [
    ['Multiple choice right on first try', `${p.mc.first} / ${p.mc.n}`],
    ['Multiple choice right on latest try', `${p.mc.now} / ${p.mc.n}`],
    ['Definitions written in full (latest try)', `${p.def.full} / ${p.def.n}`],
    ['Read the Question: task word and parts both right', `${p.rtq.ok} / ${p.rtq.n}`],
    ['Mark someone else’s: gave the real mark', `${p.as.agreed} / ${p.as.n}`]
  ];
  return `<div class="detgrid">
    <div><h4>SAC and practice exam marks</h4>${trs(marks)}
      ${fam.length ? `<h4>Where their marks went</h4>${trs(fam)}` : ''}
      ${plan.length ? `<h4>Their three drills</h4>${trs(plan)}` : ''}</div>
    <div><h4>Practice by question type (self-marked)</h4>${trs(types)}</div>
    <div><h4>Other results</h4>${trs(other)}</div>
  </div>`;
}

/* Plain text for Compass or a Teams message. */
async function copyList(all) {
  const date = new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
  const none = all.filter(s => !s.p).map(s => s.name);
  const done = all.filter(s => s.p).sort((a, b) => a.share - b.share);
  const lines = [`Year 11 Economics · Unit 2 exam portal: progress, ${date}`, ''];
  if (none.length) { lines.push('Not started yet: ' + none.join(', '), ''); }
  if (done.length) {
    lines.push('Completed so far (least first):');
    done.forEach(s => lines.push(`- ${s.name}: ${s.share}% (marks entered ${s.entered}/${TOTAL.marks}, practice ${s.p.pt.n}/${TOTAL.pt}, multiple choice ${s.p.mc.n}/${TOTAL.mc}, definitions ${s.p.def.n}/${TOTAL.def})`));
  }
  const text = lines.join('\n').trim();
  $('#cpout').classList.remove('hide');
  $('#cpout').innerHTML = `<textarea class="copy" readonly>${esc(text)}</textarea><p class="note" id="cpmsg">Select all and copy.</p>`;
  try { await navigator.clipboard.writeText(text); $('#cpmsg').textContent = 'Copied to your clipboard.'; } catch (e) {}
}
</script>
</body>
</html>
