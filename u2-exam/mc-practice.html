<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiple choice practice · Year 11 Economics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="wrap">
<header id="hdr"></header>
<main id="app"></main>
</div>
<script src="portal-data.js"></script>
<script src="mc-data.js"></script>
<script>
const app = $('#app');
let cw = null, hist = {};
const MC_CODES = Object.keys(CODES).filter(c => CODES[c].mc);

(async function () {
  cw = await mountHeader('Multiple choice practice');
  if (!cw) { app.innerHTML = `<div class="card"><p>Set your code word on the <a href="index.html">portal home page</a> first.</p></div>`; return; }
  await refresh();
  const s = new URLSearchParams(location.search).get('set');
  if (s) return start(s);
  menu();
})();
async function refresh() { hist = historyBy(await Record.rows(cw, 'mc')); }
const due = () => MCQ.filter(q => hist[q.id] && isDue(hist[q.id]));

const SETS = {
  mixed: { n: 'Mixed set of 10', d: 'Ten from across the unit, new ones first.', pick: () => {
    const unseen = shuffle(MCQ.filter(q => !hist[q.id])), seen = shuffle(MCQ.filter(q => hist[q.id]));
    return unseen.concat(seen).slice(0, 10); } },
  aos1: { n: 'Economic activity (AOS1)', pick: () => shuffle(MCQ.filter(q => kkArea(q.kk) === 'aos1')) },
  trade: { n: 'International trade', pick: () => shuffle(MCQ.filter(q => kkArea(q.kk) === 'trade')) },
  labour: { n: 'The changing labour market', pick: () => shuffle(MCQ.filter(q => kkArea(q.kk) === 'labour')) },
  calc: { n: 'Calculations', d: 'Write every step: formula, numbers, answer, unit.', pick: () => shuffle(MCQ.filter(q => q.calc)) },
  due: { n: 'Due again', pick: () => shuffle(due()) }
};

function menu() {
  const d = due().length;
  const seen = Object.keys(hist).length;
  app.innerHTML = `
    <p class="lead">Before you look at the options, underline (in your head) every NOT, MOST LIKELY and increase/decrease word in the question. Then say how sure you are before you check.</p>
    ${d ? `<a class="tool" href="#" data-s="due"><h3>Due again <span class="tag due">${d}</span></h3><p>Ones you got wrong, back on schedule.</p></a>` : ''}
    ${Object.entries(SETS).filter(([k]) => k !== 'due').map(([k, s]) => `<a class="tool" href="#" data-s="${k}"><h3>${esc(s.n)}</h3><p>${esc(s.d || s.pick().length + ' questions')}</p></a>`).join('')}
    <p class="note">${seen} of ${MCQ.length} questions attempted.</p>`;
  $$('a.tool').forEach(a => a.onclick = e => { e.preventDefault(); start(a.dataset.s); });
  window.scrollTo(0, 0);
}

function start(key) {
  const S = SETS[key] || SETS.mixed;
  const list = S.pick();
  if (!list.length) { app.innerHTML = `<div class="card"><p>Nothing due right now. Come back in a few days.</p><button class="ghost" id="m">Back</button></div>`; $('#m').onclick = menu; return; }
  let i = 0; const log = [];
  const next = () => { i++; if (i < list.length) ask(list[i], i, list.length, log, next); else summary(log); };
  ask(list[0], 0, list.length, log, next);
}

function ask(q, idx, n, log, next) {
  const order = shuffle([0, 1, 2, 3]);
  app.innerHTML = `
    <p class="prog"><a href="#" id="m">← Sets</a> · ${idx + 1} of ${n}</p>
    <div class="card">
      <p class="stem">${esc(q.stem)}</p>
      <div id="opts">${order.map((oi, k) => `<button class="opt" data-oi="${oi}"><b>${'ABCD'[k]}.</b> ${esc(q.o[oi])}</button>`).join('')}</div>
      <div id="confbox" class="hide" style="margin-top:6px"><p style="margin:6px 0"><b>How sure are you?</b></p>
        <div class="row" id="conf"><span class="chip" data-c="sure">Sure</span><span class="chip" data-c="unsure">Not sure</span><span class="chip" data-c="guess">Guess</span></div></div>
    </div><div id="res"></div>`;
  $('#m').onclick = e => { e.preventDefault(); menu(); };
  let pick = null;
  $$('.opt').forEach(b => b.onclick = () => {
    if ($('#res').innerHTML) return;
    $$('.opt').forEach(x => x.classList.remove('picked')); b.classList.add('picked'); pick = +b.dataset.oi;
    $('#confbox').classList.remove('hide');
  });
  $$('#conf .chip').forEach(c => c.onclick = () => { if (pick === null || $('#res').innerHTML) return; reveal(q, order, pick, c.dataset.c, log, next); });
  window.scrollTo(0, 0);
}

function reveal(q, order, pick, conf, log, next) {
  const ok = pick === q.a;
  $$('#conf .chip').forEach(c => { if (c.dataset.c === conf) c.classList.add('on'); c.onclick = null; });
  $$('.opt').forEach(b => { const oi = +b.dataset.oi; b.disabled = true; if (oi === q.a) b.classList.add('right'); else if (oi === pick) b.classList.add('wrong'); });
  const L = oi => 'ABCD'[order.indexOf(oi)];
  const sureWrong = !ok && conf === 'sure';
  $('#res').innerHTML = `<div class="card">
    <p class="verdict ${ok ? 'ok' : 'no'}">${ok ? (conf === 'guess' ? 'Right, but you guessed. It comes back once to check.' : 'Right.') : `Not quite. The answer is ${L(q.a)}.`}</p>
    ${sureWrong ? '<div class="box bad"><b>Sure but wrong.</b> These matter most: you won’t check an answer you’re sure of in the exam. It will come back in 3–6 days.</div>' : ''}
    <p><b>Why ${L(q.a)}:</b> ${esc(q.why)}</p>
    <p class="tip"><b>The trap (${L(q.trap)}):</b> ${esc(q.trapWhy)}</p>
    ${ok ? '' : `<p style="margin:12px 0 6px"><b>Why did you get it wrong?</b></p><div class="row" id="why">${MC_CODES.map(c => `<span class="chip" data-c="${c}" title="${esc(CODE_HELP[c])}">${esc(CODES[c].n)}</span>`).join('')}</div>`}
    <button class="go wide" id="nx" ${ok ? '' : 'disabled'}>Next</button></div>`;
  let code = null;
  if (!ok) $$('#why .chip').forEach(c => c.onclick = () => { $$('#why .chip').forEach(z => z.classList.remove('on')); c.classList.add('on'); code = c.dataset.c; $('#nx').disabled = false; });
  $('#nx').onclick = async () => {
    // A guessed right answer is treated as a miss for scheduling, so it comes back once.
    const row = { t: 'mc', q: q.id, kk: q.kk, ok: ok && conf !== 'guess', right: ok, conf, code: ok ? null : code, ts: Date.now() };
    await Record.push(cw, [row]); log.push({ q, ok, conf }); await refresh(); next();
  };
  $('#res').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function summary(log) {
  const right = log.filter(x => x.ok).length;
  const sw = log.filter(x => !x.ok && x.conf === 'sure');
  app.innerHTML = `<div class="card">
    <p class="stem">${right} / ${log.length}</p>
    ${sw.length ? `<div class="box bad"><b>Sure but wrong (${sw.length}).</b> Fix these first: ${sw.map(x => esc(KK[x.q.kk])).join('; ')}.</div>` : '<div class="box good">No “sure but wrong” answers. Your confidence is matching your knowledge.</div>'}
    <p>Anything you missed or guessed comes back on schedule. You’ll see it under <b>Due again</b>.</p>
    <div class="row"><button class="go" id="again">Another set</button><a class="ghost" style="text-decoration:none" href="${homeLink(cw)}">Portal home</a></div></div>`;
  $('#again').onclick = menu;
}
</script>
</body>
</html>
