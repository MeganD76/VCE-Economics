<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 11 Economics exam portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="wrap">
<header id="hdr"><h1>Year 11 Economics exam portal</h1><div class="who" id="who"></div></header>
<main id="app"></main>
</div>
<script src="portal-data.js"></script>
<script>
const app = $('#app'), who = $('#who');
let cw = null;

(async function () {
  const q = new URLSearchParams(location.search);
  if (q.get('switch')) return askCode();
  const fromLink = clean(q.get('cw')).length >= 3;
  cw = await getCW();
  if (!cw) return askCode();
  let ok = fromLink;
  try { ok = ok || sessionStorage.getItem('econ11-ok') === cw; } catch (e) {}
  if (ok) home(); else confirmWho();
})();

/* On a shared computer the last code word is remembered, so check it is
   still the same student before opening their record. */
function confirmWho() {
  who.innerHTML = '';
  app.innerHTML = `<div class="card">
    <p class="stem">Welcome back. Is your code word <b>${esc(cw)}</b>?</p>
    <p class="note">If you’re on a shared computer, someone else may have used this browser last.</p>
    <div class="row"><button class="go" id="yes">Yes, that’s me</button><button class="ghost" id="no">No, use my own code word</button></div>
  </div>`;
  $('#yes').onclick = () => { try { sessionStorage.setItem('econ11-ok', cw); } catch (e) {} home(); };
  $('#no').onclick = askCode;
}

function askCode() {
  who.innerHTML = '';
  app.innerHTML = `<div class="card">
    <p class="stem">What is your code word?</p>
    <p class="note">Use the same one every time. It is how your work follows you from one task to the next.
      It is not a password and it is not your name: pick something only you would use, and write it in
      your book so you don’t forget it.</p>
    <input type="text" id="cwin" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="your code word">
    <button class="go wide" id="cwgo" disabled>Continue</button>
  </div>`;
  const inp = $('#cwin'), go = $('#cwgo');
  inp.oninput = () => { go.disabled = clean(inp.value).length < 3; };
  inp.onkeydown = e => { if (e.key === 'Enter' && !go.disabled) go.click(); };
  go.onclick = async () => { cw = clean(inp.value); await Store.set(SETTINGS_CW, cw); try { sessionStorage.setItem('econ11-ok', cw); } catch (e) {} history.replaceState(null, '', 'index.html?cw=' + encodeURIComponent(cw)); home(); };
  inp.focus();
}

/* Name from the class roll, so the teacher view can show who has started.
   Same roll as the Trade and Labour Market hubs. */
function askName() {
  app.innerHTML = `<div class="card">
    <p class="stem">Which name is yours?</p>
    <p class="note">Ms Dyring can see how much you’ve done on the portal and your results (your marks and scores), so she can check in with you. She can’t see what you write.</p>
    <div class="row" id="roll">${ROLL.map(n => `<button class="ghost" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <p style="margin:14px 0 6px"><a href="#" id="other">My name isn’t here</a></p>
    <div id="otherbox" class="hide"><input type="text" id="nm" placeholder="First name and last initial" autocomplete="off">
      <button class="go wide" id="nmgo">Continue</button></div>
  </div>`;
  const pickName = async n => { await Record.update(cw, R => { R.name = n; }); home(); };
  $$('#roll button').forEach(b => b.onclick = () => pickName(b.dataset.n));
  $('#other').onclick = e => { e.preventDefault(); $('#otherbox').classList.remove('hide'); $('#nm').focus(); };
  $('#nmgo').onclick = () => { const n = $('#nm').value.trim(); if (n.length >= 2) pickName(n.slice(0, 40)); };
}

async function home() {
  who.innerHTML = `Code word <b>${esc(cw)}</b> <button class="ghost small" id="chg" style="padding:2px 8px;margin-left:6px">change</button>`;
  $('#chg').onclick = askCode;
  const S = await Record.load(cw);
  if (!S.name) return askName();
  Sync.soon(S);                               // resend the full summary in case an earlier save was offline
  const pr = S.pr || [];
  const now = Date.now();
  const due = (t, fn) => Object.values(historyBy(pr.filter(r => r.t === t))).filter(h => isDue(h, now, fn)).length;
  const dMC = due('mc'), dPT = due('pt'), dDef = due('def', dueInDef);

  const todo = [];
  if (S.plan && S.plan.length) {
    S.plan.forEach(c => { const T = TASKS[c]; if (!T) return;
      const href = T.go ? toolLink(T.go, cw, T.extra) : toolLink('marks-tracker.html', cw, 'view=plan');
      todo.push(`<li><a href="${href}"><b>${esc(T.n)}</b></a> <span class="muted small">(${esc(T.t)})</span> for <i>${esc(CODES[c].n.toLowerCase())}</i></li>`); });
  }
  if (dMC) todo.push(`<li><a href="${toolLink('mc-practice.html', cw, 'set=due')}">${dMC} multiple choice question${dMC > 1 ? 's' : ''} due again</a></li>`);
  if (dPT) todo.push(`<li><a href="${toolLink('practice.html', cw, 'type=due')}">${dPT} practice question${dPT > 1 ? 's' : ''} due again</a></li>`);
  if (dDef) todo.push(`<li><a href="${toolLink('definitions.html', cw, 'set=due')}">${dDef} definition${dDef > 1 ? 's' : ''} due again</a></li>`);
  const hasMarks = S.e && Object.keys(S.e).length;

  const today = todo.length
    ? `<div class="card"><h3 style="margin-top:0">Today</h3><ul style="margin:0;padding-left:20px">${todo.join('')}</ul>
        ${S.plan && S.plan.length ? `<p class="note" style="margin:10px 0 0">The drills come from your plan in <a href="${toolLink('marks-tracker.html', cw, 'view=plan')}">Where your marks went</a>.</p>` : ''}</div>`
    : `<div class="card"><h3 style="margin-top:0">Start here</h3><p style="margin:0">${hasMarks
        ? 'Nothing is due today. Pick a question type you lost marks on and do two questions.'
        : 'Enter your SAC marks in <b>Where your marks went</b> first. It tells you which of the tasks below to do, so you work on what actually costs you marks.'}</p></div>`;

  const cards = TOOLS.map(t => `<a class="tool" href="${toolLink(t.file, cw)}"><h3>${esc(t.name)}</h3><p>${esc(t.blurb)}</p></a>`).join('');
  const content = Object.values(CONTENT).map(c => `<a class="tool content" href="${c.href}"><h3>${esc(c.name)}</h3><p>Content practice for this area of study. Use it when your plan says the gap is the economics itself.</p></a>`).join('');

  app.innerHTML = `
    <p class="lead">Everything for the Unit 2 exam lives here. Work on what your plan tells you to work on, not on whatever looks easiest.</p>
    ${today}
    <h2>Exam technique</h2>${cards}
    <h2>Content practice already on the class site</h2>${content}
    <div class="foot">
      <p>Ms Dyring can see how much you’ve done here and your results (marks and scores), but not what you write.
        Name: <b>${esc(S.name)}</b> · <a href="#" id="chname">change</a></p>
      <p>Your work saves against your code word on this device and browser. To carry it to another device, copy your backup code here and paste it in there.</p>
      <div class="row"><button class="ghost" id="bk">Copy my backup code</button><button class="ghost" id="rs">Restore from a backup code</button></div>
      <div id="bkout" class="hide" style="margin-top:10px"></div>
      <p style="margin-top:18px"><a href="teacher.html">Teacher view</a></p>
    </div>`;
  $('#chname').onclick = e => { e.preventDefault(); askName(); };

  $('#bk').onclick = async () => {
    const code = exportCode(await Record.load(cw));
    $('#bkout').classList.remove('hide');
    $('#bkout').innerHTML = `<textarea readonly style="min-height:90px;font-size:12px">${esc(code)}</textarea><p class="note">Copy all of this and keep it somewhere safe (email it to yourself).</p>`;
    try { await navigator.clipboard.writeText(code); $('#bkout').querySelector('.note').textContent = 'Copied. Paste it somewhere safe, such as an email to yourself.'; } catch (e) {}
  };
  $('#rs').onclick = () => {
    $('#bkout').classList.remove('hide');
    $('#bkout').innerHTML = `<textarea id="rsin" placeholder="Paste your backup code (starts with ECON11:)" style="min-height:90px;font-size:12px"></textarea>
      <button class="go wide" id="rsgo">Restore</button><p class="note" id="rsmsg"></p>`;
    $('#rsgo').onclick = async () => {
      try {
        const o = importCode($('#rsin').value);
        if (!o || typeof o !== 'object') throw 0;
        o.cw = cw;
        await Store.set(cw, JSON.stringify(o));
        $('#rsmsg').textContent = 'Restored.'; setTimeout(home, 600);
      } catch (e) { $('#rsmsg').textContent = 'That code didn’t work. Check you copied all of it.'; }
    };
  };
}
</script>
</body>
</html>
