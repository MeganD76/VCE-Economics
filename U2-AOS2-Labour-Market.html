<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changing Labour Market — Lesson Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE — ledger / customs-manifest
   ============================================================ */
:root{
  --ink:#12303A;        /* headings, body text */
  --ink-soft:#4A6672;   /* secondary text */
  --teal:#0E7C7B;       /* primary action, WE DO */
  --teal-pale:#E4F1F0;
  --amber:#B9791A;      /* hints */
  --amber-pale:#FBF1DC;
  --red:#B23B32;        /* common mistakes */
  --red-pale:#FBE9E7;
  --green:#2C6E4A;      /* cleared */
  --green-pale:#E3F0E7;
  --paper:#FBFAF7;
  --card:#FFFFFF;
  --line:#DAD6CD;
  --line-soft:#EDEAE3;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-weight:700;line-height:1.15;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* eyebrow label — used for every structural marker in the page */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}

.wrap{max-width:820px;margin:0 auto;padding:0 20px 96px}

/* ---------- top bar ---------- */
.bar{
  border-bottom:1px solid var(--line);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.bar-in{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.bar-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.bar-spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.linkish{
  background:none;border:none;padding:0;font:inherit;color:var(--teal);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
.linkish:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:#0A222A;border-color:#0A222A}
.btn:disabled{background:var(--line);border-color:var(--line);color:#8B8B84;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn-teal{background:var(--teal);border-color:var(--teal)}
.btn-teal:hover{background:#0B6564;border-color:#0B6564}
.btn-sm{padding:6px 12px;font-size:14px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- name picker ---------- */
.roll{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.roll button{
  font:inherit;font-weight:500;padding:12px 20px;border:1px solid var(--line);
  background:var(--card);border-radius:2px;cursor:pointer;color:var(--ink);
}
.roll button:hover{border-color:var(--teal);background:var(--teal-pale)}

/* ---------- hub: colour accents per lesson card ---------- */
:root{
  --acc1:#0E7C7B; --acc1-pale:#E4F1F0;   /* teal   */
  --acc2:#B23B32; --acc2-pale:#FBE9E7;   /* red    */
  --acc3:#B9791A; --acc3-pale:#FBF1DC;   /* amber  */
  --acc4:#2C6E4A; --acc4-pale:#E3F0E7;   /* green  */
  --acc5:#5B4B8A; --acc5-pale:#EDE9F5;   /* plum   */
  --acc6:#1E6091; --acc6-pale:#E1EEF7;   /* sky    */
  --acc7:#A34E86; --acc7-pale:#F5E7F1;   /* orchid */
  --acc8:#C2660E; --acc8-pale:#FBE9D8;   /* rust   */
}

/* ---------- hub: welcome banner ---------- */
.hero{
  margin-top:28px;border-radius:6px;padding:22px 26px;
  background:linear-gradient(120deg,#12303A 0%,#0E7C7B 100%);
  color:#fff;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.07);
}
.hero-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.75);
}
.hero-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:26px;margin:6px 0 4px}
.hero-sub{color:rgba(255,255,255,.85);font-size:14.5px;max-width:52ch;margin:0}
.hero-stats{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;position:relative}
.hero-ring{
  width:52px;height:52px;border-radius:50%;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#F2C879 calc(var(--pct)*1%), rgba(255,255,255,.25) 0);
}
.hero-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#12303A}
.hero-ring span{position:relative;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700}
.hero-statline{font-size:14px}
.hero-statline b{font-weight:700}

/* ---------- hub: card grid ---------- */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;
  margin-top:24px;
}
.lcard{
  position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:16px 16px 14px;overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease;
}
.lcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,48,58,.12)}
.lcard:active{transform:translateY(0)}
.lcard::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc);
}
.lcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lcard-num{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;
  color:var(--acc);background:var(--acc-pale);border-radius:3px;padding:3px 8px;flex:none;
}
.lcard-title{
  font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17px;
  margin:10px 0 3px;line-height:1.2;
}
.lcard-chap{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.lcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.lcard-pips{display:flex;gap:4px}
.lcard-pip{width:14px;height:4px;border-radius:1px;background:var(--line)}
.lcard-pip.on{background:var(--acc)}

.pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:4px 10px;border-radius:99px;white-space:nowrap;
}
.pill-todo{background:var(--line-soft);color:var(--ink-soft)}
.pill-progress{background:var(--acc3-pale);color:var(--acc3)}
.pill-done{background:var(--acc4-pale);color:var(--acc4)}
.pill-done::before{content:"\2713  "}

/* ---------- hub: old row style (used by teacher toolbar buttons) ---------- */
.manifest{margin-top:26px;border-top:2px solid var(--ink)}
.mrow{
  display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;
  padding:16px 4px;border-bottom:1px solid var(--line-soft);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;
  text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.mrow:hover{background:var(--card)}
.mrow[disabled]{cursor:default;opacity:.55}
.mrow[disabled]:hover{background:none}
.mnum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft)}
.mtitle{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:19px}
.mchap{font-size:13px;color:var(--ink-soft);margin-top:1px}
.mcount{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.mcount.full{color:var(--green);font-weight:600}

/* SIGNATURE — the clearance stamp */
.stamp{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--green);
  border:2px solid var(--green);border-radius:3px;padding:3px 9px;
  transform:rotate(-4deg);opacity:.9;
}
.stamp.land{animation:land .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes land{
  from{transform:rotate(-18deg) scale(1.7);opacity:0}
  to{transform:rotate(-4deg) scale(1);opacity:.9}
}
@media (prefers-reduced-motion:reduce){.stamp.land{animation:none}}

/* ---------- lesson page ---------- */
.lesson-head{padding:28px 0 6px;border-bottom:2px solid var(--ink)}
.lesson-head h1{font-size:30px;letter-spacing:-.015em;margin-top:6px}
.progress{
  display:flex;align-items:center;gap:10px;margin-top:14px;padding-bottom:16px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);
}
.pips{display:flex;gap:5px}
.pip{width:22px;height:5px;background:var(--line);border-radius:1px}
.pip.on{background:var(--green)}

.task{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  margin-top:22px;overflow:hidden;
}
.task-head{padding:16px 20px 0;display:flex;align-items:flex-start;gap:12px}
.task-n{
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:2px 7px;margin-top:2px;flex:none;
}
.task-n.on{background:var(--green-pale);border-color:var(--green);color:var(--green)}
.task-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:19px;flex:1}
.task-marks{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:none;margin-top:3px}
.task-body{padding:12px 20px 20px}
.prompt{margin:0 0 14px;font-size:16.5px}

/* callout boxes — mirror the workbook's house style */
.box{border-radius:2px;padding:12px 14px;margin:14px 0;font-size:14.5px;line-height:1.5}
.box p{margin:0}
.box .eyebrow{display:block;margin-bottom:5px}
.box-hint{background:var(--amber-pale);border-left:3px solid var(--amber)}
.box-hint .eyebrow{color:var(--amber)}
.box-mistake{background:var(--red-pale);border-left:3px solid var(--red)}
.box-mistake .eyebrow{color:var(--red)}
.box-build{background:var(--teal-pale);border-left:3px solid var(--teal)}
.box-build .eyebrow{color:var(--teal)}
.box-build ol{margin:6px 0 0;padding-left:20px}
.box-build li{margin-bottom:3px}

/* ---------- match ---------- */
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:minmax(130px,34%) 1fr;gap:12px;align-items:center}
.pair-term{font-weight:600;font-size:15px}
select,textarea,input[type=text]{
  font:inherit;font-size:15px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:2px;padding:9px 10px;width:100%;
}
select:focus,textarea:focus,input:focus{border-color:var(--teal);outline:none;background:#fff}
.pair.ok select{border-color:var(--green);background:var(--green-pale)}
.pair.no select{border-color:var(--red);background:var(--red-pale)}

/* ---------- sort ---------- */
.sorts{display:flex;flex-direction:column;gap:9px}
.sort-row{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 12px;border:1px solid var(--line-soft);border-radius:2px;background:var(--paper);
  flex-wrap:wrap;
}
.sort-row.ok{border-color:var(--green);background:var(--green-pale)}
.sort-row.no{border-color:var(--red);background:var(--red-pale)}
.sort-txt{flex:1;min-width:190px;font-size:15px}
.chips{display:flex;gap:6px;flex:none}
.chip{
  font:inherit;font-size:13.5px;font-weight:500;padding:6px 13px;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:2px;color:var(--ink-soft);
}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- choice ---------- */
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer;
  border:1px solid var(--line-soft);border-radius:2px;background:var(--paper);font-size:15px;
}
.opt:hover{border-color:var(--teal)}
.opt input{margin:4px 0 0;flex:none;accent-color:var(--teal)}
.opt.ok{border-color:var(--green);background:var(--green-pale)}
.opt.no{border-color:var(--red);background:var(--red-pale)}

/* ---------- written ---------- */
textarea{min-height:120px;resize:vertical;line-height:1.55}
.starters{font-size:14px;color:var(--ink-soft);margin:0 0 10px;padding-left:18px}
.starters li{margin-bottom:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.word{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:4px 9px;border-radius:2px;
  border:1px dashed var(--line);color:var(--ink-soft);
}
.word.used{border-style:solid;border-color:var(--teal);background:var(--teal-pale);color:var(--teal);font-weight:500}
.meter{
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;
}
.checks{margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.checks input{margin:3px 0 0;flex:none;accent-color:var(--teal)}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.done-note{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--green);font-weight:500}

/* ---------- DUDDS checker ---------- */
.dudds{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.dcheck{
  display:flex;align-items:center;gap:7px;font-size:13.5px;
  border:1px solid var(--line);border-radius:2px;padding:6px 11px;background:var(--paper);
}
.dcheck .k{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--ink-soft)}
.dcheck.on{border-color:var(--green);background:var(--green-pale)}
.dcheck.on .k{color:var(--green)}
.chart{width:100%;border:1px solid var(--line);border-radius:2px;margin-bottom:14px;display:block}
.data-table{border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.dt-cap{
  font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:15px;
  padding:10px 12px;background:var(--teal-pale);color:var(--teal);
}
.data-table table{border-collapse:collapse;width:100%;font-size:14.5px}
.data-table th{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;background:var(--paper);text-align:left;padding:8px 12px;
  border-bottom:1px solid var(--line);position:static;
}
.data-table td{padding:8px 12px;border-bottom:1px solid var(--line-soft);white-space:normal}
.data-table tr:last-child td{border-bottom:none}
.dt-num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}
.dt-src{font-size:12px;color:var(--ink-soft);padding:8px 12px;background:var(--paper);border-top:1px solid var(--line-soft)}
.chart-slot{
  border:1px dashed var(--line);border-radius:2px;padding:26px;text-align:center;
  color:var(--ink-soft);font-size:14px;margin-bottom:14px;background:var(--paper);
}

/* ---------- two truths ---------- */
.tt-row{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.tt-tag{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:6px 8px;flex:none;
}
.lie-pick{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;font-size:14.5px}

/* ---------- teacher ---------- */
.grid-wrap{overflow-x:auto;margin-top:20px;border:1px solid var(--line);border-radius:3px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
th{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;background:var(--paper);position:sticky;top:0;
}
td.cell{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:center;color:var(--ink-soft)}
td.cell.full{background:var(--green-pale);color:var(--green);font-weight:600}
td.cell.part{background:var(--amber-pale);color:var(--amber)}
td.cell.low{background:var(--red-pale);color:var(--red);font-weight:600}
.verdict{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;
  width:22px;height:22px;line-height:22px;border-radius:50%;text-align:center;
}
.verdict.yes{background:var(--green);color:#fff}
.verdict.no{background:var(--line);color:var(--ink-soft)}
td.nm{font-weight:600}
.resp{
  border:1px solid var(--line);border-radius:3px;background:var(--card);
  padding:16px 18px;margin-top:14px;break-inside:avoid;
}
.resp h4{font-size:17px}
.resp-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin:3px 0 10px}
.resp-text{white-space:pre-wrap;font-size:15px;border-left:3px solid var(--teal-pale);padding-left:13px;margin:8px 0}
.resp-none{color:var(--ink-soft);font-style:italic;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--line-soft);color:var(--ink-soft)}
.tag.on{background:var(--green-pale);color:var(--green)}
.tag.off{background:var(--red-pale);color:var(--red)}
.err{background:var(--red-pale);border-left:3px solid var(--red);padding:12px 14px;border-radius:2px;margin-top:16px;font-size:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.sync{
  position:fixed;right:16px;bottom:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  background:var(--ink);color:#fff;padding:7px 13px;border-radius:2px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:40;
}
.sync.show{opacity:.92}
.sync.bad{background:var(--red)}

@media (max-width:560px){
  .pair{grid-template-columns:1fr;gap:5px}
  .lesson-head h1{font-size:25px}
  .mrow{grid-template-columns:38px 1fr;gap:10px}
  .mcount{grid-column:2;margin-top:4px}
  .card-grid{grid-template-columns:1fr}
  .hero{padding:18px 18px}
  .hero-title{font-size:22px}
}
@media print{
  .bar,.toolbar,.sync,.no-print{display:none!important}
  body{background:#fff}
  .resp{break-inside:avoid;border-color:#999}
}

/* ============================================================
   LABOUR MARKET HUB — extra task types (all auto-marked)
   ============================================================ */
.fb{margin-top:14px;padding:12px 14px;border-left:4px solid var(--line);background:var(--line-soft);font-size:15px}
.fb p{margin:4px 0 0}
.fb.ok{border-color:var(--green);background:var(--green-pale)}
.fb.no{border-color:var(--red);background:var(--red-pale)}
.fb .eyebrow{display:block}
.why{font-size:14px;color:var(--ink-soft);margin:6px 0 0}
.why b{color:var(--ink)}
.ok-t{color:var(--green);font-weight:600}
.no-t{color:var(--red);font-weight:600}

/* quiz */
.q{padding:14px 0;border-top:1px solid var(--line-soft)}
.q:first-child{border-top:none;padding-top:0}
.q-stem{font-weight:600;margin:0 0 8px}
.q-opts{display:grid;gap:8px}
.q-opt{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:10px 12px;cursor:pointer;color:var(--ink)}
.q-opt:hover:not([disabled]){border-color:var(--teal);background:var(--teal-pale)}
.q-opt[disabled]{cursor:default}
.q-opt.ok{border-color:var(--green);background:var(--green-pale)}
.q-opt.no{border-color:var(--red);background:var(--red-pale)}
.q-opt.dim{opacity:.55}

/* sort (buttons) */
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.srow:first-child{border-top:none}
.srow .s-txt{flex:1 1 260px}

.dbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.drow.ok .dbtn.on{background:var(--green);border-color:var(--green)}
.drow.no .dbtn.on{background:var(--red);border-color:var(--red)}
.drow .why{flex-basis:100%;margin:0}

.seq-out{min-height:52px;border:1px dashed var(--line);padding:8px;display:grid;gap:6px;background:var(--card)}
.seq-out:empty::before{content:"Tap the steps below in order";color:var(--ink-soft);font-size:14px;padding:6px}

.seq-item{font:inherit;text-align:left;padding:9px 12px;border:1px solid var(--line);background:var(--paper);cursor:pointer;border-radius:2px;color:var(--ink)}

.seq-item .n{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-right:8px}
.seq-item.ok{border-color:var(--green);background:var(--green-pale)}
.seq-item.no{border-color:var(--red);background:var(--red-pale)}

.spot{padding:12px 0;border-top:1px solid var(--line-soft);line-height:2.1}
.spot:first-child{border-top:none}
.tok{font:inherit;background:none;border:none;padding:1px 2px;margin:0;cursor:pointer;color:var(--ink);border-radius:2px}
.tok:hover:not([disabled]){background:var(--amber-pale)}

.tok.no{background:var(--red-pale);text-decoration:line-through;color:var(--red)}
.tok.ok{background:var(--green-pale);color:var(--green);font-weight:600;text-decoration:line-through}

/* trim the fat */
.exq{background:var(--card);border:1px solid var(--line);padding:12px 14px;margin:0 0 12px}
.exq b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:4px}
.trim-s{display:block;width:100%;font:inherit;text-align:left;padding:10px 12px;margin:0 0 6px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;border-radius:2px;color:var(--ink)}
.trim-s.cut{text-decoration:line-through;color:var(--ink-soft);background:var(--line-soft)}

/* examiner */

.guide label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.guide li.ok label{color:var(--green)}
.guide li.no label{color:var(--red)}

.fill-text{line-height:2.2;background:var(--card);border:1px solid var(--line);padding:12px 14px}

.fill-text select.no{border-color:var(--red);background:var(--red-pale)}

.calc-f.no input{border-color:var(--red);background:var(--red-pale)}
.calc-f .why{grid-column:1/-1;margin:0}
.unit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft)}
.stepup{display:inline-block;background:#FFC000;color:#1A1A1A;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;margin-left:8px;vertical-align:middle}

.pct-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
@media (max-width:560px){
  .calc-f{grid-template-columns:1fr}
}
.progress{flex-wrap:wrap;row-gap:8px}

// Year 11 roll. Students pick their name from this list.
const ROLL = ["Angelyn","Bisman","Shun","Riley","Nathan","Tina","Serina","Cornelius","Solomon","Leo","Felix","Lisa"];

/* ============================================================================
   2. LESSON DATA

   Every task type marks itself. Types:
     match      pairs: [[term, meaning], ...]
     sort       buckets: [..], items: [{text, bucket, why}]
     quiz       qs: [{q, options:[..], answer:index, why}]   (instant feedback)
     seq        steps: [...in the correct order]

   Optional on any task: prompt, hint, why (shown when finished), table, stepup:true

const r1 = x => Math.round(x * 10) / 10;
const r2 = x => Math.round(x * 100) / 100;
const money = x => "$" + x.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

const LESSONS = [

/* =====================================================================
   L1 — The labour market: demand, supply and the minimum wage
   ===================================================================== */
{
  id:"L1", title:"The labour market", chapter:"Lesson 1 · Demand, supply & the minimum wage",
  intro:"Seven short tasks. Each one marks itself the moment you check it — read the feedback on anything you get wrong before you try again.",
  tasks:[
    { id:"t1", type:"match", title:"Match the term to its meaning",
      pairs:[
        ["Labour market","Where firms (buyers) and households (sellers) of labour come together"],
        ["Derived demand","Demand for labour depends on demand for the goods and services it produces"],
        ["Wage rate","The price of labour, usually per hour"],
        ["Labour market equilibrium","The wage where quantity of labour demanded equals quantity supplied"],
        ["Tight labour market","Demand for labour is greater than supply — a shortage, so wages tend to rise"],
        ["Weak labour market","Supply of labour is greater than demand — a surplus, so unemployment rises"],
        ["Human capital","The knowledge, skills and health that make workers productive"]
      ],
      why:"Firms **demand** labour and households **supply** it. Tight = shortage of workers; weak = surplus of workers."
    },
    { id:"t2", type:"sort", title:"Does it shift demand or supply?",
      prompt:"Decide whether each change shifts the **demand** for labour or the **supply** of labour.",
      buckets:["Demand for labour","Supply of labour"],
      items:[
        {text:"Consumers become more confident and spend more", bucket:"Demand for labour", why:"More spending → firms produce more → they need more workers. That is derived demand."},
        {text:"Workers become more productive after training", bucket:"Demand for labour", why:"Each worker now produces more output per hour, so hiring them is worth more to firms."},
        {text:"Net overseas migration increases", bucket:"Supply of labour", why:"More people of working age are available and willing to work."},
        {text:"Childcare becomes cheaper for families", bucket:"Supply of labour", why:"More parents can afford to take a job, so more people offer their labour."},
        {text:"The government cuts payroll tax for businesses", bucket:"Demand for labour", why:"Payroll tax is a non-wage labour cost. Cutting it makes each worker cheaper to employ."},
        {text:"Robots become much cheaper than before", bucket:"Demand for labour", why:"Capital is a substitute for labour. When it gets cheaper, firms demand less labour."},
        {text:"More baby boomers retire", bucket:"Supply of labour", why:"Retirees leave the labour force, so fewer people are offering their labour."},
        {text:"Remote work lets people work for city firms from regional towns", bucket:"Supply of labour", why:"Technology improves geographical mobility, so more people can offer their labour to those firms."}
      ],
      hint:"Ask: is this about **firms wanting** workers (demand) or **people offering** to work (supply)?"
    },
    { id:"t3", type:"direction", title:"Direction of travel",
      prompt:"For each scenario, decide what happens to each variable. Assume nothing else changes (ceteris paribus).",
      scenarios:[
        { text:"**A.** Strong growth in aggregate demand increases the demand for labour.",
          vars:[
            {name:"Equilibrium wage rate", answer:"up", why:"Demand shifts right → at the old wage there is a shortage → the wage is bid up."},
            {name:"Quantity of labour employed", answer:"up", why:"Firms hire more hours of labour at the new equilibrium."}
          ]},
        { text:"**B.** A big rise in skilled migration increases the supply of labour.",
          vars:[
            {name:"Equilibrium wage rate", answer:"down", why:"Supply shifts right → a surplus at the old wage → downward pressure on wages."},
            {name:"Quantity of labour employed", answer:"up", why:"At the lower wage, firms employ more hours of labour."}
          ]},
        { text:"**C.** The government sets a minimum wage **above** the equilibrium wage.",
          vars:[
            {name:"Quantity of labour supplied", answer:"up", why:"The higher wage attracts more people to offer their labour (movement along supply)."},
            {name:"Quantity of labour demanded", answer:"down", why:"Labour is dearer, so firms hire fewer hours (movement along demand)."},
            {name:"Unemployment", answer:"up", why:"Quantity supplied > quantity demanded = a surplus of labour = unemployment."}
          ]}
      ]
    },
    { id:"t4", type:"seq", title:"Sequence the chain",
      prompt:"Consumer confidence rises. Put the chain in order, from the cause to the effect on wages.",
      steps:[
        "Consumer confidence rises",
        "Households spend more — consumption (C) rises",
        "Aggregate demand (AD) increases",
        "Firms increase production to meet demand",
        "The derived demand for labour rises",
        "The demand curve for labour shifts right",
        "The wage rate and employment rise"
      ],
      why:"Every labour market chain goes through **AD → production → derived demand for labour**. Skipping the middle links is the most common way to lose marks."
    },
    { id:"t5", type:"quiz", title:"Minimum wage & productivity",
      qs:[
        { q:"The minimum wage is set **above** the equilibrium wage. What happens?",
          options:["A surplus of labour — unemployment","A shortage of labour","No effect at all","The market wage falls"],
          answer:0, why:"Above equilibrium, more people want to work (Qs rises) but firms want fewer hours (Qd falls). Qs − Qd is unemployment." },
        { q:"A minimum wage set **below** the equilibrium wage will…",
          options:["have no effect","cause unemployment","cause a shortage of workers","push the wage down"],
          answer:0, why:"The market already pays more than the floor, so the floor does not bind. A price floor only matters if it sits above equilibrium." },
        { q:"From 1 July 2026, the national minimum wage is…",
          options:["$26.44 an hour","$24.95 an hour","$33.05 an hour","$29.45 an hour"],
          answer:0, why:"The Fair Work Commission lifted it 6%, from $24.95 to $26.44 ($1,004.90 a week). $33.05 is the casual rate with the 25% loading." },
        { q:"Labour productivity rises across the economy. The most likely effect on the demand for labour is…",
          options:["It rises, because each worker produces more and is worth more to firms","It falls, because fewer workers are needed","No change, because productivity only affects supply","It rises, because more people want to work"],
          answer:0, why:"Higher productivity lowers unit labour costs and raises the value of each hour worked, so firms demand more labour. (In one firm it can mean fewer workers are needed — but across the economy higher productivity supports demand and wages.)" },
        { q:"Why is the demand for labour called a **derived** demand?",
          options:["It depends on the demand for the goods and services labour produces","It is derived from the supply of labour","It is set by the government","It depends on the number of unemployed people"],
          answer:0, why:"Firms do not want workers for their own sake — they want them to produce goods and services that consumers are buying." }
      ]
    },
    { id:"t6", type:"spot", title:"One word wrong",
      prompt:"Each sentence has **one** word that makes it wrong. Tap it. Your first tap counts.",
      items:[
        { text:"When the supply of labour is greater than the demand for labour, the labour market is *tight*.", fix:"weak", why:"Supply > demand is a **surplus** of labour — a weak (loose) labour market with rising unemployment." },
        { text:"The demand for labour is a derived demand because it depends on the demand for *capital*.", fix:"goods and services", why:"It depends on demand for the **goods and services** labour produces." },
        { text:"An increase in labour productivity will usually *decrease* the demand for labour.", fix:"increase", why:"More productive workers are worth more to firms, so demand for labour rises." },
        { text:"A minimum wage set above equilibrium creates a *shortage* of labour.", fix:"surplus", why:"Quantity supplied exceeds quantity demanded — a **surplus**, which is unemployment." },
        { text:"A rise in the wage rate causes a *shift* of the supply curve for labour.", fix:"movement along", why:"A change in the price (wage) moves us **along** the curve. Other factors shift it." }
      ]
    },
    { id:"t7", type:"quiz", title:"Two truths and a lie",
      qs:[
        { q:"Which statement is the **lie**?",
          options:[
            "The Fair Work Commission sets the national minimum wage each year.",
            "A casual on the minimum wage earns $33.05 an hour because of the 25% loading.",
            "A higher minimum wage always reduces unemployment because low-paid workers spend more."

          answer:2, why:"Extra spending by low-paid workers does lift AD, but if the minimum wage is set well above equilibrium it can **reduce** the hours firms want to hire. It is never “always”." }
      ]
    }
  ]
},

/* =====================================================================
   L2 — Key labour market indicators
   ===================================================================== */
{
  id:"L2", title:"Measuring the labour market", chapter:"Lesson 2 · Key labour market indicators",
  intro:"The calculation task uses **different numbers for every student**, so you can’t copy — but you can compare your working.",
  tasks:[
    { id:"t1", type:"match", title:"Match the ABS term to its meaning",
      pairs:[
        ["Working-age population","Everyone aged 15 and over"],
        ["Labour force","The employed plus the unemployed"],
        ["Employed","Worked at least 1 hour for pay in the survey week"],
        ["Unemployed","Did not work at all, actively looked for work in the past 4 weeks and could start"],
        ["Underemployed","Has a job, but wants and is available for more hours"],
        ["Hidden unemployed","Wants to work but has stopped looking, so is not in the labour force"],
        ["Participation rate","The labour force as a % of the working-age population"]
      ],
      why:"The unemployed must **not** have worked at all — even 1 hour of paid work makes you employed (and maybe underemployed)."
    },
    { id:"t2", type:"sort", title:"Classify each person",
      buckets:["Employed","Unemployed","Not in the labour force"],
      items:[
        {text:"Sophie lost her retail job last month and applied for three jobs this week", bucket:"Unemployed", why:"Not working, actively looking and available."},
        {text:"Liam works 2 hours a week at the family bakery but wants full-time work", bucket:"Employed", why:"Even 1 hour of work counts as employed. He is also **underemployed**."},
        {text:"Amira has finished uni and is actively looking for her first job", bucket:"Unemployed", why:"Not working, actively looking and available to start."},
        {text:"Jacob stopped looking for work three months ago after repeated rejections", bucket:"Not in the labour force", why:"He is not actively looking, so he is not counted as unemployed. He is **hidden unemployed**."},
        {text:"John is a full-time uni student who works at Coles every Saturday", bucket:"Employed", why:"He does paid work each week, so he is employed."},
        {text:"Joe, 45, has retired and does not want a job", bucket:"Not in the labour force", why:"Neither working nor looking."},
        {text:"Angela works one paid day a week in a deli while she looks for full-time work", bucket:"Employed", why:"She works, so she is employed (and underemployed). Looking for more work does not make her unemployed."},
        {text:"Matt is a stay-at-home dad and is not looking for work", bucket:"Not in the labour force", why:"Unpaid caring work is not counted as employment, and he is not looking."}
      ]
    },
    { id:"t3", type:"calc", title:"Calculate the key indicators",
      prompt:"Use the data for **your** economy. Give rates to **1 decimal place**. Enter numbers only (no % sign needed).",
      gen: function(rnd){
        const pk = (a,b) => r1(a + rnd() * (b - a));
        const ft = pk(8.0, 10.0), pt = pk(3.0, 4.2), u = pk(0.4, 0.8), ue = pk(0.5, 1.0), nilf = pk(5.5, 7.0);
        const lf = r1(ft + pt + u), wap = r1(lf + nilf);
        const pr = lf / wap * 100, ur = u / lf * 100, uer = ue / lf * 100;
        return {
          table:{ caption:"Your economy (millions of people)", head:["Category","Millions"],
            rows:[["Employed full-time", ft.toFixed(1)],["Employed part-time", pt.toFixed(1)],["Unemployed", u.toFixed(1)],
                  ["Underemployed (already counted in part-time)", ue.toFixed(1)],["Not in the labour force", nilf.toFixed(1)]] },
          fields:[
            {label:"Labour force", unit:"millions", answer:lf, working:`Employed + unemployed = ${ft.toFixed(1)} + ${pt.toFixed(1)} + ${u.toFixed(1)} = **${lf.toFixed(1)}m**. The underemployed are already inside part-time, so don’t add them again.`},
            {label:"Working-age population", unit:"millions", answer:wap, working:`Labour force + not in the labour force = ${lf.toFixed(1)} + ${nilf.toFixed(1)} = **${wap.toFixed(1)}m**`},
            {label:"Participation rate", unit:"%", answer:r1(pr), tol:0.11, working:`Labour force ÷ working-age population × 100 = ${lf.toFixed(1)} ÷ ${wap.toFixed(1)} × 100 = **${pr.toFixed(1)}%**`},
            {label:"Unemployment rate", unit:"%", answer:r1(ur), tol:0.11, working:`Unemployed ÷ **labour force** × 100 = ${u.toFixed(1)} ÷ ${lf.toFixed(1)} × 100 = **${ur.toFixed(1)}%** (not ÷ population!)`},
            {label:"Underemployment rate", unit:"%", answer:r1(uer), tol:0.11, working:`Underemployed ÷ labour force × 100 = ${ue.toFixed(1)} ÷ ${lf.toFixed(1)} × 100 = **${uer.toFixed(1)}%**`},
            {label:"Underutilisation rate", unit:"%", answer:r1(ur + uer), tol:0.16, working:`Unemployment rate + underemployment rate = ${ur.toFixed(1)} + ${uer.toFixed(1)} = **${(ur + uer).toFixed(1)}%**`}
          ]
        };
      },
      hint:"Every **rate** except participation is divided by the **labour force**, not the population."
    },
    { id:"t4", type:"fill", title:"Describe the trend (DUDDS)",
      prompt:"Complete the description of Australia’s unemployment trend using the data. Choose the option that earns the mark in each gap.",
      table:{ caption:"Australia’s unemployment rate (seasonally adjusted)", head:["Month","Unemployment rate"],
        rows:[["June 2020 (COVID peak)","7.4%"],["January 2023","3.5%"],["June 2026","4.4%"]],
        source:"ABS Labour Force, via CPAP Economics Update 4, August 2026" },
      text:"Between {{June 2020|*January 2023|June 2026}} and June 2026, Australia’s unemployment rate {{*rose|fell|stayed the same}} from {{*3.5%|7.4%|4.4%}} to {{*4.4%|3.5%|6.5%}}, an increase of {{*0.9 percentage points|0.9 per cent|25 per cent}}. This suggests the labour market has {{*eased (become less tight)|become tighter|collapsed}}.",
      why:"DUDDS = **Direction, Unit, Data, Dates, Significance**. Rates change by **percentage points**: 3.5% → 4.4% is +0.9 percentage points, not “0.9%”. Rising unemployment means spare capacity is growing, so the market is less tight."
    },
    { id:"t5", type:"direction", title:"What happens to the statistics?",
      scenarios:[
        { text:"**A.** 100,000 hidden unemployed people start actively looking for work, but none find a job yet.",
          vars:[
            {name:"Labour force", answer:"up", why:"They are now actively looking, so they join the labour force as unemployed."},
            {name:"Unemployment rate", answer:"up", why:"Unemployed rises by more (proportionally) than the labour force."},
            {name:"Participation rate", answer:"up", why:"Labour force rises while working-age population is unchanged."},
            {name:"Number employed", answer:"same", why:"Nobody has found a job yet."}
          ]},
        { text:"**B.** Discouraged unemployed workers give up and stop looking for work.",
          vars:[
            {name:"Unemployment rate", answer:"down", why:"They leave the labour force, so the unemployment rate falls — even though nobody got a job. This is why the unemployment rate can **understate** spare capacity."},
            {name:"Participation rate", answer:"down", why:"The labour force shrinks."}
          ]},
        { text:"**C.** A full-time worker has her hours cut from 38 to 20 a week. She wants more hours.",
          vars:[
            {name:"Unemployment rate", answer:"same", why:"She still has a job, so she is still employed."},
            {name:"Underemployment rate", answer:"up", why:"She is employed but wants more hours — now underemployed."},
            {name:"Underutilisation rate", answer:"up", why:"Underutilisation = unemployment rate + underemployment rate."}
          ]}
      ]
    },
    { id:"t6", type:"examiner", title:"Examiner for a day",
      question:"Country A has an unemployment rate of 14.3% and an underutilisation rate of 28.6%. Identify whether Country A’s labour market is ‘weak’ or ‘tight’. Justify your answer.",
      marks:3,
      response:"Country A’s labour market is weak because the unemployment rate is 14.3%, which is very high.",
      guide:[
        "Identifies the labour market as **weak** (1 mark)",
        "Uses the data — unemployment and/or underutilisation rate (1 mark)",
        "Explains that the **supply of labour is greater than the demand for labour** (a surplus) (1 mark)"
      ],
      earned:[true, true, false], answer:2,
      why:"The answer identifies ‘weak’ and uses data, but never explains **why** high unemployment means weak: supply of labour exceeds demand. That link is worth a whole mark."
    },
    { id:"t7", type:"quiz", title:"Exit ticket",
      qs:[
        { q:"Employed 9 million, unemployed 1 million, people aged 15+ 15 million. The labour force is…",
          options:["10 million","9 million","15 million","Cannot be calculated"], answer:0,
          why:"Labour force = employed + unemployed = 9 + 1 = 10 million." },
        { q:"Using the same data, if the underemployment rate is 7.0%, the underutilisation rate is closest to…",
          options:["17%","7%","10%","20%"], answer:0,
          why:"Unemployment rate = 1 ÷ 10 × 100 = 10%. Underutilisation = 10% + 7% = 17%." },
        { q:"Which person is in the labour force?",
          options:["Sarah, who works part-time at IGA and is looking for full-time work","Jim, a retiree on the age pension","Ella, who looks after her children full-time","Jack, who is taking a year-long career break"], answer:0,
          why:"Sarah is employed (and underemployed). The others are neither working nor looking." },
        { q:"Hidden unemployment means the official unemployment rate…",
          options:["understates the true amount of spare labour","overstates the true amount of spare labour","is exactly right","includes the underemployed"], answer:0,
          why:"The hidden unemployed want work but aren’t counted, so the true level of unused labour is higher than the unemployment rate shows." }
      ]
    }
  ]
},

/* =====================================================================
   L3 — Causes and types of unemployment
   ===================================================================== */
{
