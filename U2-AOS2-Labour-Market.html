        { t:"Finland is a country in northern Europe.", keep:false, why:"Irrelevant. The Finnish trial is useful evidence — the country’s location is not." },
        { t:"On balance, retraining targets structural unemployment more directly, so a UBI on its own is a weaker response.", keep:true, why:"“Evaluate” needs a judgement. This is it." }
      ]
    },
    { id:"t7", type:"quiz", title:"Two truths and a lie",
      qs:[
        { q:"Which statement is the **lie**?",
          options:[
            "Australia currently has a universal basic income.",
            "JobSeeker is means-tested and has mutual obligations such as job searching.",
            "Stimulating AD is the right response to cyclical unemployment."
          ],
          answer:0, why:"Australia does **not** have a UBI. Our welfare is targeted — payments go to people who meet conditions." }
      ]
    }
  ]
}
];

/* ============================================================================
   3. ENGINE — no need to edit below here
   Every task type is marked by the page itself. Nothing waits for a teacher.
   ============================================================================ */

const KEY = "labour-" + HUB;
// Must match the Worker's safe() EXACTLY (same rule as the trade hub).
const slugify = s => String(s).trim().toLowerCase().replace(/[^a-z0-9_]+/g,"_").slice(0,60);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nl2br = s => esc(s).replace(/\n/g,"<br>");
// **bold** support inside content strings
const rich = s => nl2br(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const stamp = () => {
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const lessonById = id => LESSONS.find(l => l.id === id);
const taskById = (l, tid) => l.tasks.find(t => t.id === tid);
const liveLessons = () => LESSONS.filter(l => !l.draft);

/* ---- seeded randomness: stable for one student, different between students ---- */
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function seededShuffle(arr, seed){
  const rnd = mulberry32(hashStr(seed)); const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* shuffle that never returns the authored order (so nothing is pre-solved) */
function shuffleNotSame(arr, seed){
  for(let k=0;k<10;k++){ const s = seededShuffle(arr, seed+":"+k); if(s.some((x,i)=>x!==arr[i])) return s; }
  return arr.slice().reverse();
}
const taskSeed = (lid, tid) => lid + ":" + tid + ":" + (S && S.slug ? S.slug : "anon");

function rollClashes(){
  const seen = {}, bad = [];
  ROLL.forEach(n => { const k = slugify(n); if(seen[k]) bad.push([seen[k], n, k]); else seen[k] = n; });
  return bad;
}

let S = load();
let view = { page: S.name ? "hub" : "name", lesson:null, teacher:{ data:null, lesson:null, error:null } };

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const p = JSON.parse(raw); p.work = p.work || {}; return p; } }catch(e){}
  return { name:null, slug:null, work:{} };
}
function save(){ if(S.__isPreview) return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function work(lid, tid){
  S.work[lid] = S.work[lid] || {};
  S.work[lid][tid] = S.work[lid][tid] || {};
  return S.work[lid][tid];
}
function taskDone(lid, tid){ return !!(S.work[lid] && S.work[lid][tid] && S.work[lid][tid].done); }
function lessonDone(l){ return l.tasks.filter(t => taskDone(l.id, t.id)).length; }

let toastT = null;
function toast(msg, bad){
  const el = document.getElementById("sync");
  el.textContent = msg; el.className = "sync show" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(() => { el.className = "sync"; }, bad ? 5000 : 1800);
}

/* ---- scoring: the first attempt is the number that means something ---- */
function recordAttempt(w, correct, total){
  w.attempts = (w.attempts || 0) + 1;
  if(w.attempts === 1) w.first = { correct, total };
  w.latest = { correct, total };
}
function finishIfPerfect(l, t, w){
  if(w.latest && w.latest.correct === w.latest.total){ w.done = true; w.solved = true; if(!w.at) w.at = stamp(); }
  save(); sync(l.id); rerender(l.id, t.id);
}
function reveal(lid, tid){
  const l = lessonById(lid), t = taskById(l, tid), w = work(lid, tid);
  w.revealed = true; w.done = true; if(!w.at) w.at = stamp();
  save(); sync(lid); rerender(lid, tid);
}
function retry(lid, tid){
  const w = work(lid, tid); w.checked = false; save(); rerender(lid, tid);
}

/* ---- sync: always POST the COMPLETE lesson record, never a delta ---- */
function sync(lid){
  if(S.__isPreview) return;
  const l = lessonById(lid); if(!l) return;
  const tasks = {}, auto = {};
  l.tasks.forEach(t => {
    const w = (S.work[lid] || {})[t.id] || {};
    tasks[t.id] = !!w.done;
    if(w.first){
      auto[t.id] = { title:t.title, type:t.type, firstCorrect:w.first.correct, firstTotal:w.first.total,
                     attempts:w.attempts||0, solved:!!w.solved, revealed:!!w.revealed, at:w.at||"" };
    }
  });
  const done = l.tasks.filter(t => tasks[t.id]).length;
  const ids = Object.keys(auto);
  const firstCorrect = ids.reduce((s,id) => s + auto[id].firstCorrect, 0);
  const firstTotal = ids.reduce((s,id) => s + auto[id].firstTotal, 0);
  if(!CONNECTED){ toast("Saved on this device"); return; }
  fetch(WORKER_URL, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      name:S.name, slug:S.slug, hub:HUB, lesson:lid, written:{}, auto,
      progress:{ done, total:l.tasks.length, complete: done === l.tasks.length, tasks,
                 firstCorrect, firstTotal, autoTasks:l.tasks.length, writtenTasks:0, writtenSubmitted:0, updated:stamp() }
    })
  }).then(r => { if(!r.ok) throw new Error(r.status); toast("Saved"); })
    .catch(() => toast("Saved on this device only — no connection", true));
}

/* ============================================================================
   4. RENDER
   ============================================================================ */
function render(){
  const who = document.getElementById("who");
  who.innerHTML = S.name
    ? `<span>${esc(S.name)}</span> <button class="linkish" onclick="switchUser()">Not you?</button>`
    : `<button class="linkish" onclick="goTeacher()">Teacher</button>`;
  const app = document.getElementById("app");
  if(view.page === "name") app.innerHTML = viewName();
  else if(view.page === "hub") app.innerHTML = viewHub();
  else if(view.page === "lesson") app.innerHTML = viewLesson(view.lesson);
  else if(view.page === "teacher") app.innerHTML = viewTeacher();
  window.scrollTo(0,0);
}
function rerender(lid, tid){
  const l = lessonById(lid); const i = l.tasks.findIndex(t => t.id === tid);
  const el = document.getElementById("task-" + lid + "-" + tid);
  if(el){ el.outerHTML = renderTask(l, l.tasks[i], i); }
  const pr = document.getElementById("lesson-progress");
  if(pr) pr.outerHTML = progressLine(l);
}

function viewName(){
  const bad = rollClashes();
  return `
  <div style="padding:56px 0 0">
    ${bad.length ? `<div class="err"><b>Two names on the roll share a storage key.</b>${bad.map(b => `<br>“${esc(b[0])}” and “${esc(b[1])}” both save as <span class="mono">${esc(b[2])}</span>.`).join("")}</div>` : ``}
    <span class="eyebrow">Lesson tasks</span>
    <h1 style="font-size:38px;letter-spacing:-.02em;margin:8px 0 10px">Who are you?</h1>
    <p style="color:var(--ink-soft);max-width:46ch;margin:0">Tap your name. You will only be asked once on this device.</p>
    <div class="roll">${ROLL.map((n,i) => `<button onclick="pick(${i})">${esc(n)}</button>`).join("")}</div>
    <p style="margin-top:36px">
      <button class="linkish" onclick="goTeacher()">Teacher view</button> &nbsp;·&nbsp;
      <button class="linkish" onclick="previewLessons()">Preview lessons — nothing is saved</button>
    </p>
  </div>`;
}
function pick(i){ const n = ROLL[i]; S.name = n; S.slug = slugify(n); save(); view.page = "hub"; render(); }
function switchUser(){
  if(S.__isPreview){ S = load(); view.page = S.name ? "hub" : "name"; render(); return; }
  // A different student on a shared device must not inherit the last student's answers.
  // Their work is already on the Worker, so clearing the device copy loses nothing.
  S = { name:null, slug:null, work:{} }; save(); view.page = "name"; render();
}
function previewLessons(){ S = { name:"Preview (teacher)", slug:"__preview__", work:{}, __isPreview:true }; view.page = "hub"; render(); }

function viewHub(){
  const live = liveLessons();
  const totalTasks = live.reduce((s,l) => s + l.tasks.length, 0);
  const doneTasks = live.reduce((s,l) => s + lessonDone(l), 0);
  const finished = live.filter(l => lessonDone(l) === l.tasks.length && l.tasks.length).length;
  const pct = totalTasks ? Math.round((doneTasks/totalTasks)*100) : 0;
  const accents = ["acc1","acc2","acc3","acc4","acc5","acc6","acc7","acc8"];
  return `
  <div style="padding:28px 0 0">
    ${S.__isPreview ? `<div class="box box-hint" style="margin-top:0"><span class="eyebrow">Preview mode</span>
      <p>Nothing you click here is saved or sent anywhere. <button class="linkish" onclick="switchUser()">Exit preview</button></p></div>` : ``}
    <span class="eyebrow">Unit 2 · Area of Study 2</span>
    <div class="hero" style="--pct:${pct}">
      <span class="hero-eyebrow">The changing labour market</span>
      <div class="hero-title">${S.name ? `Welcome back, ${esc(S.name)}` : "Lesson tasks"}</div>
      <p class="hero-sub">Do each lesson’s tasks after class. Every task marks itself and explains the answer — read the feedback, it is the point.</p>
      <div class="hero-stats">
        <div class="hero-ring"><span>${pct}%</span></div>
        <div>
          <div class="hero-statline"><b>${finished}</b> of <b>${live.length}</b> lessons cleared</div>
          <div class="hero-statline" style="opacity:.85">${doneTasks} of ${totalTasks} tasks done${CONNECTED ? `` : ` · saving on this device only`}</div>
        </div>
      </div>
    </div>
    <div class="card-grid">
      ${live.map((l,i) => {
        const d = lessonDone(l), tot = l.tasks.length, full = d === tot && tot > 0;
        const acc = accents[i % accents.length];
        return `<button class="lcard" style="--acc:var(--${acc});--acc-pale:var(--${acc}-pale)" onclick="openLesson('${l.id}')">
          <div class="lcard-top"><span class="lcard-num">${String(i+1).padStart(2,"0")}</span>
            <span class="pill ${full ? "pill-done" : (d ? "pill-progress" : "pill-todo")}">${full ? "Cleared" : (d ? `${d} / ${tot} in progress` : "Not started")}</span></div>
          <div class="lcard-title">${esc(l.title)}</div>
          <div class="lcard-chap">${esc(l.chapter)}</div>
          <div class="lcard-foot"><span class="lcard-pips">${l.tasks.map(t => `<span class="lcard-pip ${taskDone(l.id,t.id)?"on":""}"></span>`).join("")}</span></div>
        </button>`;
      }).join("")}
    </div>
  </div>`;
}
function openLesson(id){
  view.page = "lesson"; view.lesson = id; render();
  if(CONNECTED && S.work[id] && Object.keys(S.work[id]).length) sync(id);
}
function goHub(){ view.page = "hub"; render(); }

function progressLine(l){
  const d = lessonDone(l), tot = l.tasks.length;
  return `<div class="progress" id="lesson-progress">
    <span class="pips">${l.tasks.map(t => `<span class="pip ${taskDone(l.id,t.id)?"on":""}"></span>`).join("")}</span>
    <span>${d} of ${tot} tasks done</span>${d===tot ? `<span class="stamp land" style="margin-left:6px">Cleared</span>` : ``}</div>`;
}
function viewLesson(id){
  const l = lessonById(id);
  return `
  <div class="lesson-head">
    <button class="linkish" onclick="goHub()">← All lessons</button>
    <span class="eyebrow" style="display:block;margin-top:14px">${esc(l.chapter)}</span>
    <h1>${esc(l.title)}</h1>
    ${progressLine(l)}
  </div>
  ${l.intro ? box("hint","Before you start", l.intro) : ``}
  ${l.tasks.map((t,i) => renderTask(l, t, i)).join("")}
  <div style="margin-top:32px"><button class="btn btn-ghost" onclick="goHub()">Back to all lessons</button></div>`;
}
function box(kind, label, text){ return `<div class="box box-${kind}"><span class="eyebrow">${label}</span><p>${rich(text)}</p></div>`; }

function taskShell(l, t, i, body){
  const on = taskDone(l.id, t.id);
  return `
  <section class="task" id="task-${l.id}-${t.id}">
    <div class="task-head">
      <span class="task-n ${on?"on":""}">${on ? "✓" : i+1}</span>
      <span class="task-title">${esc(t.title)}${t.stepup ? `<span class="stepup">Year 12 step-up</span>` : ``}</span>
      ${t.kind ? `<span class="task-marks">${esc(t.kind)}</span>` : ``}
    </div>
    <div class="task-body">
      ${t.prompt ? `<p class="prompt">${rich(t.prompt)}</p>` : ``}
      ${t.table ? dataTable(t.table) : ``}
      ${t.hint ? box("hint","Economist’s hint", t.hint) : ``}
      ${body}
    </div>
  </section>`;
}
function dataTable(tb){
  return `<div class="data-table">${tb.caption ? `<div class="dt-cap">${esc(tb.caption)}</div>` : ``}
    <table><thead><tr>${tb.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${tb.rows.map(r => `<tr>${r.map((c,j) => `<td class="${j?"dt-num":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    ${tb.source ? `<div class="dt-src">${esc(tb.source)}</div>` : ``}</div>`;
}

/* Shared footer for every check-style task */
function checkFooter(l, t, w, total, label){
  if(w.done){
    const f = w.first ? `First try: ${w.first.correct}/${w.first.total}` : "";
    return `<div class="fb ok"><span class="eyebrow">${w.revealed ? "Answers shown" : "Task complete"}</span>
      ${t.why ? `<p>${rich(t.why)}</p>` : ``}<div class="score-line">${f}</div></div>`;
  }
  if(w.checked){
    const c = w.latest ? w.latest.correct : 0;
    return `<div class="fb no"><span class="eyebrow">${c} of ${total} correct</span>
      <p>The ones marked red are wrong. Read the feedback, then fix them and check again.</p>
      <div class="actions"><button class="btn" onclick="retry('${l.id}','${t.id}')">Try again</button>
      ${w.attempts >= 2 ? `<button class="btn btn-ghost" onclick="reveal('${l.id}','${t.id}')">Show me the answers</button>` : ``}</div></div>`;
  }
  return `<div class="actions"><button class="btn" onclick="checkTask('${l.id}','${t.id}')">${label || "Check my answers"}</button></div>`;
}
const showMarks = w => w.checked || w.done;

function renderTask(l, t, i){
  const R = { match:renderMatch, sort:renderSort, quiz:renderQuiz, seq:renderSeq, calc:renderCalc,
              spot:renderSpot, trim:renderTrim, examiner:renderExaminer, fill:renderFill, direction:renderDirection };
  return R[t.type] ? taskShell(l, t, i, R[t.type](l, t)) : "";
}
function checkTask(lid, tid){
  const l = lessonById(lid), t = taskById(l, tid), w = work(lid, tid);
  const C = { match:checkMatch, sort:checkSort, seq:checkSeq, calc:checkCalc, trim:checkTrim,
              examiner:checkExaminer, fill:checkFill, direction:checkDirection };
  const res = C[t.type](l, t, w);
  if(res.incomplete){ toast(res.incomplete, true); return; }
  w.checked = true; recordAttempt(w, res.correct, res.total); finishIfPerfect(l, t, w);
}

/* ---- MATCH: term -> definition dropdowns ---- */
function renderMatch(l, t){
  const w = work(l.id, t.id); w.picks = w.picks || {};
  const defs = seededShuffle(t.pairs.map(p => p[1]), taskSeed(l.id,t.id));
  const marked = showMarks(w);
  return `<div class="pairs">${t.pairs.map((p, k) => {
    const v = w.revealed ? p[1] : (w.picks[k] || "");
    const cls = marked ? (v === p[1] ? "ok" : "no") : "";
    return `<div class="pair ${cls}"><span class="pair-term">${esc(p[0])}</span>
      <select ${w.done || w.checked ? "disabled" : ""} onchange="setPick('${l.id}','${t.id}',${k},this.value)">
        <option value="">Choose…</option>${defs.map(d => `<option ${d===v?"selected":""} value="${esc(d)}">${esc(d)}</option>`).join("")}
      </select></div>`;
  }).join("")}</div>${checkFooter(l, t, w, t.pairs.length)}`;
}
function setPick(lid, tid, k, v){ const w = work(lid, tid); w.picks = w.picks || {}; w.picks[k] = v; save(); }
function checkMatch(l, t, w){
  if(t.pairs.some((p,k) => !(w.picks||{})[k])) return { incomplete:"Choose a meaning for every term first." };
  return { correct: t.pairs.filter((p,k) => w.picks[k] === p[1]).length, total: t.pairs.length };
}

/* ---- SORT: put each item in a bucket ---- */
function renderSort(l, t){
  const w = work(l.id, t.id); w.picks = w.picks || {};
  const order = seededShuffle(t.items.map((_, k) => k), taskSeed(l.id,t.id));
  const marked = showMarks(w);
  return `<div class="sorts">${order.map(k => {
    const it = t.items[k]; const v = w.revealed ? it.bucket : w.picks[k];
    const cls = marked ? (v === it.bucket ? "ok" : "no") : "";
    return `<div class="srow ${cls}"><span class="s-txt">${rich(it.text)}</span>
      <span class="s-btns">${t.buckets.map((b, bi) => `<button class="sbtn ${v===b?"on":""}" ${w.done||w.checked?"disabled":""}
        onclick="sortPick('${l.id}','${t.id}',${k},${bi})">${esc(b)}</button>`).join("")}</span>
      ${marked && it.why ? `<p class="why">${v===it.bucket ? `<span class="ok-t">✓</span>` : `<span class="no-t">✗</span>`} ${rich(it.why)}</p>` : ``}
    </div>`;
  }).join("")}</div>${checkFooter(l, t, w, t.items.length)}`;
}
function sortPick(lid, tid, k, bi){
  const l = lessonById(lid), t = taskById(l, tid), w = work(lid, tid);
  w.picks = w.picks || {}; w.picks[k] = t.buckets[bi]; save(); rerender(lid, tid);
}
function checkSort(l, t, w){
  if(t.items.some((_,k) => !(w.picks||{})[k])) return { incomplete:"Sort every item first." };
  return { correct: t.items.filter((it,k) => w.picks[k] === it.bucket).length, total: t.items.length };
}

/* ---- QUIZ: instant feedback per question (first click counts) ---- */
function renderQuiz(l, t){
  const w = work(l.id, t.id); w.ans = w.ans || {};
  return `<div>${t.qs.map((q, qi) => {
    const idx = q.options.map((_, k) => k);
    const order = q.options.length <= 2 ? idx : seededShuffle(idx, taskSeed(l.id,t.id)+":"+qi);
    const a = w.ans[qi];
    return `<div class="q"><p class="q-stem">${t.qs.length > 1 ? `${qi+1}. ` : ``}${rich(q.q)}</p>
      <div class="q-opts">${order.map(k => {
        let cls = "";
        if(a !== undefined){ cls = k === q.answer ? "ok" : (k === a ? "no" : "dim"); }
        return `<button class="q-opt ${cls}" ${a!==undefined?"disabled":""} onclick="quizPick('${l.id}','${t.id}',${qi},${k})">${rich(q.options[k])}</button>`;
      }).join("")}</div>
      ${a !== undefined ? `<div class="fb ${a===q.answer?"ok":"no"}"><span class="eyebrow">${a===q.answer?"Correct":"Not quite — the green one is right"}</span><p>${rich(q.why)}</p></div>` : ``}
    </div>`;
  }).join("")}
  ${w.done ? `<div class="score-line">Score: ${w.first.correct}/${w.first.total}</div>` : ``}</div>`;
}
function quizPick(lid, tid, qi, k){
  const l = lessonById(lid), t = taskById(l, tid), w = work(lid, tid); w.ans = w.ans || {};
  if(w.ans[qi] !== undefined) return;
  w.ans[qi] = k;
  if(Object.keys(w.ans).length === t.qs.length){
    const c = t.qs.filter((q, i) => w.ans[i] === q.answer).length;
    w.attempts = 1; w.first = { correct:c, total:t.qs.length }; w.latest = w.first;
    w.done = true; w.solved = c === t.qs.length; w.at = stamp(); sync(lid);
  }
  save(); rerender(lid, tid);
}

/* ---- SEQ: tap steps into the right order ---- */
function renderSeq(l, t){
  const w = work(l.id, t.id); w.order = w.order || [];
  const pool = shuffleNotSame(t.steps.map((_, k) => k), taskSeed(l.id,t.id)).filter(k => w.order.indexOf(k) === -1);
  const marked = showMarks(w);
  const shown = w.revealed ? t.steps.map((_,k) => k) : w.order;
  return `<div class="seq-out">${shown.map((k, pos) => {
      const cls = marked ? (k === pos ? "ok" : "no") : "";
      return `<button class="seq-item ${cls}" ${w.done||w.checked?"disabled":""} onclick="seqRemove('${l.id}','${t.id}',${pos})"><span class="n">${pos+1}</span>${rich(t.steps[k])}</button>`;
    }).join("")}</div>
    ${w.done || w.checked ? `` : `<div class="seq-pool">${pool.map(k => `<button class="seq-item" onclick="seqAdd('${l.id}','${t.id}',${k})">${rich(t.steps[k])}</button>`).join("")}</div>
    ${w.order.length ? `<p class="why">Tap a step in the box to send it back.</p>` : ``}`}
    ${checkFooter(l, t, w, t.steps.length)}`;
}
function seqAdd(lid, tid, k){ const w = work(lid, tid); w.order = w.order || []; w.order.push(k); save(); rerender(lid, tid); }
function seqRemove(lid, tid, pos){ const w = work(lid, tid); w.order.splice(pos, 1); save(); rerender(lid, tid); }
function checkSeq(l, t, w){
  if((w.order||[]).length !== t.steps.length) return { incomplete:"Put every step in the chain first." };
  return { correct: w.order.filter((k, pos) => k === pos).length, total: t.steps.length };
}

/* ---- CALC: numbers generated per student ---- */
function calcData(l, t){ return t.gen(mulberry32(hashStr(taskSeed(l.id, t.id)))); }
function renderCalc(l, t){
  const w = work(l.id, t.id); w.vals = w.vals || {};
  const d = calcData(l, t); const marked = showMarks(w);
  return `${dataTable(d.table)}
    <div>${d.fields.map((f, k) => {
      const v = w.revealed ? String(f.answer) : (w.vals[k] || "");
      const ok = marked && calcOk(v, f);
      return `<div class="calc-f ${marked ? (ok ? "ok" : "no") : ""}">
        <label for="c-${l.id}-${t.id}-${k}">${rich(f.label)} <span class="unit">${esc(f.unit||"")}</span></label>
        <input type="text" inputmode="decimal" id="c-${l.id}-${t.id}-${k}" value="${esc(v)}" ${w.done||w.checked?"disabled":""}
          oninput="calcIn('${l.id}','${t.id}',${k},this.value)">
        ${marked ? `<p class="why">${ok ? `<span class="ok-t">✓</span>` : `<span class="no-t">✗</span>`} ${rich(f.working)}</p>` : ``}
      </div>`;
    }).join("")}</div>
    ${t.note ? `<p class="why">${rich(t.note)}</p>` : ``}
    ${checkFooter(l, t, w, d.fields.length)}`;
}
function calcIn(lid, tid, k, v){ const w = work(lid, tid); w.vals = w.vals || {}; w.vals[k] = v; save(); }
function calcOk(v, f){
  const n = parseFloat(String(v).replace(/[$,%\s]/g,"").replace(/m$/i,""));
  if(isNaN(n)) return false;
  return Math.abs(n - f.answer) <= (f.tol !== undefined ? f.tol : 0.051);
}
function checkCalc(l, t, w){
  const d = calcData(l, t);
  if(d.fields.some((f,k) => !String((w.vals||{})[k]||"").trim())) return { incomplete:"Fill in every answer first." };
  return { correct: d.fields.filter((f,k) => calcOk(w.vals[k], f)).length, total: d.fields.length };
}

/* ---- SPOT: one word wrong (first click on each sentence counts) ---- */
function spotTokens(text){ return text.split(/(\s+)/); }
function renderSpot(l, t){
  const w = work(l.id, t.id); w.clicks = w.clicks || {};
  return `<div>${t.items.map((it, ii) => {
    const clicks = w.clicks[ii] || []; const toks = spotTokens(it.text);
    const wrongIdx = toks.findIndex(x => /^\*.+\*[.,;:!?]?$/.test(x));
    const found = clicks.indexOf(wrongIdx) > -1 || (w.revealed);
    const giveUp = !found && clicks.length >= 3;
    return `<div class="spot">${toks.map((tok, ti) => {
      if(/^\s+$/.test(tok)) return tok;
      const clean = tok.replace(/\*/g,"");
      const isWrong = ti === wrongIdx;
      let cls = "";
      if(clicks.indexOf(ti) > -1) cls = isWrong ? "ok" : "no";
      if(isWrong && (found || giveUp)) cls = "ok";
      return `<button class="tok ${cls}" ${found||giveUp?"disabled":""} onclick="spotClick('${l.id}','${t.id}',${ii},${ti})">${esc(clean)}</button>${isWrong && (found||giveUp) ? `<span class="fix">→ ${esc(it.fix)}</span>` : ``}`;
    }).join("")}
    ${found || giveUp ? `<div class="fb ${clicks[0]===wrongIdx?"ok":"no"}"><span class="eyebrow">${clicks[0]===wrongIdx?"Spotted first time":"The wrong word is shown in green"}</span><p>${rich(it.why)}</p></div>` : ``}
    </div>`;
  }).join("")}
  ${w.done ? `<div class="score-line">First try: ${w.first.correct}/${w.first.total}</div>` : ``}</div>`;
}
function spotClick(lid, tid, ii, ti){
  const l = lessonById(lid), t = taskById(l, tid), w = work(lid, tid); w.clicks = w.clicks || {};
  const c = w.clicks[ii] = w.clicks[ii] || [];
  if(c.indexOf(ti) === -1) c.push(ti);
  const resolved = t.items.every((it, k) => {
    const toks = spotTokens(it.text); const wi = toks.findIndex(x => /^\*.+\*[.,;:!?]?$/.test(x));
    const cl = w.clicks[k] || []; return cl.indexOf(wi) > -1 || cl.length >= 3;
  });
  if(resolved){
    const correct = t.items.filter((it, k) => {
      const toks = spotTokens(it.text); const wi = toks.findIndex(x => /^\*.+\*[.,;:!?]?$/.test(x));
      return (w.clicks[k] || [])[0] === wi;
    }).length;
    w.attempts = 1; w.first = { correct, total:t.items.length }; w.latest = w.first;
    w.done = true; w.solved = correct === t.items.length; w.at = stamp(); sync(lid);
  }
  save(); rerender(lid, tid);
}

/* ---- TRIM: cut the sentences that earn no marks ---- */
function renderTrim(l, t){
  const w = work(l.id, t.id); w.cut = w.cut || {};
  const marked = showMarks(w);
  return `<div class="exq"><b>Question</b>${rich(t.question)}</div>
    <p class="why" style="margin:0 0 8px">Tap a sentence to cut it. Keep only the sentences that earn marks.</p>
    ${t.sentences.map((s, k) => {
      const cut = w.revealed ? !s.keep : !!w.cut[k];
      const right = cut === !s.keep;
      return `<button class="trim-s ${cut?"cut":""} ${marked ? (right?"ok":"no") : ""}" ${w.done||w.checked?"disabled":""} onclick="trimToggle('${l.id}','${t.id}',${k})">${rich(s.t)}</button>
        ${marked ? `<p class="why" style="margin:-2px 0 10px">${right ? `<span class="ok-t">✓</span>` : `<span class="no-t">✗</span>`} <b>${s.keep ? "Keep" : "Cut"}:</b> ${rich(s.why)}</p>` : ``}`;
    }).join("")}
    ${checkFooter(l, t, w, t.sentences.length)}`;
}
function trimToggle(lid, tid, k){ const w = work(lid, tid); w.cut = w.cut || {}; w.cut[k] = !w.cut[k]; save(); rerender(lid, tid); }
function checkTrim(l, t, w){
  return { correct: t.sentences.filter((s,k) => (!!(w.cut||{})[k]) === !s.keep).length, total: t.sentences.length };
}

/* ---- EXAMINER: tick what the answer earns, then give the mark ---- */
function renderExaminer(l, t){
  const w = work(l.id, t.id); w.crit = w.crit || {};
  const marked = showMarks(w);
  const mark = w.revealed ? t.answer : w.mark;
  return `<div class="exq"><b>Question · ${t.marks} marks</b>${rich(t.question)}</div>
    <span class="eyebrow">Student response</span>
    <div class="student-resp">${rich(t.response)}</div>
    <span class="eyebrow">Marking guide — tick each point the response earns</span>
    <ul class="guide">${t.guide.map((g, k) => {
      const on = w.revealed ? t.earned[k] : !!w.crit[k];
      return `<li class="${marked ? (on === t.earned[k] ? "ok" : "no") : ""}"><label>
        <input type="checkbox" ${on?"checked":""} ${w.done||w.checked?"disabled":""} onchange="examCrit('${l.id}','${t.id}',${k},this.checked)">
        <span>${rich(g)}</span></label></li>`;
    }).join("")}</ul>
    <span class="eyebrow" style="display:block;margin-top:12px">Your mark</span>
    <div class="marks-row">${Array.from({length:t.marks+1},(_,m) => `<button class="dbtn ${mark===m?"on":""}" ${w.done||w.checked?"disabled":""}
       onclick="examMark('${l.id}','${t.id}',${m})">${m}</button>`).join("")}
       ${marked ? `<span class="${mark===t.answer?"ok-t":"no-t"}" style="align-self:center">${mark===t.answer?"✓ Right mark":"✗ Not the right mark"}</span>` : ``}</div>
    ${checkFooter(l, t, w, t.guide.length + 1, "Submit my marking")}`;
}
function examCrit(lid, tid, k, v){ const w = work(lid, tid); w.crit = w.crit || {}; w.crit[k] = v; save(); }
function examMark(lid, tid, m){ const w = work(lid, tid); w.mark = m; save(); rerender(lid, tid); }
function checkExaminer(l, t, w){
  if(w.mark === undefined) return { incomplete:"Choose a mark first." };
  const c = t.guide.filter((g,k) => (!!(w.crit||{})[k]) === t.earned[k]).length + (w.mark === t.answer ? 1 : 0);
  return { correct:c, total:t.guide.length + 1 };
}

/* ---- FILL: dropdown gaps in a paragraph ({{wrong|*right|wrong}}) ---- */
function fillParts(text){
  const parts = []; const re = /\{\{(.+?)\}\}/g; let last = 0, m;
  while((m = re.exec(text))){ parts.push(text.slice(last, m.index)); parts.push(m[1].split("|")); last = re.lastIndex; }
  parts.push(text.slice(last)); return parts;
}
function renderFill(l, t){
  const w = work(l.id, t.id); w.picks = w.picks || {};
  const marked = showMarks(w); let g = -1;
  const html = fillParts(t.text).map(p => {
    if(typeof p === "string") return rich(p);
    g++; const opts = p.map(o => o.replace(/^\*/,"")); const right = opts[p.findIndex(o => o.startsWith("*"))];
    const shuffled = seededShuffle(opts, taskSeed(l.id,t.id)+":"+g);
    const v = w.revealed ? right : (w.picks[g] || "");
    return `<select class="${marked ? (v===right?"ok":"no") : ""}" ${w.done||w.checked?"disabled":""} onchange="setPick('${l.id}','${t.id}',${g},this.value)">
      <option value="">…</option>${shuffled.map(o => `<option ${o===v?"selected":""} value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`;
  }).join("");
  return `<div class="fill-text">${html}</div>${checkFooter(l, t, w, g+1)}`;
}
function checkFill(l, t, w){
  const gaps = fillParts(t.text).filter(p => typeof p !== "string");
  if(gaps.some((p,k) => !(w.picks||{})[k])) return { incomplete:"Fill every gap first." };
  return { correct: gaps.filter((p,k) => w.picks[k] === p.find(o => o.startsWith("*")).slice(1)).length, total: gaps.length };
}

/* ---- DIRECTION: up / down / no change for each variable ---- */
const DIRS = [["up","↑"],["down","↓"],["same","–"]];
function renderDirection(l, t){
  const w = work(l.id, t.id); w.picks = w.picks || {};
  const marked = showMarks(w); let n = 0;
  const html = t.scenarios.map((sc, si) => `<div class="scen"><p class="scen-h">${rich(sc.text)}</p>
    ${sc.vars.map((v, vi) => {
      const key = si + "_" + vi; n++;
      const val = w.revealed ? v.answer : w.picks[key];
      return `<div class="drow ${marked ? (val===v.answer?"ok":"no") : ""}"><span class="d-name">${rich(v.name)}</span>
        <span>${DIRS.map(d => `<button class="dbtn ${val===d[0]?"on":""}" title="${d[0]}" ${w.done||w.checked?"disabled":""}
          onclick="dirPick('${l.id}','${t.id}','${key}','${d[0]}')">${d[1]}</button>`).join(" ")}</span>
        ${marked && v.why ? `<p class="why">${val===v.answer ? `<span class="ok-t">✓</span>` : `<span class="no-t">✗</span>`} ${rich(v.why)}</p>` : ``}</div>`;
    }).join("")}</div>`).join("");
  return `<p class="why" style="margin:0 0 10px">↑ rises &nbsp; ↓ falls &nbsp; – no change</p>${html}${checkFooter(l, t, w, n)}`;
}
function dirPick(lid, tid, key, d){ const w = work(lid, tid); w.picks = w.picks || {}; w.picks[key] = d; save(); rerender(lid, tid); }
function checkDirection(l, t, w){
  let c = 0, n = 0, missing = false;
  t.scenarios.forEach((sc, si) => sc.vars.forEach((v, vi) => { n++; const p = (w.picks||{})[si+"_"+vi]; if(!p) missing = true; if(p === v.answer) c++; }));
  if(missing) return { incomplete:"Choose a direction for every row first." };
  return { correct:c, total:n };
}

/* ============================================================================
   5. TEACHER VIEW
   ============================================================================ */
function goTeacher(){ view.page = "teacher"; view.teacher = { data:null, lesson:null, error:null }; render(); }
function backToStudent(){ view.page = S.name ? "hub" : "name"; render(); }
function viewTeacher(){
  const T = view.teacher;
  if(!T.data){
    return `<div style="padding:52px 0 0">
      <span class="eyebrow">Teacher</span>
      <h1 style="font-size:32px;margin:8px 0 16px">Class results</h1>
      <div style="display:flex;gap:10px;max-width:340px">
        <input type="text" id="pin" placeholder="PIN" inputmode="numeric" style="flex:1" onkeydown="if(event.key==='Enter')loadResults()">
        <button class="btn" onclick="loadResults()">Open</button>
      </div>
      ${T.error ? `<div class="err">${esc(T.error)}</div>` : ``}
      <p style="margin-top:28px"><button class="linkish" onclick="backToStudent()">Back to student view</button>
        &nbsp;·&nbsp; <button class="linkish" onclick="previewLessons()">Preview lessons</button>
        &nbsp;·&nbsp; <button class="linkish" onclick="clearDevice()">Clear this device</button></p>
    </div>`;
  }
  return T.lesson ? teacherLesson(T.lesson) : teacherOverview();
}
function loadResults(){
  const el = document.getElementById("pin"); const pin = el ? el.value.trim() : "";
  if(pin !== PIN){ view.teacher.error = "That PIN is not right. Try again."; render(); return; }
  if(!CONNECTED){ view.teacher.error = "No Worker URL is set at the top of the file."; render(); return; }
  view.teacher.error = null;
  fetch(`${WORKER_URL}?hub=${encodeURIComponent(HUB)}&pin=${encodeURIComponent(pin)}`)
    .then(r => r.json())
    .then(j => {
      if(j && j.error){ view.teacher.error = "The Worker rejected the request: " + j.error; render(); return; }
      view.teacher.data = groupResults(j.results || []); render();
    })
    .catch(() => { view.teacher.error = "Could not reach the Worker. Check WORKER_URL at the top of the file."; render(); });
}
function groupResults(rows){
  const by = {};
  rows.forEach(r => {
    const slug = r.slug || slugify(r.name || ""); if(!slug) return;
    by[slug] = by[slug] || { slug, name:r.name || slug, lessons:{} };
    const lid = r.lesson; if(!lid) return;
    const prev = by[slug].lessons[lid];
    const size = JSON.stringify(r.auto || {}).length + ((r.progress && r.progress.done) || 0) * 1000;
    if(!prev || size > prev.__size) by[slug].lessons[lid] = Object.assign({ __size:size }, r);
  });
  const roll = ROLL.map(slugify);
  return { onRoll: ROLL.map(n => by[slugify(n)] || { slug:slugify(n), name:n, lessons:{} }),
           offRoll: Object.values(by).filter(s => roll.indexOf(s.slug) === -1) };
}
const pctCls = p => p === null ? "" : (p >= 80 ? "full" : (p >= 50 ? "part" : "low"));
function studentLesson(s, l){
  const p = (s.lessons[l.id] || {}).progress;
  return { done: p ? p.done||0 : 0, fc: p ? p.firstCorrect||0 : 0, ft: p ? p.firstTotal||0 : 0 };
}
function teacherOverview(){
  const { onRoll, offRoll } = view.teacher.data; const live = liveLessons();
  const grand = live.reduce((s,l) => s + l.tasks.length, 0);
  const rows = onRoll.map(s => {
    let done = 0, fc = 0, ft = 0;
    live.forEach(l => { const x = studentLesson(s, l); done += x.done; fc += x.fc; ft += x.ft; });
    return { s, done, fc, ft, pct: ft ? Math.round(fc/ft*100) : null };
  });
  return `<div style="padding:44px 0 0">
    <span class="eyebrow">Teacher · hub ${esc(HUB)}</span>
    <h1 style="font-size:32px;margin:8px 0 4px">Class overview</h1>
    <p style="color:var(--ink-soft);margin:0;max-width:64ch">Each cell shows tasks done and first-try accuracy for that lesson.
      Every task marks itself; students can retry until correct, so the <b>first try</b> is the figure that shows understanding.
      Tap a lesson to see which tasks the class found hardest.</p>
    <div class="grid-wrap"><table>
      <thead><tr><th>Student</th>${live.map(l => `<th style="text-align:center;cursor:pointer" onclick="openTeacherLesson('${l.id}')">${esc(l.id)}</th>`).join("")}
        <th style="text-align:center">Tasks</th><th style="text-align:center">First try</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="nm">${esc(r.s.name)}</td>
        ${live.map(l => { const x = studentLesson(r.s, l); const tot = l.tasks.length; const p = x.ft ? Math.round(x.fc/x.ft*100) : null;
          return `<td class="cell ${x.done===0?"":(x.done>=tot?"full":"part")}">${x.done}/${tot}${p!==null?`<br><span style="opacity:.7;font-size:11.5px">${p}%</span>`:``}</td>`; }).join("")}
        <td class="cell"><b>${r.done}</b>/${grand}</td>
        <td class="cell ${pctCls(r.pct)}">${r.pct===null?"—":r.pct+"%"}</td>
        <td class="cell"><button class="linkish" style="font-size:12px" onclick="deleteStudent(${ROLL.indexOf(r.s.name)})">clear</button></td></tr>`).join("")}</tbody>
    </table></div>
    <div class="toolbar">${live.map(l => `<button class="btn btn-ghost btn-sm" onclick="openTeacherLesson('${l.id}')">${esc(l.id)} · ${esc(l.title)}</button>`).join("")}</div>
    <div class="toolbar"><button class="btn btn-ghost btn-sm" onclick="exportCSV()">Download CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="backToStudent()">Back to student view</button></div>
    ${offRoll.length ? `<h3 style="margin-top:34px;font-size:19px">Records not on the roll</h3>
      ${offRoll.map(s => `<div class="resp"><b>${esc(s.name)}</b> <span class="mono" style="color:var(--ink-soft)">${esc(s.slug)}</span></div>`).join("")}` : ``}
  </div>`;
}
function openTeacherLesson(id){ view.teacher.lesson = id; render(); }
function teacherLesson(lid){
  const l = lessonById(lid); const { onRoll } = view.teacher.data;
  const stats = l.tasks.map(t => {
    let c = 0, n = 0, att = 0, who = 0, rev = 0;
    onRoll.forEach(s => { const a = ((s.lessons[lid] || {}).auto || {})[t.id]; if(a){ c += a.firstCorrect; n += a.firstTotal; att += a.attempts; who++; if(a.revealed) rev++; } });
    return { t, pct: n ? Math.round(c/n*100) : null, who, rev };
  });
  return `<div style="padding:36px 0 0">
    <button class="linkish no-print" onclick="view.teacher.lesson=null;render()">← Class overview</button>
    <span class="eyebrow" style="display:block;margin-top:14px">${esc(l.chapter)}</span>
    <h1 style="font-size:30px;margin:6px 0 12px">${esc(l.id)} · ${esc(l.title)}</h1>
    <h3 style="font-size:18px;margin:18px 0 6px">Where the class went wrong</h3>
    <p style="color:var(--ink-soft);font-size:14.5px;margin:0 0 8px">Class first-try accuracy for each task, lowest first. These are the ones to reteach or open the next lesson with.</p>
    <div class="grid-wrap"><table><thead><tr><th>Task</th><th>Type</th><th style="text-align:center">Students</th><th style="text-align:center">First try</th><th style="text-align:center">Needed answers shown</th></tr></thead>
      <tbody>${stats.slice().sort((a,b) => (a.pct===null?101:a.pct) - (b.pct===null?101:b.pct)).map(x => `<tr>
        <td>${esc(x.t.title)}</td><td class="mono" style="font-size:12px">${esc(x.t.type)}</td><td class="cell">${x.who}</td>
        <td class="cell ${pctCls(x.pct)}">${x.pct===null?"—":x.pct+"%"}</td><td class="cell">${x.rev}</td></tr>`).join("")}</tbody></table></div>
    <h3 style="font-size:18px;margin:26px 0 6px">Student by student</h3>
    <div class="grid-wrap"><table><thead><tr><th>Student</th>${l.tasks.map((t,i) => `<th style="text-align:center" title="${esc(t.title)}">T${i+1}</th>`).join("")}<th style="text-align:center">Updated</th></tr></thead>
      <tbody>${onRoll.map(s => { const rec = s.lessons[lid] || {}; const au = rec.auto || {};
        return `<tr><td class="nm">${esc(s.name)}</td>${l.tasks.map(t => { const a = au[t.id];
          if(!a) return `<td class="cell">—</td>`;
          const p = Math.round(a.firstCorrect/a.firstTotal*100);
          return `<td class="cell ${pctCls(p)}" title="${esc(t.title)}: ${a.attempts} attempt(s)${a.revealed?", answers shown":""}">${a.firstCorrect}/${a.firstTotal}${a.revealed?"*":""}</td>`; }).join("")}
          <td class="cell mono" style="font-size:11.5px">${esc((rec.progress && rec.progress.updated) || "")}</td></tr>`; }).join("")}</tbody></table></div>
    <p style="color:var(--ink-soft);font-size:13px">Cells show first-try score. * = the student asked to see the answers.
      ${l.tasks.map((t,i) => `T${i+1} ${esc(t.title)}`).join(" · ")}</p>
  </div>`;
}
function deleteStudent(i){
  const name = ROLL[i]; if(name === undefined) return;
  if(!confirm(`Delete every ${HUB} record for ${name}? This cannot be undone.`)) return;
  fetch(`${WORKER_URL}?pin=${encodeURIComponent(PIN)}&hub=${encodeURIComponent(HUB)}&name=${encodeURIComponent(name)}`, { method:"DELETE" })
    .then(() => { view.teacher.data = null; toast("Deleted — enter the PIN again to refresh"); render(); })
    .catch(() => toast("Delete failed", true));
}
function exportCSV(){
  const { onRoll } = view.teacher.data; const live = liveLessons(); const rows = [];
  rows.push(["Student","Lesson","Task","Type","First try correct","Of","Attempts","Answers shown","Completed at"]);
  onRoll.forEach(s => live.forEach(l => l.tasks.forEach(t => {
    const a = ((s.lessons[l.id] || {}).auto || {})[t.id];
    rows.push([s.name, l.id, t.title, t.type, a ? a.firstCorrect : "", a ? a.firstTotal : "", a ? a.attempts : "", a && a.revealed ? "yes" : "", a ? a.at : ""]);
  })));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = `labour-market-${HUB}-${stamp().slice(0,10)}.csv`; a.click();
}
function clearDevice(){
  if(!confirm("Clear the saved name and all answers on this computer? Work already sent is not affected.")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = { name:null, slug:null, work:{} }; view = { page:"name", lesson:null, teacher:{ data:null, lesson:null, error:null } }; render();
}

Object.assign(window, { pick, switchUser, previewLessons, openLesson, goHub, goTeacher, backToStudent, loadResults, clearDevice,
  checkTask, retry, reveal, setPick, sortPick, quizPick, seqAdd, seqRemove, calcIn, spotClick, trimToggle, examCrit, examMark, dirPick,
  openTeacherLesson, exportCSV, deleteStudent, view, render });

render();

</script>
