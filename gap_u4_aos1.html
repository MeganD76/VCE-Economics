<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U4 AOS1 — Monetary Policy GAP Analysis</title>
<style>
:root{
  --primary:#2563eb; --primaryl:#eff6ff; --primaryd:#1d4ed8;
  --ink:#1e293b; --ink-sec:#64748b; --border:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
  --green:#16a34a; --green-pale:#f0fdf4;
  --amber:#d97706; --amber-pale:#fffbeb;
  --red:#dc2626; --red-pale:#fef2f2;
  --purple:#7c3aed; --purple-pale:#f5f3ff;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
h1,h2,h3,h4{font-family:Cambria,Georgia,serif;color:#0f172a;margin:0 0 8px;}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 60px;}
.hero{background:linear-gradient(135deg,var(--primaryd),var(--primary));color:#fff;padding:38px 20px 46px;}
.hero-inner{max-width:880px;margin:0 auto;}
.badge{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:4px 14px;font-size:12.5px;font-weight:700;letter-spacing:.04em;margin-bottom:10px;}
.hero h1{color:#fff;font-size:28px;margin-bottom:6px;}
.hero p{font-size:15px;opacity:.92;margin:0;max-width:640px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-top:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--primaryd);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
.btn.sm{padding:8px 14px;font-size:13.5px;}
input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;}
input[type=text]:focus{outline:none;border-color:var(--primary);}
.footer-link{text-align:center;margin-top:26px;font-size:12.5px;color:var(--ink-sec);cursor:pointer;}
.footer-link:hover{color:var(--primary);text-decoration:underline;}

/* Survey */
.kk-block{margin-top:22px;}
.kk-title{font-size:16px;font-weight:700;color:var(--primaryd);margin-bottom:2px;}
.kk-num{color:var(--ink-sec);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;}
.sub-row{border-top:1px solid var(--border);padding:14px 0;}
.sub-label{font-size:14.5px;margin-bottom:10px;}
.rating-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;}
.rating-btn{border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:10px 6px;cursor:pointer;font-size:12.5px;text-align:center;white-space:normal;font-family:inherit;color:var(--ink);}
.rating-btn .emo{font-size:18px;display:block;margin-bottom:3px;}
.rating-btn.sel{border-color:var(--primary);background:var(--primaryl);box-shadow:0 0 0 2px var(--primary);font-weight:700;}
.progress-bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--border);margin-bottom:4px;}
.progress-track{height:8px;background:var(--border);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);transition:width .2s;}
.progress-txt{font-size:12.5px;color:var(--ink-sec);margin-top:5px;}

/* Results */
.tile-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;}
.stat-tile{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat-tile .n{font-size:26px;font-weight:800;color:var(--primaryd);font-family:Cambria,Georgia,serif;}
.stat-tile .l{font-size:12px;color:var(--ink-sec);margin-top:2px;}
.alert{border-radius:12px;padding:16px 18px;margin-top:18px;font-size:14.5px;}
.alert.warn{background:var(--amber-pale);border:1px solid #fde68a;color:#92400e;}
.kk-card{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:12px;}
.kk-card.weak{border-color:#fecaca;background:var(--red-pale);}
.kk-card.mid{border-color:#fde68a;background:var(--amber-pale);}
.kk-card.strong{border-color:#bbf7d0;background:var(--green-pale);}
.kk-bar-track{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:8px 0;}
.kk-bar-fill{height:100%;border-radius:6px;}
.badge-type{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:20px;margin-right:6px;}
.badge-type.definition{background:#fce7f3;color:#9d174d;}
.badge-type.content{background:#dbeafe;color:#1e40af;}
.badge-type.application{background:#dcfce7;color:#166534;}
.badge-type.eval{background:#ede9fe;color:#5b21b6;}
.badge-tab{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;}
.badge-tab.game{background:#dcfce7;color:#166534;}
.badge-tab.practice{background:#ede9fe;color:#5b21b6;}
.badge-tab.both{background:#fef9c3;color:#854d0e;}
details{margin-top:8px;}
summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--primaryd);}
.weak-sub{font-size:13.5px;padding:6px 0;border-top:1px dashed var(--border);}

/* Plan */
.opt-pill{display:inline-block;border:1.5px solid var(--border);border-radius:20px;padding:9px 16px;margin:4px 6px 4px 0;cursor:pointer;font-size:13.5px;background:#fff;}
.opt-pill.sel{background:var(--primary);color:#fff;border-color:var(--primary);}
textarea{width:100%;min-height:90px;padding:12px 14px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14.5px;}
.q-block{margin-top:22px;}
.q-num{font-size:12px;font-weight:700;color:var(--ink-sec);text-transform:uppercase;letter-spacing:.04em;}

/* Teacher */
.tch table{width:100%;border-collapse:collapse;font-size:13px;}
.tch th,.tch td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
.tch th{background:var(--primaryl);color:var(--primaryd);font-size:11.5px;text-transform:uppercase;}
.kdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;}
.wk-bar-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;}
.wk-bar-track{flex:1;height:14px;background:#e2e8f0;border-radius:7px;overflow:hidden;display:flex;}
.save-toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:#fff;padding:10px 18px;border-radius:9px;font-size:13.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50;}
.save-toast.show{opacity:1;transform:translateY(0);}

@media print{
  body{background:#fff;}
  .no-print{display:none !important;}
  .hero{background:#fff !important;color:#000 !important;padding:10px 0;}
  .hero h1,.hero p{color:#000 !important;}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;}
  .kk-card{break-inside:avoid;}
}
@media(max-width:560px){
  .rating-grid{grid-template-columns:repeat(2,1fr);}
  .hero h1{font-size:23px;}
}
</style>
</head>

function answeredCount(){ var n=0; for(var k in S.ratings){ if(S.ratings[k]!==undefined) n++; } return n; }

function kkAvg(kk){
  var sum=0, n=0;
  for(var i=0;i<kk.subs.length;i++){
    var v=S.ratings[kk.subs[i].id];
    if(v!==undefined){ sum+=v; n++; }
  }
  return n>0 ? sum/n : null;
}
function bandFromAvg(avg){
  if(avg===null) return null;
  var b = Math.round(avg);
  if(b<1)b=1; if(b>4)b=4;
  return b;
}
function bandKey(b){ return b<=2 ? 'f' : (b===3 ? 'c' : 'e'); }
function bandColorClass(avg){
  if(avg===null) return '';
  if(avg<2.5) return 'weak';
  if(avg<3.25) return 'mid';
  return 'strong';
}
function bandBarColor(avg){
  if(avg===null) return '#cbd5e1';
  if(avg<2.5) return '#dc2626';
  if(avg<3.25) return '#d97706';
  return '#16a34a';
}

  }
  var priority = kkResults.filter(function(r){ return r.avg!==null && r.avg<2.5; })
                           .sort(function(a,b){ return a.avg-b.avg; });
  var weakSubs = [];
  for(var j=0;j<KKS.length;j++){
    var kkj=KKS[j];
    for(var s=0;s<kkj.subs.length;s++){
      var sub=kkj.subs[s], v=S.ratings[sub.id];
      if(v!==undefined && v<=2){ weakSubs.push({kk:kkj, sub:sub, v:v}); }
    }
  }
  weakSubs.sort(function(a,b){ return a.v-b.v; });
  var foundLow = 0;
  for(var f=0;f<FOUNDATIONAL_KKS.length;f++){
    var r = kkResults.filter(function(x){return x.kk.id===FOUNDATIONAL_KKS[f];})[0];
    if(r && r.avg!==null && r.avg<2.5) foundLow++;
  }
  var totalAnswered = answeredCount(), total = totalSubs();
  var overallSum=0, overallN=0;
  for(var k in S.ratings){ overallSum+=S.ratings[k]; overallN++; }
  var overallAvg = overallN>0 ? (overallSum/overallN) : null;
  return{kkResults:kkResults, priority:priority, weakSubs:weakSubs, foundLow:foundLow,
         totalAnswered:totalAnswered, total:total, overallAvg:overallAvg};
}

function pillGroup(field, options, current, multi){
  var h = "<div>";
  for(var i=0;i<options.length;i++){
    var opt = options[i];
    var isSel = multi ? (Array.isArray(current) && current.indexOf(opt)>-1) : (current===opt);
    h += "<span class='opt-pill"+(isSel?' sel':'')+"' onclick=\"pickPlan('"+field+"',"+JSON.stringify(opt)+","+multi+")\">"+esc(opt)+"</span>";
  }
  h += "</div>";
  return h;
}
function pickPlan(field, val, multi){
  if(multi){
    var arr = S.plan[field].slice();
    var idx = arr.indexOf(val);
    if(idx>-1){ arr.splice(idx,1); } else { arr.push(val); }
    S.plan[field] = arr;
  } else {
    S.plan[field] = val;
  }
  saveLocal();
  render();
}

/* ============================================================
   WORKER SYNC
   Matches the vce-marker Worker's actual /gap-read and /gap-write
   routes: GitHub Contents API pass-through, base64-encoded content,
   SHA handled server-side on write.
   ============================================================ */
function currentSubmission(){
  return {
    name: S.name,
    submittedAt: S.submittedAt || new Date().toISOString(),
    ratings: S.ratings,
    plan: S.planSubmitted ? S.plan : null
  };
}
function b64ToStr(b64){
  return decodeURIComponent(escape(atob(String(b64).replace(/\n/g,''))));
}
function readGapData(){
  return fetch(WORKER_URL+"/gap-read?owner="+encodeURIComponent(GITHUB_OWNER)+"&repo="+encodeURIComponent(GITHUB_REPO)+"&file="+encodeURIComponent(GITHUB_FILE))
    .then(function(res){ return res.json(); })
    .then(function(d){
      if(!d || !d.content) return [];
      try{
        var arr = JSON.parse(b64ToStr(d.content));
        return Array.isArray(arr) ? arr : [];
      }catch(e){ return []; }
    })
    .catch(function(){ return []; });
}
function writeGapData(arr){
  return fetch(WORKER_URL+"/gap-write", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ owner:GITHUB_OWNER, repo:GITHUB_REPO, file:GITHUB_FILE, content: JSON.stringify(arr) })
  });
}
function syncToWorker(){
  if(!S.name) return;
  readGapData().then(function(arr){
    var mine = safeName(S.name);
    arr = arr.filter(function(row){ return safeName(row.name||'') !== mine; });
    arr.push(currentSubmission());
    return writeGapData(arr);
  }).then(function(){ toast('Synced to teacher'); })
    .catch(function(){ /* silent fail, localStorage still has it */ });
}

function renderTeacherBody(){
  var el = document.getElementById('tchBody');
  if(!el) return;
  var rows = _teacherData;
  var n = rows.length;

  // KK-level averages across class
  var kkAgg = {};
  for(var i=0;i<KKS.length;i++){ kkAgg[KKS[i].id] = {sum:0,count:0}; }
  var subAgg = {};
  for(var i2=0;i2<KKS.length;i2++){
    for(var s2=0;s2<KKS[i2].subs.length;s2++){
      subAgg[KKS[i2].subs[s2].id] = {sum:0,count:0, kk:KKS[i2].id, label:KKS[i2].subs[s2].label};
    }
  }
  var planCount = 0;
  for(var r=0;r<rows.length;r++){
    var row = rows[r];
    if(row.plan) planCount++;
    if(row.ratings){
      for(var k in row.ratings){
        var v = row.ratings[k];
        if(subAgg[k]){ subAgg[k].sum+=v; subAgg[k].count++; }
        var kkNum = parseInt(k,10);
        if(kkAgg[kkNum]){ kkAgg[kkNum].sum+=v; kkAgg[kkNum].count++; }
      }
    }
  }

  var h = "<div class='tile-row no-print'>";
  h += "<div class='stat-tile'><div class='n'>"+n+"</div><div class='l'>Submissions</div></div>";
  h += "<div class='stat-tile'><div class='n'>"+planCount+"</div><div class='l'>Plans completed</div></div>";
  h += "</div>";

  h += "<h2 style='margin-top:24px'>Class priority areas</h2>";
  var kkAvgList = [];
  for(var kid in kkAgg){
    var a = kkAgg[kid];
    var avg = a.count>0 ? a.sum/a.count : null;
    var kkObj = KKS.filter(function(x){return x.id===parseInt(kid,10);})[0];
    kkAvgList.push({id:parseInt(kid,10), title:kkObj?kkObj.title:'', avg:avg});
  }
  kkAvgList.sort(function(a,b){
    if(a.avg===null) return 1; if(b.avg===null) return -1;
    return a.avg-b.avg;
  });
  var lowKk = kkAvgList.filter(function(x){return x.avg!==null && x.avg<2.5;});
  if(lowKk.length===0){ h += "<div class='card'><p style='color:var(--ink-sec)'>No KK averages below 2.5 across the class.</p></div>"; }
  for(var lk=0;lk<lowKk.length;lk++){
    var item = lowKk[lk];
    h += "<div class='kk-card weak'><strong>KK"+item.id+"</strong> — "+esc(item.title)+" &nbsp; <span style='color:var(--red);font-weight:800'>"+item.avg.toFixed(1)+" / 4</span></div>";
  }

  h += "<h2 style='margin-top:24px'>Top 10 weakest sub-questions</h2><div class='card'>";
  var subList = [];
  for(var sk in subAgg){
    var sa = subAgg[sk];
    if(sa.count>0){ subList.push({id:sk, avg:sa.sum/sa.count, kk:sa.kk, label:sa.label, count:sa.count}); }
  }
  subList.sort(function(a,b){ return a.avg-b.avg; });
  subList = subList.slice(0,10);
  for(var w=0;w<subList.length;w++){
    var it = subList[w];
    var pct = Math.round((it.avg/4)*100);
    h += "<div class='wk-bar-row'><span style='min-width:210px'>KK"+it.kk+" — "+esc(it.label)+"</span>";
    h += "<div class='wk-bar-track'><div style='width:"+pct+"%;background:"+bandBarColor(it.avg)+"'></div></div>";
    h += "<span style='min-width:70px;text-align:right'>"+it.avg.toFixed(1)+"/4 (n="+it.count+")</span></div>";
  }
  h += "</div>";

  h += "<h2 style='margin-top:24px'>Full KK breakdown</h2>";
  for(var b=0;b<KKS.length;b++){
    var kk = KKS[b];
    var agg = kkAgg[kk.id];
    var avg = agg.count>0 ? agg.sum/agg.count : null;
    h += "<details class='card' style='padding:14px 18px'><summary>KK"+kk.id+" — "+esc(kk.title)+" ("+(avg!==null?avg.toFixed(1):'—')+"/4)</summary>";
    for(var ss=0;ss<kk.subs.length;ss++){
      var sub = kk.subs[ss], sa2 = subAgg[sub.id];
      var savg = sa2.count>0 ? sa2.sum/sa2.count : null;
      h += "<div class='weak-sub'>"+esc(sub.label)+" — "+(savg!==null?savg.toFixed(1)+'/4':'no data')+" (n="+sa2.count+")</div>";
    }
    h += "</details>";
  }

  h += "<h2 style='margin-top:24px'>Students</h2><div class='card tch'><div style='overflow-x:auto'><table><tr><th>Name</th><th>Submitted</th><th>Avg</th><th>Weakest KK</th><th>Plan?</th><th class='no-print'>Delete</th></tr>";
  var sorted = rows.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  for(var rr=0;rr<sorted.length;rr++){
    var row2 = sorted[rr];
    var sum=0,cnt=0,worst=null,worstAvg=99;
    var perKk = {};
    if(row2.ratings){
      for(var kk2 in row2.ratings){
        var v2=row2.ratings[kk2]; sum+=v2; cnt++;
        var kn = subAgg[kk2] ? subAgg[kk2].kk : null;
        if(kn){ if(!perKk[kn]) perKk[kn]={sum:0,count:0}; perKk[kn].sum+=v2; perKk[kn].count++; }
      }
    }
    for(var pk in perKk){
      var pa = perKk[pk].sum/perKk[pk].count;
      if(pa<worstAvg){ worstAvg=pa; worst=pk; }
    }
    var studentAvg = cnt>0 ? (sum/cnt) : null;
    var dt = row2.submittedAt ? new Date(row2.submittedAt) : null;
    h += "<tr><td><strong>"+esc(row2.name||'?')+"</strong></td>";
    h += "<td>"+(dt?dt.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—')+"</td>";
    h += "<td>"+(studentAvg!==null?studentAvg.toFixed(1):'—')+"/4</td>";
    h += "<td>"+(worst?('KK'+worst):'—')+"</td>";
    h += "<td>"+(row2.plan?'✅':'—')+"</td>";
    h += "<td class='no-print'><button class='btn ghost sm' style='color:var(--red);border-color:var(--red)' onclick=\"deleteStudent('"+esc(row2.name||'')+"')\">Delete</button></td></tr>";
  }
  h += "</table></div></div>";

  el.innerHTML = h;
}
function deleteStudent(name){
  if(!confirm('Delete '+name+"'s submission? This can't be undone.")) return;
  var mine = safeName(name);
  var arr = _teacherData.filter(function(row){ return safeName(row.name||'') !== mine; });
  writeGapData(arr).then(function(){ fetchTeacherData(); });
}
function clearAllData(){
  if(!confirm('Clear ALL student submissions for this GAP analysis? This cannot be undone.')) return;
  writeGapData([]).then(function(){ fetchTeacherData(); });
}

render();
</script>
