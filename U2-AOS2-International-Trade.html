<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International Trade — Lesson Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETTE — ledger / customs-manifest
   ============================================================ */
:root{
  --ink:#12303A;        /* headings, body text */
  --ink-soft:#4A6672;   /* secondary text */
  --teal:#0E7C7B;       /* primary action, WE DO */
  --teal-pale:#E4F1F0;
  --amber:#B9791A;      /* hints */
  --amber-pale:#FBF1DC;
  --red:#B23B32;        /* common mistakes */
  --red-pale:#FBE9E7;
  --green:#2C6E4A;      /* cleared */
  --green-pale:#E3F0E7;
  --paper:#FBFAF7;
  --card:#FFFFFF;
  --line:#DAD6CD;
  --line-soft:#EDEAE3;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;font-weight:700;line-height:1.15;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* eyebrow label — used for every structural marker in the page */
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
}

.wrap{max-width:820px;margin:0 auto;padding:0 20px 96px}

/* ---------- top bar ---------- */
.bar{
  border-bottom:1px solid var(--line);background:var(--card);
  position:sticky;top:0;z-index:20;
}
.bar-in{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.bar-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.bar-spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.linkish{
  background:none;border:none;padding:0;font:inherit;color:var(--teal);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
.linkish:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:#0A222A;border-color:#0A222A}
.btn:disabled{background:var(--line);border-color:var(--line);color:#8B8B84;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn-teal{background:var(--teal);border-color:var(--teal)}
.btn-teal:hover{background:#0B6564;border-color:#0B6564}
.btn-sm{padding:6px 12px;font-size:14px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- name picker ---------- */
.roll{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.roll button{
  font:inherit;font-weight:500;padding:12px 20px;border:1px solid var(--line);
  background:var(--card);border-radius:2px;cursor:pointer;color:var(--ink);
}
.roll button:hover{border-color:var(--teal);background:var(--teal-pale)}

/* ---------- hub: colour accents per lesson card ---------- */
:root{
  --acc1:#0E7C7B; --acc1-pale:#E4F1F0;   /* teal   */
  --acc2:#B23B32; --acc2-pale:#FBE9E7;   /* red    */
  --acc3:#B9791A; --acc3-pale:#FBF1DC;   /* amber  */
  --acc4:#2C6E4A; --acc4-pale:#E3F0E7;   /* green  */
  --acc5:#5B4B8A; --acc5-pale:#EDE9F5;   /* plum   */
  --acc6:#1E6091; --acc6-pale:#E1EEF7;   /* sky    */
  --acc7:#A34E86; --acc7-pale:#F5E7F1;   /* orchid */
  --acc8:#C2660E; --acc8-pale:#FBE9D8;   /* rust   */
}

/* ---------- hub: welcome banner ---------- */
.hero{
  margin-top:28px;border-radius:6px;padding:22px 26px;
  background:linear-gradient(120deg,#12303A 0%,#0E7C7B 100%);
  color:#fff;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(255,255,255,.07);
}
.hero-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.75);
}
.hero-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:26px;margin:6px 0 4px}
.hero-sub{color:rgba(255,255,255,.85);font-size:14.5px;max-width:52ch;margin:0}
.hero-stats{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;position:relative}
.hero-ring{
  width:52px;height:52px;border-radius:50%;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#F2C879 calc(var(--pct)*1%), rgba(255,255,255,.25) 0);
}
.hero-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#12303A}
.hero-ring span{position:relative;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700}
.hero-statline{font-size:14px}
.hero-statline b{font-weight:700}

/* ---------- hub: card grid ---------- */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;
  margin-top:24px;
}
.lcard{
  position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:16px 16px 14px;overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease;
}
.lcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(18,48,58,.12)}
.lcard:active{transform:translateY(0)}
.lcard::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc);
}
.lcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lcard-num{
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;
  color:var(--acc);background:var(--acc-pale);border-radius:3px;padding:3px 8px;flex:none;
}
.lcard-title{
  font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:17px;
  margin:10px 0 3px;line-height:1.2;
}
.lcard-chap{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.lcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.lcard-pips{display:flex;gap:4px}
.lcard-pip{width:14px;height:4px;border-radius:1px;background:var(--line)}
.lcard-pip.on{background:var(--acc)}

.pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:4px 10px;border-radius:99px;white-space:nowrap;
}
.pill-todo{background:var(--line-soft);color:var(--ink-soft)}
.pill-progress{background:var(--acc3-pale);color:var(--acc3)}
.pill-done{background:var(--acc4-pale);color:var(--acc4)}
.pill-done::before{content:"\2713  "}

/* ---------- hub: old row style (used by teacher toolbar buttons) ---------- */
.manifest{margin-top:26px;border-top:2px solid var(--ink)}
.mrow{
  display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;
  padding:16px 4px;border-bottom:1px solid var(--line-soft);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;
  text-align:left;font:inherit;color:inherit;cursor:pointer;
}
.mrow:hover{background:var(--card)}
.mrow[disabled]{cursor:default;opacity:.55}
.mrow[disabled]:hover{background:none}
.mnum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft)}
.mtitle{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:19px}
.mchap{font-size:13px;color:var(--ink-soft);margin-top:1px}
.mcount{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.mcount.full{color:var(--green);font-weight:600}

/* SIGNATURE — the clearance stamp */
.stamp{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--green);
  border:2px solid var(--green);border-radius:3px;padding:3px 9px;
  transform:rotate(-4deg);opacity:.9;
}
.stamp.land{animation:land .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes land{
  from{transform:rotate(-18deg) scale(1.7);opacity:0}
  to{transform:rotate(-4deg) scale(1);opacity:.9}
}
@media (prefers-reduced-motion:reduce){.stamp.land{animation:none}}

/* ---------- lesson page ---------- */
.lesson-head{padding:28px 0 6px;border-bottom:2px solid var(--ink)}
.lesson-head h1{font-size:30px;letter-spacing:-.015em;margin-top:6px}
.progress{
  display:flex;align-items:center;gap:10px;margin-top:14px;padding-bottom:16px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);
}
.pips{display:flex;gap:5px}
.pip{width:22px;height:5px;background:var(--line);border-radius:1px}
.pip.on{background:var(--green)}

.task{
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  margin-top:22px;overflow:hidden;
}
.task-head{padding:16px 20px 0;display:flex;align-items:flex-start;gap:12px}
.task-n{
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:2px 7px;margin-top:2px;flex:none;
}
.task-n.on{background:var(--green-pale);border-color:var(--green);color:var(--green)}
.task-title{font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:19px;flex:1}
.task-marks{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);flex:none;margin-top:3px}
.task-body{padding:12px 20px 20px}
.prompt{margin:0 0 14px;font-size:16.5px}

/* callout boxes — mirror the workbook's house style */
.box{border-radius:2px;padding:12px 14px;margin:14px 0;font-size:14.5px;line-height:1.5}
.box p{margin:0}
.box .eyebrow{display:block;margin-bottom:5px}
.box-hint{background:var(--amber-pale);border-left:3px solid var(--amber)}
.box-hint .eyebrow{color:var(--amber)}
.box-mistake{background:var(--red-pale);border-left:3px solid var(--red)}
.box-mistake .eyebrow{color:var(--red)}
.box-build{background:var(--teal-pale);border-left:3px solid var(--teal)}
.box-build .eyebrow{color:var(--teal)}
.box-build ol{margin:6px 0 0;padding-left:20px}
.box-build li{margin-bottom:3px}

/* ---------- match ---------- */
.pairs{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:minmax(130px,34%) 1fr;gap:12px;align-items:center}
.pair-term{font-weight:600;font-size:15px}
select,textarea,input[type=text]{
  font:inherit;font-size:15px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:2px;padding:9px 10px;width:100%;
}
select:focus,textarea:focus,input:focus{border-color:var(--teal);outline:none;background:#fff}
.pair.ok select{border-color:var(--green);background:var(--green-pale)}
.pair.no select{border-color:var(--red);background:var(--red-pale)}

/* ---------- sort ---------- */
.sorts{display:flex;flex-direction:column;gap:9px}
.sort-row{
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 12px;border:1px solid var(--line-soft);border-radius:2px;background:var(--paper);
  flex-wrap:wrap;
}
.sort-row.ok{border-color:var(--green);background:var(--green-pale)}
.sort-row.no{border-color:var(--red);background:var(--red-pale)}
.sort-txt{flex:1;min-width:190px;font-size:15px}
.chips{display:flex;gap:6px;flex:none}
.chip{
  font:inherit;font-size:13.5px;font-weight:500;padding:6px 13px;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:2px;color:var(--ink-soft);
}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- choice ---------- */
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;cursor:pointer;
  border:1px solid var(--line-soft);border-radius:2px;background:var(--paper);font-size:15px;
}
.opt:hover{border-color:var(--teal)}
.opt input{margin:4px 0 0;flex:none;accent-color:var(--teal)}
.opt.ok{border-color:var(--green);background:var(--green-pale)}
.opt.no{border-color:var(--red);background:var(--red-pale)}

/* ---------- written ---------- */
textarea{min-height:120px;resize:vertical;line-height:1.55}
.starters{font-size:14px;color:var(--ink-soft);margin:0 0 10px;padding-left:18px}
.starters li{margin-bottom:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.word{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:4px 9px;border-radius:2px;
  border:1px dashed var(--line);color:var(--ink-soft);
}
.word.used{border-style:solid;border-color:var(--teal);background:var(--teal-pale);color:var(--teal);font-weight:500}
.meter{
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;
}
.checks{margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.checks input{margin:3px 0 0;flex:none;accent-color:var(--teal)}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.done-note{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--green);font-weight:500}

/* ---------- DUDDS checker ---------- */
.dudds{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.dcheck{
  display:flex;align-items:center;gap:7px;font-size:13.5px;
  border:1px solid var(--line);border-radius:2px;padding:6px 11px;background:var(--paper);
}
.dcheck .k{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;color:var(--ink-soft)}
.dcheck.on{border-color:var(--green);background:var(--green-pale)}
.dcheck.on .k{color:var(--green)}
.chart{width:100%;border:1px solid var(--line);border-radius:2px;margin-bottom:14px;display:block}
.data-table{border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.dt-cap{
  font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:700;font-size:15px;
  padding:10px 12px;background:var(--teal-pale);color:var(--teal);
}
.data-table table{border-collapse:collapse;width:100%;font-size:14.5px}
.data-table th{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;background:var(--paper);text-align:left;padding:8px 12px;
  border-bottom:1px solid var(--line);position:static;
}
.data-table td{padding:8px 12px;border-bottom:1px solid var(--line-soft);white-space:normal}
.data-table tr:last-child td{border-bottom:none}
.dt-num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}
.dt-src{font-size:12px;color:var(--ink-soft);padding:8px 12px;background:var(--paper);border-top:1px solid var(--line-soft)}
.chart-slot{
  border:1px dashed var(--line);border-radius:2px;padding:26px;text-align:center;
  color:var(--ink-soft);font-size:14px;margin-bottom:14px;background:var(--paper);
}

/* ---------- two truths ---------- */
.tt-row{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.tt-tag{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:2px;padding:6px 8px;flex:none;
}
.lie-pick{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;font-size:14.5px}

/* ---------- teacher ---------- */
.grid-wrap{overflow-x:auto;margin-top:20px;border:1px solid var(--line);border-radius:3px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
th{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:500;background:var(--paper);position:sticky;top:0;
}
td.cell{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:center;color:var(--ink-soft)}
td.cell.full{background:var(--green-pale);color:var(--green);font-weight:600}
td.cell.part{background:var(--amber-pale);color:var(--amber)}
td.nm{font-weight:600}
.resp{
  border:1px solid var(--line);border-radius:3px;background:var(--card);
  padding:16px 18px;margin-top:14px;break-inside:avoid;
}
.resp h4{font-size:17px}
.resp-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin:3px 0 10px}
.resp-text{white-space:pre-wrap;font-size:15px;border-left:3px solid var(--teal-pale);padding-left:13px;margin:8px 0}
.resp-none{color:var(--ink-soft);font-style:italic;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--line-soft);color:var(--ink-soft)}
.tag.on{background:var(--green-pale);color:var(--green)}
.tag.off{background:var(--red-pale);color:var(--red)}
.err{background:var(--red-pale);border-left:3px solid var(--red);padding:12px 14px;border-radius:2px;margin-top:16px;font-size:15px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.sync{
  position:fixed;right:16px;bottom:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;
  background:var(--ink);color:#fff;padding:7px 13px;border-radius:2px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:40;
}
.sync.show{opacity:.92}
.sync.bad{background:var(--red)}

@media (max-width:560px){
  .pair{grid-template-columns:1fr;gap:5px}
  .lesson-head h1{font-size:25px}
  .mrow{grid-template-columns:38px 1fr;gap:10px}
  .mcount{grid-column:2;margin-top:4px}
  .card-grid{grid-template-columns:1fr}
  .hero{padding:18px 18px}
  .hero-title{font-size:22px}
}
@media print{
  .bar,.toolbar,.sync,.no-print{display:none!important}
  body{background:#fff}
  .resp{break-inside:avoid;border-color:#999}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <span class="bar-title">International Trade</span>
    <span class="eyebrow">Unit 2 · AOS 2</span>
    <span class="bar-spacer"></span>
    <span class="who" id="who"></span>
  </div>
</div>

<div class="wrap" id="app"></div>
<div class="sync" id="sync"></div>

<script>
/* ============================================================================
   1. CONFIGURATION — MsD, edit this block only
   ============================================================================ */

// ── EDIT 1 OF 2 ──────────────────────────────────────────────
// Your Cloudflare Worker URL — the same one the Year 12 activities post to.
const WORKER_URL = "https://vce-results.megan-dyring.workers.dev";

// Bump this every time you commit, and load the page as  index.html?v=3
// School Chromebooks cache aggressively and will otherwise serve the old file.
const VERSION = 7;

// True once the URL above has actually been replaced. Until then the page
// still works — it just saves on the device and never calls the Worker.
const CONNECTED = /^https:\/\//.test(WORKER_URL);

// Scopes the KV key. Must be different from the Year 12 hub ("as").
const HUB = "it26";

// Teacher PIN — must match the Worker's own constant.
const PIN = "0904";

// ── EDIT 2 OF 2 ──────────────────────────────────────────────
// Your Year 11 roll. No free-text names anywhere — students pick from this list.
// First names are enough. Add a surname initial only where two names clash.
const ROLL = ["Angelyn","Bisman","Shun","Riley","Nathan","Tina","Serina","Cornelius","Solomon","Leo","Felix","Lisa"];

// The fifth letter of DUDDS. Currently set to Significance.
// Change LABEL and TEST together if you want it to mean something else.
const DUDDS_S = {
  key: "S",
  label: "Significance — say what the trend means",
  test: t => /\b(means?|meaning|suggests?|indicat|implies|shows? that|reflect|because|surplus|deficit)\b/i.test(t)
};

/* ============================================================================
   2. LESSON DATA — add lessons by adding objects here. No code changes needed.

   Task types:
     match      pairs: [[term, definition], ...]
     sort       buckets: [..], items: [{text, bucket}]

const KEY = "trade-" + HUB;
// Must match the Worker's safe() EXACTLY. The Worker keys records as
// result:<hub>:<safe(name)>:<lesson>, so if this drifts, the teacher view
// will group students differently from the way they are actually stored.
const slugify = s => String(s).trim().toLowerCase().replace(/[^a-z0-9_]+/g,"_").slice(0,60);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const nl2br = s => esc(s).replace(/\n/g,"<br>");
const countWords = t => (String(t).trim().match(/\S+/g) || []).length;
const stamp = () => {
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const lessonById = id => LESSONS.find(l => l.id === id);
const liveLessons = () => LESSONS.filter(l => !l.draft);

/* ---- Seeded shuffle -------------------------------------------------------
   Answer order must not carry a pattern. Authoring order almost always does:
   sort items get written alternating Credit/Debit, and matching definitions get
   written in the same order as their terms, so an alphabetical sort can line
   them straight back up.

   The seed is the lesson + task + student slug, so the order is STABLE for one
   student across re-renders (a dropdown must not reshuffle mid-task) but
   DIFFERENT between students, so answers can't be copied by position.
   -------------------------------------------------------------------------- */
function hashStr(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rnd = mulberry32(hashStr(seed));
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
/* A plain shuffle can still land on a perfect alternation by chance. Reshuffle
   until at least one neighbouring pair shares a bucket, which makes an
   alternating pattern impossible. Falls back after a few tries for the case
   where every bucket holds exactly one item and no repeat is possible. */
function shuffleNoPattern(indices, buckets, seed){
  for(let attempt = 0; attempt < 12; attempt++){
    const order = seededShuffle(indices, seed + ":" + attempt);
    const seq = order.map(i => buckets[i]);
    const hasRepeat = seq.some((b, i) => i > 0 && b === seq[i - 1]);
    if(hasRepeat) return order;
  }
  return seededShuffle(indices, seed);
}
const taskSeed = (lid, tid) => lid + ":" + tid + ":" + (S && S.slug ? S.slug : "anon");

/* Two roll names that normalise to the same slug share one KV key on the
   Worker, so the second student silently overwrites the first. Catch it here
   rather than discovering it when someone's work goes missing. */
function rollClashes(){
  const seen = {}, bad = [];
  ROLL.forEach(n => {
    const k = slugify(n);
    if(seen[k]) bad.push([seen[k], n, k]); else seen[k] = n;
  });
  return bad;
}
if(rollClashes().length){
  console.warn("ROLL problem — these names share a storage key:", rollClashes());
}

let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); p.work = p.work || {}; return p; }
  }catch(e){}
  return { name:null, slug:null, work:{} };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function work(lid, tid){
  S.work[lid] = S.work[lid] || {};
  S.work[lid][tid] = S.work[lid][tid] || {};
  return S.work[lid][tid];
}
function taskDone(lid, tid){ return !!(S.work[lid] && S.work[lid][tid] && S.work[lid][tid].done); }
function lessonDone(l){ return l.tasks.filter(t => taskDone(l.id, t.id)).length; }

/* ---- toast ---- */
let toastT = null;
function toast(msg, bad){
  const el = document.getElementById("sync");
  el.textContent = msg;
  el.className = "sync show" + (bad ? " bad" : "");
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.className = "sync"; }, bad ? 5000 : 1800);
}

/* ---- sync: always POST the COMPLETE lesson record, never a delta ---- */
function sync(lid){
  const l = lessonById(lid);
  if(!l) return;
  const written = {}, tasks = {};
  l.tasks.forEach(t => {
    const w = (S.work[lid] || {})[t.id] || {};
    tasks[t.id] = !!w.done;
    if(w.text !== undefined && String(w.text).trim() !== ""){
      written[t.id] = {
        title: t.title,
        marks: t.marks || null,
        text: w.text,
        words: countWords(w.text),
        check: w.check || {},
        at: w.at || stamp()
      };
    }
    if(t.type === "truthslie" && w.statements){
      written[t.id] = {
        title: t.title, marks:null,
        text: w.statements.map((s,i) => `${i+1}. ${s}`).join("\n") + `\n\nThe lie is #${(w.lie ?? -1)+1}`,
        words: countWords(w.statements.join(" ")),
        check: {}, at: w.at || stamp()
      };
    }
    if(t.type === "dudds" && w.dudds) written[t.id] && (written[t.id].check = w.dudds);
  });
  const done = l.tasks.filter(t => tasks[t.id]).length;

  if(!CONNECTED){ toast("Saved on this device"); return; }

  fetch(WORKER_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      name: S.name, slug: S.slug, hub: HUB, lesson: lid,
      written,
      progress:{ done, total:l.tasks.length, complete: done === l.tasks.length, tasks, updated: stamp() }
    })
  }).then(r => {
    if(!r.ok) throw new Error(r.status);
    toast("Saved");
  }).catch(() => toast("Saved on this device only \u2014 no connection", true));
}

/* ---- mark a task done / undone ---- */
function setDone(lid, tid, val){
  const w = work(lid, tid);
  const was = !!w.done;
  w.done = val;
  if(val && !w.at) w.at = stamp();
  save();
  if(was !== val || val) sync(lid);
}

/* ---- lesson ---- */

function taskShell(l, t, i, body){
  const on = taskDone(l.id, t.id);
  return `
  <section class="task" id="task-${t.id}">
    <div class="task-head">
      <span class="task-n ${on?"on":""}">${on ? "\u2713" : i+1}</span>

}
function box(kind, label, text){

}

function renderTask(l, t, i){
  if(t.type === "match")     return taskShell(l,t,i, renderMatch(l,t));
  if(t.type === "sort")      return taskShell(l,t,i, renderSort(l,t));
  if(t.type === "choice")    return taskShell(l,t,i, renderChoice(l,t));
  if(t.type === "written")   return taskShell(l,t,i, renderWritten(l,t));
  if(t.type === "dudds")     return taskShell(l,t,i, renderDudds(l,t));
  if(t.type === "truthslie") return taskShell(l,t,i, renderTruths(l,t));
  return "";
}

/* ---- match ---- */
function renderMatch(l,t){
  const w = work(l.id,t.id); w.picks = w.picks || {};
  const defs = seededShuffle(t.pairs.map(p => p[1]), taskSeed(l.id, t.id) + ":defs");
  const checked = !!w.checked;
  return `
  <div class="pairs">
    ${t.pairs.map((p,idx) => {
      const chosen = w.picks[idx] || "";
      const cls = !checked ? "" : (chosen === p[1] ? "ok" : "no");
      return `<div class="pair ${cls}">
        <span class="pair-term">${esc(p[0])}</span>
        <select onchange="matchPick('${l.id}','${t.id}',${idx},this.value)">
          <option value="">Choose\u2026</option>
          ${defs.map(d => `<option value="${esc(d)}" ${d===chosen?"selected":""}>${esc(d)}</option>`).join("")}
        </select>
      </div>`;
    }).join("")}
  </div>
  <div class="actions">
    <button class="btn btn-teal btn-sm" onclick="matchCheck('${l.id}','${t.id}')">Check my answers</button>
    ${checked ? (taskDone(l.id,t.id)
      ? `<span class="done-note">All correct \u2014 task done</span>`
      : `<span class="done-note" style="color:var(--red)">Some are wrong. Fix them and check again.</span>`) : ``}
  </div>`;
}
function matchPick(lid,tid,idx,val){
  const w = work(lid,tid); w.picks[idx] = val; w.checked = false; save(); render();
}
function matchCheck(lid,tid){
  const t = lessonById(lid).tasks.find(x => x.id === tid);
  const w = work(lid,tid); w.checked = true;
  const all = t.pairs.every((p,i) => w.picks[i] === p[1]);
  save();
  setDone(lid,tid,all);
  render();
}

/* ---- sort ---- */
function renderSort(l,t){
  const w = work(l.id,t.id); w.picks = w.picks || {};
  const checked = !!w.checked;
  // Display in a shuffled order; `idx` stays the ORIGINAL index so picks and
  // marking are unaffected by the reordering.
  const order = shuffleNoPattern(
    t.items.map((_,i) => i),
    t.items.map(it => it.bucket),
    taskSeed(l.id, t.id) + ":items"
  );
  return `
  <div class="sorts">
    ${order.map(idx => {
      const it = t.items[idx];
      const chosen = w.picks[idx] || "";
      const cls = !checked || !chosen ? "" : (chosen === it.bucket ? "ok" : "no");
      return `<div class="sort-row ${cls}">
        <span class="sort-txt">${esc(it.text)}</span>
        <span class="chips">
          ${t.buckets.map(b => `<button class="chip" aria-pressed="${chosen===b}"
             onclick="sortPick('${l.id}','${t.id}',${idx},'${esc(b)}')">${esc(b)}</button>`).join("")}
        </span>
      </div>`;
    }).join("")}
  </div>
  <div class="actions">
    <button class="btn btn-teal btn-sm" onclick="sortCheck('${l.id}','${t.id}')">Check my answers</button>
    ${checked ? (taskDone(l.id,t.id)
      ? `<span class="done-note">All correct \u2014 task done</span>`
      : `<span class="done-note" style="color:var(--red)">Not all correct yet. Change the red ones.</span>`) : ``}
  </div>`;
}
function sortPick(lid,tid,idx,val){
  const w = work(lid,tid); w.picks[idx] = val; w.checked = false; save(); render();
}
function sortCheck(lid,tid){
  const t = lessonById(lid).tasks.find(x => x.id === tid);
  const w = work(lid,tid); w.checked = true;
  const all = t.items.every((it,i) => w.picks[i] === it.bucket);
  save(); setDone(lid,tid,all); render();
}

/* ---- choice + justify ---- */
function renderChoice(l,t){
  const w = work(l.id,t.id);
  const picked = w.pick;
  const words = countWords(w.text || "");
  const min = t.minWords || 10;
  const checked = w.checked;
  return `
  <p class="prompt">${nl2br(t.stem)}</p>
  <div class="opts">
    ${seededShuffle(t.options.map((_,i) => i), taskSeed(l.id, t.id) + ":opts").map(idx => {
      const o = t.options[idx];
      let cls = "";
      if(checked && picked === idx) cls = idx === t.answer ? "ok" : "no";
      if(checked && idx === t.answer) cls = "ok";
      return `<label class="opt ${cls}">
        <input type="radio" name="${l.id}-${t.id}" ${picked===idx?"checked":""}
          onchange="choicePick('${l.id}','${t.id}',${idx})"> <span>${esc(o)}</span>
      </label>`;
    }).join("")}
  </div>
  ${picked !== undefined ? `
    <p class="prompt" style="margin-top:14px">${esc(t.justify)}</p>
    <textarea style="min-height:80px" oninput="writeText('${l.id}','${t.id}',this.value)"
      placeholder="One sentence\u2026">${esc(w.text || "")}</textarea>
    <div class="meter"><span data-wc>${words} words \u00b7 need ${min}</span></div>
    <div class="actions">
      <button class="btn btn-teal btn-sm" data-submit ${words<min?"disabled":""} onclick="choiceSubmit('${l.id}','${t.id}')">
        ${taskDone(l.id,t.id) ? "Save changes" : "Submit"}</button>
      ${checked && picked !== t.answer ? `<span class="done-note" style="color:var(--red)">Not quite \u2014 the correct option is now marked green. Change your choice.</span>` : ``}
      ${taskDone(l.id,t.id) ? `<span class="done-note">Submitted ${esc(w.at||"")}</span>` : ``}
    </div>` : ``}`;
}
function choicePick(lid,tid,idx){
  const w = work(lid,tid); w.pick = idx; w.checked = false; save(); render();
}
function choiceSubmit(lid,tid){
  const t = lessonById(lid).tasks.find(x => x.id === tid);
  const w = work(lid,tid);
  w.checked = true;
  w.at = stamp();
  save();
  setDone(lid,tid, w.pick === t.answer && countWords(w.text||"") >= (t.minWords||10));
  render();
}

/* ---- written ---- */
function writeText(lid,tid,val){
  const w = work(lid,tid);
  w.text = val;
  save();
  updateLive(lid,tid);
}
/* Light-touch live update so typing doesn't re-render the whole page and lose the caret. */
function updateLive(lid,tid){
  const t = lessonById(lid).tasks.find(x => x.id === tid);
  const w = work(lid,tid);
  const words = countWords(w.text || "");
  const scope = document.getElementById("task-" + tid);
  if(!scope) return;
  const wc = scope.querySelector("[data-wc]");
  if(wc) wc.textContent = `${words} words \u00b7 need ${t.minWords || 10}`;
  const btn = scope.querySelector("[data-submit]");
  if(btn) btn.disabled = words < (t.minWords || 10);
  scope.querySelectorAll("[data-word]").forEach(el => {
    const term = el.getAttribute("data-word").toLowerCase();
    el.classList.toggle("used", (w.text||"").toLowerCase().includes(term));
  });
  if(t.type === "dudds"){
    const res = duddsCheck(w.text || "");
    w.dudds = res;
    save();
    scope.querySelectorAll("[data-d]").forEach(el => {
      el.classList.toggle("on", !!res[el.getAttribute("data-d")]);
    });
  }
}

function renderWritten(l,t){
  const w = work(l.id,t.id);
  const words = countWords(w.text || "");
  const min = t.minWords || 10;
  const done = taskDone(l.id,t.id);
  return `
  ${t.bank ? `<div class="bank">${t.bank.map(b =>
      `<span class="word ${(w.text||"").toLowerCase().includes(b.toLowerCase())?"used":""}" data-word="${esc(b)}">${esc(b)}</span>`
    ).join("")}</div>` : ``}
  ${t.starters ? `<ul class="starters">${t.starters.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ``}
  <textarea oninput="writeText('${l.id}','${t.id}',this.value)" placeholder="Write your answer\u2026">${esc(w.text || "")}</textarea>
  <div class="meter"><span data-wc>${words} words \u00b7 need ${min}</span></div>
  ${t.checks ? `<div class="checks">
    <span class="eyebrow">Before you submit, tick what you have actually done</span>
    ${t.checks.map((c,i) => `<label><input type="checkbox" ${(w.check&&w.check[i])?"checked":""}
      onchange="tick('${l.id}','${t.id}',${i},this.checked)"> <span>${esc(c)}</span></label>`).join("")}
  </div>` : ``}
  <div class="actions">
    <button class="btn btn-teal btn-sm" data-submit ${words<min?"disabled":""}
      onclick="submitWritten('${l.id}','${t.id}')">${done ? "Save changes" : "Submit"}</button>
    ${done ? `<span class="done-note">Submitted ${esc(w.at||"")}</span>` : ``}
  </div>
  ${done && t.build ? `<div class="box box-build"><span class="eyebrow">How to build this answer</span>
    <ol>${t.build.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>` : ``}`;
}
function tick(lid,tid,i,val){
  const w = work(lid,tid); w.check = w.check || {}; w.check[i] = val; save();
}
function submitWritten(lid,tid){
  const w = work(lid,tid); w.at = stamp(); save(); setDone(lid,tid,true); render();
}

/* Renders a small data table for tasks that supply figures rather than an image,
   so the task can be completed with nothing but this page. */
function renderDataTable(tb){
  return `
  <div class="data-table">
    ${tb.caption ? `<div class="dt-cap">${esc(tb.caption)}</div>` : ``}
    <table>
      <thead><tr>${tb.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${tb.rows.map(r => `<tr>${r.map((c,i) =>
        `<td${i ? ` class="dt-num"` : ``}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table>
    ${tb.source ? `<div class="dt-src">${esc(tb.source)}</div>` : ``}
  </div>`;
}

/* ---- DUDDS ---- */
function duddsCheck(text){
  const years = (text.match(/\b(19|20)\d{2}\b/g) || []);
  const nums  = (text.match(/-?\$?\d[\d,]*(\.\d+)?%?/g) || [])
                .filter(n => !/^(19|20)\d{2}$/.test(n.replace(/[^0-9]/g,"")));
  return {
    D1: /\b(increas|decreas|ros|rise|risen|rising|fell|fall|declin|grew|grow|improv|worsen|fluctuat|peak|trough|steady|stable|remain|widen|narrow|upward|downward)/i.test(text),
    U:  /(\$|billion|million|per cent|percent|%|index|points)/i.test(text),
    D2: nums.length >= 2,
    D3: years.length >= 2,
    S:  DUDDS_S.test(text)
  };
}
function renderDudds(l,t){
  const w = work(l.id,t.id);
  const words = countWords(w.text || "");
  const min = t.minWords || 25;
  const res = duddsCheck(w.text || "");
  const done = taskDone(l.id,t.id);
  const labels = {
    D1:["D","Direction \u2014 which way is it moving"],
    U: ["U","Unit \u2014 $, billion, per cent"],
    D2:["D","Data \u2014 a figure at the start AND the end"],
    D3:["D","Dates \u2014 when it starts and finishes"],
    S: ["S", DUDDS_S.label]
  };
  return `
  ${t.chart
    ? `<img class="chart" src="${esc(t.chart)}" alt="Chart for this question">`
    : ``}
  ${t.table ? renderDataTable(t.table) : ``}
  <textarea oninput="writeText('${l.id}','${t.id}',this.value)" placeholder="Describe the trend\u2026">${esc(w.text || "")}</textarea>
  <div class="meter"><span data-wc>${words} words \u00b7 need ${min}</span></div>
  <div class="dudds">
    ${Object.keys(labels).map(k => `<span class="dcheck ${res[k]?"on":""}" data-d="${k}">
      <span class="k">${labels[k][0]}</span><span>${esc(labels[k][1])}</span></span>`).join("")}
  </div>
  <p class="mono" style="font-size:12px;color:var(--ink-soft);margin:10px 0 0">
    These ticks only check that each part is <em>present</em>. They do not check whether it is right.
  </p>
  <div class="actions">
    <button class="btn btn-teal btn-sm" data-submit ${words<min?"disabled":""}
      onclick="submitWritten('${l.id}','${t.id}')">${done?"Save changes":"Submit"}</button>
    ${done ? `<span class="done-note">Submitted ${esc(w.at||"")}</span>` : ``}
  </div>`;
}

/* ---- two truths and a lie ---- */
function renderTruths(l,t){
  const w = work(l.id,t.id);
  w.statements = w.statements || ["","",""];
  const filled = w.statements.every(s => countWords(s) >= 4);
  const ready = filled && w.lie !== undefined;
  const done = taskDone(l.id,t.id);
  return `
  <p class="prompt">Write three statements about ${esc(t.topic)}. Two must be true. One must be false \u2014 but it has to sound believable.</p>
  ${w.statements.map((s,i) => `
    <div class="tt-row">
      <span class="tt-tag">${i+1}</span>
      <input type="text" value="${esc(s)}" placeholder="Statement ${i+1}\u2026"
        oninput="ttWrite('${l.id}','${t.id}',${i},this.value)">
    </div>`).join("")}
  <div class="lie-pick">
    <span>Which one is the lie?</span>
    ${[0,1,2].map(i => `<button class="chip" aria-pressed="${w.lie===i}"
      onclick="ttLie('${l.id}','${t.id}',${i})">${i+1}</button>`).join("")}
  </div>
  <div class="actions">
    <button class="btn btn-teal btn-sm" ${ready?"":"disabled"} onclick="submitWritten('${l.id}','${t.id}')">
      ${done?"Save changes":"Submit"}</button>
    ${done ? `<span class="done-note">Submitted ${esc(w.at||"")}</span>` : ``}
  </div>`;
}
function ttWrite(lid,tid,i,val){
  const w = work(lid,tid); w.statements[i] = val; save();
  const scope = document.getElementById("task-"+tid);
  if(scope){
    const btn = scope.querySelector(".actions .btn");
    if(btn) btn.disabled = !(w.statements.every(s => countWords(s) >= 4) && w.lie !== undefined);
  }
}
function ttLie(lid,tid,i){ const w = work(lid,tid); w.lie = i; save(); render(); }

/* ============================================================================
   5. TEACHER VIEW
   ============================================================================ */

function goTeacher(){ view.page = "teacher"; view.teacher = { data:null, lesson:null, error:null }; render(); }

function viewTeacher(){
  const T = view.teacher;
  if(!T.data){
    return `
    <div style="padding:52px 0 0">
      <span class="eyebrow">Teacher</span>
      <h1 style="font-size:32px;margin:8px 0 16px">Class results</h1>
      <div style="display:flex;gap:10px;max-width:340px">
        <input type="text" id="pin" placeholder="PIN" inputmode="numeric" style="flex:1">
        <button class="btn" onclick="loadResults()">Open</button>
      </div>
      ${T.error ? `<div class="err">${esc(T.error)}</div>` : ``}
      <p style="margin-top:28px">
        <button class="linkish" onclick="backToStudent()">Back to student view</button>
        &nbsp;\u00b7&nbsp;
        <button class="linkish" onclick="clearDevice()">Clear this device</button>
      </p>
      <p style="color:var(--ink-soft);font-size:13.5px;max-width:48ch;margin:6px 0 0">
        Clearing wipes the saved name and answers on this computer only. Use it after you have
        tested the tasks yourself, so the next person starts fresh.
      </p>
    </div>`;
  }
  return T.lesson ? teacherLesson(T.lesson) : teacherOverview();
}
function backToStudent(){ view.page = S.name ? "hub" : "name"; render(); }

function loadResults(){
  const el = document.getElementById("pin");
  const pin = el ? el.value.trim() : "";
  if(pin !== PIN){ view.teacher.error = "That PIN is not right. Try again."; render(); return; }
  if(!CONNECTED){
    view.teacher.error = "No Worker URL is set, so nothing has been sent anywhere. "
      + "Open the file, replace WORKER_URL at the top with your Cloudflare Worker address, and commit. "
      + "Students' work is safe on their own devices in the meantime and will sync next time they open a lesson.";
    render(); return;
  }
  view.teacher.error = null;
  fetch(`${WORKER_URL}?hub=${encodeURIComponent(HUB)}&pin=${encodeURIComponent(pin)}`)
    .then(r => r.json())
    .then(j => {
      if(j && j.error){ view.teacher.error = "The Worker rejected the request: " + j.error; render(); return; }
      view.teacher.data = groupResults(j.results || []);
      render();
    })
    .catch(() => { view.teacher.error = "Could not reach the Worker. Check WORKER_URL at the top of the file."; render(); });
}

/* Group by slug; where a student and lesson appear twice, keep the fuller record. */
function groupResults(rows){
  const by = {};
  rows.forEach(r => {
    const slug = r.slug || slugify(r.name || "");
    if(!slug) return;
    by[slug] = by[slug] || { slug, name: r.name || slug, lessons:{} };
    if(r.name && r.name.length > by[slug].name.length) by[slug].name = r.name;
    const lid = r.lesson;
    if(!lid) return;
    const prev = by[slug].lessons[lid];
    const size = JSON.stringify(r.written || {}).length + ((r.progress && r.progress.done) || 0) * 1000;
    if(!prev || size > prev.__size){ by[slug].lessons[lid] = Object.assign({ __size:size }, r); }
  });
  const roll = ROLL.map(n => slugify(n));
  return {
    onRoll: ROLL.map(n => by[slugify(n)] || { slug:slugify(n), name:n, lessons:{} }),
    offRoll: Object.values(by).filter(s => roll.indexOf(s.slug) === -1)
  };
}

function teacherOverview(){
  const { onRoll, offRoll } = view.teacher.data;
  const live = liveLessons();
  return `
  <div style="padding:44px 0 0">
    <span class="eyebrow">Teacher \u00b7 hub ${esc(HUB)}</span>
    <h1 style="font-size:32px;margin:8px 0 4px">Class overview</h1>
    <p style="color:var(--ink-soft);margin:0">Tasks completed per lesson. Tap a lesson to read what they wrote.</p>
    <div class="grid-wrap">
      <table>
        <thead><tr><th>Student</th>
          ${live.map(l => `<th style="text-align:center;cursor:pointer" onclick="openTeacherLesson('${l.id}')">${esc(l.id)}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${onRoll.map(s => `<tr>
            <td class="nm">${esc(s.name)}</td>
            ${live.map(l => {
              const rec = s.lessons[l.id];
              const done = rec && rec.progress ? rec.progress.done : 0;
              const tot = l.tasks.length;
              const cls = done === 0 ? "" : (done >= tot ? "full" : "part");
              return `<td class="cell ${cls}">${done}/${tot}</td>`;
            }).join("")}
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="toolbar">
      ${live.map(l => `<button class="btn btn-ghost btn-sm" onclick="openTeacherLesson('${l.id}')">${esc(l.id)} \u00b7 ${esc(l.title)}</button>`).join("")}
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">Download CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="backToStudent()">Back to student view</button>
    </div>
    ${offRoll.length ? `
      <h3 style="margin-top:34px;font-size:19px">Records not on the roll</h3>
      <p style="color:var(--ink-soft);font-size:14.5px;margin:4px 0 0">Left over from a name that has since changed. Delete them here.</p>
      ${offRoll.map(s => `<div class="resp" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <span><b>${esc(s.name)}</b> <span class="mono" style="color:var(--ink-soft)">${esc(s.slug)} \u00b7 ${Object.keys(s.lessons).length} lesson(s)</span></span>
        <button class="btn btn-ghost btn-sm" onclick="deleteStudent('${esc(s.name).replace(/'/g,"\\'")}')">Delete</button>
      </div>`).join("")}` : ``}
  </div>`;
}
function openTeacherLesson(id){ view.teacher.lesson = id; render(); }

function teacherLesson(lid){
  const l = lessonById(lid);
  const { onRoll } = view.teacher.data;
  const complete = onRoll.filter(s => { const r = s.lessons[lid]; return r && r.progress && r.progress.complete; }).length;
  return `
  <div style="padding:36px 0 0">
    <button class="linkish no-print" onclick="view.teacher.lesson=null;render()">\u2190 Class overview</button>
    <span class="eyebrow" style="display:block;margin-top:14px">${esc(l.chapter)}</span>
    <h1 style="font-size:30px;margin:6px 0 4px">${esc(l.title)}</h1>
    <p class="mono" style="font-size:13px;color:var(--ink-soft);margin:0">
      ${complete} of ${onRoll.length} finished all ${l.tasks.length} tasks
    </p>
    <div class="toolbar no-print">
      <button class="btn btn-ghost btn-sm" onclick="window.print()">Print</button>
    </div>
    ${onRoll.map(s => {
      const rec = s.lessons[lid];
      const p = rec && rec.progress;
      const wr = (rec && rec.written) || {};
      const hasAny = p || Object.keys(wr).length;
      return `<div class="resp">
        <h4>${esc(s.name)}</h4>
        <div class="resp-meta">${hasAny
          ? `${p ? p.done : 0} of ${l.tasks.length} tasks \u00b7 ${esc((p && p.updated) || "")}`
          : `nothing submitted`}</div>
        ${!hasAny ? `<p class="resp-none">Nothing submitted.</p>` : l.tasks.map(t => {
          const a = wr[t.id];
          const ticked = p && p.tasks && p.tasks[t.id];
          if(!a) return `<p class="resp-none">${esc(t.title)} \u2014 ${ticked ? "done (no writing in this task)" : "not done"}</p>`;
          return `<div style="margin-top:12px">
            <span class="eyebrow">${esc(t.title)}${a.marks?` \u00b7 ${a.marks} marks`:``}</span>
            <div class="resp-text">${nl2br(a.text)}</div>
            <div class="resp-meta">${a.words} words \u00b7 ${esc(a.at || "")}</div>
            ${renderTags(t, a)}
          </div>`;
        }).join("")}
      </div>`;
    }).join("")}
  </div>`;
}
function renderTags(t, a){
  const c = a.check || {};
  const keys = Object.keys(c);
  if(!keys.length) return "";
  if(t.type === "dudds"){
    return `<div class="tags">${keys.map(k =>
      `<span class="tag ${c[k]?"on":"off"}">${esc(k)}</span>`).join("")}</div>`;
  }
  if(!t.checks) return "";
  return `<div class="tags">${t.checks.map((label,i) =>
    `<span class="tag ${c[i]?"on":"off"}">${c[i]?"\u2713":"\u2717"} ${esc(label)}</span>`).join("")}</div>`;
}

function exportCSV(){
  const { onRoll } = view.teacher.data;
  const live = liveLessons();
  const rows = [["Student","Lesson","Tasks done","Total","Complete","Task","Words","Response","Submitted"]];
  onRoll.forEach(s => live.forEach(l => {
    const rec = s.lessons[l.id];
    const p = (rec && rec.progress) || { done:0, total:l.tasks.length, complete:false, updated:"" };
    const wr = (rec && rec.written) || {};
    const ids = Object.keys(wr);
    if(!ids.length){
      rows.push([s.name, l.id, p.done, l.tasks.length, p.complete?"Y":"N", "", "", "", p.updated||""]);
    } else {
      ids.forEach(id => {
        const a = wr[id];
        rows.push([s.name, l.id, p.done, l.tasks.length, p.complete?"Y":"N", a.title, a.words, a.text, a.at||""]);
      });
    }
  }));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = `trade-${HUB}-${stamp().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* Hub-scoped delete. NEVER omit hub — that deletes across every hub on the Worker. */
function deleteStudent(name){
  if(!confirm(`Delete every ${HUB} record for ${name}? This cannot be undone.`)) return;
  fetch(`${WORKER_URL}?pin=${encodeURIComponent(PIN)}&hub=${encodeURIComponent(HUB)}&name=${encodeURIComponent(name)}`, { method:"DELETE" })
    .then(() => { view.teacher.data = null; loadResults(); toast("Deleted"); })
    .catch(() => toast("Delete failed", true));
}

function clearDevice(){
  if(!confirm("Clear the saved name and all answers on this computer? Work already sent to the Worker is not affected.")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = { name:null, slug:null, work:{} };
  view = { page:"name", lesson:null, teacher:{ data:null, lesson:null, error:null } };
  render();
}

/* ---- expose for inline handlers ---- */
Object.assign(window, {
  pick, switchUser, openLesson, goHub, goTeacher, backToStudent, loadResults, clearDevice,
  matchPick, matchCheck, sortPick, sortCheck, choicePick, choiceSubmit,
  writeText, tick, submitWritten, ttWrite, ttLie,
  openTeacherLesson, exportCSV, deleteStudent, view, render
});

render();
</script>
