<style>
:root{--ink:#17223B;--soft:#5B6478;--paper:#E9ECF1;--card:#fff;--rule:#D2D8E0;
--right:#1B7F5A;--trap:#A8324A;--bar:#C3C9D2;--warn:#B6801F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:26px 20px 80px}
header{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:13px;border-bottom:2px solid var(--ink);margin-bottom:24px}
h1{font:500 19px/1.2 'IBM Plex Sans';margin:0}
.count{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:22px;margin-bottom:14px}
.src{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;margin-bottom:11px}
.stem{font:400 19px/1.5 'IBM Plex Serif',Georgia,serif;margin:0 0 18px}
button{font-family:inherit;color:inherit}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:none;cursor:pointer;border:1px solid var(--rule);border-radius:3px;padding:12px 14px;margin-bottom:8px;font:400 16px/1.45 'IBM Plex Sans'}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
fieldset{border:0;padding:0;margin:20px 0 0}
legend{font-size:14px;color:var(--soft);padding:0 0 8px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{flex:1;min-width:98px;background:none;border:1px solid var(--rule);border-radius:3px;padding:10px;cursor:pointer;font:500 14px 'IBM Plex Sans'}
.pills button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.go{margin-top:18px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:3px;padding:14px;font:500 16px 'IBM Plex Sans';cursor:pointer}
.go:disabled{background:var(--rule);color:#8A93A3;cursor:not-allowed}
.verdict{font:500 16px;margin:0 0 4px}.verdict.ok{color:var(--right)}.verdict.no{color:var(--trap)}
.state{font-size:14px;color:var(--soft);margin:0 0 14px}
.state b{color:var(--ink)}
.row{display:grid;grid-template-columns:18px 1fr 42px;gap:10px;align-items:center;margin-bottom:7px}
.ltr{font-weight:600;font-variant-numeric:tabular-nums}
.track{height:21px;background:#F1F3F6;border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--bar)}.fill.r{background:var(--right)}.fill.t{background:var(--trap)}
.pct{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;color:var(--soft)}
.mine{font-size:12px;font-weight:600}
.note{margin:15px 0 0;padding:13px 15px;background:#F4F6F9;border-radius:3px;font-size:15px;line-height:1.5}
.why{background:#FBF7E8;border-left:3px solid var(--ink);padding:13px 15px;margin:16px 0 0}
.why p{margin:0 0 9px;font-size:15px}
input[type=text]{width:100%;padding:10px;border:1px solid var(--rule);border-radius:3px;font:400 15px 'IBM Plex Sans';background:#fff;color:var(--ink)}
.slot{border-left:3px solid var(--trap);padding-left:15px;margin:0 0 22px}
.slot h3{font:500 16px;margin:0 0 3px}
.slot .meta{font-size:13px;color:var(--soft);margin:0 0 7px}
.quote{font:400 15px/1.5 'IBM Plex Serif',serif;border-left:2px solid var(--rule);padding-left:12px;margin:7px 0}
.tally{display:flex;gap:22px;font-variant-numeric:tabular-nums;margin:0 0 18px;font-size:14px;color:var(--soft)}
.tally b{display:block;font:600 26px;color:var(--ink)}
.flag{background:#FDF6E3;border-left:3px solid var(--warn);padding:12px 15px;margin:16px 0 0;font-size:15px}
.choose button{display:block;width:100%;text-align:left;background:none;border:1px solid var(--rule);border-radius:3px;padding:14px 16px;margin-bottom:9px;cursor:pointer}
.choose b{display:block;font:500 16px;margin-bottom:2px}
.choose span{font-size:14px;color:var(--soft)}
code{background:#F1F3F6;padding:2px 5px;border-radius:2px;font-size:13px;word-break:break-all}
@media(prefers-reduced-motion:no-preference){.fill{transition:width .5s ease-out}}

<script>
/* ---- Portal Integration Contract: Parts 1 & 2 ---- */
const KEY = cw => "econ2026:" + cw;
const MEM = {};
const Store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){}
    return MEM[k] || null;
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); return; }catch(e){}
    MEM[k]=v;
  }
};
const clean = s => (s||"").toLowerCase().replace(/\s+/g,"");
const DAY = 86400000;
/* Gaps sized for a ~40 day run to the exam. Missed twice, it comes back sooner;
   fixed on the return, it comes back once more to confirm, then rests. */
function dueIn(h){
  const last=h[h.length-1];
  if(last.ok){
    const missedBefore = h.some(r=>!r.ok);
    return missedBefore && h.filter(r=>r.ok).length<2 ? 12*DAY : null;  // one confirmation, then done
  }
  const misses=h.filter(r=>!r.ok).length;
  return misses>=2 ? 3*DAY : 6*DAY;
}
function isDue(h,now){ const g=dueIn(h); return g!==null && (now-h[h.length-1].ts)>=g; }
let HIST = {};        // question id -> attempts, newest last
let LAST = 0;         // ts of most recent mc attempt
async function loadHistory(cw){
  HIST={}; LAST=0;
  try{
    const raw = await Store.get(KEY(cw));
    if(!raw) return;
    const S=JSON.parse(raw);
    (S.pr||[]).filter(r=>r.t==='mc').forEach(r=>{
      const id = '20'+String(r.set).slice(4)+'-Q'+r.q;
      (HIST[id]=HIST[id]||[]).push(r);
      if(r.ts>LAST) LAST=r.ts;
    });
    Object.values(HIST).forEach(a=>a.sort((x,y)=>x.ts-y.ts));
  }catch(e){}
}
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
async function pushAttempts(cw, rows){
  const raw = await Store.get(KEY(cw));
  const S = raw ? JSON.parse(raw) : {v:1, cw};      // read
  S.pr = S.pr || [];                                 // modify only our branch
  rows.forEach(r => S.pr.push(r));
  await Store.set(KEY(cw), JSON.stringify(S));       // write
  return S;
}

const BANK = [{"id": "2013-Q1", "set": "vcaa13", "year": 2013, "q": 1, "stem": "Which one of the following would have a different effect on the overall level of aggregate demand from that of the other three?", "opt": {"A": "an increase in savings", "B": "an increase in investment", "C": "an increase in net exports", "D": "an increase in government spending"}, "ans": "A", "dist": {"A": 81, "B": 2, "C": 9, "D": 7}, "cp": 81, "band": "fluency", "trap": "C", "trapPct": 9, "task": "task2_why_tempting", "kk": "3.2.4", "kkText": "the meaning and importance of aggregate demand and the factors affecting it", "note": ""}, {"id": "2013-Q2", "set": "vcaa13", "year": 2013, "q": 2, "stem": "The effect of an introduction of a carbon tax of $23 per tonne of CO2 emissions on the market for electricity that is generated from burning coal would be to", "opt": {"A": "shift the supply curve to the left and cause a contraction in supply", "B": "shift the supply curve to the left and cause a contraction in demand", "C": "shift the demand curve to the left and cause a contraction in supply", "D": "shift the demand curve to the left and cause a contraction in demand"}, "ans": "B", "dist": {"A": 21, "B": 53, "C": 18, "D": 8}, "cp": 53, "band": "stretch", "trap": "A", "trapPct": 21, "task": "task2_why_tempting", "kk": "3.1.17", "kkText": "government intervention - indirect taxation, subsidies, regulations, advertising and direct provision", "note": "A tax on producers raises their costs, so the SUPPLY curve shifts left. Price rises and consumers respond by moving along their demand curve - a contraction in DEMAND. The 21% who said contraction in supply put a shift and a movement on the same curve, which cannot happen at once."}, {"id": "2013-Q3", "set": "vcaa13", "year": 2013, "q": 3, "stem": "Which one of the following policy decisions is likely to have a different effect on aggregate supply from that of the other three?", "opt": {"A": "an increase in the pension qualification age from 65 to 70 years", "B": "the payment of a subsidy to parents to cover the cost of childcare", "C": "an increase in the minimum school leaving age from 15 to 17 years", "D": "relaxation of the criteria that need to be met in order to qualify as a skilled migrant to Australia"}, "ans": "C", "dist": {"A": 4, "B": 15, "C": 62, "D": 18}, "cp": 62, "band": "solid", "trap": "D", "trapPct": 18, "task": "task2_why_tempting", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2013-Q4", "set": "vcaa13", "year": 2013, "q": 4, "stem": "Which one of the following is not an example of an automatic stabiliser?", "opt": {"A": "unemployment benefits", "B": "social welfare payments", "C": "progressive income taxes", "D": "salaries paid to public servants"}, "ans": "D", "dist": {"A": 3, "B": 3, "C": 12, "D": 81}, "cp": 81, "band": "fluency", "trap": "C", "trapPct": 12, "task": "task2_why_tempting", "kk": "4.1.8", "kkText": "the role of automatic stabilisers (cyclical component) in influencing AD and stabilising the business cycle", "note": ""}, {"id": "2013-Q6", "set": "vcaa13", "year": 2013, "q": 6, "stem": "In a given year, an increase in the trade-weighted index (TWI) is least likely to", "opt": {"A": "distort income distribution in favour of Australian importing firms relative to Australian exporting firms", "B": "assist with the lessening of cost pressures for Australian businesses", "C": "result in greater leakages of spending out of the Australian economy", "D": "contribute to an improvement in net external demand (X\u2013M)"}, "ans": "D", "dist": {"A": 18, "B": 16, "C": 16, "D": 49}, "cp": 49, "band": "stretch", "trap": "A", "trapPct": 18, "task": "task4_link_prior", "kk": "3.3.5", "kkText": "the exchange rate - meaning, measurement and the factors affecting its value", "note": "A higher TWI makes exports dearer and imports cheaper, so net external demand (X-M) gets WORSE. The 18% who chose the income distribution option picked something a rising dollar genuinely does cause - importers gain, exporters lose - which is why it reads well."}, {"id": "2013-Q7", "set": "vcaa13", "year": 2013, "q": 7, "stem": "Which one of the following statements regarding Real Gross Domestic Product (GDP) is false?", "opt": {"A": "Real GDP excludes the costs that are associated with negative externalities", "B": "Real GDP imputes the value of government services that are provided free of charge", "C": "Real GDP includes home-based production, such as do-it-yourself home maintenance", "D": "Real GDP measures the change in the value of goods and services that are produced over a period of time, adjusted for rates of inflation"}, "ans": "C", "dist": {"A": 8, "B": 6, "C": 79, "D": 6}, "cp": 79, "band": "solid", "trap": "A", "trapPct": 8, "task": "task2_why_tempting", "kk": "3.2.7", "kkText": "measurement of economic growth using growth in real GDP", "note": ""}, {"id": "2013-Q8", "set": "vcaa13", "year": 2013, "q": 8, "stem": "If the RBA implements an expansionary monetary policy, the likely effect on consumer spending and on the household savings ratio would be that", "opt": {"A": "consumer spending falls and the household savings ratio rises", "B": "consumer spending rises and the household savings ratio falls", "C": "consumer spending falls and the household savings ratio falls", "D": "consumer spending rises and the household savings ratio rises"}, "ans": "B", "dist": {"A": 6, "B": 87, "C": 2, "D": 5}, "cp": 87, "band": "fluency", "trap": "A", "trapPct": 6, "task": "none", "kk": "4.1.17", "kkText": "the transmission mechanism and its effect on AD: savings and investment, cash flow, exchange rate, asset prices and wealth", "note": ""}, {"id": "2013-Q9", "set": "vcaa13", "year": 2013, "q": 9, "stem": "An improvement in average material living standards in Australia is", "opt": {"A": "not achievable if there has been a decline in non-material living standards", "B": "considered to have occurred if there has been an increase in Real GDP per capita over time", "C": "possible only if the Australian Government has successfully achieved its goal of equity in income distribution", "D": "more likely to occur in a period of macroeconomic contraction of the global economy, placing Australia in a position of global competitive advantage"}, "ans": "B", "dist": {"A": 5, "B": 72, "C": 11, "D": 12}, "cp": 72, "band": "solid", "trap": "D", "trapPct": 12, "task": "task2_why_tempting", "kk": "3.2.1", "kkText": "the difference between material and non-material living standards and the factors affecting them", "note": ""}, {"id": "2013-Q10", "set": "vcaa13", "year": 2013, "q": 10, "stem": "For a hypothetical economy:<br>unemployed persons 5 million<br>underemployed persons 7 million<br>labour force 100 million<br>total population aged over 15 years 150 million<br><br>Based on the data shown above, the labour force under-utilisation rate is", "opt": {"A": "5 per cent", "B": "7 per cent", "C": "12 per cent", "D": "66 per cent"}, "ans": "C", "dist": {"A": 4, "B": 33, "C": 59, "D": 4}, "cp": 59, "band": "stretch", "trap": "B", "trapPct": 33, "task": "task2_why_tempting", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": "Underemployed people are only half the story. Under-utilisation counts the unemployed AND the underemployed, over the labour force."}, {"id": "2013-Q11", "set": "vcaa13", "year": 2013, "q": 11, "stem": "What would be the effect of an increase in net capital inflow on the Australian currency?", "opt": {"A": "an increase in the demand for the Australian dollar and an appreciation of the currency", "B": "a decrease in the demand for the Australian dollar and a depreciation of the currency", "C": "an increase in the supply of the Australian dollar and an appreciation of the currency", "D": "a decrease in the supply of the Australian dollar and a depreciation of the currency"}, "ans": "A", "dist": {"A": 74, "B": 8, "C": 14, "D": 3}, "cp": 74, "band": "solid", "trap": "C", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.3.5", "kkText": "the exchange rate - meaning, measurement and the factors affecting its value", "note": ""}, {"id": "2013-Q12", "set": "vcaa13", "year": 2013, "q": 12, "stem": "The prices of imported manufactured goods in Australia have decreased in recent years. Which one of the following is unlikely to have been a result of this trend?", "opt": {"A": "an expansion in demand for imports by Australian consumers", "B": "reduced profitability and decreased company taxation revenue derived from domestic manufacturing industries", "C": "an increase in the value of merchandise debits (merchandise import payments) in the current account of the balance of payments", "D": "increased employment in import-competing (import-replacement) industries, such as the Australian car-manufacturing industry"}, "ans": "D", "dist": {"A": 14, "B": 17, "C": 17, "D": 52}, "cp": 52, "band": "stretch", "trap": "C", "trapPct": 17, "task": "task4_link_prior", "kk": "3.3.5", "kkText": "the exchange rate - meaning, measurement and the factors affecting its value", "note": "Cheaper imports pull customers away from local producers, so employment in import-competing industries FALLS. The 17% who chose higher merchandise debits picked something cheaper imports genuinely cause, as volumes rise - the question asked for the one that would not happen."}, {"id": "2013-Q13", "set": "vcaa13", "year": 2013, "q": 13, "stem": "The promoter of a theatre play discounted the price of admission by 30 per cent, which resulted in average attendances rising by 50 per cent. Based on this data, it could be concluded that there is an", "opt": {"A": "elastic demand", "B": "inelastic demand", "C": "elastic supply", "D": "inelastic supply"}, "ans": "A", "dist": {"A": 88, "B": 7, "C": 4, "D": 1}, "cp": 88, "band": "fluency", "trap": "B", "trapPct": 7, "task": "none", "kk": "3.1.11", "kkText": "the meaning and significance of price elasticity of demand and supply", "note": ""}, {"id": "2013-Q15", "set": "vcaa13", "year": 2013, "q": 15, "stem": "Which one of the following characteristics is not shared by the market structures of perfect competition and monopolistic competition?", "opt": {"A": "a large number of buyers", "B": "a large number of sellers", "C": "low barriers to entry", "D": "identical products"}, "ans": "D", "dist": {"A": 4, "B": 14, "C": 14, "D": 68}, "cp": 68, "band": "solid", "trap": "C", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.1.3", "kkText": "the conditions for a free and perfectly competitive market", "note": ""}, {"id": "2014-Q1", "set": "vcaa14", "year": 2014, "q": 1, "stem": "A major determinant of demand in one particular market could be the", "opt": {"A": "cost of raw materials", "B": "method of production", "C": "number of sellers in the market", "D": "disposable incomes of buyers in the market"}, "ans": "D", "dist": {"A": 3, "B": 1, "C": 5, "D": 90}, "cp": 90, "band": "fluency", "trap": "C", "trapPct": 5, "task": "none", "kk": "3.1.6", "kkText": "non-price factors affecting demand and the position of the demand curve", "note": ""}, {"id": "2014-Q2", "set": "vcaa14", "year": 2014, "q": 2, "stem": "Which one of the following would be recorded as a debit in Australia\u2019s balance of payments on current account?", "opt": {"A": "the sale of Australian wool to Italy", "B": "an increase in the number of foreign tourists visiting Australia", "C": "interest paid on Australian Government bonds to overseas investors", "D": "a Chinese company purchasing a farming property in rural Australia"}, "ans": "C", "dist": {"A": 9, "B": 4, "C": 83, "D": 4}, "cp": 83, "band": "fluency", "trap": "A", "trapPct": 9, "task": "task2_why_tempting", "kk": "3.3.2", "kkText": "the balance of payments and its components", "note": ""}, {"id": "2014-Q3", "set": "vcaa14", "year": 2014, "q": 3, "stem": "Market power exists when A. the government taxes companies and individuals. B. consumers exercise consumer sovereignty in the market. C. activity in overseas economies influences Australia\u2019s exchange rate. D. a business is able to influence the price of a product by exercising control over demand, supply or both", "opt": {"A": "the government taxes companies and individuals", "B": "consumers exercise consumer sovereignty in the market", "C": "activity in overseas economies influences Australia\u2019s exchange rate", "D": "a business is able to influence the price of a product by exercising control over demand, supply or both"}, "ans": "D", "dist": {"A": 1, "B": 7, "C": 1, "D": 92}, "cp": 92, "band": "fluency", "trap": "B", "trapPct": 7, "task": "none", "kk": "3.1.3", "kkText": "the conditions for a free and perfectly competitive market", "note": ""}, {"id": "2014-Q4", "set": "vcaa14", "year": 2014, "q": 4, "stem": "The effect on the market for product A from a rise in the price of a complementary product B will", "opt": {"A": "shift the demand curve right and increase the equilibrium price", "B": "shift the demand curve left and decrease the equilibrium price", "C": "shift the supply curve left and increase the equilibrium price", "D": "shift the supply curve right and decrease the equilibrium price"}, "ans": "B", "dist": {"A": 30, "B": 58, "C": 8, "D": 4}, "cp": 58, "band": "stretch", "trap": "A", "trapPct": 30, "task": "task2_why_tempting", "kk": "3.1.6", "kkText": "non-price factors affecting demand and the position of the demand curve", "note": "If B's price rises, people buy less B \u2014 and therefore less A alongside it. Demand for A shifts LEFT. The 30% who shifted it right did what a SUBSTITUTE does, not a complement."}, {"id": "2014-Q6", "set": "vcaa14", "year": 2014, "q": 6, "stem": "Which of the following events, or combination of events, may result in the Reserve Bank of Australia (RBA) adopting a more restrictive monetary policy stance?", "opt": {"A": "an increase in the world oil price over two consecutive months", "B": "an increase in the growth of both credit and the household debt to income ratio, combined with a rapid depreciation of the Australian dollar", "C": "an increase in the official ABS unemployment rate and evidence of a higher level of labour force under-utilisation", "D": "a decrease in consumer confidence and aggregate demand, accompanied by renewed concerns about declining rates of economic growth in the economies of Australia\u2019s major trading partners"}, "ans": "B", "dist": {"A": 18, "B": 66, "C": 7, "D": 9}, "cp": 66, "band": "solid", "trap": "A", "trapPct": 18, "task": "task2_why_tempting", "kk": "4.1.18", "kkText": "the stance: expansionary (accommodative), contractionary (restrictive) or neutral", "note": ""}, {"id": "2014-Q8", "set": "vcaa14", "year": 2014, "q": 8, "stem": "Which one of the following is an example of discretionary budgetary policy?", "opt": {"A": "a decrease in the cash interest rate target", "B": "a decrease in the company tax rate from 30 per cent to 29 per cent", "C": "an increase in welfare payments due to a rise in cyclical unemployment", "D": "lower revenue from a minerals resource rent tax (MRRT) due to falling commodity prices"}, "ans": "B", "dist": {"A": 4, "B": 77, "C": 13, "D": 5}, "cp": 77, "band": "solid", "trap": "C", "trapPct": 13, "task": "task2_why_tempting", "kk": "4.1.9", "kkText": "the role of discretionary stabilisers (structural component) in influencing AD and stabilising the business cycle", "note": ""}, {"id": "2014-Q9", "set": "vcaa14", "year": 2014, "q": 9, "stem": "Which one of the following is least likely to increase productivity?", "opt": {"A": "labour skills training", "B": "innovation in work practices", "C": "investment in physical capital", "D": "a decline in competition in the market"}, "ans": "D", "dist": {"A": 3, "B": 2, "C": 3, "D": 92}, "cp": 92, "band": "fluency", "trap": "C", "trapPct": 3, "task": "none", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2014-Q11", "set": "vcaa14", "year": 2014, "q": 11, "stem": "Which one of the following is not an example of private investment expenditure (I) as a component of aggregate demand?", "opt": {"A": "A small-business owner purchases new capital equipment for a production plant", "B": "There is an increase in young married couples in Australia employing residential construction companies to build new dwellings", "C": "A small business chooses to increase production volumes while operating costs are relatively low and consciously boosts the company\u2019s stock holdings in the short term", "D": "Australian householders become cautious about future employment prospects and increase their savings in bank accounts as a means of securing their future spending capacity"}, "ans": "D", "dist": {"A": 4, "B": 16, "C": 13, "D": 67}, "cp": 67, "band": "solid", "trap": "B", "trapPct": 16, "task": "task2_why_tempting", "kk": "3.2.4", "kkText": "the meaning and importance of aggregate demand and the factors affecting it", "note": ""}, {"id": "2014-Q12", "set": "vcaa14", "year": 2014, "q": 12, "stem": "Which one of the following government initiatives is most likely to improve non-material living standards in Australia?", "opt": {"A": "increased public resources directed to the provision of support services for domestic dispute resolution", "B": "the introduction of industrial relations reforms that encourage businesses to negotiate directly with employees on extended working hours", "C": "a high priority given to restoring the budget balance through significant cutbacks in expenditure on infrastructure development throughout Australia", "D": "the successful monetary policy containment of inflation within the target zone, allowing for a slow and steady increase in real household disposable income and Real Gross Domestic Product (GDP) per capita"}, "ans": "A", "dist": {"A": 69, "B": 17, "C": 3, "D": 10}, "cp": 69, "band": "solid", "trap": "B", "trapPct": 17, "task": "task2_why_tempting", "kk": "3.2.1", "kkText": "the difference between material and non-material living standards and the factors affecting them", "note": ""}, {"id": "2014-Q13", "set": "vcaa14", "year": 2014, "q": 13, "stem": "Suppose Australia\u2019s interest rates are increased while the interest rates of its major trading partners remain unchanged. Which one of the following combinations is most likely to result?", "opt": {"A": "the supply of Australian dollars increases and the trade-weighted index (TWI) increases", "B": "the supply of Australian dollars decreases and the TWI decreases", "C": "the supply of Australian dollars increases and the TWI decreases", "D": "the supply of Australian dollars decreases and the TWI increases"}, "ans": "D", "dist": {"A": 21, "B": 16, "C": 16, "D": 46}, "cp": 46, "band": "stretch", "trap": "A", "trapPct": 21, "task": "task2_why_tempting", "kk": "3.3.5", "kkText": "the exchange rate - meaning, measurement and the factors affecting its value", "note": "Higher Australian rates make holding the dollar more attractive, so fewer people sell it. Supply of AUD DECREASES and the TWI rises. The 21% who had supply increasing described what happens when rates FALL."}, {"id": "2014-Q14", "set": "vcaa14", "year": 2014, "q": 14, "stem": "Assume average wages in the national economy have increased by 5 per cent per annum and average labour productivity has increased by 2 per cent per annum. Which one of the following is the most likely outcome of these increases?", "opt": {"A": "an increase in real wages and a rise in the operating profits of Australian businesses", "B": "an improvement in equity in income distribution as a result of the likelihood of declining unemployment", "C": "an increase in inflationary pressures, reducing the price competitiveness of Australian exports and import-competing goods", "D": "a significant increase in business confidence levels, resulting in much higher levels of investment by business owners in new capital resources"}, "ans": "C", "dist": {"A": 19, "B": 12, "C": 57, "D": 11}, "cp": 57, "band": "stretch", "trap": "A", "trapPct": 19, "task": "task2_why_tempting", "kk": "3.2.17", "kkText": "causes of inflation - demand inflation and cost inflation", "note": "Wages up 5% against productivity up 2% means unit labour costs rise 3%. That is cost inflation, and it damages price competitiveness. The 19% who chose higher profits had it backwards - costs rising faster than productivity squeezes margins, it does not widen them."}, {"id": "2015-Q1", "set": "vcaa15", "year": 2015, "q": 1, "stem": "An increase in the demand for aged-care facilities is most likely to occur when there is", "opt": {"A": "an increase in average life expectancy", "B": "an increase in the wages paid to staff in aged-care facilities", "C": "an increase in the cost of providing aged-care facilities and services", "D": "a decrease in government subsidies for aged-care facilities and services"}, "ans": "A", "dist": {"A": 93, "B": 2, "C": 2, "D": 3}, "cp": 93, "band": "fluency", "trap": "D", "trapPct": 3, "task": "none", "kk": "3.1.6", "kkText": "non-price factors affecting demand and the position of the demand curve", "note": ""}, {"id": "2015-Q2", "set": "vcaa15", "year": 2015, "q": 2, "stem": "A less favourable movement in the terms of trade means that", "opt": {"A": "export prices and import prices have fallen", "B": "export prices and import prices have risen", "C": "export prices have risen relative to import prices", "D": "import prices have risen relative to export prices"}, "ans": "D", "dist": {"A": 2, "B": 3, "C": 10, "D": 85}, "cp": 85, "band": "fluency", "trap": "C", "trapPct": 10, "task": "none", "kk": "3.3.6", "kkText": "the terms of trade - meaning, measurement and the factors affecting it", "note": ""}, {"id": "2015-Q3", "set": "vcaa15", "year": 2015, "q": 3, "stem": "The effect on the market for product A of a rise in the price of a substitute product B will be to", "opt": {"A": "shift the demand curve left and decrease the equilibrium price of product A", "B": "shift the demand curve right and increase the equilibrium price of product A", "C": "shift the supply curve left and increase the equilibrium price of product A", "D": "shift the supply curve right and decrease the equilibrium price of product A"}, "ans": "B", "dist": {"A": 8, "B": 82, "C": 5, "D": 5}, "cp": 82, "band": "fluency", "trap": "A", "trapPct": 8, "task": "task2_why_tempting", "kk": "3.1.6", "kkText": "non-price factors affecting demand and the position of the demand curve", "note": ""}, {"id": "2015-Q5", "set": "vcaa15", "year": 2015, "q": 5, "stem": "The opportunity cost of diverting increased federal budget outlays to the funding of tertiary institutions from one \ufb01scal year to the next would be measured by", "opt": {"A": "the difference, in dollar terms, in funding tertiary institutions from one year to the next", "B": "the satisfaction forgone by not allocating the additional federal budget outlays to the next best alternative use", "C": "the difference in quality of educational outcomes achieved by tertiary institutions from one year to the next", "D": "the total \ufb01nancial cost of funding tertiary institutions compared to the \ufb01nancial bene\ufb01ts achieved by the national economy of a more highly educated labour force"}, "ans": "B", "dist": {"A": 7, "B": 69, "C": 9, "D": 14}, "cp": 69, "band": "solid", "trap": "D", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.1.1", "kkText": "relative scarcity, needs, wants, resources, opportunity cost, the PPF model and the three basic economic questions", "note": ""}, {"id": "2015-Q6", "set": "vcaa15", "year": 2015, "q": 6, "stem": "What is the most likely effect of a decrease in the tariff on an imported product?", "opt": {"A": "a loss of jobs for overseas suppliers", "B": "a fall in the price of the domestic product", "C": "a rise in the price of the domestic product", "D": "an increase in employment in the domestic sector"}, "ans": "B", "dist": {"A": 2, "B": 83, "C": 12, "D": 3}, "cp": 83, "band": "fluency", "trap": "C", "trapPct": 12, "task": "task2_why_tempting", "kk": "4.2.5", "kkText": "trade liberalisation and its short and long-term effects", "note": ""}, {"id": "2015-Q7", "set": "vcaa15", "year": 2015, "q": 7, "stem": "Which one of the following would be an example of a structurally unemployed person?", "opt": {"A": "a ski instructor who is looking for alternative employment during summer", "B": "an accountant who has left their job to travel overseas to gain more experience in their profession", "C": "a cash register operator at a supermarket who has been replaced by self-service check-out machines", "D": "a construction worker who has not worked recently due to an economic downturn in the building and construction industry"}, "ans": "C", "dist": {"A": 3, "B": 3, "C": 85, "D": 9}, "cp": 85, "band": "fluency", "trap": "D", "trapPct": 9, "task": "none", "kk": "3.2.12", "kkText": "the difference between cyclical and structural unemployment", "note": ""}, {"id": "2015-Q8", "set": "vcaa15", "year": 2015, "q": 8, "stem": "An expansion in the quantity supplied would be shown graphically as a", "opt": {"A": "movement up the supply curve", "B": "shift to the left of the supply curve", "C": "shift to the right of the supply curve", "D": "movement down the supply curve"}, "ans": "A", "dist": {"A": 52, "B": 4, "C": 40, "D": 4}, "cp": 52, "band": "stretch", "trap": "C", "trapPct": 40, "task": "task2_why_tempting", "kk": "3.1.8", "kkText": "the supply curve, including movements along and shifts of the curve", "note": "An expansion is a movement along the existing supply curve caused by a price change. A shift means a non-price factor changed."}, {"id": "2015-Q9", "set": "vcaa15", "year": 2015, "q": 9, "stem": "The average material living standards of Australian households may decline if", "opt": {"A": "the average annual household disposable income rises at a faster rate than Consumer Price Index (CPI) in\ufb02ation", "B": "CPI in\ufb02ation is increasing at a slower rate in Australia than the rate experienced by our trading partners", "C": "the rate of population growth is greater than the rate of increase in Real GDP over a sustained period of time", "D": "negative externalities, such as pollution and urban congestion, are consequences of population growth in Australian cities"}, "ans": "C", "dist": {"A": 4, "B": 7, "C": 79, "D": 10}, "cp": 79, "band": "solid", "trap": "D", "trapPct": 10, "task": "task2_why_tempting", "kk": "3.2.1", "kkText": "the difference between material and non-material living standards and the factors affecting them", "note": ""}, {"id": "2015-Q11", "set": "vcaa15", "year": 2015, "q": 11, "stem": "If the market price of bananas suddenly increases due to poor weather conditions in Queensland, the impact on the market for banana cakes is most likely to be", "opt": {"A": "reduced pro\ufb01tability in the production of banana cakes due to lower production costs and a consequent decrease in the supply of banana cakes relative to constant demand in the market, leading to an increase in the market price of banana cakes", "B": "improved pro\ufb01tability in the production of banana cakes following the expansion of demand, in response to the higher prices that can be charged for banana cakes", "C": "reduced pro\ufb01tability in the production of banana cakes as the relative scarcity of a key factor of production increases the costs of production and leads to a decrease in the supply of banana cakes in the market", "D": "improved pro\ufb01tability in the production of banana cakes as the manufacturers can rapidly increase the market price to cover increased costs and maintain output at a constant level"}, "ans": "C", "dist": {"A": 3, "B": 4, "C": 87, "D": 6}, "cp": 87, "band": "fluency", "trap": "D", "trapPct": 6, "task": "none", "kk": "3.1.9", "kkText": "non-price factors affecting supply and the position of the supply curve", "note": ""}, {"id": "2015-Q12", "set": "vcaa15", "year": 2015, "q": 12, "stem": "Consider the following data for the Australian economy.<br>Year 1: unemployment rate 5%, real GDP growth 3% pa<br>Year 2: unemployment rate 6%, real GDP growth 1.75% pa<br><br>Based on this data, it is most likely that", "opt": {"A": "the Australian economy will have fewer idle resources at the end of Year 2 compared to the end of Year 1", "B": "the RBA may be more likely to raise interest rates in Year 2 as a pre-emptive action against increased CPI inflationary pressures", "C": "consumer confidence will be falling as growth in average household disposable income may be slowing", "D": "aggregate injections of spending within the macroeconomy will have been stronger than aggregate leakages during Year 2"}, "ans": "C", "dist": {"A": 5, "B": 7, "C": 82, "D": 6}, "cp": 82, "band": "fluency", "trap": "B", "trapPct": 7, "task": "task2_why_tempting", "kk": "3.2.8", "kkText": "consequences of not achieving strong and sustainable economic growth", "note": ""}, {"id": "2015-Q13", "set": "vcaa15", "year": 2015, "q": 13, "stem": "The operator of a tourist resort on Australia\u2019s Gold Coast was quoted as saying that \u2018a weaker Australian dollar will be good for business\u2019. This is most likely because a weaker dollar", "opt": {"A": "means that Australian residents are less able to afford holidays in other countries, while residents in other countries are more likely to take their holidays in Australia", "B": "leads to a lower rate of in\ufb02ation in Australia and this will encourage Australian residents to take holidays in Australia", "C": "increases the value of Australians\u2019 income and this will increase the demand for tourism", "D": "causes lower interest rates in Australia and this will stimulate spending by Australian residents on tourism"}, "ans": "A", "dist": {"A": 91, "B": 3, "C": 3, "D": 3}, "cp": 91, "band": "fluency", "trap": "D", "trapPct": 3, "task": "none", "kk": "3.3.8", "kkText": "the effect of the terms of trade, the exchange rate and international competitiveness on the domestic goals", "note": ""}, {"id": "2015-Q14", "set": "vcaa15", "year": 2015, "q": 14, "stem": "Each of the following consists of a change in economic policy and an economic outcome. In which case is the change in policy most likely to produce the outcome in the short term?", "opt": {"A": "increased interest rates and employment growth", "B": "increased rates of personal income tax and a reduced CAD", "C": "increased government spending and reduced demand in\ufb02ation", "D": "decreased government spending and a lower rate of unemployment"}, "ans": "B", "dist": {"A": 9, "B": 69, "C": 14, "D": 7}, "cp": 69, "band": "solid", "trap": "C", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.3.3", "kkText": "cyclical and structural influences on Australia's current account balance", "note": ""}, {"id": "2016-Q1", "set": "vcaa16", "year": 2016, "q": 1, "stem": "Which one of the following components of aggregate demand is the most unstable?", "opt": {"A": "private investment expenditure", "B": "private consumption expenditure", "C": "government investment expenditure", "D": "government consumption expenditure"}, "ans": "A", "dist": {"A": 58, "B": 28, "C": 6, "D": 7}, "cp": 58, "band": "stretch", "trap": "B", "trapPct": 28, "task": "task2_why_tempting", "kk": "3.2.4", "kkText": "the meaning and importance of aggregate demand and the factors affecting it", "note": "Consumption is the biggest slice of AD, not the most volatile one. Investment swings hardest because it turns on business confidence and interest rates. Size and instability are different things."}, {"id": "2016-Q2", "set": "vcaa16", "year": 2016, "q": 2, "stem": "When resources are used to produce the goods and services that best satisfy society\u2019s needs and wants, this is known as", "opt": {"A": "dynamic efficiency", "B": "allocative efficiency", "C": "intertemporal efficiency", "D": "productive or technical efficiency"}, "ans": "B", "dist": {"A": 3, "B": 93, "C": 1, "D": 3}, "cp": 93, "band": "fluency", "trap": "D", "trapPct": 3, "task": "none", "kk": "3.1.2", "kkText": "economic efficiency - allocative, productive, dynamic and intertemporal - and its relationship to the PPF model", "note": ""}, {"id": "2016-Q3", "set": "vcaa16", "year": 2016, "q": 3, "stem": "The construction of a tall apartment building that blocks out the light to a nearby public park is an example of what kind of market failure?", "opt": {"A": "market power", "B": "a public good", "C": "a negative externality", "D": "asymmetric information"}, "ans": "C", "dist": {"A": 1, "B": 5, "C": 92, "D": 1}, "cp": 92, "band": "fluency", "trap": "B", "trapPct": 5, "task": "none", "kk": "3.1.16", "kkText": "types of market failure - public goods, externalities, asymmetric information, common access resources", "note": ""}, {"id": "2016-Q4", "set": "vcaa16", "year": 2016, "q": 4, "stem": "Which one of the following terms describes the \u2018potential output of an economy\u2019?", "opt": {"A": "production", "B": "productivity", "C": "productive capacity", "D": "Gross Domestic Product (GDP)"}, "ans": "C", "dist": {"A": 3, "B": 2, "C": 88, "D": 6}, "cp": 88, "band": "fluency", "trap": "D", "trapPct": 6, "task": "none", "kk": "3.1.1", "kkText": "relative scarcity, needs, wants, resources, opportunity cost, the PPF model and the three basic economic questions", "note": ""}, {"id": "2016-Q5", "set": "vcaa16", "year": 2016, "q": 5, "stem": "Consider the following hypothetical Consumer Price Index (CPI) data. Time period CPI Quarter 1 100 Quarter 2 101 Quarter 3 102 Quarter 4 103 The annualised rate of inflation for Quarter 2 is", "opt": {"A": "1%", "B": "3%", "C": "4%", "D": "6%"}, "ans": "C", "dist": {"A": 68, "B": 9, "C": 22, "D": 2}, "cp": 22, "band": "trap", "trap": "A", "trapPct": 68, "task": "task2_why_tempting", "kk": "3.2.16", "kkText": "measurement of inflation using the CPI, including headline and underlying", "note": "1% is the quarterly movement. Annualising multiplies the quarterly rate by four, so 1% a quarter is 4% a year. 68% of the state stopped at the quarterly figure."}, {"id": "2016-Q6", "set": "vcaa16", "year": 2016, "q": 6, "stem": "A recession in Australia in conjunction with a depreciation of the Australian dollar is likely to lead to", "opt": {"A": "an increase in the volume of Australia\u2019s imports and a decrease in the volume of exports", "B": "a decrease in the volume of Australia\u2019s imports and an increase in the volume of exports", "C": "a decrease in the volume of Australia\u2019s imports and a decrease in the volume of exports", "D": "an increase in the volume of Australia\u2019s imports and an increase in the volume of exports"}, "ans": "B", "dist": {"A": 5, "B": 75, "C": 17, "D": 2}, "cp": 75, "band": "solid", "trap": "C", "trapPct": 17, "task": "task2_why_tempting", "kk": "3.3.8", "kkText": "the effect of the terms of trade, the exchange rate and international competitiveness on the domestic goals", "note": ""}, {"id": "2016-Q7", "set": "vcaa16", "year": 2016, "q": 7, "stem": "Which one of the following government policies will not lead to a long-term expansion of aggregate supply?", "opt": {"A": "lowering the company taxation rate", "B": "increasing skilled migration by 5000 persons per year", "C": "extending the solar energy rebate scheme for households", "D": "increasing unemployment benefits by an amount equal to the rate of inflation"}, "ans": "D", "dist": {"A": 2, "B": 1, "C": 14, "D": 83}, "cp": 83, "band": "fluency", "trap": "C", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2016-Q8", "set": "vcaa16", "year": 2016, "q": 8, "stem": "The \u2018transmission mechanism\u2019 refers to the way a change in interest rates affects economic activity. The transmission occurs via a number of channels. The channel that affects decisions by those in the economy with existing variable rate home loans is known as the", "opt": {"A": "asset values or asset prices channel", "B": "exchange rate channel", "C": "cost of credit channel", "D": "cash flow channel"}, "ans": "D", "dist": {"A": 12, "B": 1, "C": 24, "D": 62}, "cp": 62, "band": "solid", "trap": "C", "trapPct": 24, "task": "task2_why_tempting", "kk": "4.1.17", "kkText": "the transmission mechanism and its effect on AD: savings and investment, cash flow, exchange rate, asset prices and wealth", "note": ""}, {"id": "2016-Q9", "set": "vcaa16", "year": 2016, "q": 9, "stem": "Consider the following information related to the labour market of a hypothetical economy. Year Population who are of Employed persons Unemployed working age (millions) (millions) persons (millions) 1 20 14 2 2 25 17 2 In comparing Year 2 to Year 1, which one of the following statements is true?", "opt": {"A": "Year 2 has a lower participation rate and a lower unemployment rate", "B": "Year 2 has a lower participation rate and a higher unemployment rate", "C": "Year 2 has a higher participation rate and a lower unemployment rate", "D": "Year 2 has a higher participation rate and a higher unemployment rate"}, "ans": "A", "dist": {"A": 53, "B": 13, "C": 24, "D": 9}, "cp": 53, "band": "stretch", "trap": "C", "trapPct": 24, "task": "task2_why_tempting", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": "Work the two rates separately from the same data. Participation is the labour force over the working-age population; unemployment is the unemployed over the labour force. The 24% who chose C had the unemployment direction right and the participation direction wrong - check each one on its own before you match them up."}, {"id": "2016-Q10", "set": "vcaa16", "year": 2016, "q": 10, "stem": "If a large percentage fall in a product\u2019s price causes a small percentage increase in the quantity demanded, then", "opt": {"A": "supply is price elastic", "B": "demand is price elastic", "C": "supply is price inelastic", "D": "demand is price inelastic"}, "ans": "D", "dist": {"A": 2, "B": 12, "C": 4, "D": 82}, "cp": 82, "band": "fluency", "trap": "B", "trapPct": 12, "task": "task2_why_tempting", "kk": "3.1.11", "kkText": "the meaning and significance of price elasticity of demand and supply", "note": ""}, {"id": "2016-Q14", "set": "vcaa16", "year": 2016, "q": 14, "stem": "If a product became less popular, while at the same time increased costs of production caused the supply of the product to decrease, it can be concluded that, for this product, the", "opt": {"A": "equilibrium price might rise or fall", "B": "equilibrium quantity might rise or fall", "C": "equilibrium price and the equilibrium quantity would rise", "D": "equilibrium price and the equilibrium quantity would fall"}, "ans": "A", "dist": {"A": 27, "B": 9, "C": 6, "D": 59}, "cp": 27, "band": "trap", "trap": "D", "trapPct": 59, "task": "task2_why_tempting", "kk": "3.1.10", "kkText": "the effects of changes in supply and demand on equilibrium price and quantity traded", "note": "Demand falls and supply falls. Both cut quantity, so quantity definitely falls. But falling demand pushes price down while falling supply pushes it up \u2014 so price could go either way. 59% assumed both moved together."}, {"id": "2016-Q15", "set": "vcaa16", "year": 2016, "q": 15, "stem": "Australia\u2019s unemployment rate decreased from 6.4% in January 2015 to 5.8% in February 2016. The impact of this change on government tax receipts, government outlays and the size of the budget deficit is likely to be that", "opt": {"A": "tax receipts increase, outlays increase, the budget deficit is reduced", "B": "tax receipts increase, outlays decrease, the budget deficit is reduced", "C": "tax receipts increase, outlays decrease, the budget deficit is increased", "D": "tax receipts decrease, outlays increase, the budget deficit is increased"}, "ans": "B", "dist": {"A": 7, "B": 87, "C": 3, "D": 4}, "cp": 87, "band": "fluency", "trap": "A", "trapPct": 7, "task": "none", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": ""}, {"id": "2017-Q1", "set": "vcaa17", "year": 2017, "q": 1, "stem": "Relative scarcity can best be defined as", "opt": {"A": "wants in relation to needs", "B": "wants in relation to resources", "C": "unlimited wants in relation to limited resources", "D": "limited wants in relation to unlimited resources"}, "ans": "B", "dist": {"A": 0, "B": 98, "C": 1, "D": 1}, "cp": 98, "band": "fluency", "trap": "D", "trapPct": 1, "task": "none", "kk": "3.1.1", "kkText": "relative scarcity, needs, wants, resources, opportunity cost, the PPF model and the three basic economic questions", "note": ""}, {"id": "2017-Q2", "set": "vcaa17", "year": 2017, "q": 2, "stem": "Which one of the following might help to reduce a government\u2019s budget deficit?", "opt": {"A": "a slowing of growth in the world economy", "B": "reducing the marginal rate of personal income tax", "C": "removing the means test on some items of government welfare", "D": "removing the exemptions of education and food from the goods and services tax (GST)"}, "ans": "D", "dist": {"A": 11, "B": 13, "C": 11, "D": 64}, "cp": 64, "band": "solid", "trap": "B", "trapPct": 13, "task": "task2_why_tempting", "kk": "4.1.4", "kkText": "the budget outcome: balanced, deficit or surplus", "note": ""}, {"id": "2017-Q3", "set": "vcaa17", "year": 2017, "q": 3, "stem": "Which one of the following is unlikely to increase productivity?", "opt": {"A": "increasing tariffs", "B": "labour skills training", "C": "innovation in work practices", "D": "investment in physical capital"}, "ans": "A", "dist": {"A": 96, "B": 1, "C": 1, "D": 2}, "cp": 96, "band": "fluency", "trap": "D", "trapPct": 2, "task": "none", "kk": "4.2.2", "kkText": "the operation of AS policies in improving supply-side conditions via the quantity and quality of the factors of production", "note": ""}, {"id": "2017-Q4", "set": "vcaa17", "year": 2017, "q": 4, "stem": "What would be the effect on the market for Good X if there were a rise in the price of a substitute good?", "opt": {"A": "The demand curve would shift left and the equilibrium price of Good X would decrease", "B": "The supply curve would shift left and the equilibrium price of Good X would increase", "C": "The demand curve would shift right and the equilibrium price of Good X would increase", "D": "The supply curve would shift right and the equilibrium price of Good X would decrease"}, "ans": "C", "dist": {"A": 9, "B": 3, "C": 84, "D": 4}, "cp": 84, "band": "fluency", "trap": "A", "trapPct": 9, "task": "task2_why_tempting", "kk": "3.1.6", "kkText": "non-price factors affecting demand and the position of the demand curve", "note": ""}, {"id": "2017-Q5", "set": "vcaa17", "year": 2017, "q": 5, "stem": "What is the most likely effect of a decrease in the tariff on an imported good?", "opt": {"A": "a loss of jobs for overseas suppliers", "B": "a fall in the price of a competing domestic good", "C": "a rise in the price of a competing domestic good", "D": "an increase in employment in the domestic sector"}, "ans": "B", "dist": {"A": 1, "B": 87, "C": 9, "D": 3}, "cp": 87, "band": "fluency", "trap": "C", "trapPct": 9, "task": "none", "kk": "4.2.5", "kkText": "trade liberalisation and its short and long-term effects", "note": ""}, {"id": "2017-Q6", "set": "vcaa17", "year": 2017, "q": 6, "stem": "Over time, which one of the following would most likely increase aggregate supply in the economy?", "opt": {"A": "reducing the age pension", "B": "reducing skilled migration", "C": "reducing the retirement age", "D": "reducing funding for apprenticeships"}, "ans": "A", "dist": {"A": 76, "B": 5, "C": 14, "D": 5}, "cp": 76, "band": "solid", "trap": "C", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2017-Q7", "set": "vcaa17", "year": 2017, "q": 7, "stem": "Consider the following hypothetical Consumer Price Index (CPI) data. Year CPI 1 100 2 110 3 121 The increase in the annual rate of inflation from Year 2 to Year 3 is", "opt": {"A": "10%", "B": "11%", "C": "20%", "D": "21%"}, "ans": "B", "dist": {"A": 5, "B": 73, "C": 15, "D": 8}, "cp": 73, "band": "solid", "trap": "C", "trapPct": 15, "task": "task2_why_tempting", "kk": "3.2.16", "kkText": "measurement of inflation using the CPI, including headline and underlying", "note": ""}, {"id": "2017-Q8", "set": "vcaa17", "year": 2017, "q": 8, "stem": "According to the five-sector circular flow model of the economy, a rise in the total value of injections relative to the total value of leakages is most likely to result in", "opt": {"A": "a decrease in consumption and a decrease in levels of aggregate demand", "B": "a decrease in total incomes and a rise in the unemployment rate", "C": "neither a decrease in consumption, levels of aggregate demand and total incomes, nor a rise in the unemployment rate", "D": "a decrease in consumption, levels of aggregate demand and total incomes, and a rise in the unemployment rate"}, "ans": "C", "dist": {"A": 7, "B": 5, "C": 73, "D": 15}, "cp": 73, "band": "solid", "trap": "D", "trapPct": 15, "task": "task2_why_tempting", "kk": "3.2.2", "kkText": "the five-sector circular flow model of income", "note": ""}, {"id": "2017-Q9", "set": "vcaa17", "year": 2017, "q": 9, "stem": "The following information refers to a hypothetical country\u2019s terms of trade. Year Import price index Export price index 1 100 100 2 104 117 The change in the terms of trade from Year 1 to Year 2 most likely means that, for this country", "opt": {"A": "the exchange rate will fall", "B": "the current account deficit will rise", "C": "the value of imports is greater than the value of exports", "D": "more imports can be bought with a given volume of exports"}, "ans": "D", "dist": {"A": 13, "B": 8, "C": 3, "D": 76}, "cp": 76, "band": "solid", "trap": "A", "trapPct": 13, "task": "task2_why_tempting", "kk": "3.3.6", "kkText": "the terms of trade - meaning, measurement and the factors affecting it", "note": ""}, {"id": "2017-Q10", "set": "vcaa17", "year": 2017, "q": 10, "stem": "The quantity demanded for a product increases by a higher percentage than the decrease in the price of that product. What is this known as?", "opt": {"A": "demand elasticity", "B": "demand inelasticity", "C": "supply elasticity", "D": "supply inelasticity"}, "ans": "A", "dist": {"A": 82, "B": 13, "C": 2, "D": 2}, "cp": 82, "band": "fluency", "trap": "B", "trapPct": 13, "task": "task2_why_tempting", "kk": "3.1.11", "kkText": "the meaning and significance of price elasticity of demand and supply", "note": ""}, {"id": "2017-Q13", "set": "vcaa17", "year": 2017, "q": 13, "stem": "As the level of aggregate demand slows, the budget outcome will", "opt": {"A": "improve as unemployment increases", "B": "deteriorate as unemployment increases", "C": "improve as social security payments decrease", "D": "deteriorate as social security payments decrease"}, "ans": "B", "dist": {"A": 3, "B": 90, "C": 3, "D": 4}, "cp": 90, "band": "fluency", "trap": "D", "trapPct": 4, "task": "none", "kk": "4.1.8", "kkText": "the role of automatic stabilisers (cyclical component) in influencing AD and stabilising the business cycle", "note": ""}, {"id": "2017-Q14", "set": "vcaa17", "year": 2017, "q": 14, "stem": "When the Reserve Bank of Australia buys government securities on the overnight market, the effect will be to", "opt": {"A": "increase the supply of cash in the money market and increase the cash rate", "B": "decrease the supply of cash in the money market and increase the cash rate", "C": "increase the supply of cash in the money market and decrease the cash rate", "D": "decrease the supply of cash in the money market and decrease the cash rate"}, "ans": "C", "dist": {"A": 10, "B": 13, "C": 72, "D": 5}, "cp": 72, "band": "solid", "trap": "B", "trapPct": 13, "task": "task2_why_tempting", "kk": "4.1.15", "kkText": "conventional monetary policy (cash rate target) and how it affects interest rates", "note": ""}, {"id": "2017-Q15", "set": "vcaa17", "year": 2017, "q": 15, "stem": "Which one of the following is an example of government capital expenditure?", "opt": {"A": "personal income tax refunds", "B": "payment of unemployment benefits", "C": "provision of transport infrastructure", "D": "government loans to tertiary students for university fees"}, "ans": "C", "dist": {"A": 2, "B": 5, "C": 86, "D": 7}, "cp": 86, "band": "fluency", "trap": "D", "trapPct": 7, "task": "none", "kk": "4.1.3", "kkText": "types of government expenses, including current and capital expenditure and transfer payments", "note": ""}, {"id": "2018-Q1", "set": "vcaa18", "year": 2018, "q": 1, "stem": "The type of unemployment caused by technological change is known as", "opt": {"A": "cyclical unemployment", "B": "frictional unemployment", "C": "structural unemployment", "D": "hard-core unemployment"}, "ans": "C", "dist": {"A": 4, "B": 8, "C": 86, "D": 2}, "cp": 86, "band": "fluency", "trap": "B", "trapPct": 8, "task": "none", "kk": "3.2.12", "kkText": "the difference between cyclical and structural unemployment", "note": ""}, {"id": "2018-Q2", "set": "vcaa18", "year": 2018, "q": 2, "stem": "Expansionary monetary policy is most likely to cause", "opt": {"A": "a decrease in welfare payments", "B": "an appreciation of the Australian dollar", "C": "a reduction in the rate of economic growth", "D": "an increase in the size of the budget deficit"}, "ans": "A", "dist": {"A": 47, "B": 25, "C": 3, "D": 25}, "cp": 47, "band": "stretch", "trap": "D", "trapPct": 25, "task": "task3_rewrite_stem", "kk": "4.1.17", "kkText": "the transmission mechanism and its effect on AD: savings and investment, cash flow, exchange rate, asset prices and wealth", "note": "Expansionary monetary policy lifts AD, so employment rises and fewer people claim benefits. The 25% who chose a bigger deficit had it backwards \u2014 this is the RBA, not the budget. It spends nothing, and a stronger economy shrinks the deficit."}, {"id": "2018-Q4", "set": "vcaa18", "year": 2018, "q": 4, "stem": "Of the following policy initiatives, which one is least likely to increase aggregate supply in the economy?", "opt": {"A": "increased government spending on infrastructure", "B": "increased government spending on education and training", "C": "increased government outlays allocated to payment of unemployment benefits", "D": "a reduction in company tax rates"}, "ans": "C", "dist": {"A": 2, "B": 3, "C": 90, "D": 5}, "cp": 90, "band": "fluency", "trap": "D", "trapPct": 5, "task": "none", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2018-Q5", "set": "vcaa18", "year": 2018, "q": 5, "stem": "The payment of dividends to overseas shareholders will appear in the balance of payments as a", "opt": {"A": "credit in the capital and financial account", "B": "debit in the capital and financial account", "C": "credit in the balance of payments on current account", "D": "debit in the balance of payments on current account"}, "ans": "D", "dist": {"A": 6, "B": 33, "C": 7, "D": 54}, "cp": 54, "band": "stretch", "trap": "B", "trapPct": 33, "task": "task2_why_tempting", "kk": "3.3.2", "kkText": "the balance of payments and its components", "note": "Dividends paid to overseas shareholders are a servicing cost on foreign investment here. Servicing costs are primary income, which sits in the current account. The 33% who chose the capital and financial account picked the account that records the investment itself, not the income it earns."}, {"id": "2018-Q6", "set": "vcaa18", "year": 2018, "q": 6, "stem": "An increase in productivity is likely to", "opt": {"A": "worsen Australia\u2019s international competitiveness and increase inflation", "B": "worsen Australia\u2019s international competitiveness and decrease inflation", "C": "improve Australia\u2019s international competitiveness and increase inflation", "D": "improve Australia\u2019s international competitiveness and decrease inflation"}, "ans": "D", "dist": {"A": 1, "B": 0, "C": 22, "D": 77}, "cp": 77, "band": "solid", "trap": "C", "trapPct": 22, "task": "task2_why_tempting", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2018-Q9", "set": "vcaa18", "year": 2018, "q": 9, "stem": "Which one of the following would reduce the size of the Australian Government\u2019s budget deficit?", "opt": {"A": "company tax cuts", "B": "personal income tax cuts", "C": "increasing the rate of the goods and services tax (GST)", "D": "increasing the tax-free threshold for personal income tax"}, "ans": "C", "dist": {"A": 2, "B": 2, "C": 93, "D": 3}, "cp": 93, "band": "fluency", "trap": "D", "trapPct": 3, "task": "none", "kk": "4.1.4", "kkText": "the budget outcome: balanced, deficit or surplus", "note": ""}, {"id": "2018-Q10", "set": "vcaa18", "year": 2018, "q": 10, "stem": "The degree of price elasticity of demand is important to producers because it reveals how", "opt": {"A": "responsive quantity demanded is to a change in price", "B": "much of the product will be supplied at different prices", "C": "responsive demand for a product is to advertising or promotional campaigns", "D": "responsive quantity demanded is to a change in the level of consumer income"}, "ans": "A", "dist": {"A": 96, "B": 1, "C": 1, "D": 2}, "cp": 96, "band": "fluency", "trap": "D", "trapPct": 2, "task": "none", "kk": "3.1.11", "kkText": "the meaning and significance of price elasticity of demand and supply", "note": ""}, {"id": "2018-Q11", "set": "vcaa18", "year": 2018, "q": 11, "stem": "Which one of the following is not a feature of a perfectly competitive market?", "opt": {"A": "Firms have ease of entry into and exit from the market", "B": "Products sold in the market are homogenous", "C": "Consumer sovereignty exists", "D": "Resources are not mobile"}, "ans": "D", "dist": {"A": 1, "B": 2, "C": 6, "D": 91}, "cp": 91, "band": "fluency", "trap": "C", "trapPct": 6, "task": "none", "kk": "3.1.3", "kkText": "the conditions for a free and perfectly competitive market", "note": ""}, {"id": "2018-Q12", "set": "vcaa18", "year": 2018, "q": 12, "stem": "When the economy is experiencing low rates of inflation and low rates of economic and employment growth, the Reserve Bank of Australia will be likely to", "opt": {"A": "sell government securities in order to increase the cash rate", "B": "sell government securities in order to decrease the cash rate", "C": "purchase government securities in order to increase the cash rate", "D": "purchase government securities in order to decrease the cash rate"}, "ans": "D", "dist": {"A": 12, "B": 14, "C": 11, "D": 64}, "cp": 64, "band": "solid", "trap": "B", "trapPct": 14, "task": "task2_why_tempting", "kk": "4.1.18", "kkText": "the stance: expansionary (accommodative), contractionary (restrictive) or neutral", "note": ""}, {"id": "2018-Q13", "set": "vcaa18", "year": 2018, "q": 13, "stem": "Imagine the Australian Government\u2019s budget is in surplus. If the rate of economic growth were to slow, this may ultimately result in a", "opt": {"A": "smaller surplus budget, as receipts rise and outlays fall", "B": "budget deficit, as receipts rise and outlays fall", "C": "larger surplus budget, as receipts rise and outlays fall", "D": "smaller surplus budget, as receipts fall and outlays rise"}, "ans": "D", "dist": {"A": 9, "B": 4, "C": 5, "D": 83}, "cp": 83, "band": "fluency", "trap": "A", "trapPct": 9, "task": "task2_why_tempting", "kk": "4.1.8", "kkText": "the role of automatic stabilisers (cyclical component) in influencing AD and stabilising the business cycle", "note": ""}, {"id": "2018-Q14", "set": "vcaa18", "year": 2018, "q": 14, "stem": "Which of the following would be the most likely impact of an increase in inflation in the United States (US)?", "opt": {"A": "an increase in US interest rates and a depreciation of the Australian dollar", "B": "an increase in US interest rates and an appreciation of the Australian dollar", "C": "a decrease in US interest rates and a depreciation of the Australian dollar", "D": "a decrease in US interest rates and an appreciation of the Australian dollar"}, "ans": "A", "dist": {"A": 44, "B": 26, "C": 9, "D": 20}, "cp": 44, "band": "trap", "trap": "B", "trapPct": 26, "task": "task3_rewrite_stem", "kk": "3.3.5", "kkText": "the exchange rate - meaning, measurement and the factors affecting its value", "note": "Higher US inflation means the Fed lifts rates, the interest differential moves in America's favour, capital leaves Australia and the dollar DEPRECIATES. 26% got the rate rise right and the currency backwards."}, {"id": "2019-Q1", "set": "vcaa19", "year": 2019, "q": 1, "stem": "The international competitiveness of a nation would improve if", "opt": {"A": "its currency appreciated", "B": "labour productivity increased", "C": "real unit labour costs (RULC) increased", "D": "its rate of inflation increased relative to that of its trading partners"}, "ans": "B", "dist": {"A": 5, "B": 91, "C": 1, "D": 3}, "cp": 91, "band": "fluency", "trap": "A", "trapPct": 5, "task": "none", "kk": "3.3.7", "kkText": "international competitiveness and the factors affecting it", "note": ""}, {"id": "2019-Q3", "set": "vcaa19", "year": 2019, "q": 3, "stem": "One weakness of budgetary policy compared with monetary policy is that budgetary policy", "opt": {"A": "may be subject to political constraints", "B": "can target certain parts of the economy to give assistance", "C": "may be counteracted by the operation of automatic stabilisers", "D": "tends to be relatively ineffective in a recession due to low levels of consumer confidence"}, "ans": "A", "dist": {"A": 90, "B": 2, "C": 4, "D": 4}, "cp": 90, "band": "fluency", "trap": "D", "trapPct": 4, "task": "none", "kk": "4.1.13", "kkText": "the strengths and weaknesses of budgetary policy", "note": ""}, {"id": "2019-Q4", "set": "vcaa19", "year": 2019, "q": 4, "stem": "An increase in the labour force participation rate is most likely to", "opt": {"A": "increase productivity", "B": "increase productive capacity", "C": "decrease government revenue", "D": "increase government expenses"}, "ans": "B", "dist": {"A": 18, "B": 80, "C": 1, "D": 2}, "cp": 80, "band": "fluency", "trap": "A", "trapPct": 18, "task": "task2_why_tempting", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": ""}, {"id": "2019-Q6", "set": "vcaa19", "year": 2019, "q": 6, "stem": "\u2018A maximum price set below the equilibrium price will cause greater shortages if", "opt": {"A": "both demand and supply are price inelastic", "B": "both demand and supply are price elastic", "C": "demand is price inelastic and supply is price elastic", "D": "demand is price elastic and supply is price inelastic"}, "ans": "B", "dist": {"A": 14, "B": 29, "C": 21, "D": 35}, "cp": 29, "band": "trap", "trap": "D", "trapPct": 35, "task": "task3_rewrite_stem", "kk": "3.1.12", "kkText": "factors affecting price elasticity of demand", "note": "A shortage is the gap between quantity demanded and quantity supplied at the capped price. The more both sides respond to price, the wider that gap opens. Elastic on BOTH sides gives the biggest shortage. The 35% who chose one elastic and one inelastic get a narrower gap."}, {"id": "2019-Q7", "set": "vcaa19", "year": 2019, "q": 7, "stem": "\u2018As the world economy slows, the Australian Government's budget outcome may", "opt": {"A": "deteriorate as demand for Australian exports decreases", "B": "improve as employment in Australia increases", "C": "deteriorate as domestic output increases", "D"
