"}, "ans": "A", "dist": {"A": 79, "B": 11, "C": 8, "D": 3}, "cp": 79, "band": "solid", "trap": "B", "trapPct": 11, "task": "task2_why_tempting", "kk": "4.2.1", "kkText": "the use of AS policies to complement AD policies in promoting non-inflationary growth over time", "note": ""}, {"id": "2021-Q9", "set": "vcaa21", "year": 2021, "q": 9, "stem": "Which one of the following is not a likely effect of trade liberalisation?", "opt": {"A": "a decrease in structural unemployment in the short term", "B": "an incentive for domestic firms to achieve greater efficiency", "C": "long-term improvement in material living standards", "D": "a reduction in costs for firms that use imports in the production process"}, "ans": "A", "dist": {"A": 71, "B": 8, "C": 11, "D": 10}, "cp": 71, "band": "solid", "trap": "C", "trapPct": 11, "task": "task2_why_tempting", "kk": "4.2.5", "kkText": "trade liberalisation and its short and long-term effects", "note": ""}, {"id": "2021-Q10", "set": "vcaa21", "year": 2021, "q": 10, "stem": "Which one of the following goods is not likely to be considered a public good?", "opt": {"A": "a fireworks display", "B": "street lighting", "C": "healthcare services", "D": "free-to-air TV broadcasts"}, "ans": "C", "dist": {"A": 32, "B": 2, "C": 48, "D": 18}, "cp": 48, "band": "stretch", "trap": "A", "trapPct": 32, "task": "task2_why_tempting", "kk": "3.1.16", "kkText": "types of market failure - public goods, externalities, asymmetric information, common access resources", "note": "Healthcare is rivalrous and excludable \u2014 treating one patient uses capacity another cannot. The others are consumed without reducing what is left for anyone else."}, {"id": "2021-Q11", "set": "vcaa21", "year": 2021, "q": 11, "stem": "Which one of the following is not a role of the RBA?", "opt": {"A": "adjusting tax rates", "B": "issuing Australia\u2019s bank notes", "C": "managing foreign currency reserves", "D": "providing specialist banking services to the Australian Government"}, "ans": "A", "dist": {"A": 70, "B": 8, "C": 13, "D": 9}, "cp": 70, "band": "solid", "trap": "C", "trapPct": 13, "task": "task2_why_tempting", "kk": "4.1.14", "kkText": "the role of the RBA with respect to monetary policy as outlined in its charter", "note": ""}, {"id": "2021-Q12", "set": "vcaa21", "year": 2021, "q": 12, "stem": "Consider the following data for a hypothetical economy.<br>employed persons 11 million<br>unemployed persons 1 million<br>persons not in the labour force but of working age (over 15) 8 million<br><br>Using this data, the labour force participation rate is", "opt": {"A": "50%", "B": "55%", "C": "60%", "D": "65%"}, "ans": "C", "dist": {"A": 3, "B": 30, "C": 57, "D": 11}, "cp": 57, "band": "stretch", "trap": "B", "trapPct": 30, "task": "task2_why_tempting", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": "55% is 11 over 20 \u2014 employed people over the working-age population. The participation rate uses the whole labour force on top: employed plus unemployed, 12 over 20."}, {"id": "2021-Q13", "set": "vcaa21", "year": 2021, "q": 13, "stem": "A reduction in the cash rate is likely to result in", "opt": {"A": "an increase in the value of the Australian dollar and a lower inflation rate", "B": "a decrease in the value of the Australian dollar and a higher inflation rate", "C": "a decrease in the value of the Australian dollar and a higher unemployment rate", "D": "an increase in the value of the Australian dollar and a lower unemployment rate"}, "ans": "B", "dist": {"A": 14, "B": 66, "C": 10, "D": 10}, "cp": 66, "band": "solid", "trap": "A", "trapPct": 14, "task": "task2_why_tempting", "kk": "4.1.17", "kkText": "the transmission mechanism and its effect on AD: savings and investment, cash flow, exchange rate, asset prices and wealth", "note": ""}, {"id": "2022-Q1", "set": "vcaa22", "year": 2022, "q": 1, "stem": "Which one of the following is likely to be classified as structural unemployment?", "opt": {"A": "a person who loses their job as a tour operator due to a recession", "B": "a person who loses their job as a fruit picker when there is no fruit left to pick C", "C": "aperson who loses their job as an accountant because they stole from their employer", "D": "a person who loses their job as an Economics teacher due to a decline in the number of students studying Economics"}, "ans": "D", "dist": {"A": 14, "B": 17, "C": 6, "D": 63}, "cp": 63, "band": "solid", "trap": "B", "trapPct": 17, "task": "task2_why_tempting", "kk": "3.2.12", "kkText": "the difference between cyclical and structural unemployment", "note": ""}, {"id": "2022-Q3", "set": "vcaa22", "year": 2022, "q": 3, "stem": "Which one of the following reasons is most likely to explain why the unemployment rate in a country remains high despite strong rates of economic growth?", "opt": {"A": "a fall in the labour force participation rate", "B": "an increase in the number of part-time workers", "C": "raising the school leaving age to 18 years old", "D": "an increase in the rate of labour productivity growth"}, "ans": "D", "dist": {"A": 22, "B": 7, "C": 14, "D": 57}, "cp": 57, "band": "stretch", "trap": "A", "trapPct": 22, "task": "task2_why_tempting", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": "If productivity grows quickly, firms can lift output without hiring, so unemployment stays high even through strong growth. The 22% who chose a falling participation rate picked something that would LOWER the measured unemployment rate - discouraged workers leave the labour force and stop being counted."}, {"id": "2022-Q4", "set": "vcaa22", "year": 2022, "q": 4, "stem": "Which one of the following factors is likely to have a different effect on Australia\u2019s rate of economic growth than the others?", "opt": {"A": "an increase in the cash rate", "B": "an increase in the tax-free threshold", "C": "an increase in the rate of economic growth in China", "D": "an increase in government spending on infrastructure"}, "ans": "A", "dist": {"A": 69, "B": 5, "C": 18, "D": 8}, "cp": 69, "band": "solid", "trap": "C", "trapPct": 18, "task": "task2_why_tempting", "kk": "3.2.19", "kkText": "AD and AS factors affecting the achievement of the domestic macroeconomic goals", "note": ""}, {"id": "2022-Q6", "set": "vcaa22", "year": 2022, "q": 6, "stem": "Which one of the following goods and services is likely to have the highest price elasticity of demand?", "opt": {"A": "cigarettes", "B": "haircuts", "C": "soft drinks", "D": "international travel"}, "ans": "D", "dist": {"A": 12, "B": 7, "C": 28, "D": 53}, "cp": 53, "band": "stretch", "trap": "C", "trapPct": 28, "task": "task2_why_tempting", "kk": "3.1.11", "kkText": "the meaning and significance of price elasticity of demand and supply", "note": "Highest elasticity means most responsive to price. International travel is expensive, discretionary and easy to postpone. The 28% who chose soft drinks picked something cheap and habitual \u2014 people keep buying it when the price moves."}, {"id": "2022-Q7", "set": "vcaa22", "year": 2022, "q": 7, "stem": "How could the 2022-23 Australian Government budget deficit be financed?", "opt": {"A": "by increasing company tax rates", "B": "by reducing welfare spending", "C": "by-selling government bonds to foreign companies", "D": "byall of the options listed above"}, "ans": "C", "dist": {"A": 1, "B": 1, "C": 39, "D": 59}, "cp": 39, "band": "trap", "trap": "D", "trapPct": 59, "task": "task2_why_tempting", "kk": "4.1.6", "kkText": "methods of financing a deficit or utilising a surplus", "note": "Financing a deficit means raising the money to cover the shortfall. Only selling bonds does that. Raising tax or cutting spending REDUCES the deficit; they do not finance it. 59% chose 'all of the above' without testing each option separately."}, {"id": "2022-Q8", "set": "vcaa22", "year": 2022, "q": 8, "stem": "\u2018A depreciation of the Australian dollar is most likely to be caused by an increase in", "opt": {"A": "Australia\u2019s terms of trade", "B": "foreign travel expenditure by Australians. C", "C": "the value of primary income credits in the balance of payments", "D": "the value of foreign direct investment by multinational corporations into Australia"}, "ans": "B", "dist": {"A": 18, "B": 60, "C": 12, "D": 9}, "cp": 60, "band": "solid", "trap": "A", "trapPct": 18, "task": "task2_why_tempting", "kk": "3.3.5", "kkText": "the exchange rate - meaning, measurement and the factors affecting its value", "note": ""}, {"id": "2022-Q9", "set": "vcaa22", "year": 2022, "q": 9, "stem": "Consider the following data for a hypothetical economy.<br>Government spending $20b<br>Imports $55b<br>Taxation receipts $25b<br>Private investment $15b<br>Exports $65b<br>Savings $30b<br><br>Using this data, which one of the following statements about the hypothetical economy is correct?", "opt": {"A": "It is contracting, because savings are greater than taxation receipts", "B": "It is contracting, because leakages are greater than injections", "C": "It is expanding, because injections are greater than leakages", "D": "It is expanding, because imports are greater than private investment"}, "ans": "B", "dist": {"A": 9, "B": 53, "C": 35, "D": 3}, "cp": 53, "band": "stretch", "trap": "C", "trapPct": 35, "task": "task2_why_tempting", "kk": "3.2.2", "kkText": "the five-sector circular flow model of income", "note": "Leakages are S 30 + T 25 + M 55 = 110. Injections are I 15 + G 20 + X 65 = 100. Leakages win, so the economy contracts. The 35% who said expanding most likely dropped imports \u2014 the biggest leakage on the list."}, {"id": "2022-Q10", "set": "vcaa22", "year": 2022, "q": 10, "stem": "Which one of the following international transactions would be recorded as a primary income debit in the current account section of Australia\u2019s balance of payments?", "opt": {"A": "the sale of education services by Australian universities to international students", "B": "the purchase of Australian Government securities by American investment banks", "C": "the purchase of electronic devices by Australian retailers from Chinese distributors", "D": "the payment of rent by Australian companies for retail space owned in Melbourne by Japanese companies"}, "ans": "D", "dist": {"A": 12, "B": 14, "C": 24, "D": 50}, "cp": 50, "band": "stretch", "trap": "C", "trapPct": 24, "task": "task2_why_tempting", "kk": "3.3.2", "kkText": "the balance of payments and its components", "note": "Primary income records income earned on investment. Rent paid to the Japanese owners of Melbourne property is income leaving Australia, so a primary income debit. The 24% who chose the electronics purchase picked a GOODS debit - money out, but payment for a product, not for the use of capital."}, {"id": "2022-Q11", "set": "vcaa22", "year": 2022, "q": 11, "stem": "Australia\u2019s current account balance is likely to worsen if", "opt": {"A": "China\u2019s rate of economic growth decreases", "B": "there is an increase in Australia\u2019s national savings", "C": "there is an increase in the price of iron ore in world markets", "D": "Australian superannuation funds invest more in international shares"}, "ans": "A", "dist": {"A": 67, "B": 9, "C": 7, "D": 17}, "cp": 67, "band": "solid", "trap": "D", "trapPct": 17, "task": "task2_why_tempting", "kk": "3.3.3", "kkText": "cyclical and structural influences on Australia's current account balance", "note": ""}, {"id": "2022-Q12", "set": "vcaa22", "year": 2022, "q": 12, "stem": "If an economy moved into the contraction phase of the business cycle, which combination of outcomes would result?", "opt": {"A": "an increase in interest rates and a decrease in the value of business investment", "B": "an increase in household savings and a decrease in consumer confidence", "C": "an increase in cyclical unemployment and an increase in business confidence", "D": "a decrease in cyclical unemployment and a higher labour force participation rate"}, "ans": "B", "dist": {"A": 13, "B": 81, "C": 4, "D": 2}, "cp": 81, "band": "fluency", "trap": "A", "trapPct": 13, "task": "task2_why_tempting", "kk": "3.2.3", "kkText": "the business cycle and its causes", "note": ""}, {"id": "2022-Q13", "set": "vcaa22", "year": 2022, "q": 13, "stem": "Which one of the following Australian Government policy initiatives is the least likely to increase both aggregate demand and aggregate supply?", "opt": {"A": "higher childcare rebates", "B": "lower company tax rates", "C": "higher tariff\u2019s on imported goods", "D": "increased spending on road and rail infrastructure"}, "ans": "C", "dist": {"A": 12, "B": 10, "C": 67, "D": 12}, "cp": 67, "band": "solid", "trap": "D", "trapPct": 12, "task": "task2_why_tempting", "kk": "4.2.2", "kkText": "the operation of AS policies in improving supply-side conditions via the quantity and quality of the factors of production", "note": ""}, {"id": "2022-Q14", "set": "vcaa22", "year": 2022, "q": 14, "stem": "The international competitiveness of a country is most likely to fall if", "opt": {"A": "labour productivity decreases", "B": "real unit labour costs decrease", "C": "its currency can buy less of a foreign currency", "D": "its inflation rate is lower than that of its trading partners"}, "ans": "A", "dist": {"A": 82, "B": 3, "C": 12, "D": 3}, "cp": 82, "band": "fluency", "trap": "C", "trapPct": 12, "task": "task2_why_tempting", "kk": "3.3.7", "kkText": "international competitiveness and the factors affecting it", "note": ""}, {"id": "2022-Q15", "set": "vcaa22", "year": 2022, "q": 15, "stem": "Which one of the following would not be classified as a direct tax in the Australian Government\u2019s federal budget?", "opt": {"A": "company tax", "B": "capital gains tax", "C": "goods and services tax", "D": "pay-as-you-go income tax"}, "ans": "C", "dist": {"A": 5, "B": 17, "C": 63, "D": 15}, "cp": 63, "band": "solid", "trap": "B", "trapPct": 17, "task": "task2_why_tempting", "kk": "4.1.2", "kkText": "sources of government revenue, including direct and indirect taxation; progressive, regressive and proportional taxes; revenue from government businesses and asset sales", "note": ""}, {"id": "2023-Q2", "set": "vcaa23", "year": 2023, "q": 2, "stem": "Which one of the following is not likely to be caused by an inflation rate of 7.8%?", "opt": {"A": "delayed consumption", "B": "erosion of purchasing power", "C": "distortions of investment decisions", "D": "a loss of international competitiveness"}, "ans": "A", "dist": {"A": 47, "B": 5, "C": 29, "D": 19}, "cp": 47, "band": "stretch", "trap": "C", "trapPct": 29, "task": "task2_why_tempting", "kk": "3.2.18", "kkText": "consequences of not achieving low and stable inflation", "note": "High inflation erodes purchasing power, distorts investment and damages competitiveness. What it does NOT do is delay consumption \u2014 it brings spending forward, because waiting costs you. Delayed consumption is a DEFLATION effect. The 29% who chose distorted investment named something inflation genuinely does cause."}, {"id": "2023-Q3", "set": "vcaa23", "year": 2023, "q": 3, "stem": "Which one of the following would be classified as government current expenditure when calculating aggregate demand?", "opt": {"A": "unemployment benefits provided by the Australian Government", "B": "the payment of salaries to the police force by a state government", "C": "a deposit paid by the Australian Government to the US Government for new nuclear submarines", "D": "the purchase of new computers for the neighbourhood library by a local government"}, "ans": "B", "dist": {"A": 33, "B": 40, "C": 15, "D": 12}, "cp": 40, "band": "trap", "trap": "A", "trapPct": 33, "task": "task2_why_tempting", "kk": "4.1.3", "kkText": "types of government expenses, including current and capital expenditure and transfer payments", "note": "Current expenditure is day-to-day operating spending, and salaries are the clearest case. The 33% who chose unemployment benefits picked a transfer payment \u2014 and transfers are not counted in AD at all. The government buys nothing; it moves money to a household, which then spends it as consumption."}, {"id": "2023-Q4", "set": "vcaa23", "year": 2023, "q": 4, "stem": "Which one of the following is not a strength of monetary policy when trying to reduce aggregate demand?", "opt": {"A": "Indebted households on variable rate loans are highly responsive to higher interest rates", "B": "Sectors of the economy in which there is excess demand can be easily targeted", "C": "The cash rate can be raised in small increments", "D": "Ithas a short implementation lag"}, "ans": "B", "dist": {"A": 14, "B": 68, "C": 7, "D": 11}, "cp": 68, "band": "solid", "trap": "A", "trapPct": 14, "task": "task2_why_tempting", "kk": "4.1.20", "kkText": "the strengths and weaknesses of monetary policy", "note": ""}, {"id": "2023-Q5", "set": "vcaa23", "year": 2023, "q": 5, "stem": "Which one of the following is least likely to result in a decrease in aggregate supply?", "opt": {"A": "an increase in interest rates", "B": "a slower rate of productivity growth", "C": "an increase in the number of people retiring", "D": "a decrease in the availability of capital resources"}, "ans": "B", "dist": {"A": 56, "B": 23, "C": 16, "D": 5}, "cp": 23, "band": "trap", "trap": "A", "trapPct": 56, "task": "task2_why_tempting", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": "VCAA's reasoning: a SLOWER RATE of productivity growth still means productivity is rising, so AS still increases. 56% chose interest rates, and VCAA accepts that higher rates can reduce AS through debt servicing costs. Interest rates work on both sides. In the exam you can use either \u2014 lead with AD, it is the bigger impact."}, {"id": "2023-Q6", "set": "vcaa23", "year": 2023, "q": 6, "stem": "Consider the following information for a hypothetical economy.<br>unemployed persons 10 million<br>underemployed persons 5 million<br>employed persons 70 million<br>total population 100 million<br><br>Based on the data shown above, the labour force underutilisation rate of this hypothetical economy is approximately", "opt": {"A": "10%", "B": "13%", "C": "15%", "D": "19%"}, "ans": "D", "dist": {"A": 3, "B": 7, "C": 46, "D": 43}, "cp": 43, "band": "trap", "trap": "C", "trapPct": 46, "task": "task2_why_tempting", "kk": "3.2.11", "kkText": "measurement of the labour force - participation, unemployment and under-utilisation rates", "note": "15% is 15 million over the total population. Same denominator error as the unemployment rate \u2014 under-utilisation is over the labour force, 80 million, giving roughly 19%."}, {"id": "2023-Q7", "set": "vcaa23", "year": 2023, "q": 7, "stem": "The payment of dividends to Australians holding shares in foreign companies will be recorded in the balance of payments as", "opt": {"A": "acredit in the capital and financial account", "B": "a debit in the capital and financial account", "C": "a credit in the current account", "D": "a debit in the current account"}, "ans": "C", "dist": {"A": 34, "B": 12, "C": 47, "D": 7}, "cp": 47, "band": "stretch", "trap": "A", "trapPct": 34, "task": "task2_why_tempting", "kk": "3.3.2", "kkText": "the balance of payments and its components", "note": "Dividends received BY Australians from shares held overseas are money flowing IN, so a credit, and income earned on investment sits in the current account. The 34% who chose the capital and financial account picked the account that records buying and selling the shares, not the income they pay."}, {"id": "2023-Q8", "set": "vcaa23", "year": 2023, "q": 8, "stem": "Cyclical unemployment is least likely to be caused by", "opt": {"A": "a decrease in the size of the government\u2019s budget structural deficit", "B": "a decrease in the world price of iron ore. C", "C": "lowrates of economic growth in China", "D": "negative interest rates"}, "ans": "D", "dist": {"A": 28, "B": 14, "C": 13, "D": 45}, "cp": 45, "band": "stretch", "trap": "A", "trapPct": 28, "task": "task2_why_tempting", "kk": "4.1.17", "kkText": "the transmission mechanism and its effect on AD: savings and investment, cash flow, exchange rate, asset prices and wealth", "note": "Cyclical unemployment comes from weak AD. Negative interest rates encourage borrowing and spending, which lifts AD and REDUCES cyclical unemployment. The 28% who chose the smaller structural deficit picked something that does cut AD \u2014 which makes it a cause, the opposite of what the question asked."}, {"id": "2023-Q9", "set": "vcaa23", "year": 2023, "q": 9, "stem": "Which one of the following is an example of an automatic stabiliser?", "opt": {"A": "higher company tax collections due to increased profitability", "B": "an increase in the cash rate due to an excessive inflation rate", "C": "a decision by the Australian Government to proceed with the Stage 3 tax cuts", "D": "increasing the goods and services tax rate to 12% due to an aging population"}, "ans": "A", "dist": {"A": 78, "B": 13, "C": 5, "D": 4}, "cp": 78, "band": "solid", "trap": "B", "trapPct": 13, "task": "task2_why_tempting", "kk": "4.1.8", "kkText": "the role of automatic stabilisers (cyclical component) in influencing AD and stabilising the business cycle", "note": ""}, {"id": "2023-Q10", "set": "vcaa23", "year": 2023, "q": 10, "stem": "The price elasticity of supply for avocados is likely to increase if", "opt": {"A": "preservatives are invented to extend the shelf life of avocados", "B": "there is an increase in demand for avocados", "C": "there is a decrease in the price of avocados", "D": "the cost of fertiliser increases"}, "ans": "A", "dist": {"A": 70, "B": 10, "C": 6, "D": 14}, "cp": 70, "band": "solid", "trap": "D", "trapPct": 14, "task": "task2_why_tempting", "kk": "3.1.13", "kkText": "factors affecting price elasticity of supply", "note": ""}, {"id": "2023-Q11", "set": "vcaa23", "year": 2023, "q": 11, "stem": "\u2018A cyclical factor that might cause Australia\u2019s current account balance to worsen is", "opt": {"A": "ahigh rate of economic growth in China", "B": "ahigh rate of economic growth in Australia", "C": "high energy costs due to the closure of coal-based power plants", "D": "lower productivity growth in Australia than in its major trading partners"}, "ans": "B", "dist": {"A": 8, "B": 28, "C": 18, "D": 45}, "cp": 28, "band": "trap", "trap": "D", "trapPct": 45, "task": "task2_why_tempting", "kk": "3.3.3", "kkText": "cyclical and structural influences on Australia's current account balance", "note": "Cyclical means tied to the business cycle. Strong growth in Australia pulls in imports faster than exports grow, worsening the current account. The 45% who chose lower productivity growth named a real problem, but a STRUCTURAL one. Check which type the question wants before you read the options."}, {"id": "2023-Q12", "set": "vcaa23", "year": 2023, "q": 12, "stem": "Australia\u2019s terms of trade is likely to deteriorate if", "opt": {"A": "the Australian dollar appreciates", "B": "export prices rise faster than import prices", "C": "there is excess supply of iron ore in world markets", "D": "there is an increase in productivity growth in Australia\u2019s major trading partners"}, "ans": "C", "dist": {"A": 28, "B": 11, "C": 51, "D": 11}, "cp": 51, "band": "stretch", "trap": "A", "trapPct": 28, "task": "task2_why_tempting", "kk": "3.3.6", "kkText": "the terms of trade - meaning, measurement and the factors affecting it", "note": "The terms of trade is export prices over import prices. Excess supply of iron ore drives export prices down, so the ratio falls. The 28% who chose an appreciation picked something that moves export and import prices together \u2014 and the causation usually runs the other way, with a high terms of trade lifting the dollar."}, {"id": "2023-Q13", "set": "vcaa23", "year": 2023, "q": 13, "stem": "Consider the following production possibility frontier (PPF) for a hypothetical nation. production Y of services production of goods \u2018A movement from point X to point Y is least likely to result in", "opt": {"A": "an increase in technical efficiency", "B": "an increase in the nation\u2019s real GDP", "C": "decrease in the nation\u2019s unemployment rate", "D": "a decrease in negative production externalities"}, "ans": "D", "dist": {"A": 16, "B": 7, "C": 15, "D": 62}, "cp": 62, "band": "solid", "trap": "A", "trapPct": 16, "task": "task2_why_tempting", "kk": "3.1.1", "kkText": "relative scarcity, needs, wants, resources, opportunity cost, the PPF model and the three basic economic questions", "note": ""}, {"id": "2023-Q14", "set": "vcaa23", "year": 2023, "q": 14, "stem": "Which one of the following outcomes is not usually associated with productivity growth?", "opt": {"A": "an increase in material living standards", "B": "an increase in international competitiveness", "C": "an increase in the prices of goods and services", "D": "an increase in the nation\u2019s productive capacity"}, "ans": "C", "dist": {"A": 9, "B": 4, "C": 83, "D": 4}, "cp": 83, "band": "fluency", "trap": "A", "trapPct": 9, "task": "task2_why_tempting", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}, {"id": "2024-Q2", "set": "vcaa24", "year": 2024, "q": 2, "stem": "Consider the following Production Possibility Frontier (PPF) for a hypothetical economy. PPF for an economy amount of coffee amount > oftea As the production of coffee increases in equal amounts, the opportunity cost in terms of tea", "opt": {"A": "increases", "B": "decreases", "C": "decreases then increases", "D": "stays the same. 2024 VCE Economics Section A Page 3 of"}, "ans": "A", "dist": {"A": 65, "B": 28, "C": 2, "D": 5}, "cp": 65, "band": "solid", "trap": "B", "trapPct": 28, "task": "task2_why_tempting", "kk": "3.1.1", "kkText": "relative scarcity, needs, wants, resources, opportunity cost, the PPF model and the three basic economic questions", "note": "The PPF bows outward because resources are not equally suited to both goods. Each extra unit of coffee pulls in resources that are worse at coffee, so it costs MORE tea than the last one. The 28% who said opportunity cost decreases described a PPF curving the wrong way."}, {"id": "2024-Q4", "set": "vcaa24", "year": 2024, "q": 4, "stem": "Which of the following is most likely to result in an increase in aggregate demand in the economy?", "opt": {"A": "a decrease in labour market productivity", "B": "anincrease in consumer confidence", "C": "an increase in the cash rate", "D": "a decrease in business confidence"}, "ans": "B", "dist": {"A": 1, "B": 96, "C": 2, "D": 0}, "cp": 96, "band": "fluency", "trap": "C", "trapPct": 2, "task": "none", "kk": "3.2.4", "kkText": "the meaning and importance of aggregate demand and the factors affecting it", "note": ""}, {"id": "2024-Q6", "set": "vcaa24", "year": 2024, "q": 6, "stem": "Which of the following factors are both characteristics of an expansion or upward swing in the business cycle?", "opt": {"A": "a decrease in production and an increase in capital investment", "B": "an increase in wages and rising business profits", "C": "an increase in unemployment and reduced transfer payments", "D": "anincrease in consumer spending and decreased business confidence Page 4 of 28 Section A 2024 VCE Economics"}, "ans": "B", "dist": {"A": 2, "B": 90, "C": 3, "D": 5}, "cp": 90, "band": "fluency", "trap": "D", "trapPct": 5, "task": "none", "kk": "3.2.3", "kkText": "the business cycle and its causes", "note": ""}, {"id": "2024-Q8", "set": "vcaa24", "year": 2024, "q": 8, "stem": "Consider a market where the demand for a good is relatively inelastic. If supply was to decrease in the market, it is most likely that the price will", "opt": {"A": "decrease, and quantity demanded will decrease by a relatively smaller amount", "B": "increase, and quantity demanded will decrease by a relatively smaller amount", "C": "increase, and quantity demanded will decrease by a relatively larger amount", "D": "decrease, and quantity demanded will fall by a relatively larger amount. 2024 VCE Economics Section A Page 5 of"}, "ans": "B", "dist": {"A": 8, "B": 80, "C": 10, "D": 2}, "cp": 80, "band": "fluency", "trap": "C", "trapPct": 10, "task": "task2_why_tempting", "kk": "3.1.11", "kkText": "the meaning and significance of price elasticity of demand and supply", "note": ""}, {"id": "2024-Q10", "set": "vcaa24", "year": 2024, "q": 10, "stem": "Which of the following is unlikely to increase cost inflation in the short term?", "opt": {"A": "an increase in the price of oil", "B": "anincrease in electricity prices", "C": "anincrease in the value of transfer payments", "D": "anincrease in tolls for major highways Page 6 of 28 Section A 2024 VCE Economics"}, "ans": "C", "dist": {"A": 4, "B": 3, "C": 74, "D": 19}, "cp": 74, "band": "solid", "trap": "D", "trapPct": 19, "task": "task2_why_tempting", "kk": "3.2.17", "kkText": "causes of inflation - demand inflation and cost inflation", "note": ""}, {"id": "2024-Q12", "set": "vcaa24", "year": 2024, "q": 12, "stem": "Aggregate supply policies are designed to", "opt": {"A": "maximise production in an economy", "B": "improve supply-side conditions so that domestic macroeconomic goals and enhanced living standards can be more easily achieved", "C": "ensure aggregate supply is always exceeding aggregate demand so that there are no shortfalls of supply in the economy", "D": "ensure that output is boosted in the short run to allow for the achievement of macroeconomic goals"}, "ans": "B", "dist": {"A": 5, "B": 90, "C": 4, "D": 1}, "cp": 90, "band": "fluency", "trap": "A", "trapPct": 5, "task": "none", "kk": "4.2.1", "kkText": "the use of AS policies to complement AD policies in promoting non-inflationary growth over time", "note": ""}, {"id": "2024-Q13", "set": "vcaa24", "year": 2024, "q": 13, "stem": "Which of the following will not cause a slowing of labour productivity in an economy?", "opt": {"A": "decreasing overall business investment", "B": "lower barriers to entry for international investors", "C": "lower levels of entrepreneurship, slowing allocation of resources to productive areas", "D": "lower investment in education and training"}, "ans": "B", "dist": {"A": 6, "B": 85, "C": 7, "D": 3}, "cp": 85, "band": "fluency", "trap": "C", "trapPct": 7, "task": "none", "kk": "3.2.5", "kkText": "the meaning and importance of aggregate supply and the factors affecting it", "note": ""}];
const LET = ['A','B','C','D'];
const MCODE = [
  ['M1','Didn\u2019t know it'],
  ['M2','Down to two'],
  ['M3','Misread the question'],
  ['M4','Calculation slip']
];
const KNOWLEDGE = new Set(['M1','M2']);   // Part 3: M3/M4 are not topic evidence

let cw=null, queue=[], i=0, pick=null, conf=null, mcode=null, log=[];
const app=document.getElementById('app'), count=document.getElementById('count');

/* ---- entry ---- */
(async function(){
  const u=new URLSearchParams(location.search).get('cw');
  if(u && clean(u).length>=3){ cw=clean(u); await loadHistory(cw); return choose(); }
  askCode();
})();

function askCode(){
  app.innerHTML=`<div class="card">
   <p class="stem" style="font-size:17px">Enter your code word</p>
   <p class="state">The same one you use on the portal. Nothing personal is stored.</p>
   <input type="text" id="cwin" autocomplete="off" placeholder="code word">
   <button class="go" id="cwgo" disabled>Start</button></div>`;
  const inp=document.getElementById('cwin'), go=document.getElementById('cwgo');
  inp.oninput=()=>go.disabled=clean(inp.value).length<3;
  inp.onkeydown=e=>{ if(e.key==='Enter'&&!go.disabled) go.click(); };
  go.onclick=async()=>{ cw=clean(inp.value); await loadHistory(cw); choose(); };
  inp.focus();
}

function stats(bands){
  const pool=BANK.filter(q=>bands.includes(q.band));
  let seen=0, due=0, ok=0, tot=0, guessOk=0;
  pool.forEach(q=>{
    const h=HIST[q.id];
    if(!h||!h.length) return;
    seen++;
    const last=h[h.length-1];
    if(isDue(h,Date.now())) due++;
    h.forEach(r=>{ tot++; if(r.ok) ok++; if(r.ok&&r.conf==='low') guessOk++; });
  });
  return {n:pool.length, seen, due, fresh:pool.length-seen,
          acc: tot? Math.round(100*ok/tot) : null, shaky:guessOk};
}

function choose(){
  count.textContent='';
  const F=stats(['fluency']), B=stats(['fluency','solid']), T=stats(['stretch','trap']);
  const restDay = LAST && sameDay(LAST, Date.now());
  const ready = F.acc!==null && F.acc>=85 && F.seen>=15 && F.shaky<=2;
  const line = s => s.seen
      ? `${s.fresh} not yet seen` + (s.due?` · <b>${s.due} due back</b>`:'') + (s.acc!==null?` · ${s.acc}% so far`:'')
      : `${s.n} questions`;
  app.innerHTML=`
   ${restDay?`<div class="card"><p class="verdict">You have already done a set today.</p>
     <p class="state">Spacing is what makes this work — a second set now teaches you much less than the same set tomorrow. Do the writing from last time instead.</p>
     <button class="go" id="anyway">Do another set anyway</button></div>`:''}
   <div class="card choose" ${restDay?'style="opacity:.45"':''} id="picker">
   <p class="state">Ten questions, about twelve minutes.${ready?' <b>Your warm-up sets are solid — try Build up.</b>':''}</p>
   <button data-b="fluency"><b>Warm up</b><span>${line(F)}</span></button>
   <button data-b="fluency,solid"><b>Build up</b><span>${line(B)}</span></button>
   <button data-b="stretch,trap"><b>Traps</b><span>${line(T)}</span></button>
  </div>`;
  const go=()=>app.querySelectorAll('#picker button').forEach(b=>b.onclick=()=>start(b.dataset.b.split(',')));
  if(restDay){
    document.getElementById('anyway').onclick=()=>{
      document.getElementById('picker').style.opacity='1'; go();
      document.getElementById('anyway').closest('.card').remove();
    };
  } else go();
}

/* due re-tests first, then unseen, then longest-ago */
function start(bands){
  const pool=BANK.filter(q=>bands.includes(q.band)), now=Date.now();
  const due=[], fresh=[], old_=[];
  pool.forEach(q=>{
    const h=HIST[q.id];
    if(!h||!h.length){ fresh.push(q); return; }
    const last=h[h.length-1];
    if(isDue(h,now)) due.push({q,ts:last.ts});
    else old_.push({q,ts:last.ts});
  });
  due.sort((a,b)=>a.ts-b.ts);
  old_.sort((a,b)=>a.ts-b.ts);
  const shuffle=a=>a.sort(()=>Math.random()-0.5);
  queue=[...due.slice(0,4).map(x=>x.q), ...shuffle(fresh)].slice(0,10);
  if(queue.length<10) queue=[...queue, ...old_.map(x=>x.q)].slice(0,10);
  shuffle(queue);
  i=0; log=[]; render();
}

function render(){
  if(i>=queue.length) return finish();
  const q=queue[i]; pick=null; conf=null; mcode=null;
  count.textContent=(i+1)+' of '+queue.length;
  app.innerHTML=`<div class="card">
   <div class="src">${q.year} exam, question ${q.q}</div>
   <p class="stem">${q.stem}</p>
   <div>${LET.map(L=>`<button class="opt" data-l="${L}" aria-pressed="false"><span class="ltr">${L}</span><span>${q.opt[L]}</span></button>`).join('')}</div>
   <fieldset><legend>How sure are you?</legend><div class="pills" id="conf">
    ${[['high','Sure'],['medium','Fairly sure'],['low','Guessing']].map(c=>`<button data-c="${c[0]}" aria-pressed="false">${c[1]}</button>`).join('')}
   </div></fieldset>
   <button class="go" id="go" disabled>Check answer</button></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=b.dataset.l;
    app.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));ready();});
  app.querySelectorAll('#conf button').forEach(b=>b.onclick=()=>{conf=b.dataset.c;
    app.querySelectorAll('#conf button').forEach(x=>x.setAttribute('aria-pressed',x===b));ready();});
  document.getElementById('go').onclick=reveal;
  window.scrollTo(0,0);
}
const ready=()=>document.getElementById('go').disabled=!(pick&&conf);

function reveal(){
  const q=queue[i], ok=pick===q.ans, sure=conf==='high';
  const tookTrap = pick===q.trap;
  const askWhy = !ok && (sure || (conf==='medium' && tookTrap));
  app.querySelectorAll('button,input').forEach(b=>b.disabled=true);
  const bars=LET.map(L=>{
    const cls=L===q.ans?'r':(L===q.trap?'t':'');
    return `<div class="row"><span class="ltr">${L}</span><div class="track"><div class="fill ${cls}" style="width:${q.dist[L]}%"></div></div><span class="pct">${q.dist[L]}%</span></div>`
      +(L===pick?`<div class="row"><span></span><span class="mine">\u2191 you chose this</span><span></span></div>`:'');
  }).join('');
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<p class="verdict ${ok?'ok':'no'}">${ok?'Correct \u2014 '+q.ans:'Not quite. The answer is '+q.ans+'.'}</p>
   <p class="state"><b>${q.cp}%</b> of the state got this right${q.trap?`, and <b>${q.trapPct}%</b> chose ${q.trap}`:''}.</p>
   <div>${bars}</div>
   ${q.note?`<div class="note">${q.note}</div>`:''}
   ${!ok?`<fieldset><legend>What happened?</legend><div class="pills" id="mc">
     ${MCODE.map(m=>`<button data-m="${m[0]}" aria-pressed="false">${m[1]}</button>`).join('')}</div></fieldset>`:''}
   ${askWhy?`<div class="why"><p>${sure?'You were sure, and':'You leaned that way, and'} ${q.trapPct}% of the state chose the same thing. Before you move on:</p>
     <input type="text" id="reason" placeholder="What made your answer look right?" autocomplete="off"></div>`:''}
   ${(ok&&conf==='low'&&q.cp>=80)?`<div class="flag">You guessed, and ${q.cp}% of the state got this. Worth another look \u2014 a right answer you weren\u2019t sure of is still a gap.</div>`:''}
   <button class="go" id="next" ${ok?'':'disabled'}>${i===queue.length-1?'Finish':'Next question'}</button>`;
  app.appendChild(c);
  const next=document.getElementById('next');
  if(!ok) app.querySelectorAll('#mc button').forEach(b=>b.onclick=()=>{mcode=b.dataset.m;
    app.querySelectorAll('#mc button').forEach(x=>x.setAttribute('aria-pressed',x===b));next.disabled=false;});
  next.onclick=()=>{
    const r=document.getElementById('reason');
    log.push({q,pick,conf,ok,code:mcode,reason:r?r.value.trim():''});
    i++; render();
  };
  c.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function finish(){
  count.textContent='Done';
  const rows=log.map(l=>{
    const r={t:'mc',set:l.q.set,q:l.q.q,kk:l.q.kk,ok:l.ok,conf:l.conf,
             st:l.q.cp,                                   // state % correct, copied at attempt time
             cond:{time:'full',mat:'closed',mark:'self'},ts:Date.now()};
    if(!l.ok&&l.code) r.code=l.code;
    return r;
  });
  let saved=true, S=null;
  try{ S=await pushAttempts(cw,rows); await loadHistory(cw); }catch(e){ saved=false; }
  const wrong=log.filter(l=>!l.ok);
  const rank={high:0,medium:1,low:2};
  const three=[...wrong].sort((a,b)=>rank[a.conf]-rank[b.conf]||b.q.trapPct-a.q.trapPct).slice(0,3);
  const fragile=log.filter(l=>l.ok&&l.conf==='low');
  const real=wrong.filter(l=>KNOWLEDGE.has(l.code));
  const TASK={
    task2_why_tempting:'Write why that option looked right, then write why it fails.',
    task3_rewrite_stem:'Rewrite the question so that your answer would have been the correct one.',
    task4_link_prior:'Write where you first met this idea in class, and what you have forgotten since.',
    none:'Read the explanation again. This one was a slip, not a gap.'};
  let exp='';
  try{ exp='ECON1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){}
  app.innerHTML=`<div class="card">
   <div class="tally"><span><b>${log.length-wrong.length}</b>correct</span><span><b>${wrong.length}</b>missed</span><span><b>${fragile.length}</b>lucky guesses</span></div>
   ${three.length?`<p class="state">Write about these three. Nothing else.</p>
    ${three.map(l=>`<div class="slot"><h3>${l.q.year} question ${l.q.q}</h3>
      <p class="meta">${l.q.kkText}</p>
      ${l.reason?`<div class="quote">You wrote: \u201c${l.reason}\u201d</div>`:''}
      <p>${TASK[l.q.task]||TASK.task2_why_tempting}</p></div>`).join('')}`
    :'<p>Nothing missed this time.</p>'}
   ${wrong.length&&real.length<wrong.length?`<div class="flag">${wrong.length-real.length} of your misses were a misread or a slip rather than a gap. Those don\u2019t count against the topic \u2014 but they cost the same mark in the exam.</div>`:''}
   ${wrong.length?`<p class="state">The ${wrong.length} you missed will come back in under a week, mixed into a normal set. That return is where the correction sticks.</p>`:''}
   ${fragile.length?`<p class="state">You guessed right on ${fragile.length}. Worth a second look before then.</p>`:''}
   ${!saved?`<div class="flag">Couldn\u2019t save this session. Your answers are still on screen \u2014 note them down before you close this.</div>`:''}
  </div>
  <div class="card"><p class="state">Backup string \u2014 give this to your teacher or paste it on another device.</p>
   <p><code>${exp||'unavailable'}</code></p>
   <button class="go" id="again">Done for today</button></div>`;
  document.getElementById('again').onclick=choose;
  window.scrollTo(0,0);
}
</script></body></html>
