  stem:`Explain how an appreciation of the Australian dollar may affect the structure of relative prices and resource allocation in Australia.`,
  crit:[ {t:'Explains the change in relative prices: Australian products become dearer relative to imports and to overseas competitors',m:1},
         {t:'Explains the fall in sales and profitability of trade-exposed industries',m:1},
         {t:'Explains the movement of resources towards other sectors',m:1} ],
  model:`<p>An appreciation makes Australian-made products more expensive for overseas buyers in their own currency, and makes imports cheaper for Australians. So Australian products become relatively more expensive than imports, both here and overseas.</p>
    <p>Industries that export or compete with imports, such as tourism, education and manufacturing, lose sales and profitability. They demand fewer resources, which are reallocated towards sectors with stronger demand. During the mining boom, for example, a high dollar driven partly by a rising terms of trade saw resources shift away from these industries and towards mining.</p>` },

{ qt:'resalloc', q:'ra-mining-boom', n:'4', marks:5, kk:'3.1.14',
  stem:`Explain how the mining boom in Australia resulted in a change in relative prices and a reallocation of the nation\u2019s resources.`,
  crit:[ {t:'Rising demand raises relative wages in mining, drawing labour into the industry',m:1},
         {t:'The boom lifts the dollar, changing the relative prices of imports and local goods',m:1},
         {t:'Imports become relatively cheaper, so demand for locally made goods falls',m:1},
         {t:'Trade-exposed industries cut production and employ fewer resources',m:1},
         {t:'Resources move away from those industries, with some structural unemployment',m:1} ],
  model:`<p>The mining boom was driven by rising demand for Australian resources from rapidly developing nations. As demand rose, mining companies paid higher wages relative to other sectors, encouraging some workers to move from non-mining to mining industries.</p>
    <p>The boom also contributed to an appreciation of the Australian dollar, changing relative prices \u2014 the price of one good or service compared with another. Imports became cheaper in Australian dollars, and Australian products became more expensive in foreign currency.</p>
    <p>Cheaper imports lowered costs for businesses that rely on imported inputs and for retailers of imported goods, so locally made goods became relatively more expensive. For example, a foreign-made car became relatively cheaper, and demand for locally made cars fell. Local manufacturers cut production targets, so fewer land, labour and capital resources were used in the local car industry. Some workers became structurally unemployed until they could retrain for growing industries. Tourism, education and retail faced similar pressures.</p>
    <p>Exporters also found it harder to sell overseas. Much like a tariff cut, the high dollar pushed local firms to cut costs, source cheaper inputs or become more productive, using fewer resources for similar output.</p>
    <p>Overall, the mining boom shifted resources away from tourism, education, manufacturing and retail, directly through relative wages and indirectly through the dollar and the relative prices of imports and exports.</p>` },

{ qt:'resalloc', q:'ra-relative-prices', n:'5', marks:4, kk:'3.1.14',
  stem:`Explain how a change in relative prices might result in a reallocation of resources.`,
  crit:[ {t:'Defines relative prices',m:1},
         {t:'Explains how a change in demand or supply creates a shortage or surplus and changes relative prices',m:1},
         {t:'Explains how price signals change relative profitability',m:1},
         {t:'Explains how resources are reallocated, using a realistic example',m:1} ],
  model:`<p>Relative prices are the price of one product in terms of another. A change in relative prices changes the relative profitability of producing one product rather than another, signalling to market participants that they should reconsider their behaviour.</p>
    <p>For example, suppose consumers switch from Product A to Product B after it is announced that Product B has considerable health benefits. There is a short-term surplus of Product A, lowering its price, and a short-term shortage of Product B, pushing its price up.</p>
    <p>Suppliers read these price signals as falling profitability for Product A and rising profitability for Product B, assuming production costs are stable. More land, labour and capital are directed to supplying Product B and fewer to Product A, assuming resources can move easily. In a competitive market consumer sovereignty prevails: suppliers respond directly to the relative price signals created by changes in consumer spending.</p>`,
  report:`<p>Many students used an example well. Common errors: arguing that suppliers are attracted when prices are <i>lower</i>; writing about the price of one product rather than relative prices; and saying higher prices cause reallocation without showing why or how.</p>` },

/* ============================== STABILISERS ============================== */
{ qt:'stabiliser', q:'stab-trends-budget', n:'1', marks:4, kk:'4.1.10', now:['gdp','unemp','budget'],
  stem:`Explain, with reference to automatic stabilisers, how the trends in the unemployment rate and the rate of economic growth may have affected the federal government\u2019s budget outcome for 2025\u201326.`,
  crit:[ {t:'Explains automatic stabilisers: the cyclical component of the budget',m:1},
         {t:'Links the trend in unemployment to outlays and receipts',m:1},
         {t:'Links the trend in economic growth to tax receipts',m:1},
         {t:'Links these to the budget outcome, with current data',m:1} ],
  model:`<p>Automatic stabilisers are the cyclical component of the budget, which responds to changing economic conditions without the government needing to make any policy decision.</p>
    <p>In 2025\u201326 the economy grew 2.4% and the labour market stayed strong, with unemployment in the low 4% range for most of the year. Strong employment boosted personal income tax receipts and kept unemployment benefit payments low, and high commodity prices supported company profits and company tax.</p>
    <p>As a result, receipts were higher than expected. The 2026\u201327 Budget estimated the 2025\u201326 deficit at $28.3 billion, $8.5 billion smaller than forecast in the December MYEFO.</p>`,
  altLabel: RECENT + ' (2009\u201310): a downturn',
  alt:`<p>As growth slowed and unemployment rose after the global financial crisis, outlays on unemployment benefits increased, income tax receipts grew more slowly, and falling company profits reduced company tax. With outlays up and receipts down, the deficit for 2009\u201310 was expected to reach $57.6 billion, up from $32.1 billion the year before.</p>` },

{ qt:'stabiliser', q:'stab-auto-disc-4yrs', n:'2', marks:4, kk:'4.1.10', two:true, cur:'adapted', now:['budget','budget27'],
  stem:`Explain how automatic and discretionary stabilisers might have influenced the budget outcome over the last four years.`,
  crit:[ {t:'Explains automatic stabilisers',m:1},
         {t:'Explains discretionary stabilisers',m:1},
         {t:'Explains how automatic stabilisers influenced the outcome, with evidence',m:1},
         {t:'Explains how discretionary changes influenced the outcome, with evidence',m:1} ],
  model:`<p><i>Written for 2008\u201309 to 2011\u201312.</i></p>
    <p>Automatic stabilisers are the cyclical component of the budget, changing with the business cycle without any government action. Discretionary stabilisers are the structural component: changes the government deliberately makes to budget items.</p>
    <p>The budget was in deficit throughout these four years. When the global financial crisis hit, unemployment rose and growth fell, so income tax receipts fell and welfare outlays rose automatically. Although unemployment later fell, it stayed above its pre-crisis level.</p>
    <p>The government also made discretionary changes, including two stimulus packages that transferred funds to households and funded major infrastructure such as \u2018Building the Education Revolution\u2019. This extra spending widened the deficit further.</p>
    <p>As the economy recovered, with unemployment around 5% and growth around 4%, welfare outlays fell and tax receipts rose automatically, and the deficit shrank. The government also cut spending in areas including defence and private health insurance rebates, aiming for a surplus in 2012\u201313.</p>` },

{ qt:'stabiliser', q:'stab-growth-below-2', n:'3', marks:3, kk:'4.1.10', now:['gdp','budget27'],
  stem:`Discuss the effect of automatic stabilisers on the federal budget outcome if real economic growth falls below 2% per annum.`,
  crit:[ {t:'States the meaning and essential qualities of automatic stabilisers',m:1},
         {t:'Makes evident the impact of lower growth on tax receipts and welfare payments',m:1},
         {t:'Makes evident the relationship between slower growth and the budget outcome',m:1} ],
  model:`<p>Automatic stabilisers are features built into the budget that change automatically with the level of economic activity. They are the cyclical component of the budget, and include personal income tax, company tax and welfare payments.</p>
    <p>If real growth falls below 2% a year, businesses respond to slower aggregate demand by reducing production, so employment falls. Fewer people in work means less personal income tax collected and more spent on welfare payments. Slower growth also reduces business profits and so company tax.</p>
    <p>Each of these either reduces government receipts or increases outlays, so the budget outcome worsens and the deficit increases. With growth at 2.1% through the year to June 2026 and forecast to slow, this is a live risk for the 2026\u201327 deficit, forecast at $31.5 billion.</p>`,
  report:`<p>This is one of a number of possible answers.</p>` },

/* ======================== STRUCTURAL UNEMPLOYMENT ======================== */
{ qt:'structural', q:'str-cyclical-vs-structural', n:'1', marks:2, kk:'3.2.12',
  stem:`Explain the difference between cyclical unemployment and structural unemployment.`,
  crit:[ {t:'Defines cyclical unemployment: caused by a downturn in economic activity',m:1},
         {t:'Defines structural unemployment and states the difference: a skills mismatch that exists regardless of the cycle',m:1} ],
  model:`<p>Cyclical unemployment arises from a decline in macroeconomic activity: a slowdown in aggregate demand leads businesses to cut production, reducing their derived demand for labour. This may lead to retrenchments or fewer new jobs advertised.</p>
    <p>Structural unemployment arises from structural changes within industries over time, creating a mismatch between the skills businesses need and the skills job seekers have. These changes can come from advances in technology, global pressures, changes in government policy, changes in resource availability, or changes in competitiveness such as a shift in the exchange rate.</p>
    <p>The key difference is that cyclical unemployment depends on the strength of macroeconomic activity, while structural unemployment can exist whatever the health of the economy.</p>`,
  report:`<p>Many students struggled to define the two types, which made the difference hard to explain. Many gave only a cause of each. Too many confused cyclical unemployment with seasonal unemployment.</p>` },

{ qt:'structural', q:'str-policy', n:'2', marks:2, kk:'4.2.3',
  stem:`Describe <b>one</b> example of discretionary budgetary policy that could be implemented to lower the rate of structural unemployment.`,
  crit:[ {t:'Identifies a policy that targets the skills mismatch',m:1},
         {t:'Explains how it helps the structurally unemployed find work',m:1} ],
  model:`<p>The government could increase funding for retraining programs and further education. The structurally unemployed would learn new skills, allowing them to find work in other industries and reducing the mismatch between the skills job seekers have and those growing industries need.</p>`,
  report:`<p>Many students didn\u2019t seem to know the causes of structural unemployment, so they chose a policy that might reduce unemployment in general rather than one targeting structural unemployment.</p>` },

/* ============================= TERMS OF TRADE ============================= */
{ qt:'tot', q:'tot-bot-vs-tot', n:'1', marks:2, kk:'3.3.6',
  stem:`What is the difference between the balance of trade and the terms of trade?`,
  crit:[ {t:'Defines the balance of trade, as a value',m:1},
         {t:'Defines the terms of trade as a ratio of prices, and states the difference',m:1} ],
  model:`<p>The balance of trade is the value of exports of goods and services minus the value of imports. \u2018Value\u2019 means both price and quantity matter: value is price multiplied by quantity.</p>
    <p>The terms of trade is a ratio of price indices: the price received for a weighted basket of exports divided by the price paid for a weighted basket of imports.</p>
    <p>So the balance of trade measures net exports, a contribution to GDP, while the terms of trade measures the relative prices of exports and imports.</p>` },

{ qt:'tot', q:'tot-unfavourable', n:'2', marks:4, kk:'3.3.8', two:true, now:['tot','ca'],
  stem:`Analyse how an unfavourable movement in the terms of trade is likely to affect Australia\u2019s<ul><li>balance of payments on current account</li><li>living standards.</li></ul>`,
  crit:[ {t:'Explains the effect on the current account: lower export prices reduce credits',m:2},
         {t:'Explains the effect on living standards, through incomes, jobs and wellbeing',m:2} ],
  model:`<p><b>Current account.</b> When the terms of trade fall, each export receives a lower price, so a given quantity sold earns less revenue. The value of exports may fall, even if export volumes rise. The balance of trade deteriorates, so the current account balance may also become more negative.</p>
    <p><b>Living standards.</b> Lower export prices mean, for example, that miners receive less for each tonne sold, so some mining projects are no longer profitable and high-cost mines may close. Workers who lose their jobs move from wages to unemployment benefits, so their disposable income falls and their ability to buy goods and services, their material living standards, falls. Their non-material living standards may fall too, as unemployment can damage self-esteem and increase anxiety and depression.</p>`,
  report:`<p>Many students thought an unfavourable movement meant a fall in the <i>quantity</i> of exports. It means export prices falling relative to import prices. High-scoring students analysed the current account in terms of credits and debits, which helped structure their answer.</p>` },

{ qt:'tot', q:'tot-rise-budget', n:'3', marks:3, kk:'3.3.8', now:['tot','budget'],
  stem:`Explain the likely impact of a rise in the terms of trade on the federal government\u2019s budget position.`,
  points:[ 'Define the terms of trade and link to a movement, with data', 'Give a reason it has risen',
           'A higher terms of trade raises export profits', 'Higher tax receipts and lower welfare payments',
           'The budget outcome improves', 'Link to current information' ],
  model:`<p>The terms of trade is the index of export prices divided by the index of import prices. <i>This example was written when the terms of trade had risen strongly over 2018, driven by higher prices for commodities such as iron ore.</i></p>
    <p>A higher terms of trade increases the value of net exports and the profits of exporting companies and the businesses and workers who depend on them. This raises company tax receipts, and personal income tax receipts rise as export industries employ more workers. Fewer people need welfare payments. Together these automatic stabilisers improve the budget outcome: the 2018\u201319 MYEFO showed the forecast deficit improving from $14.5 billion to $5.2 billion, partly due to the higher terms of trade.</p>`,
  report:`<p>A current link: the 2026\u201327 Budget credited high commodity prices, along with a strong jobs market, with lifting tax receipts.</p>` },

{ qt:'tot', q:'tot-rise-fe-ls', n:'4', marks:5, kk:'3.3.8', two:true,
  stem:`Describe the likely effect of an increase in the terms of trade on full employment and living standards.`,
  crit:[ {t:'States the meaning and essential qualities of the goal of full employment',m:1},
         {t:'Explains why the terms of trade affect full employment',m:2},
         {t:'Explains why the terms of trade affect living standards',m:2} ],
  model:`<p>The goal of full employment is the lowest rate of unemployment without cyclical unemployment and without adding to inflation, often called the NAIRU: the non-accelerating inflation rate of unemployment.</p>
    <p>An increase in the terms of trade means we receive more for our exports relative to what we pay for imports. The value of exports rises relative to imports, increasing net exports and aggregate demand. Suppliers increase production to meet the higher demand, so the economy grows, and more resources, including labour, are needed. Unemployment falls.</p>
    <p>More employment raises material living standards, as higher disposable income per person increases access to goods and services. Having a job can also lift self-esteem and may reduce crime, improving non-material living standards.</p>`,
  report:`<p>This is one of a number of possible answers.</p>` },

/* ========================= TRANSMISSION MECHANISM ========================= */
{ qt:'transmission', q:'tm-cashflow-exchange', n:'1', marks:4, kk:'4.1.17', two:true,
  stem:`Analyse, with reference to the cash-flow channel and the exchange rate channel of the transmission mechanism, how cuts in official interest rates might operate to assist in the achievement of the goal of full employment.`,
  crit:[ {t:'Explains the cash-flow channel',m:1},
         {t:'Links it through AD and the derived demand for labour to full employment',m:1},
         {t:'Explains the exchange rate channel, including how the depreciation occurs',m:1},
         {t:'Links it through net exports to full employment',m:1} ],
  model:`<p><b>Cash-flow channel.</b> A cut in the cash rate flows on to interest rates on personal, home and business loans. Households and businesses already paying variable rates find servicing their debt cheaper, which increases their discretionary income and may increase consumption and investment spending.</p>
    <p>Higher aggregate demand signals producers to expand output, increasing the derived demand for labour and other resources. This reduces cyclical unemployment, moving the economy towards full employment.</p>
    <p><b>Exchange rate channel.</b> Lower interest rates in Australia, relative to rates overseas, make interest-bearing deposits here less attractive to overseas investors. Capital flows out, increasing the supply of Australian dollars in the foreign exchange market relative to demand, so the dollar depreciates.</p>
    <p>A lower dollar increases demand for Australian exports and import-competing goods and reduces demand for imports. More injections and fewer leakages boost the profitability of Australian businesses, which expand and employ more people.</p>`,
  report:`<p>Many students knew both channels but didn\u2019t link them to full employment. Some described a different channel from the ones asked for, and some confused discretionary income with disposable income. Many knew a cut causes a depreciation but couldn\u2019t explain how.</p>` },

{ qt:'transmission', q:'tm-rate-rises-growth', n:'2', marks:3, kk:'4.1.17', now:['cash','gdp'],
  stem:`Explain, with reference to <b>at least one</b> transmission mechanism channel, how the increases in interest rates in 2026 may affect the rate of economic growth over the next 12 months.`,
  crit:[ {t:'Identifies the change in rates and names a channel',m:1},
         {t:'Explains how the channel works',m:1},
         {t:'Links it through AD and production to economic growth',m:1} ],
  model:`<p>The RBA raised the cash rate three times in 2026, from 3.60% to 4.35%. Through the cash-flow channel, households with variable-rate home loans face higher repayments, leaving them less discretionary income after paying their mortgage.</p>
    <p>With less to spend, households cut consumption, so businesses see weaker sales and reduce production. As production falls, employment and incomes may fall too, reducing spending further through the multiplier effect. Growth is likely to slow over the next 12 months; it had already eased to 2.1% through the year to June 2026, from 2.6% at the end of 2025.</p>`,
  altLabel: RECENT + ' (2016): a cut',
  alt:`<p>The RBA cut the cash rate to 1.5% during 2016. Through the cash-flow channel, households with variable-rate home loans faced lower repayments and had more discretionary income. If they spent it, businesses saw higher sales and increased production, using spare capacity. As production increased, employment and incomes rose, generating further spending through the multiplier effect.</p>` },

{ qt:'transmission', q:'tm-stance-two-channels', n:'3', marks:6, kk:'4.1.19', two:true, now:['cash','aud','gdp','unemp'],
  stem:`Analyse the monetary policy stance adopted by the Reserve Bank of Australia over the past 12 months. Using <b>two</b> monetary policy transmission channels, explain how this stance is likely to have an impact on the goals of strong and sustainable economic growth and full employment.`,
  crit:[ {t:'Identifies the stance, with data',m:1},
         {t:'Explains the first channel',m:1},
         {t:'Explains the second channel',m:1},
         {t:'Explains the likely effect on economic growth',m:1},
         {t:'Explains the likely effect on full employment',m:1},
         {t:'Addresses all parts of the question in a structured analysis',m:1} ],
  model:`<p><b>Stance.</b> The RBA adopted a contractionary stance, raising the cash rate three times in 2026, from 3.60% to 4.35%, and describing policy as somewhat restrictive. With inflation well above the 2\u20133% target, it aimed to slow demand and bring inflation back to target.</p>
    <p><b>Cash-flow channel.</b> Higher interest rates raise repayments for households and businesses with variable-rate debt, reducing their discretionary income. Less is spent on consumption and investment, reducing aggregate demand.</p>
    <p><b>Exchange rate channel.</b> Higher Australian interest rates, relative to rates overseas, attract capital inflows, increasing demand for the Australian dollar. The dollar rose to about 71 US cents, making exports dearer and imports cheaper, reducing net exports and AD.</p>
    <p><b>The goals.</b> Lower AD slows production, so economic growth eases: growth fell to 2.1% through the year to June 2026, from 2.6% at the end of 2025. With less production, businesses need less labour, and unemployment rose from 4.3% earlier in 2026 to 4.5% in July. The stance works against faster growth and lower unemployment in the short term, in order to return inflation to target and support sustainable growth over time.</p>`,
  report:`<p>The highest-scoring answers were carefully structured and addressed every part of the question: the stance, two channels, and the effect on both growth and employment. Many spent too long defining terms. Some wrote about open market operations instead of the channels.</p>
    <p>The four study design channels: savings and investment, cash-flow, exchange rate, and asset prices and wealth.</p>` },
{ qt:'transmission', q:'tm-mp-full-employment', n:'4', marks:3, kk:'4.1.19', now:['cash','unemp'],
  stem:`Analyse the possible impact of changes in monetary policy over the past 12 months on the achievement of the goal of full employment.`,
  points:[ 'Outline the latest changes in the cash rate', 'Link through a transmission channel',
           'The effect on AD', 'The effect on production', 'The effect on the resources, including labour, that businesses need',
           'The effect on unemployment', 'Land on the goal of full employment' ],
  model:`<p>The RBA raised the cash rate three times in 2026, from 3.60% to 4.35%, a contractionary stance. Through the cash-flow channel, higher cash rates flow through to higher retail interest rates, so individuals and businesses with variable-rate loans pay more in interest. Their discretionary income and after-tax profits fall.</p>
    <p>Lower discretionary income reduces spending and investment, lowering aggregate demand. Suppliers reduce production and so need fewer resources, including labour, reducing the derived demand for labour. Unemployment rose from 4.3% earlier in 2026 to 4.5% in July.</p>
    <p>In the short term this works against the goal of full employment, although the RBA judged the labour market to have been tighter than is consistent with low and stable inflation, so some rise in unemployment may bring it closer to the NAIRU.</p>`,
  altLabel: RECENT + ' (2016): cuts',
  alt:`<p>The RBA cut the cash rate by 25 basis points to 1.75% in May 2016, and to 1.5% in August 2016 \u2014 an expansionary stance, below the neutral rate at the time. Through the cash-flow channel, lower retail interest rates reduced repayments, raising discretionary incomes and after-tax profits. Higher spending and investment boosted AD, so suppliers increased production and their derived demand for labour, moving the economy closer to full employment.</p>` }
);

</script>
<script>
/* =====================================================================
   Practice by question type — student tool for the exam portal
   Shared contract: one record per student at econ2026:<code word>.
   This tool only ever APPENDS rows tagged t:'practice' to S.pr.
   ===================================================================== */

const NS = 'econ2026:';
const KEY = cw => NS + cw;
const SETTING = k => NS + '@' + k;          // '@' keys can never collide with a code word
const MEM = {};
const Store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){}
    return MEM[k] || null;
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); return; }catch(e){}
    MEM[k] = v;
  }
};
const clean = s => (s || '').toLowerCase().replace(/\s+/g, '');

/* read-modify-write: re-read immediately before writing, keep every key we don't own */
async function pushRow(cw, row){
  const raw = await Store.get(KEY(cw));
  const S = raw ? JSON.parse(raw) : { v:1, cw };   // a corrupt record throws here, so we never overwrite it
  S.pr = S.pr || [];
  S.pr.push(row);
  await Store.set(KEY(cw), JSON.stringify(S));
  const check = JSON.parse(await Store.get(KEY(cw)) || '{}');
  if(!(check.pr || []).some(r => r.t === 'practice' && r.ts === row.ts && r.q === row.q)) throw new Error('not saved');
  return S;
}
async function readRecord(){
  try{ const raw = await Store.get(KEY(cw)); return raw ? JSON.parse(raw) : { v:1, cw }; }
  catch(e){ return { v:1, cw, _unreadable:true }; }
}

/* ---------------- state ---------------- */
let cw = null, REC = { v:1 }, ROWS = [], PLAN = [];
let COND = { time:'full', mat:'closed' };
let VIEW = { name:'home', qt:null, list:[], idx:0, filter:'all' };
let CUR = null, TICK = null, TOAST = '';

const app = document.getElementById('app');
const who = document.getElementById('who');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = html => { const d = document.createElement('div'); d.innerHTML = html; return d.textContent.replace(/\s+/g,' ').trim(); };
const typeOf = qt => TYPES.find(t => t.qt === qt);
const inType = qt => BANK.filter(b => b.qt === qt);
const hkey = r => r.set + '|' + r.q;
const mins = m => { const x = m * 1.5; return (Number.isInteger(x) ? x : Math.floor(x) + '\u00BD') + ' min'; };
const ago = ts => { const d = Math.floor((Date.now() - ts) / 86400000); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
const kkName = k => KK_LABEL[k] || 'this topic';

/* ---------------- entry ---------------- */
(async function(){
  try{ const c = JSON.parse(await Store.get(SETTING('practice')) || 'null'); if(c && c.time && c.mat) COND = c; }catch(e){}
  const fromUrl = new URLSearchParams(location.search).get('cw');
  if(fromUrl && clean(fromUrl).length >= 3){ cw = clean(fromUrl); await Store.set(SETTING('cw'), cw); return start(); }
  const saved = await Store.get(SETTING('cw'));
  if(saved && saved.length >= 3){ cw = saved; return start(); }
  askCode();
})();

function askCode(){
  stopClock();
  who.innerHTML = '';
  app.innerHTML = `<div class="card">
    <p class="stem">What is your code word?</p>
    <p class="note">The same one you use on the portal, so this practice joins up with the rest of your work. Nothing personal is stored.</p>
    <input type="text" id="cwin" aria-label="Code word" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="your code word">
    <button class="go" id="cwgo" disabled>Continue</button></div>`;
  const inp = document.getElementById('cwin'), go = document.getElementById('cwgo');
  inp.oninput = () => { go.disabled = clean(inp.value).length < 3; };
  inp.onkeydown = e => { if(e.key === 'Enter' && !go.disabled) go.click(); };
  go.onclick = async () => { cw = clean(inp.value); await Store.set(SETTING('cw'), cw); start(); };
  inp.focus();
}

async function start(){
  who.innerHTML = `<a class="toportal" id="toportal" href="index.html?cw=${encodeURIComponent(cw)}">Portal</a>
    <span>Code word <b>${esc(cw)}</b></span> <button class="linkbtn" id="chg">change</button>`;
  document.getElementById('chg').onclick = () => { if(leaveOk()) askCode(); };
  document.getElementById('toportal').onclick = e => { if(!leaveOk()) e.preventDefault(); else CUR = null; };
  await refresh();
  home();
}

async function refresh(){
  REC = await readRecord();
  ROWS = (REC.pr || []).filter(r => r && r.t === 'practice');
  PLAN = readPlan(REC);
}

/* ---------------- the tracker's plan: read, never enforce ----------------
   Expected at S.plan, written by the tracker:
     { ts, items:[ { qt:'govint', kk:['3.1.18'] }, ... ] }
   An item may carry qt only, kk only, or both. Codes are study design order. */
function readPlan(S){
  const p = S && S.plan;
  if(!p) return [];
  const items = Array.isArray(p) ? p : (Array.isArray(p.items) ? p.items : []);
  return items.map(it => ({
      qt: it && typeof it.qt === 'string' ? it.qt : null,
      kk: [].concat((it && it.kk) || []).filter(x => typeof x === 'string')
    })).filter(it => it.qt || it.kk.length);
}
function planForType(qt){
  const here = inType(qt).map(b => b.kk);
  const hits = PLAN.filter(it => it.qt === qt || (!it.qt && it.kk.some(k => here.includes(k))));
  if(!hits.length) return null;
  const kk = [...new Set(hits.flatMap(it => it.kk))].filter(k => here.includes(k));
  return { kk };
}
const planHits = b => PLAN.some(it => (it.qt === b.qt || !it.qt) && it.kk.includes(b.kk));

/* ---------------- conditions ---------------- */
function condBar(){
  const seg = (k, opts) => `<span class="seg" role="group">${opts.map(([v,l]) =>
    `<button data-k="${k}" data-v="${v}" aria-pressed="${COND[k]===v}">${l}</button>`).join('')}</span>`;
  return `<div class="cond"><span>How you\u2019re working</span>
    ${seg('time', [['full','Timed'],['ext','Untimed']])}
    ${seg('mat', [['closed','Notes closed'],['open','Notes open']])}</div>`;
}
function wireCond(){
  app.querySelectorAll('.cond button').forEach(b => b.onclick = async () => {
    COND[b.dataset.k] = b.dataset.v;
    app.querySelectorAll(`.cond button[data-k="${b.dataset.k}"]`).forEach(x => x.setAttribute('aria-pressed', x === b));
    await Store.set(SETTING('practice'), JSON.stringify(COND));
  });
}

/* ---------------- home: every type, fixed order ---------------- */
function toastHtml(){ const t = TOAST; TOAST = ''; return t ? `<div class="toast" role="status">${t}</div>` : ''; }

function home(){
  stopClock();
  VIEW = { name:'home', qt:null, list:[], idx:0, filter:VIEW.filter || 'all' };
  const twos = BANK.filter(b => b.two);
  const counts = TYPES.map(t => ROWS.filter(r => r.qt === t.qt).length);
  const top = Math.max(1, ...counts);

  const list = TYPES.map((t, i) => {
    const qs = inType(t.qt), n = counts[i];
    const tried = new Set(ROWS.filter(r => r.qt === t.qt).map(hkey)).size;
    const p = planForType(t.qt) || (PLAN.some(it => it.qt === t.qt) ? { kk:[] } : null);
    const planTag = p ? `<span class="plan">Your plan points here${p.kk.length ? ', especially ' + p.kk.map(kkName).join(' and ') : ''}</span>` : '';
    const sub = qs.length ? `${qs.length} question${qs.length>1?'s':''}` : 'Questions not loaded yet';
    return `<li><button class="fold${qs.length?'':' off'}" data-qt="${t.qt}" ${qs.length?'':'disabled'}>
      <span><span class="nm">${t.name}</span><span class="sub">${sub}</span>${planTag}</span>
      <span class="meter" aria-label="${n} answers done"><b>${n}</b>
        <span class="trk"><span class="fil" style="width:${Math.round(100*n/top)}%;display:block"></span></span>
        ${qs.length ? `<small>${tried} of ${qs.length} tried</small>` : ''}</span>
    </button></li>`;
  }).join('');

  const twoList = twos.map(b => qItem(b, true)).join('');

  app.innerHTML = `${toastHtml()}
    <p class="lead">Pick a type of question and work through it. Write your answer first, then mark it against the guide.</p>
    ${condBar()}
    <div class="filters" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="${VIEW.filter==='all'}">All types</button>
      <button data-f="two" aria-pressed="${VIEW.filter==='two'}">Two-part questions (${twos.length})</button>
    </div>
    <div id="f-all" class="${VIEW.filter==='all'?'':'hide'}">
      <div class="tally-head"><span>Question type</span><span>Answers done</span></div>
      <ul class="folders">${list}</ul>
    </div>
    <div id="f-two" class="card ${VIEW.filter==='two'?'':'hide'}">
      <p class="note">These ask for two things. Answering only one half is the most common way marks go missing: every question that scored under 45% across the state from 2023 to 2025 asked for two things.</p>
      <ul class="qlist">${twoList}</ul>
    </div>
    ${footer()}`;

  wireCond();
  app.querySelectorAll('.filters button').forEach(b => b.onclick = () => { VIEW.filter = b.dataset.f; home(); });
  app.querySelectorAll('.fold:not(:disabled)').forEach(b => b.onclick = () => folder(b.dataset.qt));
  app.querySelectorAll('#f-two .qbtn').forEach(b => b.onclick = () => {
    VIEW.list = twos; open(twos.findIndex(x => x.q === b.dataset.q), 'two');
  });
  wireCopy();
  window.scrollTo(0, 0);
}

function footer(){
  let exp = '';
  try{ if(!REC._unreadable) exp = 'ECON1:' + btoa(unescape(encodeURIComponent(JSON.stringify(REC)))); }catch(e){}
  return `<div class="foot">
    <p>Your marks and reasons save against your code word on this device. What you type in the answer box is not kept.</p>
    ${REC._unreadable ? '<p class="flag">Your saved record couldn\u2019t be read on this device, so nothing new will be saved over it. Show your teacher.</p>' : ''}
    <details><summary>Backup string</summary>
      <p>Copy this and keep it somewhere safe, or give it to your teacher. It holds all your portal work, not just this page.</p>
      <code id="exp">${exp || 'unavailable'}</code>
      <button class="linkbtn" id="copy" ${exp?'':'disabled'}>Copy backup string</button>
    </details></div>`;
}
function wireCopy(){
  const b = document.getElementById('copy'); if(!b) return;
  b.onclick = async () => {
    const t = document.getElementById('exp').textContent;
    try{ await navigator.clipboard.writeText(t); b.textContent = 'Copied'; }
    catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById('exp'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected \u2014 copy it now'; }
  };
}

/* ---------------- one type ---------------- */
function qItem(b, showType){
  const h = ROWS.filter(r => hkey(r) === SET_ID + '|' + b.q);
  const last = h[h.length - 1];
  const stat = last
    ? `Last time <b>${last.got}/${last.marks}</b>, ${ago(last.ts)}${h.length > 1 ? ` \u00B7 ${h.length} tries` : ''}`
    : 'Not tried yet';
  const lab = showType ? `${typeOf(b.qt).name}, question ${b.n}` : `Question ${b.n}`;
  return `<li><button class="qbtn" data-q="${b.q}">
    <span class="qhead"><span>${planHits(b) ? '<span class="dot" aria-hidden="true"></span>' : ''}${lab}</span><span>${b.marks} mark${b.marks>1?'s':''}</span></span>
    <span class="qtext">${esc(plain(b.stem))}</span>
    <span class="qstat">${stat}${planHits(b) ? ' \u00B7 on your plan' : ''}${b.cur === 'adapted' ? ' \u00B7 older context' : ''}</span>
  </button></li>`;
}

function folder(qt){
  stopClock();
  const t = typeOf(qt), qs = inType(qt);
  VIEW = { name:'folder', qt, list:qs, idx:0, filter:VIEW.filter };
  const n = ROWS.filter(r => r.qt === qt).length;
  const p = planForType(qt);
  const firstNew = qs.findIndex(b => !ROWS.some(r => hkey(r) === SET_ID + '|' + b.q));

  app.innerHTML = `${toastHtml()}
    <div class="crumb"><button class="linkbtn" id="back">All question types</button><span>${n} answer${n===1?'':'s'} done</span></div>
    <div class="card">
      <h2>${t.name}</h2>
      <p class="note">${t.d}</p>
      ${INTRO[qt] ? `<details class="rep intro"><summary>How to approach these</summary>${INTRO[qt]}</details>` : ''}
      ${p ? `<p class="plan">Your plan points here${p.kk.length ? '. Look for the questions marked with a dot \u2014 they\u2019re on ' + p.kk.map(kkName).join(' and ') : ''}</p>` : ''}
      <ul class="qlist">${qs.map(b => qItem(b, false)).join('')}</ul>
      ${firstNew >= 0 ? `<button class="go quiet" id="nextnew">Start the first one you haven\u2019t tried</button>` : ''}
    </div>`;

  document.getElementById('back').onclick = home;
  app.querySelectorAll('.qbtn').forEach(b => b.onclick = () => open(qs.findIndex(x => x.q === b.dataset.q), 'folder'));
  const nn = document.getElementById('nextnew'); if(nn) nn.onclick = () => open(firstNew, 'folder');
  window.scrollTo(0, 0);
}

/* ---------------- attempt ---------------- */
function stopClock(){ if(TICK){ clearInterval(TICK); TICK = null; } }
function leaveOk(){ return !(CUR && CUR.revealed && !CUR.saved) || confirm('Leave without saving this attempt?'); }
function backTo(){ if(!leaveOk()) return; CUR = null; VIEW.from === 'two' ? (VIEW.filter = 'two', home()) : folder(VIEW.qt); }

function open(idx, from){
  stopClock();
  const b = VIEW.list[idx];
  VIEW = { ...VIEW, name:'q', idx, from, qt: from === 'folder' ? VIEW.qt : b.qt };
  CUR = { b, conf:null, paper:false, text:'', revealed:false, saved:false, marked:false,
          got:0, pick:null, ticks:new Set(), codes:[], t0:Date.now(), secs:0 };
  const t = typeOf(b.qt);
  const timed = COND.time === 'full';

  app.innerHTML = `${toastHtml()}
    <div class="crumb"><button class="linkbtn" id="back">${from === 'two' ? 'Two-part questions' : t.name}</button>
      <span>${idx + 1} of ${VIEW.list.length}</span></div>
    <div class="card" id="attempt">
      <div class="src"><span>${t.name}, question ${b.n}</span><span>${b.marks} mark${b.marks>1?'s':''} \u00B7 about ${mins(b.marks)}</span></div>
      ${b.cur === 'adapted' ? `<p class="aside dated">This question was written for an earlier year. Practise the structure, and where it asks about recent conditions, use the figures you know now.</p>` : ''}
      ${b.stim ? `<div class="stim">${STIM[b.stim]}</div>` : ''}
      <p class="stem">${b.stem}</p>
      ${b.note ? `<p class="aside">${b.note}</p>` : ''}
      ${b.now ? nowBox(b.now) : ''}
      <label for="ans" class="note" style="display:block;margin:0 0 6px">Your answer</label>
      <textarea id="ans" placeholder="Write it here, or on paper as you would in the exam."></textarea>
      <label class="check"><input type="checkbox" id="paper"> I wrote it on paper</label>
      ${timed ? `<p class="note" style="margin:10px 0 0">Time <span class="clock" id="clock">0:00</span> of about ${mins(b.marks)}</p>` : ''}
      <fieldset><legend>Before you look: how sure are you of your answer?</legend>
        <div class="pills" id="conf">
          ${[['high','Sure'],['medium','Fairly sure'],['low','Guessing']].map(c => `<button data-c="${c[0]}" aria-pressed="false">${c[1]}</button>`).join('')}
        </div></fieldset>
      <button class="go" id="reveal" disabled>Show the marking guide</button>
      <p class="lock" id="need">Write your answer, or tick that you wrote it on paper, and choose how sure you are.</p>
    </div>
    <div id="mark"></div>`;

  const ans = document.getElementById('ans'), paper = document.getElementById('paper');
  const go = document.getElementById('reveal'), need = document.getElementById('need');
  const ready = () => {
    const wrote = CUR.paper || CUR.text.trim().length >= 15;
    go.disabled = !(wrote && CUR.conf);
    need.textContent =
        !wrote && !CUR.conf ? 'Write your answer, or tick that you wrote it on paper, and choose how sure you are.'
      : !wrote             ? 'Write your answer, or tick that you wrote it on paper.'
      : !CUR.conf          ? 'Choose how sure you are.'
      : 'Once you look, your answer and how sure you were are locked in.';
  };
  ans.oninput = () => { CUR.text = ans.value; ready(); };
  paper.onchange = () => { CUR.paper = paper.checked; ready(); };
  app.querySelectorAll('#conf button').forEach(x => x.onclick = () => {
    CUR.conf = x.dataset.c;
    app.querySelectorAll('#conf button').forEach(y => y.setAttribute('aria-pressed', y === x));
    ready();
  });
  go.onclick = reveal;
  document.getElementById('back').onclick = backTo;

  if(timed){
    const clock = document.getElementById('clock'), limit = b.marks * 90;
    TICK = setInterval(() => {
      const s = Math.floor((Date.now() - CUR.t0) / 1000);
      clock.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      clock.classList.toggle('over', s > limit);
    }, 1000);
  }
  window.scrollTo(0, 0);
}

function nowBox(keys){
  const rows = keys.filter(k => CURRENT[k]).map(k => { const c = CURRENT[k];
    return `<li><b>${c.l}:</b> ${c.v}. <span>${c.n}</span> <small>(${c.s})</small></li>`; }).join('');
  return `<details class="nowbox"><summary>Current figures you can use, as at ${CURRENT_ASAT}</summary><ul>${rows}</ul>
    <p class="note" style="margin:6px 0 0">Check these against your data workbook. Figures change \u2014 quote the latest you know, with its date.</p></details>`;
}

/* ---------------- reveal and self-mark ---------------- */
function reveal(){
  const b = CUR.b;
  stopClock();
  CUR.revealed = true;
  CUR.secs = Math.round((Date.now() - CUR.t0) / 1000);
  const A = document.getElementById('attempt');
  A.querySelectorAll('textarea,input,button').forEach(x => x.disabled = true);
  document.getElementById('reveal').classList.add('hide');
  document.getElementById('need').textContent = 'Locked in. Now mark it honestly against the guide.';

  const guide = b.crit
    ? `<p class="note">Tick each line your answer actually does. Close enough doesn\u2019t count.</p>
       <ul class="crit">${b.crit.map((c, i) => `<li><label><input type="checkbox" data-i="${i}"><span>${c.t}</span><span class="mk">${c.m} mark${c.m>1?'s':''}</span></label></li>`).join('')}</ul>
       <button class="linkbtn" id="none" style="margin-top:8px">My answer doesn\u2019t do any of these</button>`
    : `<p class="note">Check your answer against each point, then give yourself a mark.</p>
       <ol class="pts">${b.points.map(p => `<li>${p}</li>`).join('')}</ol>
       <p class="note" style="margin:12px 0 0">Your mark out of ${b.marks}</p>
       <div class="markpick" role="group">${Array.from({length:b.marks + 1}, (_, i) => `<button data-m="${i}" aria-pressed="false">${i}</button>`).join('')}</div>`;

  const M = document.getElementById('mark');
  M.innerHTML = `<div class="card">
      <h2>Mark your answer</h2>
      ${CUR.text.trim() ? `<h3>What you wrote</h3><div class="mine" id="mine"></div>` : ''}
      <h3>Marking guide</h3>
      ${guide}
      <div id="sample">
        <h3>Sample answer</h3>
        <div class="model">${b.model}</div>
        ${b.alt ? `<p class="or">${b.altLabel || 'Another way to answer it'}</p><div class="model">${b.alt}</div>` : ''}
      </div>
      ${b.tips ? `<details class="rep"><summary>What markers look for</summary>${b.tips}</details>` : ''}
      ${b.report ? `<details class="rep"><summary>${b.tips ? 'What the examiners saw' : 'What the examiners saw, and notes'}</summary>${b.report}</details>` : ''}
      <div class="score" id="score" aria-live="polite"></div>
      <div id="why"></div>
      <div id="fix"></div>
      <div class="row2">
        <button class="go" id="save" disabled>${VIEW.idx < VIEW.list.length - 1 ? 'Save and next question' : 'Save and finish'}</button>
      </div>
      <button class="linkbtn" id="savelist" style="margin-top:12px" disabled>Save and go back to the list</button>
      <p class="lock" id="saveneed">Mark your answer first.</p>
    </div>`;
  if(CUR.text.trim()) document.getElementById('mine').textContent = CUR.text;

  if(b.crit){
    M.querySelectorAll('.crit input').forEach(x => x.onchange = () => {
      x.checked ? CUR.ticks.add(+x.dataset.i) : CUR.ticks.delete(+x.dataset.i);
      CUR.marked = true;
      CUR.got = Math.min(b.marks, [...CUR.ticks].reduce((s, i) => s + b.crit[i].m, 0));
      update();
    });
    document.getElementById('none').onclick = () => {
      M.querySelectorAll('.crit input').forEach(x => x.checked = false);
      CUR.ticks.clear(); CUR.marked = true; CUR.got = 0; update();
    };
  } else {
    M.querySelectorAll('.markpick button').forEach(x => x.onclick = () => {
      M.querySelectorAll('.markpick button').forEach(y => y.setAttribute('aria-pressed', y === x));
      CUR.marked = true; CUR.got = +x.dataset.m; update();
    });
  }
  document.getElementById('save').onclick = () => save(true);
  document.getElementById('savelist').onclick = () => save(false);
  M.firstElementChild.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start' });
}

function update(){
  const b = CUR.b, lost = b.marks - CUR.got;
  document.getElementById('score').innerHTML = `<b>${CUR.got}/${b.marks}</b><span>${
    lost === 0 ? 'Full marks.' : lost === 1 ? 'One mark lost.' : lost + ' marks lost.'}</span>`;

  /* reasons: required when two or more marks are lost (shared rule) */
  const why = document.getElementById('why');
  if(lost >= 2){
    if(!why.dataset.on){
      why.dataset.on = '1';
      why.innerHTML = `<h3>Why did the marks go?</h3>
        <p class="note">Pick the main reason, then a second if there was one. Tap again to remove.</p>
        ${b.two ? `<p class="aside">This question asks for two things. If you only answered one of them, that\u2019s A2.</p>` : ''}
        ${Object.entries(CODES).map(([f, F]) => `<div class="fam"><p><b>${F.name}</b> <span>${F.note}</span></p>
          <div class="codes">${F.list.map(([c, nm]) => `<button data-code="${c}" aria-pressed="false"><b>${c}</b>${nm}</button>`).join('')}</div></div>`).join('')}
        <p class="lock" id="codenote"></p>`;
      why.querySelectorAll('.codes button').forEach(x => x.onclick = () => pickCode(x.dataset.code));
    }
    drawCodes();
  } else {
    why.dataset.on = ''; why.innerHTML = ''; CUR.codes = [];
  }

  /* revise: the third step, after attempt and compare */
  const fix = document.getElementById('fix');
  if(lost >= 1 && !fix.dataset.on){
    fix.dataset.on = '1';
    fix.innerHTML = `<h3>Fix it</h3>
      <p class="note">Hide the sample answer, then rewrite the part you missed in your own words. If you can\u2019t do it without looking, that tells you something.</p>
      <button class="go quiet" id="hideS" style="margin-top:0">Hide the sample answer</button>
      <textarea id="redo" placeholder="Your rewrite. This isn\u2019t saved." style="margin-top:10px;min-height:120px"></textarea>`;
    document.getElementById('hideS').onclick = e => {
      const s = document.getElementById('sample'), hid = s.classList.toggle('hide');
      e.target.textContent = hid ? 'Show the sample answer again' : 'Hide the sample answer';
    };
  } else if(lost === 0){ fix.dataset.on = ''; fix.innerHTML = ''; document.getElementById('sample').classList.remove('hide'); }

  canSave();
}

function pickCode(c){
  const i = CUR.codes.indexOf(c);
  const note = document.getElementById('codenote');
  note.textContent = '';
  if(i >= 0) CUR.codes.splice(i, 1);
  else if(CUR.codes.length < 2) CUR.codes.push(c);
  else note.textContent = 'Two at most. Tap one to remove it first.';
  drawCodes(); canSave();
}
function drawCodes(){
  document.querySelectorAll('#why .codes button').forEach(x => {
    const r = CUR.codes.indexOf(x.dataset.code);
    if(r >= 0){ x.dataset.rank = r + 1; x.setAttribute('aria-pressed', 'true'); }
    else { delete x.dataset.rank; x.setAttribute('aria-pressed', 'false'); }
  });
  const note = document.getElementById('codenote');
  if(note && !note.textContent && CUR.codes.some(c => c[0] === 'B') && COND.mat === 'open')
    note.textContent = 'Your notes were open, so this won\u2019t be counted as a content gap.';
}
function canSave(){
  const b = CUR.b, lost = b.marks - CUR.got;
  const ok = CUR.marked && !(lost >= 2 && CUR.codes.length === 0);
  document.getElementById('save').disabled = !ok;
  document.getElementById('savelist').disabled = !ok;
  document.getElementById('saveneed').textContent = !CUR.marked ? 'Mark your answer first.'
    : !ok ? 'Pick at least one reason before saving.' : '';
}

/* ---------------- save ---------------- */
async function save(next){
  const b = CUR.b, lost = b.marks - CUR.got;
  const row = { t:'practice', qt:b.qt, kk:b.kk, set:SET_ID, q:b.q, marks:b.marks, got:CUR.got,
                conf:CUR.conf, cond:{ time:COND.time, mat:COND.mat, mark:'self' }, ts:Date.now() };
  if(lost > 0 && CUR.codes[0]) row.code = CUR.codes[0];
  if(lost > 0 && CUR.codes[1]) row.code2 = CUR.codes[1];

  const btns = [document.getElementById('save'), document.getElementById('savelist')];
  btns.forEach(x => x.disabled = true);
  try{
    if(REC._unreadable) throw new Error('unreadable');
    await pushRow(cw, row);
  }catch(e){
    btns.forEach(x => x.disabled = false);
    document.getElementById('saveneed').innerHTML =
      '<span class="flag" style="display:block">This didn\u2019t save. Your record on this device couldn\u2019t be updated \u2014 note your mark down, and try again later.</span>';
    return;
  }
  CUR.saved = true;
  await refresh();
  TOAST = feedback(b, row);
  CUR = null;
  if(next && VIEW.idx < VIEW.list.length - 1) open(VIEW.idx + 1, VIEW.from);
  else if(VIEW.from === 'two'){ VIEW.filter = 'two'; home(); }
  else folder(VIEW.qt);
}

function feedback(b, row){
  const head = `Saved question ${b.n}: ${row.got}/${row.marks}.`;
  const lost = row.marks - row.got;
  if(lost === 0 && row.conf === 'low') return `${head} Full marks, but you were guessing. Come back to this one in a few days.`;
  if(lost === 0) return `${head} Full marks.`;
  if(row.conf === 'high' && lost >= 2) return `${head} You were sure, and lost ${lost} marks. That gap is worth more of your attention than anything else here.`;
  if(row.code && row.code[0] === 'B') return `${head} This counts towards ${kkName(b.kk)}.`;
  if(row.code) return `${head} This was about how you answered, not what you know, so it won\u2019t count against ${kkName(b.kk)}.`;
  return head;
}
window.addEventListener('beforeunload', e => { if(CUR && CUR.revealed && !CUR.saved){ e.preventDefault(); e.returnValue = ''; } });

</script>
