<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Practice by question type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
--serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
--ink:#17223B;--soft:#5B6478;--paper:#E9ECF1;--card:#fff;--rule:#D2D8E0;
--right:#1B7F5A;--trap:#A8324A;--bar:#C3C9D2;--warn:#B6801F;--wash:#F4F6F9;--plan:#FDF6E3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:26px 20px 80px}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hide{display:none!important}

header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding-bottom:13px;border-bottom:2px solid var(--ink);margin-bottom:24px}
h1{font:500 19px/1.2 var(--sans);margin:0}
.who{font-size:14px;color:var(--soft);white-space:nowrap}
.who b{color:var(--ink);font-weight:600}
.toportal{color:var(--ink);font-weight:500;text-decoration:none;border:1px solid var(--rule);border-radius:3px;
  padding:4px 9px;margin-right:10px;background:var(--card)}
.toportal:hover{border-color:var(--ink)}
@media (max-width:520px){.who{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 0;align-items:baseline}}
.linkbtn{background:none;border:0;padding:0;color:var(--soft);font:400 14px var(--sans);
  text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.crumb{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:14px;color:var(--soft);margin:-10px 0 18px}
.crumb a{color:var(--soft)}

.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:22px;margin-bottom:14px}
.lead{font:400 17px/1.5 var(--serif);margin:0 0 18px}
.note{font-size:14px;color:var(--soft);margin:0 0 14px}
.stem{font:400 19px/1.5 var(--serif);margin:0 0 16px}
.stem b{font-weight:500}
.stem ul{margin:8px 0 0;padding-left:22px}
.fig img{max-width:100%;height:auto;display:block;border:1px solid var(--rule)}
.nowbox{background:var(--wash);border-radius:3px;padding:10px 14px;margin:0 0 16px;font-size:14.5px}
.nowbox summary{cursor:pointer;font-weight:500}
.nowbox ul{margin:10px 0 0;padding-left:18px}
.nowbox li{margin:0 0 7px}
.nowbox li span{color:var(--ink)}
.nowbox small{color:var(--soft)}
details.intro{margin:0 0 12px;border-top:0;padding-top:0}
details.intro p,details.intro ol{font-size:15px}
.src{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;margin-bottom:11px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

input[type=text],textarea{width:100%;font:400 16px/1.5 var(--sans);color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:12px 14px}
textarea{min-height:170px;resize:vertical}
textarea:disabled{background:var(--wash);color:var(--soft)}
.go{margin-top:16px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:3px;
  padding:14px;font:500 16px var(--sans);cursor:pointer}
.go:disabled{background:var(--rule);color:#8A93A3;cursor:not-allowed}
.go.quiet{background:none;color:var(--ink);border:1px solid var(--ink)}
.row2{display:flex;gap:10px}.row2 .go{flex:1}

/* --- conditions --- */
.cond{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--soft);
  margin:0 0 16px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 11px;font:500 13.5px var(--sans);cursor:pointer;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* --- folder list: the tally is the point --- */
.filters{display:flex;gap:8px;margin:0 0 12px}
.filters button{background:none;border:1px solid var(--rule);border-radius:3px;padding:8px 12px;
  font:500 14px var(--sans);cursor:pointer;color:var(--soft)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tally-head{display:grid;grid-template-columns:1fr 92px;gap:14px;font-size:12.5px;color:var(--soft);
  padding:0 16px 6px}
.tally-head span:last-child{text-align:right}
.folders{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--rule);border-radius:3px}
.folders li+li{border-top:1px solid var(--rule)}
.fold{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;width:100%;
  text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer}
.fold:hover:not(:disabled){background:var(--wash)}
.fold:disabled{cursor:default}
.fold .nm{font:500 16px/1.3 var(--sans);display:block}
.fold .sub{font-size:13.5px;color:var(--soft);display:block;margin-top:2px}
.fold.off .nm{color:var(--soft);font-weight:400}
.plan{display:inline-block;font:500 12.5px/1 var(--sans);color:#7A5410;background:var(--plan);
  border-left:3px solid var(--warn);padding:4px 7px;margin-top:6px}
.meter{text-align:right;font-variant-numeric:tabular-nums}
.meter b{font:600 20px/1 var(--sans);display:block}
.meter .trk{height:4px;background:#EEF0F4;margin-top:6px;border-radius:2px;overflow:hidden}
.meter .fil{height:100%;background:var(--ink)}
.meter small{font-size:12px;color:var(--soft);display:block;margin-top:4px}

/* --- question list inside a folder --- */
.qlist{list-style:none;margin:0;padding:0}
.qlist li+li{border-top:1px solid var(--rule)}
.qbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 0;cursor:pointer}
.qbtn:hover .qtext{text-decoration:underline}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--soft);
  font-variant-numeric:tabular-nums}
.qtext{font:400 16px/1.45 var(--serif);margin:3px 0 0;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qstat{font-size:13px;margin-top:4px;color:var(--soft)}
.qstat b{color:var(--ink);font-weight:600}
.grp{font-size:13px;color:var(--soft);padding:14px 0 0;margin:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}

/* --- stimulus --- */
.stim{border-left:2px solid var(--rule);padding-left:14px;margin:0 0 18px;font-size:15px}
.stim p{margin:0 0 10px}
.stimhead{font-weight:600}
.quote{font:400 16px/1.5 var(--serif);margin:0 0 8px;padding:0}
.srcline{font-size:13px;color:var(--soft)}
.tbl{overflow-x:auto;margin:0 0 10px}
table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
th,td{border-bottom:1px solid var(--rule);padding:7px 10px 7px 0;text-align:left;vertical-align:top}
th{font-weight:600;font-size:13px}
.fig{margin:6px 0 10px;overflow-x:auto}
.fig svg{width:100%;min-width:250px;max-width:520px;height:auto;display:block}
.fig figcaption{font:600 14px var(--sans);margin:0 0 4px}
.fig .ax path{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .ah{fill:var(--ink);stroke:none}
.fig .dash path{stroke:var(--soft);stroke-width:1;stroke-dasharray:4 4;fill:none}
.fig .cv path{stroke:var(--ink);stroke-width:2;fill:none}
.fig .pt{fill:var(--soft);stroke:var(--ink);stroke-width:1.2}
.fig .arw{stroke:var(--ink);stroke-width:2.5}
.fig .lb{font:600 16px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.fig .al{font:italic 15px var(--serif);fill:var(--ink)}
.fig .tk{font:15px var(--sans);fill:var(--ink)}
.fig .tk.e{text-anchor:end}.fig .tk.m{text-anchor:middle}

/* --- attempt --- */
.aside{background:var(--wash);border-radius:3px;padding:11px 14px;font-size:14.5px;margin:0 0 16px}
.aside.dated{background:var(--plan);border-left:3px solid var(--warn)}
.clock{font-variant-numeric:tabular-nums}
.clock.over{color:var(--warn);font-weight:600}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-size:14px;color:var(--soft);padding:0 0 8px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{flex:1;min-width:92px;background:none;border:1px solid var(--rule);border-radius:3px;
  padding:10px;cursor:pointer;font:500 14px var(--sans)}
.pills button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pills button:disabled{cursor:default}
.pills button:disabled:not([aria-pressed="true"]){opacity:.5}
.check{display:flex;align-items:center;gap:9px;font-size:14.5px;margin-top:10px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.lock{font-size:13px;color:var(--soft);margin-top:8px}

/* --- reveal --- */
h2{font:600 16px/1.3 var(--sans);margin:0 0 10px}
h3{font:600 14.5px/1.3 var(--sans);margin:18px 0 8px}
.mine{white-space:pre-wrap;font-size:15px;background:var(--wash);border-radius:3px;padding:12px 14px;margin:0 0 4px;
  max-height:260px;overflow:auto}
.crit{list-style:none;margin:0;padding:0}
.crit li{border-bottom:1px solid var(--rule)}
.crit label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 0;cursor:pointer;align-items:start}
.crit input{width:18px;height:18px;margin-top:2px;accent-color:var(--right)}
.crit .mk{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts{margin:0;padding-left:20px}
.pts li{margin:0 0 5px}
.model{font:400 16.5px/1.62 var(--serif)}
.model p{margin:0 0 12px}
.or{font-size:13px;color:var(--soft);margin:4px 0 10px}
details.rep{margin-top:6px;border-top:1px solid var(--rule);padding-top:10px}
details.rep summary{cursor:pointer;font-weight:500;font-size:15px}
details.rep p{font-size:15px;margin:10px 0 0}
.score{display:flex;align-items:baseline;gap:10px;margin:16px 0 0;padding-top:14px;border-top:2px solid var(--ink)}
.score b{font:600 28px/1 var(--sans);font-variant-numeric:tabular-nums}
.score span{color:var(--soft);font-size:14px}
.markpick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.markpick button{min-width:46px;background:none;border:1px solid var(--rule);border-radius:3px;padding:9px 0;
  font:600 16px var(--sans);cursor:pointer;font-variant-numeric:tabular-nums}
.markpick button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.fam{margin:12px 0 0}
.fam p{margin:0 0 6px;font-size:14px}
.fam p b{font-weight:600}
.fam p span{color:var(--soft)}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.codes button{background:none;border:1px solid var(--rule);border-radius:3px;padding:7px 9px;
  font:400 14px var(--sans);cursor:pointer;text-align:left;position:relative}
.codes button b{font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.codes button[data-rank]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);padding-left:30px}
.codes button[data-rank]::before{content:attr(data-rank);position:absolute;left:7px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font:600 11px/17px var(--sans);text-align:center}
.flag{background:var(--plan);border-left:3px solid var(--warn);padding:11px 14px;margin:14px 0 0;font-size:14.5px}
.good{border-left:3px solid var(--right);background:#EEF7F2;padding:11px 14px;margin:14px 0 0;font-size:14.5px}

.toast{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--right);border-radius:3px;
  padding:12px 16px;margin:0 0 14px;font-size:15px}

.foot{margin-top:26px;padding-top:15px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--soft)}
.foot p{margin:0 0 8px}
.foot code{display:block;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;
  font-size:12px;word-break:break-all;max-height:90px;overflow:auto;margin:6px 0}

@media (max-width:520px){
  .wrap{padding:20px 14px 70px}
  .card{padding:18px 16px}
  .stem{font-size:18px}
  .fold{grid-template-columns:1fr 70px;padding:13px 14px}
  .tally-head{grid-template-columns:1fr 70px;padding:0 14px 6px}
  .meter b{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .meter .fil{transition:width .4s ease-out}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 id="title">Practice by question type</h1>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>
</div>
<script>
/* =====================================================================
   PRACTICE BANK — teacher folders, 2026
   One entry per question. Every question carries:
     qt   question type slug (one of the eighteen)
     kk   key knowledge, STUDY DESIGN order (never booklet order)
     q    stable id within set 'tf26' — do not rename once students use it
   Optional:
     stim   id of a shared stimulus in STIM (sub-parts share one)
     two    true when the stem asks for two things (the A2 trap)
     cur    'adapted' when the context was written for an earlier year
     crit   [{t, m}] marking criteria, m = marks for that line
     points [text]   key points with no marks attached (student picks the mark)
     model  sample answer, HTML
     alt    second sample answer, HTML
     report what the examiners saw, HTML
   ===================================================================== */

const SET_ID = 'tf26';

/* ---- the eighteen types: slugs are shared with the tracker, never rename ---- */
const TYPES = [
  { qt:'fivepoint',    name:'5 point process',          d:'Take a market change through the demand and supply diagram, from the factor to the new equilibrium.' },
  { qt:'aud',          name:'Australian dollar',        d:'What moves the dollar, and what a movement does to the economy.' },
  { qt:'calc',         name:'Calculations',             d:'Work out the indicators from real data, with the formulas and a calculator.' },
  { qt:'define',       name:'Definitions',              d:'Say exactly what a term means, in study design language.' },
  { qt:'trends',       name:'Describe trends',          d:'Read a graph and describe what happened, with figures and dates.' },
  { qt:'difference',   name:'Difference',               d:'Define both terms, then say how they differ.' },
  { qt:'elasticity',   name:'Elasticity',               d:'How responsive quantity is to price, and why.' },
  { qt:'evaluate',     name:'Evaluate',                 d:'Weigh strengths against weaknesses and arrive at a judgement.' },
  { qt:'factors',      name:'Factors',                  d:'Name a specific factor and trace how it had its effect.' },
  { qt:'govint',       name:'Government intervention',  d:'When the market fails, what government does about it, and when that goes wrong.' },
  { qt:'impact',       name:'Impact',                   d:'Trace a change through to its effect, where no other type fits.' },
  { qt:'refdata',      name:'Refer to data',            d:'Use the figures you are given, and say what they show.' },
  { qt:'relationship', name:'Relationship',             d:'How two things move together, and why.' },
  { qt:'resalloc',     name:'Resource allocation',      d:'How relative prices move land, labour and capital between uses.' },
  { qt:'stabiliser',   name:'Stabilisers',              d:'How automatic and discretionary changes move the budget.' },
  { qt:'structural',   name:'Structural unemployment',  d:'Structural unemployment only: what it is and what reduces it.' },
  { qt:'tot',          name:'Terms of trade',           d:'Export prices against import prices, and what a movement does.' },
  { qt:'transmission', name:'Transmission mechanism',   d:'How a cash rate change travels through the channels to the goals.' }
];

/* ---- short topic labels. Students see these, never the codes ---- */
const KK_LABEL = {
  '3.1.1':'relative scarcity and the PPF','3.1.2':'the types of economic efficiency','3.1.3':'conditions for a competitive market',
  '3.1.4':'the law of demand','3.1.5':'movements along and shifts of the demand curve','3.1.6':'non-price demand factors',
  '3.1.7':'the law of supply','3.1.8':'movements along and shifts of the supply curve','3.1.9':'non-price supply factors',
  '3.1.10':'changes in equilibrium price and quantity','3.1.11':'price elasticity of demand and supply',
  '3.1.12':'factors affecting elasticity of demand','3.1.13':'factors affecting elasticity of supply',
  '3.1.14':'relative prices and resource allocation','3.1.15':'competitive markets and efficient allocation',
  '3.1.16':'types of market failure','3.1.17':'government intervention to address market failure',
  '3.1.18':'intervention that reduces efficiency',
  '3.2.1':'material and non-material living standards','3.2.2':'the circular flow model','3.2.3':'the business cycle',
  '3.2.4':'aggregate demand and its factors','3.2.5':'aggregate supply and its factors',
  '3.2.6':'the goal of strong and sustainable growth','3.2.7':'measuring economic growth',
  '3.2.8':'consequences of missing the growth goal','3.2.9':'the goal of full employment',
  '3.2.10':'labour force classifications','3.2.11':'participation, unemployment and underutilisation',
  '3.2.12':'cyclical and structural unemployment','3.2.13':'consequences of missing full employment',
  '3.2.14':'the goal of low and stable inflation','3.2.15':'inflation, disinflation and deflation',
  '3.2.16':'measuring inflation','3.2.17':'causes of inflation','3.2.18':'consequences of missing the inflation goal',
  '3.2.19':'AD and AS factors over the past two years',
  '3.3.1':'gains from trade','3.3.2':'the balance of payments','3.3.3':'influences on the current account',
  '3.3.4':'net foreign debt and equity','3.3.5':'the exchange rate','3.3.6':'the terms of trade',
  '3.3.7':'international competitiveness','3.3.8':'effects of the terms of trade and exchange rate',
  '4.1.1':'why AD policies are needed','4.1.2':'sources of government revenue','4.1.3':'types of government expenses',
  '4.1.4':'the budget outcome','4.1.5':'the underlying cash balance','4.1.6':'financing a deficit or using a surplus',
  '4.1.7':'the budget outcome and public debt','4.1.8':'automatic stabilisers','4.1.9':'discretionary stabilisers',
  '4.1.10':'effects of budget changes on the outcome','4.1.11':'the budgetary policy stance',
  '4.1.12':'budgetary policy over the past two years','4.1.13':'strengths and weaknesses of budgetary policy',
  '4.1.14':'the RBA charter','4.1.15':'the cash rate target','4.1.16':'unconventional monetary policy',
  '4.1.17':'the transmission mechanism','4.1.18':'the monetary policy stance',
  '4.1.19':'monetary policy over the past two years','4.1.20':'strengths and weaknesses of monetary policy',
  '4.2.1':'AS policies alongside AD policies','4.2.2':'how AS policies work','4.2.3':'budgetary AS policies',
  '4.2.4':'skilled immigration','4.2.5':'trade liberalisation','4.2.6':'market-based environmental policy'
};

/* ---- the twenty-two written codes. Shared with the tracker ---- */
const CODES = {
  A:{ name:'Reading the question', note:'You knew it, but answered a different question.',
      list:[['A1','Wrong task word'],['A2','Half the stem'],['A3','Wrong direction or scope'],
            ['A4','Stimulus ignored'],['A5','Overclaimed'],['A6','Outside scope']] },
  B:{ name:'Knowing the content', note:'The economics itself was missing or wrong.',
      list:[['B1','Definition incomplete'],['B2','Wrong term or factor'],['B3','Mechanism reversed'],
            ['B4','Half the concept'],['B5','Not study design language'],['B6','Can\u2019t source this']] },
  C:{ name:'Building the answer', note:'You knew it, but the answer didn\u2019t show it.',
      list:[['C1','Chain stops short'],['C2','No landing'],['C3','But how?'],['C4','But why?'],
            ['C5','No data'],['C6','Data not interpreted'],['C7','No example'],
            ['C8','Depth doesn\u2019t match marks'],['C9','Sequencing'],['C10','Can\u2019t follow this']] }
};

/* ---- shared stimulus ---- */
const STIM = {

  petrol: `<p class="stimhead">Market for petrol</p>
    <p>The federal government increases the excise tax (producer tax) on petrol. The government has forecast the tax will raise $4 billion over the next three years because demand for petrol is relatively price inelastic. The current price of petrol is $1.50 a litre and the government expects it will add 10 per cent to the price of petrol over the next three years. The petrol excise tax is considered to be a regressive tax.</p>`,

  coffee: `<p>Examine the following demand and supply graph for cups of takeaway coffee from competing coffee shops located near Southern Cross railway station in Melbourne.</p>
    <figure class="fig">
    <figcaption>Demand and supply for cups of takeaway coffee</figcaption>
    <svg viewBox="0 0 460 340" role="img" aria-labelledby="cfT cfD">
      <title id="cfT">Demand and supply for cups of takeaway coffee</title>
      <desc id="cfD">Supply curve S1 is fixed. Demand shifts right from D1 to D2. The first equilibrium E1 is at $3 and 800 cups a day. At $3 on D2, 1600 cups are demanded. The new equilibrium E2 is at $4 and 1200 cups a day.</desc>
      <g class="ax"><path d="M60 40V290H445"/><path d="M60 34l-4 9h8zM451 290l-9-4v8z" class="ah"/></g>
      <text x="48" y="38" class="al">p</text><text x="450" y="306" class="al">q</text><text x="52" y="306" class="al">O</text>
      <g class="dash"><path d="M60 134H364M60 82H288M212 134V290M288 82V290M364 134V290"/></g>
      <text x="52" y="139" class="tk e">$3</text><text x="52" y="87" class="tk e">$4</text>
      <text x="212" y="306" class="tk m">800</text><text x="288" y="306" class="tk m">1200</text><text x="364" y="306" class="tk m">1600</text>
      <g class="cv"><path d="M120 197L330 53"/><path d="M130 78L380 249"/><path d="M206 26L440 186"/></g>

/* ============================ AUSTRALIAN DOLLAR ============================ */
{ qt:'aud', q:'aud-depreciation-inflation', n:'1', marks:2, kk:'3.3.8',
  stem:`Describe how a depreciation of the Australian dollar might affect the rate of inflation in Australia.`,
  crit:[ {t:'Explains that a depreciation makes imports more expensive in Australian dollars',m:1},
         {t:'Links higher import costs to higher prices and cost inflation',m:1} ],
  model:`<p>A depreciation means the Australian dollar has fallen in value against other currencies, so each Australian dollar buys less foreign currency. This makes imports more expensive.</p>
    <p>Producers who rely on imported components or raw materials face higher costs and raise their prices to protect profit margins, and consumers pay more for imported goods and services. This adds to cost inflation and raises the general level of prices.</p>`,
  report:`<p>Answered well. As a two-mark question, one relationship was enough \u2014 demand side or supply side, not both. Writing more than needed cost some students time on longer questions.</p>` },

{ qt:'aud', q:'aud-high-concern', n:'2', marks:2, kk:'3.3.8',
  stem:`Outline <b>one</b> reason why the Australian Government might be concerned if the value of the Australian dollar was to remain at a relatively high level.`,
  now:['aud'],
  crit:[ {t:'Explains that a high dollar makes local industries less price competitive at home and overseas',m:1},
         {t:'Links this to lower production and jobs, and why that concerns the government',m:1} ],
  model:`<p>A high Australian dollar puts many local industries, such as manufacturing, tourism and education, at a price disadvantage against overseas competitors. Australian consumers are drawn to cheaper imports instead of locally made products, and Australian businesses struggle to sell their relatively expensive exports overseas.</p>
    <p>Lower net exports mean spending leaks out of the economy, which may lead to business closures and job losses in these industries. Higher unemployment concerns the government for both economic and social reasons.</p>` },

{ qt:'aud', q:'aud-high-inflation-ls', n:'3', marks:4, kk:'3.3.8', two:true, now:['aud','cpi'],
  stem:`Describe the effect of a high Australian dollar on each of the following.<ul><li>the goal of low and stable inflation</li><li>Australia\u2019s living standards</li></ul>`,
  crit:[ {t:'Explains how a high dollar eases inflation: cheaper imported inputs reduce cost inflation, or weaker net exports ease demand inflation',m:2},
         {t:'Explains the effect on living standards: cheaper imports raise purchasing power, but export industries may lose sales, jobs and income',m:2} ],
  model:`<p><b>Low and stable inflation.</b> A high Australian dollar makes imported intermediate and capital goods cheaper in Australian dollars. Businesses can hold down their selling prices without hurting profits, which reduces cost inflation. A high dollar also encourages spending on imports and discourages exports, so more spending leaks out of the economy. This eases demand inflation.</p>
    <p><b>Living standards.</b> A high Australian dollar makes imported goods and services cheaper for Australians, increasing their purchasing power and allowing them to buy more goods and services with their income. This improves material living standards.</p>
    <p>However, a high dollar makes Australian exports more expensive for overseas buyers, potentially reducing export demand, production and employment in export industries. This may reduce household incomes and material living standards for affected workers.</p>`,
  report:`<p>Most students described the effect on living standards well, but many struggled with inflation.</p>
    <p>The value of the dollar affects import and export prices directly. It does not directly change what a dollar buys within Australia: when we buy locally produced goods, we don\u2019t exchange our money for another currency.</p>` },

{ qt:'aud', q:'aud-structural', n:'4', marks:2, kk:'3.3.8', now:['aud'],
  stem:`Explain how a persistently high Australian dollar might contribute to a greater incidence of structural unemployment in Australia.`,
  crit:[ {t:'Explains how a high dollar reduces sales of trade-exposed industries',m:1},
         {t:'Links a lasting decline in those industries to a mismatch of skills, and so structural unemployment',m:1} ],
  model:`<p>When the dollar appreciates, overseas buyers need more of their own currency for each Australian dollar, so demand for Australian-made goods and services falls. At the same time imports become cheaper for Australians. Tourism, education, manufacturing and retail lose sales and competitiveness.</p>
    <p>If the dollar stays high, these industries shrink permanently and the structure of the economy changes. Workers whose skills suited those industries may not have the skills that growing industries need, so they become structurally unemployed. This happened to car manufacturing in Australia, which closed after years of a high dollar during the mining boom.</p>` },

{ qt:'aud', q:'aud-fall-ca', n:'5', marks:3, kk:'3.3.8', now:['aud','ca'],
  stem:`Explain the impact of a fall in the Australian dollar relative to the US dollar on the level of the current account balance.`,
  points:[ 'Include a current value of the dollar against the US dollar',
           'Exports become cheaper and imports more expensive, through the exchange rate alone rather than a change in their price',
           'Credits increase and debits decrease',
           'The current account deficit narrows' ],
  model:`<p>The Australian dollar is currently worth about 71 US cents. If it fell, exports such as coal, iron ore and tourism would become cheaper for overseas buyers, and imports such as electrical equipment would become more expensive for Australians. Exports would rise and imports would fall.</p>
    <p>Net exports increase: credits on goods and services rise and debits fall. This narrows the current account deficit as a percentage of GDP, so the current account balance improves.</p>`,
  report:`<p>The dollar has risen over the past year, so this question asks about a fall you haven\u2019t seen recently. Quote today\u2019s value and reason from there.</p>` },

{ qt:'aud', q:'aud-change-reason', n:'6', marks:3, kk:'3.3.5', now:['aud','cash'],
  stem:`Explain <b>one</b> reason for the change in the value of the Australian dollar over the past two years.`,
  points:[ 'State the recent movement of the dollar, with figures',
           'Select a factor that caused the movement',
           'Explain the factor through demand for, or supply of, the dollar',
           'Possible factors: relative interest rates, commodity prices and the terms of trade, foreign investment, speculation' ],
  model:`<p>The Australian dollar fell to about 61 US cents in early 2025, then rose to about 71 US cents by September 2026.</p>
    <p>One reason is a change in relative interest rates. The RBA raised the cash rate three times in 2026, to 4.35%, and was among the first major central banks to start tightening again. Higher Australian interest rates make Australian financial assets more attractive to overseas investors, who need Australian dollars to buy them. The increase in demand for the dollar raised its value against the US dollar.</p>`,
  altLabel: RECENT + ' (2019): a fall',
  alt:`<p>The Australian dollar fell from about 80 US cents in January 2018 to around 69 US cents in September 2019. One reason was the interest rate differential: the RBA cut the cash rate twice to a record low of 1%, while US interest rates were 1.75\u20132%. Investors chased higher returns in the US, reducing demand for the Australian dollar, and some withdrew funds from Australia, increasing its supply. Both put downward pressure on its value.</p>` },

{ qt:'aud', q:'aud-twi-budget', n:'7', marks:2, kk:'3.3.8', now:['twi','budget'],
  stem:`Explain how an appreciation in the trade-weighted index (TWI) will affect the outcome of the federal budget.`,
  crit:[ {t:'States the meaning of the trade-weighted index and its essential qualities',m:1},
         {t:'Makes evident how an appreciation affects the budget outcome',m:1} ],
  model:`<p>The trade-weighted index is an index of the Australian dollar against a basket of our trading partners\u2019 currencies, weighted by their share of our trade.</p>
    <p>An appreciation makes exports more expensive for overseas buyers and imports cheaper for Australians, so the value of exports falls and imports rise. Business profits fall, so the company tax collected falls, increasing the budget deficit and worsening the budget outcome.</p>`,
  report:`<p>This is one of a number of possible answers.</p>` },

/* ============================== DEFINITIONS ============================== */
{ qt:'define', q:'def-full-employment', n:'1', marks:2, kk:'3.2.9',
  stem:`Define the goal of full employment.`,
  crit:[ {t:'The lowest rate of unemployment that can be sustained without accelerating inflation or external pressures',m:1},
         {t:'No cyclical unemployment: the NAIRU (natural rate of unemployment)',m:1} ],
  model:`<p>The goal of full employment is the lowest level of unemployment at which economic growth can be sustained without creating inflationary and external pressures. There is no cyclical unemployment, and unemployment is at the NAIRU (the non-accelerating inflation rate of unemployment), sometimes called the natural rate of unemployment.</p>` },

{ qt:'define', q:'def-sseg', n:'2', marks:2, kk:'3.2.6',
  stem:`Define the term \u2018strong and sustainable economic growth\u2019.`,
  crit:[ {t:'The highest possible rate of economic growth, while creating jobs',m:1},
         {t:'Without a negative effect on inflation, the external sector or the environment',m:1} ],
  model:`<p>Strong and sustainable economic growth is the highest rate of growth that is consistent with employment growth, without a negative impact on inflation, the environment or the external sector.</p>` },

{ qt:'define', q:'def-free-rider', n:'3', marks:2, kk:'3.1.16',
  stem:`Outline the \u2018free rider problem\u2019.`,
  crit:[ {t:'People can benefit from a public good without paying, because it is non-excludable',m:1},
         {t:'So firms can\u2019t profit from supplying it, and the market under-produces it',m:1} ],
  model:`<p>The free rider problem occurs with public goods, such as street lighting, which are non-excludable: people who don\u2019t pay can\u2019t be stopped from using them. Because people can benefit without paying, businesses can\u2019t make a profit supplying the good, so the market under-produces it or doesn\u2019t produce it at all.</p>` },

{ qt:'define', q:'def-ped', n:'4', marks:2, kk:'3.1.11',
  stem:`Outline the meaning of price elasticity of demand.`,
  crit:[ {t:'The responsiveness of quantity demanded to a change in price',m:1},
         {t:'Illustrates elastic and inelastic demand with examples',m:1} ],
  model:`<p>Price elasticity of demand measures how responsive the quantity demanded is to a change in price. Most non-essential items, such as gym memberships and home entertainment systems, have elastic demand, while necessities such as food and medicine have inelastic demand.</p>` },

{ qt:'define', q:'def-budgetary-policy', n:'5', marks:2, kk:'4.1.1',
  stem:`Explain what is meant by the term \u2018budgetary\u2019 or \u2018fiscal\u2019 policy.`,
  crit:[ {t:'The government\u2019s use of its budget receipts and outlays',m:1},
         {t:'Changing their level and composition to achieve its economic goals',m:1} ],
  model:`<p>Budgetary policy is the government\u2019s use of its annual budget to achieve its economic goals. The budget sets out the government\u2019s expected receipts and outlays for the next financial year, and budgetary policy involves changing the level and composition of these receipts and outlays to achieve those goals.</p>` },

/* ============================ DESCRIBE TRENDS ============================ */
{ qt:'trends', q:'trends-ca-2016', n:'1', marks:2, kk:'3.3.2', stim:'caGraph',
  stem:`Describe the trend in the current account balance since 2016.`,
  crit:[ {t:'Identifies the overall trend: a deficit that narrowed',m:1},
         {t:'Supports it with figures and dates from the graph',m:1} ],
  model:`<p>The current account balance stayed in deficit, but the deficit narrowed overall. From about 5% of GDP in 2016, it narrowed to under 1% of GDP in 2019. This was driven by a large rise in the trade balance, which moved into surplus.</p>` },

{ qt:'trends', q:'trends-tot-2yrs', n:'2', marks:2, kk:'3.3.6', stim:'totGraph',
  stem:`Describe the trend in the terms of trade over the last <b>two</b> years shown on the graph.`,
  crit:[ {t:'Interprets the overall trend as increasing',m:1},
         {t:'Refers to figures from the graph',m:1} ],
  model:`<p>The overall trend in the terms of trade over the last two years shown has been increasing, from an index of about 100 to about 110.</p>`,
  report:`<p>This is one of a number of possible answers.</p>` },

/* ============================== DIFFERENCE ============================== */
{ qt:'difference', q:'diff-efficiency', n:'1', marks:3, kk:'3.1.2',
  stem:`Explain the difference between allocative efficiency and productive (technical) efficiency.`,
  crit:[ {t:'Defines allocative efficiency',m:1}, {t:'Defines productive efficiency',m:1}, {t:'Explains the difference',m:1} ],
  model:`<p>Allocative efficiency occurs when resources are allocated to the uses that maximise society\u2019s living standards: it is impossible to reallocate resources to make someone better off without making someone else worse off.</p>
    <p>Productive efficiency occurs when resources are used in the least wasteful way, maximising output from each unit of input. It is closely related to productivity.</p>
    <p>The difference is that allocative efficiency is about <i>what</i> resources are used to produce, while productive efficiency is about <i>how well</i> resources are used once they have been allocated to an industry.</p>` },

{ qt:'difference', q:'diff-tot-twi', n:'2', marks:3, kk:'3.3.6',
  stem:`Explain the difference between the terms of trade and the trade-weighted index.`,
  crit:[ {t:'Defines the terms of trade',m:1}, {t:'Defines the trade-weighted index',m:1}, {t:'Concludes with the difference',m:1} ],
  model:`<p>The terms of trade is the index of export prices divided by the index of import prices.</p>
    <p>The trade-weighted index measures the Australian dollar against the currencies of our trading partners, weighted by their importance in our trade.</p>
    <p>The difference is that the terms of trade compares prices of goods and services, while the trade-weighted index compares currencies.</p>` },

{ qt:'difference', q:'diff-stabilisers', n:'3', marks:3, kk:'4.1.8',
  stem:`Distinguish between discretionary and automatic budgetary stabilisers.`,
  crit:[ {t:'Defines automatic stabilisers: the cyclical component',m:1},
         {t:'Defines discretionary stabilisers: the structural component',m:1},
         {t:'Explains the difference',m:1} ],
  model:`<p>Automatic stabilisers are the cyclical component of the federal budget, which changes with the stage of the business cycle. Examples are company tax, personal income tax and welfare payments, which change automatically as economic activity changes.</p>
    <p>Discretionary stabilisers are the structural component of the budget: deliberate policy decisions to change receipts or outlays to influence economic activity.</p>
    <p>Automatic stabilisers change without any government decision, while discretionary stabilisers are changes the government chooses to make to the structure of the budget to alter economic activity.</p>` },

{ qt:'difference', q:'diff-underutil-part', n:'4', marks:3, kk:'3.2.11',
  stem:`Distinguish between the labour force underutilisation rate and the labour force participation rate.`,
  now:['part','under'],
  crit:[ {t:'Defines the labour force underutilisation rate',m:1}, {t:'Defines the participation rate',m:1}, {t:'Explains the difference',m:1} ],
  model:`<p>The underutilisation rate measures how far the supply of labour is not being used. It is the number of unemployed plus the number of underemployed (people who have work but want more hours), as a percentage of the labour force.</p>
    <p>The participation rate is the percentage of people aged 15 and over who are in the labour force, either employed or actively looking for work.</p>
    <p>So the participation rate shows how many of the working-age population are taking part in the labour force, while the underutilisation rate shows how much spare capacity there is within it.</p>` },

{ qt:'difference', q:'diff-bot-tot', n:'5', marks:3, kk:'3.3.6',
  stem:`What is the difference between the balance of trade and the terms of trade?`,
  crit:[ {t:'Defines the balance of trade, as a value (price times quantity)',m:1},
         {t:'Defines the terms of trade, as a ratio of price indices',m:1},
         {t:'States the difference',m:1} ],
  model:`<p>The balance of trade is the value of exports of goods and services minus the value of imports. \u2018Value\u2019 means both price and quantity matter: value is price multiplied by quantity.</p>
    <p>The terms of trade is a ratio of price indices: the price received for a weighted basket of exports divided by the price paid for a weighted basket of imports.</p>
    <p>So the balance of trade measures net exports, a contribution to GDP, while the terms of trade measures the relative prices of exports and imports.</p>` },

/* ============================== ELASTICITY ============================== */
{ qt:'elasticity', q:'elas-eggs', n:'1', marks:3, kk:'3.1.12',
  stem:`With reference to <b>one</b> factor that can affect demand elasticity, explain how a report stating that eating eggs lowers blood cholesterol could change the price elasticity of demand for eggs.`,
  points:[ 'Define price elasticity of demand', 'Explain how the report will affect demand',
           'Link to a factor: degree of necessity', 'Explain how the report will reduce price elasticity of demand' ],
  model:`<p>Price elasticity of demand measures how responsive quantity demanded is to a change in price. The report will increase demand for eggs, shifting the demand curve to the right.</p>
    <p>One factor affecting elasticity is the degree of necessity. The health benefits in the report make eggs more of a need for consumers. As a result, consumers become less responsive to changes in the price of eggs, so price elasticity of demand falls and demand for eggs becomes less elastic.</p>` },

{ qt:'elasticity', q:'elas-ped', n:'2', marks:2, kk:'3.1.11',
  stem:`Outline the meaning of price elasticity of demand.`,
  crit:[ {t:'The responsiveness of quantity demanded to a change in price',m:1},
         {t:'Illustrates elastic and inelastic demand with examples',m:1} ],
  model:`<p>Price elasticity of demand measures how responsive the quantity demanded is to a change in price. Most non-essential items, such as gym memberships and home entertainment systems, have elastic demand, while necessities such as food and medicine have inelastic demand.</p>` },

{ qt:'elasticity', q:'elas-petrol', n:'3', marks:3, kk:'3.1.12',
  stem:`Identify and explain <b>one</b> reason why petrol has a price elasticity of demand that is relatively inelastic.`,
  crit:[ {t:'Identifies one reason',m:1}, {t:'Explains why petrol is price inelastic',m:2} ],
  model:`<p>For most people petrol is a necessity for day-to-day living, like food, basic clothing and medical services. So when its price rises or falls sharply, the change in quantity demanded is relatively small: petrol is price inelastic.</p>
    <p>For example, if the price rose from $1.50 to $2.00 a litre, a 33% increase, the quantity demanded would fall, but by much less than 33%.</p>` },

{ qt:'elasticity', q:'elas-pes-factor', n:'4', marks:2, kk:'3.1.13',
  stem:`Outline <b>one</b> factor that influences the price elasticity of supply for a product.`,
  crit:[ {t:'Identifies a factor affecting price elasticity of supply',m:1},
         {t:'Explains how it makes supply more or less responsive to a change in price',m:1} ],
  model:`<p>One factor is the durability of goods: how easily they can be stored. If producers can store goods, as with non-perishable products like tinned fruit, they can respond more easily to changes in market price. If the market price of tinned fruit rose, suppliers could draw on stockpiles and increase supply quickly to take advantage of the higher profit margin. Supply of tinned fruit is therefore relatively elastic: the easier goods are to store, the higher the price elasticity of supply.</p>`,
  report:`<p>Many students confused price elasticity of supply with price elasticity of demand and gave demand factors. Even students with a correct factor often didn\u2019t link it to how responsive supply is to a change in price, which the question required.</p>
    <p>Correct factors included durability (storability) and the production period.</p>` },

/* ================================ EVALUATE ================================ */
{ qt:'evaluate', q:'ev-cash-rate-inflation', n:'1', marks:4, kk:'4.1.20', now:['cash','cpi','trim'],
  stem:`Evaluate the effectiveness of changes in the official cash rate by the Reserve Bank of Australia in achieving the goal of low inflation. In your answer, refer to the strengths and/or weaknesses of monetary policy.`,
  crit:[ {t:'Explains how an increase in the cash rate reduces AD and demand inflation',m:1},
         {t:'Identifies and explains a relevant strength of monetary policy',m:1},
         {t:'Identifies and explains a relevant weakness of monetary policy',m:1},
         {t:'Provides a supported judgement about effectiveness in achieving low inflation',m:1} ],
  model:`<p>The goal of low inflation involves achieving consumer price inflation of 2\u20133% on average over time.</p>
    <p>In 2026, the RBA adopted a contractionary monetary policy stance, increasing the cash rate three times from 3.60% to 4.35%. Higher interest rates increase borrowing costs and mortgage repayments, reducing household discretionary income, consumption and business investment. This reduces aggregate demand and demand inflationary pressures.</p>
    <p>A strength of monetary policy is its short implementation lag, as the independent RBA can adjust the cash rate relatively quickly in response to inflationary pressures.</p>
    <p>However, monetary policy has a long and uncertain impact lag and is less effective at directly addressing cost inflation caused by rising production costs.</p>
    <p>Overall, the rate increases should help reduce demand inflation, but their effectiveness in achieving low inflation depends on the causes of inflation and the time taken for reduced spending to affect prices.</p>`,
  tips:`<p>Explain the transmission from interest rates to AD and inflation, rather than simply stating that higher rates reduce inflation.</p>
    <p>A strong evaluation connects the strength and weakness to effectiveness and reaches a supported judgement.</p>` },

{ qt:'evaluate', q:'ev-mp-growth', n:'2', marks:4, kk:'4.1.20',
  stem:`Evaluate <b>one</b> strength and <b>one</b> weakness of using monetary policy to achieve sustainable rates of economic growth.`,
  two:true,
  crit:[ {t:'Identifies and explains one strength of monetary policy',m:1},
         {t:'Links this strength to sustainable economic growth',m:1},
         {t:'Identifies and explains one weakness of monetary policy',m:1},
         {t:'Links this weakness to sustainable economic growth and makes a supported judgement',m:1} ],
  model:`<p>Monetary policy involves the RBA influencing interest rates to affect aggregate demand and achieve its economic objectives.</p>
    <p>One strength is the RBA\u2019s independence from the government, allowing it to adjust interest rates in response to economic conditions without being directly influenced by the government\u2019s electoral priorities. For example, reducing the cash rate during weak economic conditions can encourage consumption and investment, increasing AD and real GDP.</p>
    <p>However, a weakness is that monetary policy is a blunt instrument that cannot target specific industries or regions. For example, increasing interest rates to control excessive economic growth may significantly reduce spending by mortgage holders and investment by indebted businesses, even when some sectors are already experiencing weak growth.</p>
    <p>Overall, monetary policy can help stabilise economic growth over the business cycle, but its broad effects mean it may need to be complemented by targeted budgetary and aggregate supply policies to achieve sustainable growth.</p>`,
  tips:`<p>Distinguish between economic growth and <i>sustainable</i> economic growth: maintaining increases in real GDP over time without excessive inflation or other imbalances.</p>
    <p>A generic strength or weakness without a link to economic growth is not enough for full marks.</p>` },

{ qt:'evaluate', q:'ev-markets', n:'3', marks:6, kk:'3.1.15',
  stem:`\u2018Free and competitive markets should lead to an allocation of resources that maximises society\u2019s wellbeing.\u2019<br><br>With reference to the statement above, evaluate the role of markets in achieving an efficient allocation of resources.`,
  crit:[ {t:'Shows understanding of allocative efficiency and competitive markets',m:1},
         {t:'Explains how the price mechanism directs resources towards consumer preferences',m:1},
         {t:'Explains how competition promotes efficient resource allocation',m:1},
         {t:'Identifies and explains a relevant source of market failure, such as negative externalities',m:1},
         {t:'Explains how market failure or limited competition reduces allocative efficiency',m:1},
         {t:'Provides a supported judgement about the ability of markets to maximise society\u2019s wellbeing',m:1} ],
  model:`<p>Allocative efficiency occurs when resources are allocated to producing the combination of goods and services that maximises society\u2019s wellbeing.</p>
    <p>Free and competitive markets involve many buyers and sellers, low barriers to entry and exit, and limited government intervention.</p>
    <p>A strength of competitive markets is that the price mechanism directs resources towards goods and services that consumers demand. For example, an increase in demand for electric vehicles may increase their price and profitability, encouraging producers to allocate more resources towards their production. Competition also encourages businesses to lower costs and prices, improving efficiency.</p>
    <p>However, markets may fail to achieve allocative efficiency when externalities exist. For example, the production and consumption of fossil fuels generate pollution, imposing costs on third parties that are not fully reflected in market prices. Consequently, fossil fuels may be overproduced and overconsumed relative to the socially optimal level.</p>
    <p>Furthermore, where competition is limited, such as in a monopoly, businesses can restrict output and charge higher prices, potentially reducing allocative efficiency and consumer wellbeing.</p>
    <p>Overall, competitive markets can promote allocative efficiency through the price mechanism and competition. However, market failures mean that government intervention may be necessary to achieve a more socially optimal allocation of resources.</p>`,
  tips:`<p>Explain the price mechanism and its role in allocating scarce resources.</p>
    <p>A strong evaluation recognises that competitive markets can promote efficiency but may not maximise society\u2019s wellbeing when market failures exist.</p>` },

{ qt:'evaluate', q:'ev-bp-mp-full-employment', n:'4', marks:8, kk:'4.1.13', two:true,
  stem:`The government can utilise a combination of budgetary policy and monetary policy to pursue its domestic macroeconomic goals.<br><br>Evaluate the relative strengths and weaknesses of budgetary policy and monetary policy in achieving the economic goal of full employment.`,
  crit:[ {t:'Shows understanding of budgetary policy',m:1},
         {t:'Explains one strength of budgetary policy in achieving full employment',m:1},
         {t:'Explains one weakness of budgetary policy in achieving full employment',m:1},
         {t:'Shows understanding of monetary policy',m:1},
         {t:'Explains one strength of monetary policy in achieving full employment',m:1},
         {t:'Explains one weakness of monetary policy in achieving full employment',m:1},
         {t:'Makes an explicit comparison of the relative effectiveness of the two policies',m:1},
         {t:'Provides a supported overall judgement linked to full employment',m:1} ],
  model:`<p>Full employment occurs when everyone who is willing and able to work at prevailing wage rates can find employment, apart from those experiencing natural unemployment.</p>
    <p>Budgetary policy involves the government\u2019s use of revenue and expenditure to influence economic activity and achieve its economic objectives.</p>
    <p>A strength of budgetary policy is its ability to target specific sectors and groups. For example, government spending on infrastructure projects can directly create construction jobs and indirectly increase employment in related industries. This increases aggregate demand and the derived demand for labour, reducing cyclical unemployment.</p>
    <p>However, discretionary budgetary policy can experience long implementation lags because spending measures may require parliamentary approval, planning and construction. Consequently, employment may not increase until well after the policy is announced.</p>
    <p>Monetary policy involves the RBA influencing interest rates to affect aggregate demand and achieve its economic objectives.</p>
    <p>A strength of monetary policy is its short implementation lag. The RBA can reduce the cash rate relatively quickly when economic activity is weak. Lower borrowing costs encourage consumption and investment, increasing AD, production and the derived demand for labour, reducing cyclical unemployment.</p>
    <p>However, monetary policy has a long and uncertain impact lag. Businesses may delay investment and hiring decisions even after interest rates fall, particularly when consumer and business confidence are weak.</p>
    <p>Furthermore, monetary policy is less effective at addressing structural unemployment caused by skills mismatches.</p>
    <p>Overall, monetary policy can respond relatively quickly to changing economic conditions, while budgetary policy can target particular industries and unemployed groups. A combination of the two policies may therefore be more effective in achieving full employment, particularly when supported by aggregate supply policies that address structural unemployment.</p>`,
  tips:`<p>Explicitly compare the two policies rather than writing two unrelated descriptions.</p>
    <p>Show how each policy affects AD, production and the derived demand for labour, and recognise the difference between cyclical and structural unemployment when judging effectiveness.</p>` },

{ qt:'evaluate', q:'ev-as-policy', n:'5', marks:4, kk:'4.2.4', two:true,
  stem:`Select <b>one</b> of the following aggregate supply policies.<ul><li>skilled immigration policy</li><li>tax reform policy</li><li>training and education policy</li></ul>Outline <b>one</b> strength and <b>one</b> weakness of using this policy to increase employment and rates of economic growth.`,
  crit:[ {t:'Identifies and explains one relevant strength of the selected policy',m:1},
         {t:'Links the strength to increased employment and economic growth',m:1},
         {t:'Identifies and explains one relevant weakness of the selected policy',m:1},
         {t:'Links the weakness to employment and/or economic growth',m:1} ],
  model:`<p><i>Using skilled immigration policy.</i></p>
    <p>Skilled immigration policy involves the Australian Government allowing skilled migrants to enter Australia to increase the quantity and quality of labour resources.</p>
    <p>One strength is that skilled migrants can address labour shortages in industries such as healthcare and construction. This increases the quantity of labour available and may improve labour productivity, allowing businesses to expand production and increase aggregate supply. Consequently, real GDP and the demand for labour may increase, supporting economic growth and employment.</p>
    <p>However, a weakness is that increased immigration may place additional pressure on existing infrastructure and housing. If infrastructure and housing supply cannot expand sufficiently, congestion and rising costs may reduce productivity and limit the benefits of immigration for economic growth.</p>
    <p>Overall, skilled immigration can increase Australia\u2019s productive capacity and support employment and economic growth, but its effectiveness depends partly on the availability of complementary infrastructure and housing.</p>`,
  tips:`<p>Select a policy from the list and explain how it affects aggregate supply: through the quantity or quality of resources, production costs or productivity. Then explain the effect on employment and economic growth.</p>
    <p>Tax reform or training and education are equally valid choices, provided the economics is sound.</p>` },

{ qt:'evaluate', q:'ev-jobs-growth', n:'6', marks:8, kk:'4.1.13', two:true,
  stem:`Evaluate <b>one</b> strength and <b>one</b> weakness of using each of budgetary policy and monetary policy in achieving increased \u2018jobs and growth\u2019.`,
  crit:[ {t:'Identifies and explains one strength of budgetary policy',m:1},
         {t:'Links this strength to increased jobs and growth',m:1},
         {t:'Identifies and explains one weakness of budgetary policy',m:1},
         {t:'Links this weakness to increased jobs and growth',m:1},
         {t:'Identifies and explains one strength of monetary policy',m:1},
         {t:'Links this strength to increased jobs and growth',m:1},
         {t:'Identifies and explains one weakness of monetary policy',m:1},
         {t:'Links this weakness to increased jobs and growth and provides a supported judgement',m:1} ],
  model:`<p>Budgetary policy involves the government\u2019s use of revenue and expenditure to influence economic activity and achieve its economic objectives.</p>
    <p>One strength is its ability to target particular industries and groups. For example, government infrastructure spending can directly create construction jobs while increasing demand for materials and services from other businesses. This increases AD, production and the derived demand for labour, supporting employment and economic growth.</p>
    <p>However, a weakness is that budgetary policy can experience long implementation lags. Infrastructure projects may require extensive planning and approval before construction begins, delaying their positive impact on jobs and growth.</p>
    <p>Monetary policy involves the RBA influencing interest rates to affect AD and achieve its economic objectives.</p>
    <p>One strength is its short implementation lag. The RBA can reduce the cash rate relatively quickly during periods of weak economic activity. Lower interest rates reduce borrowing costs and encourage consumption and investment, increasing AD, real GDP and the derived demand for labour.</p>
    <p>However, monetary policy has a long and uncertain impact lag. Even when interest rates fall, households may choose to save rather than spend, while businesses may delay investment due to weak confidence. This reduces the effectiveness of monetary policy in stimulating jobs and growth.</p>
    <p>Overall, both policies can support employment and economic growth by increasing AD. Budgetary policy has the advantage of targeting particular sectors, while monetary policy can be implemented relatively quickly. However, both face time lags, meaning their effectiveness depends on economic conditions and how households and businesses respond.</p>`,
  tips:`<p>Explain one strength and one weakness of each policy, and link all four to employment and economic growth.</p>
    <p>Stating that monetary policy has a long impact lag isn\u2019t enough unless you explain how that delays its effect on AD, production and employment.</p>`,
  report:`<p>To score highly, responses had to evaluate each strength and weakness in terms of jobs and growth, not just list them. Higher-scoring responses used examples. Lower-scoring responses confused the policies, for example claiming monetary policy works \u2018instantly\u2019.</p>` },

/* ================================ FACTORS ================================ */
{ qt:'factors', q:'fac-chocolate', n:'1', marks:3, kk:'3.1.6', now:['cash'],
  stem:`Explain how a change in <b>one</b> demand factor over the past 12 months could influence the demand curve for chocolate.`,
  points:[ 'Choose a demand factor that has actually changed in the past 12 months, not just in theory',
           'Explain how it changes consumers\u2019 willingness or ability to buy',
           'Explain the effect on the demand curve and the new equilibrium' ],
  model:`<p>Interest rates rose over the past 12 months, with the RBA raising the cash rate three times in 2026 to 4.35%. Households with variable-rate mortgages now pay more in interest, leaving them less discretionary income.</p>
    <p>With less to spend, consumers cut back most on wants such as chocolate. Demand decreases and the demand curve shifts to the left, so less chocolate is demanded at the original price, leading to a lower equilibrium price and quantity.</p>`,
  altLabel:'Another factor: consumer confidence',
  alt:`<p>A fall in consumer confidence \u2014 people\u2019s confidence in their future financial and job prospects \u2014 makes them less willing to spend and more likely to save a larger share of their disposable income. Spending falls, mostly on wants such as chocolate, shifting the demand curve to the left and lowering the equilibrium price and quantity.</p>` },

{ qt:'factors', q:'fac-ad-as-full-employment', n:'2', marks:4, kk:'3.2.19', two:true, now:['aud','unemp','cpi'],
  stem:`Other than changes to interest rates, explain how <b>one</b> aggregate demand factor and <b>one</b> aggregate supply factor have influenced the achievement of the goal of full employment over the past two years.`,
  points:[ 'AD factor: one that has actually changed, not just in theory', 'Link it to lower AD, less production and less labour needed',
           'AS factor: one that has actually changed', 'Link it to lower AS and a lower demand for labour',
           'Include statistics', 'Land on the goal of full employment' ],
  model:`<p><b>Aggregate demand.</b> The Australian dollar has appreciated, to about 71 US cents, up about 7% over the past year. Australian exports are dearer for overseas buyers and imports cheaper for Australians, so net exports fall. Trade in goods and services has been in deficit for two quarters in a row, although record fuel import prices were the main driver. Lower net exports reduce AD, so businesses in trade-exposed industries produce less and need less labour.</p>
    <p><b>Aggregate supply.</b> The conflict in the Middle East pushed fuel prices to record highs in 2026. Higher fuel costs raise the costs of production across the economy, reducing businesses\u2019 willingness and ability to supply. As AS falls, production falls and so does the demand for labour.</p>
    <p><b>Full employment.</b> Both factors reduce the demand for labour, and unemployment rose from 4.3% earlier in 2026 to 4.5% in July. Whether this moves Australia closer to or further from full employment depends on where the NAIRU sits: the RBA has pointed to capacity pressures in the economy, which suggests unemployment had been below the level consistent with low and stable inflation.</p>`,
  altLabel: RECENT + ' (2019)',
  alt:`<p>China\u2019s slowdown, partly due to its trade war with the United States, weakened demand for Australian commodities, tourism and education, reducing AD. Firms cut production and needed less labour. A drought reduced aggregate supply, as farmers\u2019 ability to supply fell, further reducing the demand for labour. Both lowered the likelihood of achieving full employment, with unemployment at 5.3% in August 2019.</p>`,
  report:`<p>Possible AD factors: weaker consumer or business confidence, a change in disposable income, the exchange rate, growth overseas. Possible AS factors: a severe weather event, higher costs of production, changes in productivity.</p>` },

{ qt:'factors', q:'fac-aud-reason', n:'3', marks:3, kk:'3.3.5', now:['aud','cash'],
  stem:`Explain <b>one</b> reason (factor) for the change in the value of the Australian dollar over the past two years.`,
  points:[ 'State the recent movement of the dollar, with figures', 'Select a factor that caused the movement',
           'Explain the factor through demand for, or supply of, the dollar',
           'Possible factors: relative interest rates, commodity prices and the terms of trade, foreign investment, speculation' ],
  model:`<p>The Australian dollar fell to about 61 US cents in early 2025, then rose to about 71 US cents by September 2026.</p>
    <p>One reason is a change in relative interest rates. The RBA raised the cash rate three times in 2026, to 4.35%, and was among the first major central banks to start tightening again. Higher Australian interest rates make Australian financial assets more attractive to overseas investors, who need Australian dollars to buy them. The increase in demand for the dollar raised its value against the US dollar.</p>`,
  altLabel: RECENT + ' (2019): a fall',
  alt:`<p>The Australian dollar fell to about 69 US cents by September 2019. China\u2019s economic growth slowed, and as Australia\u2019s largest buyer of commodities such as iron ore, its demand for them grew more slowly. Commodity prices fell, lowering the terms of trade. With less demand for our exports, there was less demand for the Australian dollar needed to buy them, so its value fell against the US dollar.</p>` },

{ qt:'factors', q:'fac-ad-as-growth', n:'4', marks:4, kk:'3.2.19', two:true, now:['cash','gdp','cpi'],
  stem:`Identify and explain <b>one</b> aggregate demand factor and <b>one</b> aggregate supply factor that may have influenced the rate of economic growth in the last 12 months.`,
  crit:[ {t:'Identifies an AD factor that has changed, with evidence',m:1},
         {t:'Explains how it affected AD and so production and growth',m:1},
         {t:'Identifies an AS factor that has changed, with evidence',m:1},
         {t:'Explains how it affected AS and so production and growth',m:1} ],
  model:`<p><b>Aggregate demand.</b> Interest rates rose, with the RBA raising the cash rate three times in 2026 to 4.35%. Higher repayments leave households with variable-rate loans less discretionary income, and higher borrowing costs discourage business investment. Consumption and investment grow more slowly, reducing AD, so businesses expand production less.</p>
    <p><b>Aggregate supply.</b> Fuel prices surged to record highs with the conflict in the Middle East. Higher fuel costs raise costs of production for businesses across the economy, reducing their willingness and ability to supply, so AS decreases.</p>
    <p>Both factors slowed the rate of economic growth: real GDP grew 2.1% through the year to the June quarter 2026, down from 2.6% at the end of 2025.</p>` },

{ qt:'factors', q:'fac-dom-global-ad', n:'5', marks:4, kk:'3.2.4', two:true, now:['cash','gdp'],
  stem:`Explain how <b>one</b> domestic demand-side factor and <b>one</b> global demand-side factor might have influenced aggregate demand in Australia over the past 12 months.`,
  points:[ 'Select a domestic demand-side factor that has actually changed', 'Explain how it affected a component of AD',
           'Select a global demand-side factor that has actually changed', 'Explain how it affected a component of AD' ],
  model:`<p><b>Domestic.</b> Interest rates rose three times in 2026, taking the cash rate to 4.35%. Higher borrowing costs and repayments reduce households\u2019 willingness and ability to spend, slowing consumption, and discourage businesses from borrowing to invest. Slower growth in consumption and investment reduces AD. Household consumption grew 1.8% through the year to June 2026, down from 2.4% in the March quarter.</p>
    <p><b>Global.</b> The conflict in the Middle East pushed fuel prices to record highs and raised uncertainty. Households cut back on fuel use and on domestic and international travel, reducing consumption and so AD.</p>`,
  altLabel: RECENT + ' (2019)',
  alt:`<p><b>Domestic.</b> Low consumer confidence, given concerns about job security, reduced households\u2019 willingness to spend, reducing consumption and AD. <b>Global.</b> The trade war between the United States and China slowed growth and raised uncertainty, reducing demand for Australian exports and so net exports and AD. A lower Australian dollar, around 68 US cents, partly offset this by making exports cheaper.</p>`,
  report:`<p>High-scoring students selected a domestic and a global demand-side factor and detailed how each influenced a component of aggregate demand.</p>` },

{ qt:'factors', q:'fac-rba-decision', n:'6', marks:2, kk:'4.1.19', now:['cash','cpi'],
  stem:`Outline <b>one</b> economic factor that might explain the RBA\u2019s most recent change to the cash rate.`,
  crit:[ {t:'Identifies the decision and a relevant economic factor, with data',m:1},
         {t:'Links the factor to the RBA\u2019s goals or target',m:1} ],
  model:`<p>In May 2026 the RBA raised the cash rate by 25 basis points to 4.35%, its third rise of the year. Inflation was 4.6% in the year to March 2026, well above the 2\u20133% target, as fuel prices surged with the conflict in the Middle East and capacity pressures persisted.</p>
    <p>Because the RBA\u2019s main focus in setting monetary policy is low and stable inflation, it adopted a more contractionary stance to reduce AD and demand inflation, and to stop higher inflation expectations becoming entrenched.</p>`,
  altLabel: RECENT + ' (June 2019): a cut',
  alt:`<p>In June 2019 the RBA cut the cash rate to a then record low of 1.25%, after holding it at 1.5% for a long period. Inflation was tracking below the 2\u20133% target, so the RBA could adopt a more expansionary stance to boost domestic demand, with growth below trend and unemployment rising.</p>`,
  report:`<p>High-scoring responses linked their factor to the RBA\u2019s charter goals, or compared the current figure with the goal target. Common factors: inflation relative to target, conditions in the labour market, the pace of domestic activity, confidence.</p>` },

{ qt:'factors', q:'fac-tot-movement', n:'7', marks:2, kk:'3.3.6', now:['tot'],
  stem:`Outline <b>one</b> factor that might explain the recent movement in Australia\u2019s terms of trade.`,
  crit:[ {t:'Describes the recent movement, with data',m:1},
         {t:'Explains one factor through export or import prices',m:1} ],
  model:`<p>The terms of trade measure export prices relative to import prices. They fell 1.6% in the June quarter 2026, to 94.8.</p>
    <p>One factor is rising import prices. The conflict in the Middle East tightened global oil supply and pushed up the price of fuel imports. With import prices rising relative to export prices, the terms of trade fell.</p>`,
  altLabel: RECENT + ' (2019): a rise',
  alt:`<p>Australia\u2019s terms of trade rose because prices received for commodity exports such as iron ore increased. Despite China\u2019s slowdown, world demand kept commodity prices strong, with iron ore rising from about $70 to $120 a tonne over the year.</p>` },

/* ================================= IMPACT ================================= */
{ qt:'impact', q:'imp-skilled-immigration', n:'1', marks:4, kk:'4.2.4',
  stem:`Explain how an increase in skilled immigration resulting from a government initiative can affect both production and productivity, and therefore aggregate supply.`,
  crit:[ {t:'Gives the characteristics of the migration initiative',m:1},
         {t:'Connects the initiative to production',m:1},
         {t:'Connects the initiative to productivity',m:1},
         {t:'Connects the initiative to aggregate supply',m:1} ],
  model:`<p>Skilled immigration policy encourages skilled migrants to join the Australian labour force. Each year the government sets the size of the permanent Migration Program, most of which goes to skilled migrants chosen for occupations where Australia has shortages.</p>
    <p>More migrants increase the size of the labour force, and because skilled migrants are mostly of working age, they can also lift the participation rate. The greater availability of labour may ease pressure on wages and lower costs of production, allowing businesses to increase production.</p>
    <p>Because entry is targeted at occupations in shortage, skills shortages in those industries ease. Businesses can use more skilled labour, and migrants bring new skills, ideas and processes, lifting productivity.</p>
    <p>A larger workforce and higher productivity make businesses more willing and able to supply goods and services, increasing aggregate supply.</p>`,
  report:`<p>This is one of a number of possible answers.</p>` },

{ qt:'impact', q:'imp-productivity-nfd', n:'2', marks:4, kk:'3.3.4', two:true, now:['cpi','nfd','ca'],
  stem:`Explain how a slowdown in productivity growth might influence the level of Australia\u2019s net foreign debt. Explain how our current rates of inflation could reduce the impact of this slowdown.`,
  points:[ 'Link to Australia\u2019s recent slowdown in productivity growth', 'Define productivity',
           'Link lower productivity growth to international competitiveness', 'Link to lower net exports',
           'Explain the effect on the current account deficit and then net foreign debt',
           'Explain how relatively low inflation could help net exports, and so net foreign debt' ],
  model:`<p>Australia has experienced a slowdown in productivity growth \u2014 the growth in output per unit of input. If productivity grows more slowly than costs rise, average costs of production increase. If our costs rise faster than our trading partners\u2019, Australia becomes less internationally competitive.</p>
    <p>Exports fall and imports rise as buyers switch from Australian production to imports. Credits on goods and services fall and debits rise, widening the current account deficit as a percentage of GDP. A larger current account deficit must be funded through the capital and financial account, and if it is funded by borrowing, net foreign debt rises. Net foreign debt reached $1,486 billion at 30 June 2026.</p>
    <p>Inflation affects this through relative prices. Australia\u2019s inflation was 3.5% in the year to July 2026. If this is lower than our trading partners\u2019 inflation, our goods and services become relatively cheaper, lifting net exports and offsetting some of the effect of slower productivity growth on net foreign debt. If it is higher, it adds to the loss of competitiveness instead.</p>` },

/* ============================== RELATIONSHIP ============================== */
{ qt:'relationship', q:'rel-growth-inflation', n:'1', marks:3, kk:'3.2.8', two:true, now:['gdp','cpi'],
  stem:`Analyse the relationship between the goals of strong and sustainable economic growth and low and stable inflation. In your answer, explain how these goals might be conflicting and how they might be compatible.`,
  crit:[ {t:'States the meaning of strong and sustainable growth and of low and stable inflation',m:1},
         {t:'Makes evident how sustainable growth can help achieve low inflation',m:1},
         {t:'Makes evident how growth that is too strong can hinder low inflation',m:1} ],
  model:`<p>Strong and sustainable growth is growth strong enough to create jobs without a negative impact on inflation, the environment or the external sector. Low and stable inflation means inflation of 2\u20133%, with the RBA aiming for the midpoint of 2.5%.</p>
    <p><b>Compatible.</b> When growth is at a sustainable rate, around the economy\u2019s potential growth rate (currently estimated at about 2%), aggregate supply can keep pace with aggregate demand without large price rises, so inflation can stay within the target.</p>
    <p><b>Conflicting.</b> If growth runs above potential and aggregate demand outstrips aggregate supply, often because of capacity constraints, shortages of goods and services develop. Suppliers raise prices, causing demand inflation, and the goal of low and stable inflation is not met.</p>`,
  report:`<p>This is one of a number of possible answers.</p>` },

{ qt:'relationship', q:'rel-unemp-part', n:'2', marks:2, kk:'3.2.11', cur:'adapted', now:['unemp','part'],
  stem:`Explain the relationship between the unemployment rate and the participation rate over the last two years.`,
  crit:[ {t:'Describes how the two rates moved, with data',m:1},
         {t:'Explains the link between them',m:1} ],
  model:`<p><i>Written for 2009\u201311.</i> In 2009\u201310 Australia was recovering from the global financial crisis. As production increased, so did the derived demand for labour, and the unemployment rate fell. With better job prospects, people who were marginally attached to the labour force, such as the hidden unemployed, started looking for work, and the participation rate rose.</p>`,
  altLabel:'Another way the rates can move',
  alt:`<p>In 2010\u201311 the participation rate began to fall as the first baby boomers reached 65 and retired. A lower participation rate can help keep the unemployment rate down, because there is less competition for the jobs available \u2014 which may explain why unemployment kept falling despite a downturn in the first half of 2011.</p>`,
  report:`<p>The two rates can move in either direction relative to each other, so describe what the data actually shows before explaining it.</p>` },

{ qt:'relationship', q:'rel-growth-unemp-table', n:'3', marks:3, kk:'3.2.8', stim:'growthTable', two:true,
  stem:`Explain the relationship between the rate of economic growth and the unemployment rate, making specific reference to the data in the table.`,
  crit:[ {t:'States the inverse relationship',m:1},
         {t:'Explains it through the derived demand for labour',m:1},
         {t:'Refers to specific figures from the table',m:1} ],
  model:`<p>The data shows an inverse relationship between economic growth and the unemployment rate. While growth was above 3 per cent, unemployment held steady or fell, from 4.8 to 4.3 per cent. When growth fell to 0.4 per cent in 2008\u201309, unemployment rose sharply from 4.3 to 5.7 per cent.</p>
    <p>When growth slows, the volume of goods and services produced grows more slowly, so producers reduce their derived demand for labour and unemployment rises. As people move from paid work onto welfare payments their disposable income falls, which can reduce spending and slow growth further.</p>` },

/* =========================== RESOURCE ALLOCATION =========================== */
{ qt:'resalloc', q:'ra-competitive-market', n:'1', marks:3, kk:'3.1.14',
  stem:`Using an example, explain how resources are allocated in a competitive market.`,
  points:[ 'The market mechanism', 'Interaction between consumers and suppliers', 'A shortage',
           'A change in relative prices', 'Price signal', 'Profit opportunities',
           'Reallocation of resources', 'Linked to your example' ],
  model:`<p>In a competitive market, resources are allocated by the market or price mechanism. For example, if consumer preferences shift from large vehicles to smaller vehicles, the interaction between consumers and producers changes how resources are allocated in this market.</p>
    <p>The increase in demand for small cars relative to large cars creates a shortage of small cars, which raises their relative price. Suppliers read the higher relative price as a signal that producing small cars is now relatively more profitable than producing large cars, so they move resources away from large cars towards small cars.</p>` },

{ qt:'resalloc', q:'ra-apples-oranges', n:'2', marks:4, kk:'3.1.14',
  stem:`Explain how an increase in the level of demand for apples relative to oranges may impact on the allocation of resources.`,
  points:[ 'The market mechanism', 'Shortages and surpluses at the original price', 'A change in relative prices',
           'Price signal', 'Profit opportunities', 'Reallocation of resources', 'Linked to the examples in the question' ],
  model:`<p>In a free market, resources are allocated through the market mechanism. An increase in demand for apples relative to oranges creates a shortage of apples at the original price, raising the relative price of apples. At the same time, relatively lower demand for oranges creates a short-term surplus of oranges and a lower profit incentive to produce them.</p>
    <p>Suppliers read the higher relative price of apples as a price signal and a profit opportunity. To maximise profits, they shift land, labour and capital away from producing oranges towards producing apples. This is consumer sovereignty at work: suppliers respond to changes in consumer demand by reallocating resources according to relative price signals and profit opportunities.</p>` },

{ qt:'resalloc', q:'ra-aud-appreciation', n:'3', marks:3, kk:'3.1.14', now:['aud'],
